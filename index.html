<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>学习总手册</title>
<style>
:root{
  --bg:#f7f7f8; --panel:#ffffff; --text:#1f2328; --muted:#6b7280;
  --accent:#2563eb; --accent-soft:#dbeafe; --border:#e5e7eb;
  --ok:#16a34a; --bad:#dc2626; --code-bg:#f3f4f6;
}
[data-theme="dark"]{
  --bg:#111318; --panel:#1a1d24; --text:#e5e7eb; --muted:#9ca3af;
  --accent:#60a5fa; --accent-soft:#1e3a5f; --border:#2d333d;
  --ok:#4ade80; --bad:#f87171; --code-bg:#20242c;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.7;font-size:15px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--border);padding:10px 18px}
.brand{font-size:17px;font-weight:700;display:inline-block;margin-right:18px}
.brand span{color:var(--muted);font-weight:400;font-size:12px;margin-left:6px}
.tabs{display:inline-flex;gap:6px;flex-wrap:wrap;vertical-align:middle}
.tab{border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:999px;padding:4px 14px;cursor:pointer;font-size:13px}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.hdr-right{float:right;display:flex;gap:8px;align-items:center;margin-top:2px}
#q{width:260px;padding:6px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:13px}
#theme-btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 12px;cursor:pointer}
.layout{display:flex;min-height:calc(100vh - 60px)}
.sidebar{width:290px;flex:none;background:var(--panel);border-right:1px solid var(--border);
  padding:14px;position:sticky;top:60px;height:calc(100vh - 60px);overflow-y:auto}
#progress-bar{height:5px;background:var(--border);border-radius:3px;margin:6px 0;overflow:hidden}
#progress-bar>div{height:100%;width:0;background:var(--accent);transition:width .3s}
#progress-label{font-size:12px;color:var(--muted);margin-bottom:8px}
.nav-sec{font-size:12px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.4px}
.nav-item{display:block;padding:5px 10px;border-radius:6px;color:var(--text);font-size:14px}
.nav-item:hover{background:var(--accent-soft);text-decoration:none}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item .done{float:right;color:var(--ok);font-size:12px}
.main{flex:1;min-width:0;padding:28px 40px 80px;max-width:920px}
.page h1{font-size:26px;border-bottom:2px solid var(--border);padding-bottom:8px;margin-top:0}
.page h2{font-size:20px;margin-top:26px}
.page h3{font-size:17px;margin-top:22px}
.page table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}
.page th,.page td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.page th{background:var(--code-bg)}
.page code{background:var(--code-bg);padding:2px 5px;border-radius:4px;font-size:.9em}
.page pre{background:var(--code-bg);padding:12px;border-radius:8px;overflow-x:auto;font-size:13px}
.page pre code{background:none;padding:0}
.page blockquote{border-left:4px solid var(--accent);margin:12px 0;padding:6px 14px;background:var(--accent-soft);border-radius:0 6px 6px 0}
.page img{max-width:100%}
.mermaid{background:var(--code-bg);padding:14px;border-radius:8px;overflow-x:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre;color:var(--muted)}
.mermaid-hint{font-size:12px;color:var(--muted);margin:4px 0 14px}
svg{max-width:100%;height:auto}
.quiz-item{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:14px 0;background:var(--panel)}
.quiz-q{margin:0 0 8px;font-weight:500}
.quiz-opts label{display:block;padding:4px 0;cursor:pointer}
.quiz-blank{width:60%;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)}
.quiz-check{margin-top:10px;padding:6px 16px;border:none;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
.quiz-feedback{margin-left:12px;font-size:13px}
.fb-ok{color:var(--ok)}.fb-bad{color:var(--bad)}
.quiz-explain{margin-top:8px;font-size:13px;color:var(--muted);border-top:1px dashed var(--border);padding-top:6px}
.flashcard{perspective:1200px;margin:24px auto;max-width:520px;cursor:pointer;user-select:none}
.fc-inner{position:relative;width:100%;height:240px;transform-style:preserve-3d;transition:transform .5s}
.flashcard.flip .fc-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;
  padding:22px;border-radius:14px;border:1px solid var(--border);background:var(--panel);font-size:16px;text-align:center}
.fc-back{transform:rotateY(180deg);background:var(--accent-soft);color:var(--text)}
.card-controls{display:flex;gap:14px;align-items:center;margin:12px 0;flex-wrap:wrap}
.card-actions{display:flex;gap:12px;justify-content:center}
.card-actions button{padding:8px 22px;border:none;border-radius:8px;cursor:pointer;font-size:14px}
#card-known-btn{background:var(--ok);color:#fff}
#card-again-btn{background:var(--bad);color:#fff}
.card-counts{color:var(--muted);font-size:13px}
.path-step{margin:8px 0;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
.path-step.passed{border-color:var(--ok)}
#glossary-filter{width:100%;max-width:380px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
#glossary-list li{padding:6px 0;border-bottom:1px dashed var(--border)}
.glossary-ref{color:var(--muted);font-size:12px}
.search-hit{margin:10px 0}
.book-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin:16px 0}
.book-card{border:1px solid var(--border);border-radius:12px;padding:16px;background:var(--panel)}
.book-card h3{margin:0 0 6px;font-size:16px}
.book-card .meta{font-size:13px;color:var(--muted);margin-bottom:10px}
.book-card .enter{font-size:13px}
.empty{color:var(--muted);padding:20px 0}
@media print{header,.sidebar,.quiz-actions,.card-actions,.card-controls{display:none!important}.main{max-width:none;padding:0}}
@media (max-width:820px){.sidebar{width:100%;height:auto;position:static}.layout{flex-direction:column}.main{padding:16px}
  .hdr-right{float:none;margin-top:8px}#q{width:100%}}
</style>
</head>
<body>
<header>
  <span class="brand">学习总手册<span>点化学习系统 · 统一入口</span></span>
  <span class="tabs" id="tabs"></span>
  <span class="hdr-right">
    <input id="q" type="search" placeholder="全书搜索…">
    <button id="theme-btn">🌙 深色</button>
  </span>
</header>
<div class="layout">
  <aside class="sidebar">
    <div id="progress-bar"><div id="progress-fill"></div></div>
    <div id="progress-label">进度 0%</div>
    <nav id="nav"></nav>
  </aside>
  <main><div id="view" class="page"></div></main>
</div>
<script>
const BOOKS = {"cpu-tongshi":{"manifest": {"slug": "cpu-tongshi", "title": "CPU 通识课", "subtitle": "从一块硅片到一整套生态：零基础学透 CPU", "book": {"title": "CPU 通识课", "author": "靳国杰、张戈", "source": ["CPU通识课.pdf（310 页）"]}, "audience": "零基础", "goal": "读完能看懂 CPU 的关键参数、说清从指令到芯片的完整链路、理解生态与自主路线的产业逻辑", "companion": "cpu-tongshi-companion.html", "learningPath": [{"step": "01", "title": "概览篇：CPU 是什么", "chapterIds": ["ch01", "ch02", "ch03"], "checkpoint": "该篇各章自测题正确率 ≥ 80%"}, {"step": "02", "title": "术语篇：CPU 的语汇", "chapterIds": ["ch04", "ch05", "ch06", "ch07", "ch08", "ch09", "ch10"], "checkpoint": "该篇各章自测题正确率 ≥ 80%"}, {"step": "03", "title": "原理篇：CPU 怎么算", "chapterIds": ["ch11", "ch12", "ch13", "ch14", "ch15", "ch16", "ch17", "ch18"], "checkpoint": "该篇各章自测题正确率 ≥ 80%"}, {"step": "04", "title": "系统篇：CPU 与外部世界", "chapterIds": ["ch19", "ch20", "ch21", "ch22", "ch23"], "checkpoint": "该篇各章自测题正确率 ≥ 80%"}, {"step": "05", "title": "生产制造篇：从设计到实物", "chapterIds": ["ch24", "ch25", "ch26", "ch27", "ch28"], "checkpoint": "该篇各章自测题正确率 ≥ 80%"}, {"step": "06", "title": "家族篇：厂商与架构的兴衰", "chapterIds": ["ch29", "ch30", "ch31"], "checkpoint": "该篇各章自测题正确率 ≥ 80%"}, {"step": "07", "title": "生态篇：为什么生态比芯片难", "chapterIds": ["ch32", "ch33", "ch34"], "checkpoint": "该篇各章自测题正确率 ≥ 80%"}, {"step": "08", "title": "中国 CPU 篇：自主路线", "chapterIds": ["ch35", "ch36", "ch37", "ch38"], "checkpoint": "该篇各章自测题正确率 ≥ 80%"}], "chapters": [{"id": "ch01", "title": "第 1 章：CPU 是什么，为什么它是信息社会的基石", "file": "chapters/c01-cpu-shenme.md", "difficulty": 1, "hours": 0.5, "prerequisite": "无", "core": "CPU 是运算器加控制器。程序是指令序列，存在存储器里，CPU 一条条取出来执行，所以换程序就能换功能，不用改电路。", "objectives": ["能说出 CPU 由哪两个部件合并而成，以及它在五大部件里的位置", "能按冯·诺依曼模型，把\"取指—执行—写回\"这条循环讲一遍", "能举出通用 CPU 与专用 CPU 各两个例子"]}, {"id": "ch02", "title": "第 2 章：怎么衡量一颗 CPU 的好坏", "file": "chapters/c02-cpu-xingneng.md", "difficulty": 2, "hours": 0.7, "prerequisite": "第 1 章", "core": "性能是\"多快把问题算完\"，不是\"时钟敲得多快\"。主频、每周期干的活、并行度，三者乘起来才是吞吐。", "objectives": ["能说清\"性能 = 单位时间完成的计算量\"，并据此解释为什么主频不是唯一因素", "能举出 MIPS/MFLOPS 失效的原因", "能说明 SPEC CPU 测的是什么，以及它被\"跑分\"利用的两种方式"]}, {"id": "ch03", "title": "第 3 章：普通人也能学懂 CPU", "file": "chapters/c03-renren-ke-xue.md", "difficulty": 1, "hours": 0.4, "prerequisite": "第 1、2 章", "core": "CPU 的外形从占满机柜变成几毫米的模块，原理却一脉相承。学它不是为了造它，是为了拿到理解整个计算机系统最底层的那把钥匙。", "objectives": ["能用三代机器的数字说明 CPU 这七十年变的是什么、没变的是什么", "能说出推动 CPU 发展的三股力量", "能解释\"制作计算机 = 做 CPU + 做操作系统\"这句话"]}, {"id": "ch04", "title": "第 4 章：指令集——计算机的语言", "file": "chapters/c04-zhilingji.md", "difficulty": 2, "hours": 0.8, "prerequisite": "第 1 章", "core": "指令集是软件和硬件之间的编码约定。它写出来只要几个月，但要让全世界为它写软件，要很多年。", "objectives": ["能定义指令集，并说明它为什么同时是\"标准规范\"和\"生态入口\"", "能解释\"增量演进、向下兼容\"具体约束了什么", "能用 IA64 与 AMD64 的竞争说明兼容性的市场后果"]}, {"id": "ch05", "title": "第 5 章：精简指令集与汇编语言", "file": "chapters/c05-risc-huibian.md", "difficulty": 2, "hours": 0.8, "prerequisite": "第 4 章", "core": "指令不是越多越好。常用指令占两成却承担八成执行，剩下的复杂指令增加设计负担，还挡住流水线。", "objectives": ["能说清 CISC 为什么越来越臃肿，RISC 又为什么回来", "能解释\"CISC = 预译码 + RISC\"是什么意思", "能说明汇编语言和高级语言各自省掉了什么麻烦"]}, {"id": "ch06", "title": "第 6 章：做 CPU 就是做微结构", "file": "chapters/c06-weijiegou.md", "difficulty": 2, "hours": 0.6, "prerequisite": "第 4、5 章", "core": "指令集是地基，微结构是图纸和施工，IP 核是可以复用的预制构件。买房和买房图纸，不是一回事。", "objectives": ["能区分指令集和微结构：一个是规范，一个是电路实现", "能说明同一个微结构怎样衍生成不同型号的 CPU", "能解释 IP 核的软硬两种形态，以及\"SoC 攒芯片\"的局限"]}, {"id": "ch07", "title": "第 7 章：功耗从哪里来", "file": "chapters/c07-gonghao.md", "difficulty": 2, "hours": 0.5, "prerequisite": "第 1 章", "core": "功耗是电流通过晶体管时变成的热。降功耗有三条路：换工艺、让操作系统管电源、按负载调频率电压。工艺买得到，设计买不到。", "objectives": ["能按场景说出四类 CPU 的典型功耗区间", "能列出降低功耗的三条路径，并说明哪条最依赖设计", "能解释\"低功耗\"为什么不只是省电费"]}, {"id": "ch08", "title": "第 8 章：摩尔定律与它的黄昏", "file": "chapters/c08-moer.md", "difficulty": 2, "hours": 0.6, "prerequisite": "第 2、7 章", "core": "摩尔定律不是物理定律，是一条被人努力维持了半个多世纪的经验曲线。曲线还在，但斜率在变小。", "objectives": ["能说出摩尔定律的原始表述与 1975 年的修正", "能解释 Tick-Tock 为什么把工艺和架构分开做，以及后来为什么变成三步", "能列出 CPU 性能提升变慢的三个原因"]}, {"id": "ch09", "title": "第 9 章：通用还是专用", "file": "chapters/c09-tongyong-zhuanyong.md", "difficulty": 2, "hours": 0.6, "prerequisite": "第 1、5 章", "core": "通用 CPU 什么都能干，但什么都不最快。把常见的大块计算交给专用电路，剩下的调度交回 CPU，整机就快了。", "objectives": ["能说清异构计算的两个基本思想", "能举例说明专用处理器为什么快", "能解释 big.little 的思路与适用场景"]}, {"id": "ch10", "title": "第 10 章：后门与漏洞——芯片里的幽灵", "file": "chapters/c10-houmen-loudong.md", "difficulty": 3, "hours": 0.8, "prerequisite": "第 4、5 章", "core": "后门是有人故意留的门，漏洞是没人发现的门缝。前者靠制度和自律，后者只能靠设计与验证，而且永远清不干净。", "objectives": ["能区分后门与漏洞：一个是态度问题，一个是能力问题", "能说出 Meltdown/Spectre 利用了哪些常见优化机制", "能解释打补丁为什么必然掉性能，以及为什么自主设计是必要的"]}, {"id": "ch11", "title": "第 11 章：理论基石——布尔代数与数字电路", "file": "chapters/c11-lilun-jishi.md", "difficulty": 2, "hours": 0.7, "prerequisite": "第 4、5 章", "core": "CPU 是数学、电子、计算机科学三股绳拧出来的。设计它的难，不在单个模块，在模块之间那张网。", "objectives": ["能说出支撑 CPU 的三门基础理论", "能列出 CPU 研制团队里至少六个岗位，并说出各自产出什么", "能解释为什么电路设计比软件编程更难"]}, {"id": "ch12", "title": "第 12 章：EDA——在电脑里先把 CPU 造一遍", "file": "chapters/c12-eda.md", "difficulty": 2, "hours": 0.6, "prerequisite": "第 11 章", "core": "EDA 是芯片的设计软件。你用 Verilog 写\"要什么功能\"，它帮你算\"怎么摆晶体管\"。", "objectives": ["能说出 EDA 的两大功能", "能走通 RTL → 逻辑综合 → 门级网表 → 版图这条链", "能区分前端设计与后端设计"]}, {"id": "ch13", "title": "第 13 章：二进制——从开关到数字", "file": "chapters/c13-erjinzhi.md", "difficulty": 2, "hours": 0.8, "prerequisite": "无（本章可独立读）", "core": "0/1 不是抽象符号，是晶体管导通与截止。补码让减法变成加法，浮点数让小数点的位置可以浮动。", "objectives": ["能用 CMOS 晶体管解释 0/1 的物理来源", "能用\"字符表 + 权重\"说明任意进制，并会做十进制转二进制", "能解释补码为什么让 CPU 只需要加法器", "能说出 IEEE 754 浮点数存了哪两部分"]}, {"id": "ch14", "title": "第 14 章：CPU 的天职——数值运算", "file": "chapters/c14-shuzhi-yunsuan.md", "difficulty": 2, "hours": 0.6, "prerequisite": "第 13 章", "core": "CPU 的算力起点是一个能做\"1+1\"的电路。把它串起来、并起来、加快起来，就有了现代 CPU。", "objectives": ["能说明 1 位加法器怎样串成 32 位加法器", "能列出 ALU 的四类常见功能", "能区分数数据寄存器、指令寄存器、地址寄存器、标志位寄存器", "能解释\"CPU 是多少位\"指的是什么"]}, {"id": "ch15", "title": "第 15 章：流水线的奥秘", "file": "chapters/c15-liushuixian.md", "difficulty": 3, "hours": 0.7, "prerequisite": "第 14 章", "core": "流水线是把一条指令切成几段，让不同段同时处理不同指令。切得越细主频越高，但段间的开销也越大。", "objectives": ["能画出四级流水线，并说明为什么两条指令只要 5 拍而不是 8 拍", "能列出流水线级数增加的好处与代价", "能用 Pentium 4 的例子说明\"主频不等于性能\""]}, {"id": "ch16", "title": "第 16 章：乱序执行与多发射——把流水线喂饱", "file": "chapters/c16-luanxu-duofa.md", "difficulty": 3, "hours": 0.9, "prerequisite": "第 15 章", "core": "乱序执行的秩序是：乱着做，按原顺序交账。保留站负责乱，ROB 负责收，重命名寄存器负责中间账。", "objectives": ["能区分数据相关与结构相关，并说明它们为什么让流水线停顿", "能用保留站、重命名寄存器、ROB 三个部件解释乱序执行", "能解释多发射与转移猜测各自解决什么问题"]}, {"id": "ch17", "title": "第 17 章：内存、缓存与虚拟内存", "file": "chapters/c17-neicun-huancun.md", "difficulty": 2, "hours": 0.7, "prerequisite": "第 14 章", "core": "CPU 太快，内存太慢，缓存是中间那张小桌子。虚拟内存是给每个程序发一张\"看起来连续\"的地图。", "objectives": ["能说明访存指令（LD/ST）做了什么", "能解释缓存为什么有效：数据局部性", "能说清多级缓存的取舍，以及虚拟内存的分段与分页差别"]}, {"id": "ch18", "title": "第 18 章：CPU 的\"外交\"——特权级、中断与 I/O", "file": "chapters/c18-waijiao.md", "difficulty": 2, "hours": 0.6, "prerequisite": "第 17 章", "core": "CPU 只管算，外设的事靠三条通道接进来：总线搬数据、中断报消息、DMA 让数据自己走。", "objectives": ["能解释特权级怎样隔开操作系统与应用程序", "能分清中断与例外的触发源", "能说明 DMA 为什么比直接 I/O 高效"]}, {"id": "ch19", "title": "第 19 章：系统调用——应用与操作系统之间的桥", "file": "chapters/c19-xitong-diaoyong.md", "difficulty": 2, "hours": 0.5, "prerequisite": "第 18 章", "core": "应用只能在自己的院子里活动，想看墙外的信息，得走系统调用这道门，门卫是操作系统。", "objectives": ["能写出\"应用程序 = 指令序列 + 库函数 + 系统调用\"这个等式并解释每一项", "能说明系统调用为什么必须切换特权级", "能区分库函数与系统调用"]}, {"id": "ch20", "title": "第 20 章：专用指令——向量与加密", "file": "chapters/c20-zhuanyong-zhiling.md", "difficulty": 2, "hours": 0.5, "prerequisite": "第 14、15 章", "core": "一条指令算一组数据叫标量，算多组叫向量。把重复的活打包进一条指令，就是拿面积换时间。", "objectives": ["能用 ADDV.W 说明向量指令如何一条算四组", "能举例说出向量指令的适用场景", "能说明硬件加密相对软件加密的两点优势"]}, {"id": "ch21", "title": "第 21 章：虚拟化与可信计算——一台机器当几台用，也只信该信的", "file": "chapters/c21-xunihua-kexin.md", "difficulty": 3, "hours": 0.7, "prerequisite": "第 18、19 章", "core": "虚拟化是把资源切成几份分给不同系统，可信计算是给每个部件验明正身。一个管\"怎么分\"，一个管\"信不信\"。", "objectives": ["能说明虚拟化把一台机器变成多台逻辑机器的机制与用途", "能解释硬件虚拟化为什么能让虚拟机跑出接近物理机的性能", "能对比\"老三样\"与可信计算的思路差别"]}, {"id": "ch22", "title": "第 22 章：并行——多核、多路、多线程与 Amdahl 定律", "file": "chapters/c22-bingxing.md", "difficulty": 3, "hours": 0.8, "prerequisite": "第 15、16 章", "core": "横向加计算单元比纵向冲主频容易，但加速比有天花板——串行那一段决定了上限。", "objectives": ["能区分多核、多路、硬件多线程三个层次的并行", "能用 Amdahl 定律算出加速比上限", "能说清 SMP 与 NUMA 的差别，以及弱一致性为什么被普遍采用"]}, {"id": "ch23", "title": "第 23 章：从 CPU 到计算机——总线、主板与 BIOS", "file": "chapters/c23-zongxian-zhuban.md", "difficulty": 2, "hours": 0.7, "prerequisite": "第 18、19 章", "core": "CPU 只是大脑。总线是神经，桥片是副官，主板是躯干，BIOS 是开机后跑的第一段代码。", "objectives": ["能说清系统总线与外设总线的分工，以及桥片的作用", "能说出主板的两种 CPU 安装方式与印制电路板的基本构成", "能按顺序复述\"敲一下键\"在计算机内部走过的 11 步"]}, {"id": "ch24", "title": "第 24 章：化设计为实物——设计公司与流片厂", "file": "chapters/c24-sheji-shiti.md", "difficulty": 2, "hours": 0.5, "prerequisite": "第 12 章", "core": "大多数芯片公司只出图纸，不出芯片。图纸叫版图，交货的动作叫流片。", "objectives": ["能解释 Fabless 模式：设计公司做什么、代工厂做什么", "能说清\"流片\"这个词的来源", "能准确说出纳米工艺指的是哪一段尺寸"]}, {"id": "ch25", "title": "第 25 章：从沙子到晶圆", "file": "chapters/c25-guiyuanpian.md", "difficulty": 2, "hours": 0.7, "prerequisite": "第 24 章", "core": "芯片的原料是沙子。把它提纯、切片、一层层刻蚀掺杂，三个月后它变成一颗会算数的东西。", "objectives": ["能说明硅为什么成为芯片首选材料", "能按顺序复述晶圆制造的主要步骤", "能用\"生长、挖掉、掺杂\"三种手法概括所有工序"]}, {"id": "ch26", "title": "第 26 章：模拟与数字元器件——世界只有几种积木", "file": "chapters/c26-monishuzi-qijian.md", "difficulty": 2, "hours": 0.7, "prerequisite": "第 13 章", "core": "无论多复杂的电路，积木只有不到十种。复杂来自组合方式，不来自零件数量。", "objectives": ["能说出模拟电路六大基础器件与各自的用途", "能用 PN 结解释二极管的单向导电", "能说明 CMOS 反相器如何由一对互补晶体管构成", "能区分组合电路与时序电路"]}, {"id": "ch27", "title": "第 27 章：版图、制造设备与成本", "file": "chapters/c27-banTu-chengben.md", "difficulty": 2, "hours": 0.6, "prerequisite": "第 24、25 章", "core": "版图是设计的终点、制造的起点。它由色块叠成，靠光刻机印出来，最后由成本公式定价。", "objectives": ["能说明版图里有什么、单元库有什么用", "能说出光刻机与晶圆代工的产业格局", "能拆开 CPU 成本的三项构成，并解释成品率与销量的影响"]}, {"id": "ch28", "title": "第 28 章：不流片也能做 CPU——FPGA 与模拟器", "file": "chapters/c28-fpga-moniqi.md", "difficulty": 2, "hours": 0.5, "prerequisite": "第 24 章", "core": "想验证 CPU，不一定要花上千万流片。FPGA 是租来的硬件，模拟器是免费的软件，代价都是慢。", "objectives": ["能说明 FPGA 为什么能\"烧写\"成 CPU", "能比较 FPGA、模拟器、流片三种验证方式的速度与成本", "能说出 SOI 与 FinFET 各解决了什么问题"]}, {"id": "ch29", "title": "第 29 章：从上古到战国——CPU 家族简史", "file": "chapters/c29-cpu-jianshi.md", "difficulty": 2, "hours": 0.6, "prerequisite": "第 4 章", "core": "1971 年之前，CPU 只是整机的一部分；1971 年之后，CPU 成了有型号、有品牌的独立商品。这条分界线是 Intel 4004。", "objectives": ["能定义 CPU 的\"上古时代\"与\"战国时代\"", "能举出四款 20 世纪 70 年代的经典 8 位处理器", "能说出几个曾经辉煌、如今退场的 CPU 品牌及其原因"]}, {"id": "ch30", "title": "第 30 章：巨头寻踪——Intel、AMD、ARM、苹果、IBM", "file": "chapters/c30-jutou-xunzong.md", "difficulty": 2, "hours": 0.7, "prerequisite": "第 29 章", "core": "Intel 赢在生态，不在性能。ARM 赢在开放，不在算力。AMD 赢在敢跟，苹果赢在敢自己来。", "objectives": ["能说明 Intel 成功的真正原因不在性能领先", "能说出 AMD 与 Intel 竞争的两大法宝与两次逆转", "能解释 ARM 的授权模式为何能建成第二套生态"]}, {"id": "ch31", "title": "第 31 章：小而坚强与世界边缘——MIPS、RISC-V 与各国 CPU 之路", "file": "chapters/c31-mips-riscv-shijie.md", "difficulty": 2, "hours": 0.6, "prerequisite": "第 30 章", "core": "MIPS 输给了生态，RISC-V 想用开放换生态。日本输给了授权，因为它只做产品、不做标准。", "objectives": ["能说出 MIPS 的两大贡献与衰落原因", "能解释 RISC-V 的开放理念和它面对的碎片化难题", "能用日本的教训说明\"制造不等于掌握生态\""]}, {"id": "ch32", "title": "第 32 章：生态之重——CPU 的价值不在 CPU", "file": "chapters/c32-shengtai-zhizhong.md", "difficulty": 2, "hours": 0.6, "prerequisite": "第 4、19 章", "core": "CPU 是土，软件生态是森林。土本身不能吃，能长出什么才值钱。", "objectives": ["能定义 CPU 生态与软件生态，并说明二者的关系", "能说出 CPU 与应用之间的三种接口", "能用 Inside / Outside 模型解释 CPU 企业的两个使命"]}, {"id": "ch33", "title": "第 33 章：开发者的号角与解决方案为王", "file": "chapters/c33-kaifazhe-fangan.md", "difficulty": 2, "hours": 0.7, "prerequisite": "第 32 章", "core": "写代码的人决定生态有没有内容，做解决方案的人决定钱怎么分。", "objectives": ["能区分系统软件开发者与应用软件开发者，说出中国开发者结构的特点", "能说明 Linux 发行版是怎么\"做\"出来的", "能用虚拟机的机制解释\"脱离指令集的生态\"", "能用利润率数字说明\"解决方案为王\""]}, {"id": "ch34", "title": "第 34 章：生态的优点与方向——开放、兼容、优化", "file": "chapters/c34-shengtai-fangxiang.md", "difficulty": 2, "hours": 0.7, "prerequisite": "第 33 章", "core": "开放把力量聚起来，兼容把成果留住，优化把体验拉高。三条缺一条，生态就会散。", "objectives": ["能说出优秀生态的三个原则及各自作用", "能用 Linux 的碎片化说明\"开放而不兼容\"的代价", "能用\"标准—品牌—产品\"三档解释 CPU 企业的营利模式"]}, {"id": "ch35", "title": "第 35 章：中国 CPU 旧事——为什么必须自己做", "file": "chapters/c35-zhongguo-cpu-jiushi.md", "difficulty": 2, "hours": 0.6, "prerequisite": "第 30、31 章", "core": "CPU 是所有信息设备的底座。底座买别人的，利润、安全、话语权就都在别人手里。", "objectives": ["能说出中国做 CPU 的三条理由与市场规模数据", "能比较\"市场换技术\"与\"市场带技术\"两条路线", "能概括中国计算机事业的三个阶段"]}, {"id": "ch36", "title": "第 36 章：龙的声音——龙芯的两个十年与三条原则", "file": "chapters/c36-long-shengyin.md", "difficulty": 2, "hours": 0.7, "prerequisite": "第 35 章", "core": "龙芯的第一个十年证明\"能做\"，第二个十年证明\"能用\"。转折点是从追单项指标，转向追用户感受。", "objectives": ["能说清龙芯两个十年各自的任务", "能说出龙芯 1/2/3 号系列的定位差别", "能复述从学院派转向做产品后的三条设计原则"]}, {"id": "ch37", "title": "第 37 章：龙之生态——试错、LoongArch 与内生安全", "file": "chapters/c37-long-shengtai.md", "difficulty": 3, "hours": 0.7, "prerequisite": "第 32、36 章", "core": "核心技术难在细节不在原理，所以只能靠时间试错。指令集是生态的户口本，没有它就只能当租客。", "objectives": ["能用高复杂系统的两个难点解释\"试错不可绕过\"", "能说明 LoongArch 为什么是自主生态的根基", "能列出龙芯内生安全的四类机制"]}, {"id": "ch38", "title": "第 38 章：未来已来——泛生态六支柱与多条路线", "file": "chapters/c38-weilai-yilai.md", "difficulty": 2, "hours": 0.5, "prerequisite": "第 34、37 章", "core": "把技术链打通只是第一步，真正的门槛是把生态链打通——标准、软件、方案、认证、人才、书籍，六根柱子缺一根都会漏风。", "objectives": ["能列出龙芯泛生态的六个支柱", "能说出\"从零开始造计算机\"的教育思路", "能比较中国 CPU 企业的两条路线与代表产品"]}], "concepts": [{"id": "c-isa", "title": "指令集（ISA）", "file": "concepts/isa.md", "chapterIds": ["ch04", "ch05", "ch06", "ch37"]}, {"id": "c-uarch", "title": "微结构", "file": "concepts/microarchitecture.md", "chapterIds": ["ch06", "ch15", "ch16"]}, {"id": "c-pipeline", "title": "流水线", "file": "concepts/pipeline.md", "chapterIds": ["ch15", "ch16"]}, {"id": "c-cache", "title": "缓存与存储层次", "file": "concepts/cache.md", "chapterIds": ["ch17"]}, {"id": "c-syscall", "title": "系统调用", "file": "concepts/system-call.md", "chapterIds": ["ch18", "ch19"]}, {"id": "c-perf", "title": "性能度量", "file": "concepts/performance.md", "chapterIds": ["ch02", "ch36"]}, {"id": "c-eco", "title": "软件生态", "file": "concepts/ecology.md", "chapterIds": ["ch32", "ch33", "ch34"]}, {"id": "c-ownisa", "title": "自主指令集", "file": "concepts/autonomous-isa.md", "chapterIds": ["ch04", "ch37", "ch38"]}], "glossary": [{"term": "CPU", "def": "中央处理器，运算器与控制器的合称，负责指挥整机并 曼模型，把&quot;取指—执行—写回&quot;这条循环讲一遍\n<\/li><li>\n能举出通用 CPU 与专用 CPU 各两个例子\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>CPU 是运算器加控制器。程序是指令序列，存在存储器里，CPU 一条条取出来执行，所以换程序就能换功能，不用改电路。<\/p>\n<h2>零基础讲解<\/h2>\n<p>一台计算机按经典模型分五部分：运算器、控制器、存储器、输入设备、输出设备。前两个在实际芯片里通常一起设计，合起来就是中央处理器（CPU）。它的活是两件：控制器负责指挥别的部件什么时候动，运算器负责真正算数。<\/p>\n<p>1945 年冯·诺依曼在 EDVAC 报告里把&quot;程序存进存储器&quot;这件事定了下来，这就是后来的冯·诺依曼体系结构。它带来一个关键后果：机器不再需要工人现场拨开关、插线板，程序进去以后自己指挥自己跑。<\/p>\n<h3>一条指令怎么走完<\/h3>\n<p>存储器里放着一串二进制编码，每一格是一条指令。时钟每响一次，控制器里的地址计数器加一，把对应地址的单元读进指令寄存器；译码后交给运算器执行；结果写进数据寄存器，必要时再写回存储器。然后取下一条。直到程序最后一条执行完，结果从输出设备交出去。<\/p>\n<h3>为什么要分成通用和专用<\/h3>\n<p>通用 CPU 不限定用途，跑通用操作系统和应用软件，台式机、服务器、笔记本、手机里都是它。专用 CPU 只服务一个场景，为了这个场景可以砍掉多余功能：汽车里监测整车状态的芯片、智能门锁里管刷卡和蓝牙的低功耗芯片，都算专用。<\/p>\n<p>按制造工艺分四代：电子管、晶体管、集成电路（Intel 4004，1971 年，2250 个晶体管）、超大规模集成电路。按使用场合分五类：科学计算、信息化设备、移动计算、嵌入式、微控制器。越往后性能越低，用量越大。<\/p>\n<h3>为什么它是国之重器<\/h3>\n<p>高端 CPU 的设计技术集中在少数国家的少数企业手里。整机厂大量采购国外 CPU，会同时背三笔账：利润被拿走、知识产权不受控、安全上不透明（不提供设计资料和源码，后门与漏洞查不清）。这不是单纯的商业问题。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  M[存储器&lt;br/&gt;指令队列] --&gt;|按地址取指| IR[指令寄存器]\n  IR --&gt;|译码| CA[运算器]\n  CA --&gt;|结果| DR[数据寄存器]\n  DR --&gt;|写回| M\n  DR --&gt;|输出| O[输出设备]\n  I[输入设备] --&gt;|干预| IR<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：中间那条回路就是&quot;取指—执行—写回&quot;。输入设备插在取指路径上，所以早期机器可以用开关直接改指令；这也是现在键盘、鼠标能干预程序的位置来源。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：CPU 像一个拿着工序单的车间主任。工序单是程序，机床是运算器，主任按单子逐条喊&quot;下一步&quot;，成品从传送带出去。失效边界：真实 CPU 会同时开几条线、还会猜着往下做，不是严格一句一句来。\n<\/li><li>\n实例：书里那台&quot;汉字生成器&quot;CHN-1。存储器每格 1 位，0 显示&quot;关&quot;、1 显示&quot;开&quot;；时钟一来地址加一；运算器把这一位变成 8×8 点阵；显示器按 64 位点亮。整台机器只有五个部件，但冯·诺依曼模型的骨架已经齐了。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 CPU 就是&quot;算得最快的那个部件&quot;——它一半的职责是指挥和调度，算只是其中一步。\n<\/li><li>\n别以为程序放在硬盘上就能直接跑。程序必须先装进存储器，CPU 只认存储器里的指令。\n<\/li><li>\n别以为&quot;专用&quot;等于&quot;低端&quot;。专用是为了一个场景把性能和成本压到极致，很多场景里比通用 CPU 更合适。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\nCPU 由哪两部分合并而成？｜运算器和控制器｜存储器和运算器｜控制器和输入设备｜答案：A｜解析：教材把运算器与控制器合称 CPU，存储器与输入输出设备是另外的部件。\n<\/li><li>\n冯·诺依曼体系结构最关键的思想是？｜程序和数据都放在存储器里｜用继电器代替电子管｜用多核提高主频｜答案：A｜解析：&quot;存储程序&quot;让机器自动逐条执行，不再依赖人工操作。\n<\/li><li>\n下列哪个最可能是专用 CPU？｜服务器里的通用处理器｜智能门锁里管刷卡和蓝牙的低功耗芯片｜台式机 CPU｜答案：B｜解析：专用 CPU 面向单一场景设计，可以砍掉与该场景无关的功能。\n<\/ol>\n<h2>抽认卡<\/h2>\n<ul><li>\nCPU 由哪两部分组成？｜运算器 + 控制器\n<\/li><li>\n冯·诺依曼体系结构的核心思想？｜程序和数据都存在存储器中，由控制器逐条取指执行\n<\/li><li>\n通用 CPU 和专用 CPU 的区别？｜通用不限场景、跑通用系统；专用面向单一场景，可为该场景牺牲通用功能\n<\/li><li>\n计算机五大部件？｜运算器、控制器、存储器、输入设备、输出设备\n<\/li><li>\nCPU 为什么是&quot;国之重器&quot;？｜高端设计技术集中、进口依赖带来利润、知识产权与信息安全三重风险\n<\/ul>\n<h2>术语<\/h2>\n<ul><li>\nCPU：中央处理器，运算器与控制器的合称，负责指挥整机并执行运算\n<\/li><li>\n冯·诺依曼体系结构：程序和数据都存于存储器、由控制器逐条取指执行的计算机模型\n<\/li><li>\n指令：CPU 能识别并执行的一项基本操作，以二进制编码存在存储器中\n<\/li><li>\n主频：时钟模块每秒发出节拍的次数，决定 CPU 的工作节奏\n<\/li><li>\n专用 CPU：面向单一应用场景设计的处理器，可牺牲通用性换取性能、成本或功耗优势\n<\/ul>\n<h2>复习锚点<\/h2>\n<ul><li>\nCPU = 运算器 + 控制器；程序 = 指令序列，存在存储器里\n<\/li><li>\n取指、译码、执行、写回，循环到程序结束\n<\/li><li>\n通用与专用不是高低之分，是场景之分\n<\/ul>", "ch02": "<h1>第 2 章：怎么衡量一颗 CPU 的好坏<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>学时<\/strong>：0.7 小时 | <strong>前置<\/strong>：第 1 章\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说清&quot;性能 = 单位时间完成的计算量&quot;，并据此解释为什么主频不是唯一因素\n<\/li><li>\n能举出 MIPS/MFLOPS 失效的原因\n<\/li><li>\n能说明 SPEC CPU 测的是什么，以及它被&quot;跑分&quot;利用的两种方式\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>性能是&quot;多快把问题算完&quot;，不是&quot;时钟敲得多快&quot;。主频、每周期干的活、并行度，三者乘起来才是吞吐。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>主频为什么会卡住<\/h3>\n<p>数据在电路里从一个模块传到下一个模块要时间，运算器加工也要时间。这些时间加起来，决定了执行一条指令的最短周期，也就决定了主频的上限。频率再往上提，上一条没算完下一条就来了，电路进入不可控状态。想突破，只能靠更先进的工艺缩短时延，或者改结构。<\/p>\n<h3>CHN-2：主频降到四分之一，性能不变<\/h3>\n<p>书里给了个反例。把显示器扩成同时显示 4 个汉字，指令从 1 位扩到 4 位，运算器放 4 个点阵生成器，数据寄存器从 64 位扩到 256 位。这台 CHN-2 的主频可以只有 CHN-1 的四分之一，单位时间显示的汉字数却一样多。代价是各部件都要加宽、加多，晶体管成倍增长。这就是&quot;用并行度换频率&quot;。<\/p>\n<h3>MIPS 和 MFLOPS 为什么不管用<\/h3>\n<p>这两个指标数的是&quot;每秒执行多少条指令&quot;。问题是不同机器的一条指令含金量不同：CHN-2 一条顶 CHN-1 四条。数字好看不代表活干得多。现在它们只在计算模式单一的超算领域还有限使用。<\/p>\n<h3>SPEC CPU 的思路<\/h3>\n<p>面向问题：挑几十个真实应用（压缩、下棋、有限元、分子动力学、气象、地震波），用 C/Fortran 写好、定好输入，在被测机器上编译运行，比对结果、掐运行时间。它屏蔽了主频、指令这些实现细节，直接测&quot;问题解决得多快&quot;。<\/p>\n<p>它也有软肋。一是编译器：Intel 用自家 icc 编译，效率比 gcc 高不少，但用户实际多用 gcc，跑分高不等于日常快。二是测试集只覆盖计算型负载，厂商可以堆浮点单元、堆核来刷分，而手机日常的拍照、聊天并不吃这套。<\/p>\n<h3>UnixBench 为什么不建议用<\/h3>\n<p>1995 年的老工具，2012 年后基本停更。数学项用 Dhrystone/Whetstone，程序模式太简单、数据量太小；图形项用 x11perf，测的是早已被显卡加速取代的 X11 显示路径。拿它比现代 CPU，结论会偏得离谱。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  F[主频&lt;br/&gt;每秒多少拍] --&gt; P[吞吐&lt;br/&gt;单位时间完成的计算量]\n  W[每拍干多少活&lt;br/&gt;指令宽度 / 并行度] --&gt; P\n  N[同时干活的单元数&lt;br/&gt;多核 / 多发射] --&gt; P\n  C[编译器与软件优化] --&gt; P<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：P 不是由 F 单独决定的。三条箭头任何一条变强，吞吐都能涨；反过来，只看主频就是把另外两条忽略了。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：送快递。主频是车速，每拍干多少活是每趟能装几件，多核是多开几辆车。只看车速判断谁送得快，显然不靠谱。失效边界：现实里还有堵车（访存延迟）、装卸（编译与调度开销），这些在公式里体现不出来。\n<\/li><li>\n实例：同一颗 CPU，用 icc 编译的 SPEC 分数明显高于 gcc。分数差出来的那一截，是编译器的功劳，不是硅片的。采购时看到这类数字，先问一句&quot;用什么编译器跑的&quot;。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为主频高就一定快。架构不同，一条指令干的活差好几倍。\n<\/li><li>\n别以为跑分高就等于日常流畅。测试集偏计算型，日常偏交互和访存。\n<\/li><li>\n别以为核多就一定强。核多了还有一致性、带宽、调度的问题，单线程任务用不上。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n为什么主频不能无限提高？｜因为数据通路和运算都有延迟，周期短于一条指令的最短执行时间就会失控｜因为厂商不愿意｜因为散热片不够大｜答案：A｜解析：主频上限由电路时延决定，工艺进步才能把它推高。\n<\/li><li>\nMIPS 指标的根本缺陷是？｜不同机器一条指令代表的工作量不同｜数值太大不好记｜只适用于手机｜答案：A｜解析：指令语义强度不同，数指令条数没有可比性。\n<\/li><li>\nSPEC CPU 测试的本质是？｜测硬件和软件联合运行真实程序的时间｜测晶体管数量｜测主频｜答案：A｜解析：它用真实应用掐时间，所以结果同时受编译器、操作系统影响。\n<\/li><li>\nUnixBench 不适合当标准的主要原因是？｜测试项老旧，与当前硬件结构脱节｜收费太贵｜只支持 Windows｜答案：A｜解析：Dhrystone/Whetstone 和 x11perf 都代表不了现代 CPU 的实际负载。\n<\/ol>\n<h2>抽认卡<\/h2>\n<ul><li>\n性能的本质定义？｜单位时间内完成的计算量\n<\/li><li>\n主频的上限由什么决定？｜数据通路时延加运算时延，即一条指令的最短执行时间\n<\/li><li>\nCHN-2 为什么主频低还能同性能？｜把并行度提高到 4 倍，用宽度换频率\n<\/li><li>\nMIPS 的缺陷？｜不同机器指令语义强度不同，条数不可比\n<\/li><li>\nSPEC CPU 的两大局限？｜编译器影响大；测试集偏计算型，可被堆硬件刷分\n<\/li><li>\n为什么不推荐 UnixBench？｜1995 年的老测试项，2012 年后停更，与现代表述脱节\n<\/ul>\n<h2>术语<\/h2>\n<ul><li>\n主频：时钟每秒发出的节拍数，CPU 的节奏基准\n<\/li><li>\n吞吐：单位时间内完成的有效计算量，性能的实质\n<\/li><li>\nMIPS：每秒执行百万条指令数，早期性能指标\n<\/li><li>\nSPEC CPU：面向真实应用的性能测试套件，以运行时间衡量\n<\/li><li>\n编译器优化：把高级语言转成更高效机器码的手段，会显著影响跑分\n<\/ul>\n<h2>复习锚点<\/h2>\n<ul><li>\n性能 = 主频 × 每拍工作量 × 并行度，再减去各种开销\n<\/li><li>\n跑分要看用什么编译器、测的什么负载\n<\/li><li>\n老测试工具不等于通用标准\n<\/ul>", "ch03": "<h1>第 3 章：普通人也能学懂 CPU<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>学时<\/strong>：0.4 小时 | <strong>前置<\/strong>：第 1、2 章\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能用三代机器的数字说明 CPU 这七十年变的是什么、没变的是什么\n<\/li><li>\n能说出推动 CPU 发展的三股力量\n<\/li><li>\n能解释&quot;制作计算机 = 做 CPU + 做操作系统&quot;这句话\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>CPU 的外形从占满机柜变成几毫米的模块，原理却一脉相承。学它不是为了造它，是为了拿到理解整个计算机系统最底层的那把钥匙。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>三代机器，同一套原理<\/h3>\n<p>ENIAC（1946）有 17468 个电子管，每秒 5000 次加法，抵得上五万人同时手算。Intel 4004（1971）把整个 CPU 放进 3mm×4mm 的硅片，2250 个晶体管，10 微米工艺，每秒 6 万次运算，PC 时代从这儿开始。龙芯 3A4000（2019）封装 37.5mm×37.5mm，峰值 128GFLOP/s，能支撑台式机上的排版、上网、3D 游戏。<\/p>\n<p>体积和速度变了，架构没变：依然是取指、执行、写回那一套。这也是为什么拿一台 70 年前的机器讲原理，今天仍然听得懂。<\/p>\n<h3>三股力量在推<\/h3>\n<p>需求牵引：科学计算要更快，软件越写越重，逼着 CPU 提性能。 工艺进步：单位面积能放的晶体管越来越多，给了架构发挥的空间。 科学探索：工程师自己想做出更聪明的机器，这股劲不完全由市场驱动。<\/p>\n<h3>它在计算机科学里的位置<\/h3>\n<p>ACM 2013 年划了 18 个知识领域，其中&quot;体系结构与组织&quot;&quot;操作系统&quot;两门跟 CPU 绑得最紧：前者讲以 CPU 为中心的硬件组成，后者讲跑在 CPU 上的软件平台。经典体系结构教材第一章必讲 CPU，CPU 原理能占整个计算机原理的七成。<\/p>\n<p>于是有那个等式：制作计算机 = 做 CPU + 做操作系统。产业界把 CPU 叫&quot;电脑之心&quot;、操作系统叫&quot;电脑之魂&quot;，说法虽俗，位置说得准。剩下十六门课，多数是在这台机器上开发应用。<\/p>\n<h3>不做 CPU 的人为什么也要学<\/h3>\n<p>三层理由，一层比一层软。硬的一层：不懂底层，排障只能靠猜，性能优化只能调参数。中间一层：流水线、缓存、多核这些工程方法，搬到别的行业也能用。最软的一层：CPU 是观察信息产业的一个窗口，技术趋势、产业格局都能从这里看出来。<\/p>\n<h3>开源 CPU 的现实<\/h3>\n<p>OpenRISC、RISC-V 面向嵌入式与物联网；OpenSPARC、OpenPOWER 是原厂做不下去才开出来的服务器级设计。OpenCores 上两百多个核，不少十年没更新；GitHub 搜 CPU FPGA 有六百多个项目，star 最高的也就五千多，跟随便一个软件组件比都算冷清。硬件开源远没有软件开源成熟，这点要有预期。<\/p>\n<p>国内有可用的教学资源：龙芯 2016 年把 GS132、GS232 两款核向高校开源，配套实验平台。2020 年国科大&quot;一生一芯&quot;计划里，五位本科生做出一款 64 位芯片并流片成功，跑通了 Linux 和自己写的教学操作系统。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[1946 ENIAC&lt;br/&gt;17468 电子管&lt;br/&gt;5000 次加法/秒] --&gt; B[1971 Intel 4004&lt;br/&gt;2250 晶体管&lt;br/&gt;6 万次/秒]\n  B --&gt; C[2019 龙芯 3A4000&lt;br/&gt;128 GFLOP/s]\n  A -.原理不变.-&gt; C<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：横轴是时间，纵轴是集成度与算力，两条曲线都在涨；虚线表示架构主线没断。看懂这张图，就明白&quot;变小变快&quot;和&quot;原理没变&quot;可以同时成立。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：CPU 的发展像汽车。从蒸汽车到电动车，动力方式换了几轮，但方向盘、油门、刹车的逻辑一直在。失效边界：汽车换能源是断裂式演进，CPU 更多是同一套结构上的持续加固。\n<\/li><li>\n实例：&quot;一生一芯&quot;。五个本科生，一年时间，从设计到流片，芯片能跑 Linux。这说明入门门槛没有想象中高；但同一批人要做服务器级 CPU，还差得远。两件事要分开看。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为学 CPU 就是为了造 CPU。绝大多数学习者是为了获得解释力和方法迁移。\n<\/li><li>\n别以为开源 CPU 能直接拿来造高端产品。开源的多是入门级核，性能和验证深度都不够。\n<\/li><li>\n别以为本科生能流片，就意味着高端 CPU 不难。能跑通和能商用之间，隔着工艺、验证、生态三道墙。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\nIntel 4004 的意义是？｜第一款商用微处理器，把 CPU 做进一块芯片｜第一台电子计算机｜第一个开源 CPU｜答案：A｜解析：1971 年发布，2250 个晶体管，开启 PC 时代。\n<\/li><li>\n&quot;制作计算机 = 做 CPU + 做操作系统&quot;强调的是？｜两者是构成一台可用计算机的核心，其余多是应用｜只要会写应用就行｜操作系统不重要｜答案：A｜解析：CPU 是心、操作系统是魂，缺一不可。\n<\/li><li>\n当前开源 CPU 的整体状况是？｜以入门级、嵌入式为主，活跃度有限｜已经能替代高端商用 CPU｜完全空白｜答案：A｜解析：受开发成本与知识产权限制，开源硬件远不如开源软件成熟。\n<\/ol>\n<h2>抽认卡<\/h2>\n<ul><li>\nENIAC 的规模与速度？｜17468 个电子管，每秒 5000 次加法\n<\/li><li>\nIntel 4004 的关键数字？｜1971 年，2250 个晶体管，10 微米工艺，每秒 6 万次\n<\/li><li>\n推动 CPU 发展的三股力量？｜应用需求、生产工艺、科学探索\n<\/li><li>\n为什么说 CPU 原理占计算机原理的大部分？｜体系结构以 CPU 为中心，存储与 IO 都围绕它组织\n<\/li><li>\n开源 CPU 的代表项目？｜OpenRISC、RISC-V、OpenSPARC、OpenPOWER\n<\/li><li>\n&quot;一生一芯&quot;证明了什么？｜本科生团队可以完成 64 位芯片设计与流片，入门门槛并非高不可攀\n<\/ul>\n<h2>术语<\/h2>\n<ul><li>\n集成电路：把大量晶体管与连线做在同一块半导体衬底上的电路\n<\/li><li>\n制程（工艺节点）：制造中晶体管的最小特征尺寸，如 10μm、7nm\n<\/li><li>\n流片：把设计送去晶圆厂试产，第一次做出实物芯片\n<\/li><li>\n开源 CPU：设计源码公开、可复用的处理器核\n<\/li><li>\n体系结构：规定指令集、寄存器、存储与 IO 组织方式的计算机抽象层\n<\/ul>\n<h2>复习锚点<\/h2>\n<ul><li>\n七十年：体积缩小几个数量级，原理仍是取指执行\n<\/li><li>\n三动力：需求、工艺、探索\n<\/li><li>\n学 CPU 的价值在解释力和方法迁移，不在人人去造芯\n<\/ul>", "ch04": "<h1>第 4 章：指令集——计算机的语言<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>学时<\/strong>：0.8 小时 | <strong>前置<\/strong>：第 1 章\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能定义指令集，并说明它为什么同时是&quot;标准规范&quot;和&quot;生态入口&quot;\n<\/li><li>\n能解释&quot;增量演进、向下兼容&quot;具体约束了什么\n<\/li><li>\n能用 IA64 与 AMD64 的竞争说明兼容性的市场后果\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>指令集是软件和硬件之间的编码约定。它写出来只要几个月，但要让全世界为它写软件，要很多年。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>指令集是什么<\/h3>\n<p>CPU 由晶体管组成，只认 0 和 1。软件要在它上面跑，就得按双方约定的格式编码，这套约定叫指令集，也叫指令系统架构（ISA）。每个 CPU 能理解的指令，构成一个有限集合；CHN-1 只有两条（0 表示关、1 表示开），现代桌面 CPU 有上千条。<\/p>\n<p>把指令集理解成接口最准确：软件这边看到的是&quot;能调哪些操作&quot;，硬件这边看到的是&quot;要支持哪些编码&quot;。两边对上，程序才能跑。<\/p>\n<h3>兼容性是一条铁律<\/h3>\n<p>跑相同指令集的机器叫兼容机。兼容意味着同一份软件不用改就能运行。反过来，指令编码一变——比如 CHN-2 把每条指令从 1 位扩成 4 位——老软件就跑不了，两台机器不兼容。<\/p>\n<p>产业界摸索出的办法是&quot;增量演进、向下兼容&quot;：只允许加新指令，不允许删老指令，也不允许改老指令的功能。这样新 CPU 能继承全部旧软件。1964 年 IBM System/360 是这套规则的起点，同一系列不同型号跑同一批软件，客户的软件资产不作废。直到今天 IBM 还在造兼容 System/360 的大机。<\/p>\n<p>反例很有名。2001 年 Intel 和惠普搞 IA64，另起炉灶，不兼容 32 位 x86；AMD 同期推 AMD64，向下兼容 x86。市场选了 AMD64，Intel 最终放弃 IA64，把 AMD64 收编为 x86-64。强势如 Intel，也没拗过这条铁律。<\/p>\n<h3>指令集怎么控制生态<\/h3>\n<p>一个新指令集要活下来，得走完这条链：定标准 → 造 CPU → 做操作系统和工具链 → 吸引应用开发者 → 软件越积越多 → 卖 CPU 赚钱。规模起来后，别的厂商也会来做兼容 CPU，分蛋糕。于是有了专利与授权：想生产兼容某指令集的 CPU，得先拿到授权，费用可以高到上亿元。授权门槛就是生态的准入门槛。<\/p>\n<p>这也解释了为什么全世界主流指令集不超过十个。设计本身几个月能写完，难的是打破&quot;没用户就没软件、没软件就没用户&quot;的死循环。再加上高端 CPU 的指令集要跟电源管理、安全、虚拟化、调试接口一起统筹，往往得把 CPU 和操作系统的原型都做出来验证。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  ISA[指令集标准] --&gt; CPU[兼容该 ISA 的 CPU]\n  CPU --&gt; OS[操作系统与工具链]\n  OS --&gt; APP[应用软件]\n  APP --&gt; USERS[用户与市场]\n  USERS --&gt;|反哺销量| CPU\n  ISA --&gt;|专利授权| VENDORS[其他 CPU 厂商]\n  VENDORS --&gt; CPU<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：左边是技术，右边是市场，中间靠软件填满。授权那条虚线说明：谁握住指令集，谁就能决定谁能进来造 CPU。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：指令集像铁路轨距。改轨距技术上不难，难的是让全国的车厢都换轮子。失效边界：轨距是物理的，指令集是编码的，后者可以靠翻译层（二进制翻译）临时过渡，虽然效率有损。\n<\/li><li>\n实例：LoongArch 分四块——基础、二进制翻译扩展（LBT）、虚拟化扩展（LVZ）、向量扩展（LSX/LASX）。LBT 的存在本身就说明&quot;生态迁移&quot;是现实问题，得给旧软件留一条翻译通道。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为指令集是&quot;越先进越好&quot;。生态不认，再先进也卖不动。\n<\/li><li>\n别以为兼容就是抄。兼容是遵守同一套编码约定，微结构可以完全不同。\n<\/li><li>\n别以为有了授权就万事大吉。软件、编译器、开发者习惯都要跟着搬，这是慢功夫。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n指令集的本质是？｜软件与硬件之间的二进制编码规范｜一种电路布局｜一种编程语言｜答案：A｜解析：它规定 CPU 能识别哪些编码，是软硬件的接口。\n<\/li><li>\n&quot;增量演进、向下兼容&quot;的含义是？｜只增加新指令，不删除、不改变已有指令｜每隔几年推翻重来｜只兼容自家软件｜答案：A｜解析：这样旧软件在新 CPU 上仍可运行，软件资产得以继承。\n<\/li><li>\nIA64 失败的直接原因是？｜不兼容 32 位 x86，而 AMD64 向下兼容｜性能太差｜价格太高｜答案：A｜解析：市场不愿放弃既有软件，兼容性成为决定性因素。\n<\/li><li>\n新指令集难在哪里？｜难在建立软件生态，而非写出规范｜难在申请专利｜难在取名字｜答案：A｜解析：没有软件就没有用户，没有用户就没人写软件，双向悖论最难破。\n<\/ol>\n<h2>抽认卡<\/h2>\n<ul><li>\n指令集的另一个名称？｜指令系统架构（ISA）\n<\/li><li>\n兼容机的定义？｜能识别相同指令编码、运行相同软件的计算机\n<\/li><li>\n向下兼容的具体约束？｜只增不删、不改老指令功能\n<\/li><li>\nSystem/360 的历史地位？｜1964 年 IBM 推出，&quot;兼容机&quot;概念的始祖\n<\/li><li>\n指令集如何控制生态？｜通过专利与授权设定准入门槛，决定谁能造兼容 CPU\n<\/li><li>\nLoongArch 的四个组成部分？｜基础、二进制翻译扩展 LBT、虚拟化扩展 LVZ、向量扩展 LSX/LASX\n<\/ul>\n<h2>术语<\/h2>\n<ul><li>\n指令集（ISA）：CPU 能识别的指令编码规范，软硬件接口\n<\/li><li>\n兼容机：遵循同一指令集、可运行相同软件的计算机\n<\/li><li>\n向下兼容：新机器能运行旧机器上的软件\n<\/li><li>\n二进制翻译：把一种指令集的机器码转换成另一种指令集可执行形式的技术\n<\/li><li>\n指令集授权：指令集权利人许可他人生产兼容 CPU 的商业模式\n<\/ul>\n<h2>复习锚点<\/h2>\n<ul><li>\n指令集 = 编码约定 = 生态入口\n<\/li><li>\n兼容靠&quot;只增不改&quot;，破坏它的产品会被市场淘汰\n<\/li><li>\n写规范几个月，养生态很多年\n<\/ul>", "ch05": "<h1>第 5 章：精简指令集与汇编语言<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>学时<\/strong>：0.8 小时 | <strong>前置<\/strong>：第 4 章\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说清 CISC 为什么越来越臃肿，RISC 又为什么回来\n<\/li><li>\n能解释&quot;CISC = 预译码 + RISC&quot;是什么意思\n<\/li><li>\n能说明汇编语言和高级语言各自省掉了什么麻烦\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>指令不是越多越好。常用指令占两成却承担八成执行，剩下的复杂指令增加设计负担，还挡住流水线。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>指令数量的膨胀与代价<\/h3>\n<p>早期机器指令很少：ENIAC 50 条，Intel 4004 只有 45 条。到 8086 是 72 条，80386 超过 100 条，Pentium 220 条，2000 年前后的 CPU 已经上千条。<\/p>\n<p>膨胀有两个推力：晶体管便宜了，塞得下更多功能；PC 普及后，程序员希望一条指令干更多事（比如一次读写一串内存单元），图省事。代价也很实在：译码电路变复杂、容易设计出错；指令之间功能重复，违背正交性；最麻烦的是指令长度和执行时间不一致，流水线不好排，编译器也不好调度。<\/p>\n<h3>RISC 的判断依据<\/h3>\n<p>统计发现指令使用率极不均匀：最常用的两成指令，占八成执行次数。用得最多的恰恰是最原始的加减、判断、访存。既然如此，何必为那些一年用不上一次的指令付设计成本？<\/p>\n<p>RISC 的思路是只留常用指令，每条只干一件事，长度统一、编码规整。这样流水线容易做，编译器也容易排。一般认为 1975 年开始研制的 IBM 801 是最早的 RISC 处理器。九十年代以后新出的指令集基本都走 RISC，剩下的主流 CISC 只有 x86。<\/p>\n<h3>为什么 x86 没死<\/h3>\n<p>因为生态。换指令集等于让所有软件重写，没人敢。<\/p>\n<p>CISC 厂商找到的办法是两级译码：x86 指令进来，先&quot;预译码&quot;成内部微指令（μOP），微指令按 RISC 思路设计，后面全用流水线跑。对外仍是 x86，对内是 RISC。于是有了那个等式：CISC = 预译码 + RISC。Intel 80486 就上了五级流水线：取指、译码 1、译码 2、执行、回写。<\/p>\n<h3>指令集里到底放什么<\/h3>\n<p>以 LoongArch 为例：基础部分管数据运算，LBT 管跨指令集的二进制翻译效率，LVZ 管虚拟化，LSX/LASX 管向量（科学计算、信号处理、媒体解码）。每一项都对着具体需求，不是为了凑数。指令多了，学习成本、编译器复杂度都要跟着涨。<\/p>\n<h3>汇编：第一次抽象<\/h3>\n<p>机器指令是一串 0/1，人记不住。汇编用助记符代替操作码，用标号和寄存器名代替地址与编号。比如把&quot;开/关&quot;写成 ON/OFF。<\/p>\n<p>汇编代码不能直接跑，要经汇编器（Assembler）转成机器码。汇编把&quot;功能表示&quot;从&quot;硬件机制&quot;里分了出来，程序员第一次不用手算二进制。<\/p>\n<p>但汇编仍是面向机器的语言：得自己管寄存器、管内存，一条指令干的事太少，复杂程序写出来很长。<\/p>\n<h3>高级语言：第二次抽象<\/h3>\n<p>高级语言把数据类型抬到整数、浮点、数组、结构体，把控制结构抬到循环和分支。代码经编译器（Compiler）转成机器码。同样的问题，高级语言代码量平均只有汇编的七分之一，bug 也少。它还是平台无关的：换指令集只要换编译器重编一遍，不用重写。<\/p>\n<p>TIOBE 前二十基本都是高级语言，汇编排在十几位，份额百分之一二。<\/p>\n<h3>汇编为什么没消失<\/h3>\n<p>两种场景离不开它。一是高级语言够不着的地方：读写 CPU 内部寄存器、访问外设端口，BIOS、内核、驱动、嵌入式控制程序里都有汇编。二是极致的性能优化：编译器不一定生成最优指令序列，关键函数手工汇编能榨出最后一点性能。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  ASM[汇编源码] --&gt;|汇编器| BIN[机器码]\n  HL[高级语言源码] --&gt;|编译器| BIN\n  X86[x86 CISC 指令] --&gt;|预译码| UOP[微指令 μOP]\n  UOP --&gt; PIPE[流水线执行]\n  BIN --&gt; PIPE<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：上面两条是&quot;人怎么写&quot;，下面这条是&quot;机器怎么跑&quot;。CISC 在中间加了一层翻译，把复杂指令拆成规整的微操作，流水线才跑得顺。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：CISC 像一整套组合工具箱，什么形状都有，但找起来费劲、箱子重；RISC 像一把瑞士军刀加几个常用件，轻，快，缺的场合再补。失效边界：军刀补不了重活，CISC 的复杂指令在少数场景确实一条顶多条。\n<\/li><li>\n实例：数组复制。C 语言一个 for 循环四行；龙芯汇编要自己维护三个指针（源、目的、计数），每轮做 load、store、两次地址加、一次比较跳转。代码长，但每条指令干什么一清二楚。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 RISC 一定比 CISC 快。x86 内部早就 RISC 化了，外部表现取决于微结构，不取决于标签。\n<\/li><li>\n别以为汇编等于过时。内核、驱动、启动代码里它一直在。\n<\/li><li>\n别以为指令越多功能越强。堆指令带来的复杂度，往往超过它节省的那点代码。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\nRISC 提出的统计依据是？｜两成常用指令承担八成执行次数｜指令越少越好｜寄存器越多越好｜答案：A｜解析：二八原则说明复杂指令的实际使用率很低。\n<\/li><li>\n&quot;CISC = 预译码 + RISC&quot;描述的是？｜CISC 指令在内部被译成 RISC 风格微指令再流水执行｜CISC 被 RISC 取代｜两种指令集合并｜答案：A｜解析：对外保持兼容，对内用 RISC 结构跑，兼顾生态与性能。\n<\/li><li>\n高级语言相对汇编的主要优势不包括？｜可以直接操作 CPU 内部寄存器｜代码量约为汇编的七分之一｜换平台只需重新编译｜答案：A｜解析：直接操作寄存器恰恰是汇编的专长，高级语言做不到。\n<\/li><li>\n汇编语言仍被使用的原因？｜内核驱动等需访问硬件，以及关键代码的性能优化｜因为编译器不存在｜因为汇编更简单｜答案：A｜解析：两类场景高级语言覆盖不了。\n<\/ol>\n<h2>抽认卡<\/h2>\n<ul><li>\nCISC 与 RISC 的核心差别？｜CISC 指令多而复杂、长度不一；RISC 指令少而规整、长度统一\n<\/li><li>\nRISC 的代表作起点？｜IBM 801，1975 年开始研制\n<\/li><li>\n指令膨胀的三大弊端？｜译码电路复杂、功能重复、妨碍流水线与编译调度\n<\/li><li>\nμOP 是什么？｜CISC 指令预译码后生成的内部微指令，对软件不可见\n<\/li><li>\n汇编器的作用？｜把汇编源码转成二进制机器码\n<\/li><li>\n高级语言&quot;平台无关&quot;的含义？｜换指令集只需用新编译器重编，不必重写源码\n<\/ul>\n<h2>术语<\/h2>\n<ul><li>\nCISC：复杂指令集计算机，指令多、长度可变\n<\/li><li>\nRISC：精简指令集计算机，指令少、长度统一、便于流水\n<\/li><li>\n正交性：指令之间功能不重复、可组合覆盖全部需求的性质\n<\/li><li>\n微指令（μOP）：CISC 内部译码产生的 RISC 风格操作\n<\/li><li>\n汇编器：把汇编语言转成机器码的程序\n<\/li><li>\n编译器：把高级语言源码转成机器码的程序\n<\/ul>\n<h2>复习锚点<\/h2>\n<ul><li>\n指令膨胀有代价，RISC 用二八原则把它砍回去\n<\/li><li>\nx86 靠&quot;预译码 + RISC 内核&quot;活下来\n<\/li><li>\n汇编管硬件细节，高级语言管问题逻辑\n<\/ul>", "ch06": "<h1>第 6 章：做 CPU 就是做微结构<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>学时<\/strong>：0.6 小时 | <strong>前置<\/strong>：第 4、5 章\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能区分指令集和微结构：一个是规范，一个是电路实现\n<\/li><li>\n能说明同一个微结构怎样衍生成不同型号的 CPU\n<\/li><li>\n能解释 IP 核的软硬两种形态，以及&quot;SoC 攒芯片&quot;的局限\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>指令集是地基，微结构是图纸和施工，IP 核是可以复用的预制构件。买房和买房图纸，不是一回事。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>微结构：真正的&quot;做 CPU&quot;<\/h3>\n<p>微结构（micro-architecture）是一个 CPU 的电路设计，是把指令集功能落到硬件上的实现方案。指令集属于知识产权问题——你可以授权别人的规范；微结构属于设计能力问题——能不能用电路把它高效实现出来，得自己练。<\/p>\n<p>一个微结构能衍生出很多型号。做法有四种：改参数（缓存大小）、裁模块（去不去浮点单元）、多核组合（1/4/8/16/64 核）、换工艺（28nm/14nm/7nm），最后再按测试结果分档定频定价。所以同门兄弟可能长得差很远：龙芯 3A4000 用 GS464V，3A5000 和 3C5000 用 LA464；Intel 的 P6 架构从 Pentium Pro 一路用到 Pentium Ⅲ。<\/p>\n<h3>IP 核：一次设计，多次使用<\/h3>\n<p>IP 核是设计好的电路模块，可以在不同芯片里重复使用。它像软件里的函数：定义一次，到处调用。粒度可大可小，小到乘法器、浮点单元，大到一个完整的 CPU。<\/p>\n<p>软 IP 是用硬件描述语言（Verilog、VHDL）写的电路功能描述，相当于电路的源码；硬 IP 是做完布局布线、确定晶体管的版图，相当于成品。卖软 IP 交的是设计，卖硬 IP 交的是能直接流片的版图。<\/p>\n<h3>SoC：把一台计算机塞进一块芯片<\/h3>\n<p>SoC（System on Chip）在一块芯片上集成 CPU、内存控制器、通信接口、电源管理等模块，接近一台完整计算机。龙芯 2K1000 集成了两个核和二十多种外设控制器，最小主板做到名片大小；高通的骁龙 865 把 8 个 CPU、5G、GPU、AI、Wi-Fi、蓝牙、USB、摄像头、音频、充电管理全塞进去，7nm 工艺，面积不到一角硬币。<\/p>\n<h3>买 IP 攒芯片，算不算会做 CPU<\/h3>\n<p>不算。IP 授权是成熟生意，CPU 核、DDR 控制器、GPU、PCIe、SATA、USB 控制器，甚至温度传感器都能买到。有钱、懂集成，几个月就能&quot;做&quot;出一颗手机芯片。<\/p>\n<p>但这只说明你会集成，不代表掌握核心设计。用别人的核、别人的图纸，做出来的是&quot;CPU 搬运工&quot;。真正的自主，是自己设计微结构、自己定义指令集，还能反过来给别人授权。龙芯走的是后者，不采用第三方 IP 核。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  ISA[指令集&lt;br/&gt;规范 / 知识产权] --&gt; MA[微结构&lt;br/&gt;电路设计 / 设计能力]\n  MA --&gt; IP[IP 核&lt;br/&gt;可复用模块]\n  IP --&gt; SOC[SoC&lt;br/&gt;集成多模块]\n  SOC --&gt; CHIP[芯片]\n  MA --&gt;|参数 / 核数 / 工艺 / 频率| CHIP<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：同一条微结构可以向两个方向走——往下封装成 IP 复用，往右按参数衍生成不同型号。买 IP 的路径从中间插入，跳过了左边两格。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：造芯片像盖房子。指令集是地基规范，微结构是设计图纸加快工，IP 核是预制楼梯和门窗。买 IP 攒芯片，等于用别人的图纸、在别人的地基上盖房，房子能住，产权不是你的。失效边界：房子不能拆了重盖，芯片设计可以迭代流片，改一版再试。\n<\/li><li>\n实例：ARM 卖公版核，手机厂买授权，几个月出芯片。同一时期，一家没有自家微结构的公司，很难在能效上做出差异化——因为大家的图纸是一样的，只能在集成和工艺上找空间。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为有指令集授权就等于会做 CPU。授权给的是规范，不是实现。\n<\/li><li>\n别以为 SoC 集成等于自研。集成能力有价值，但它不解决核心设计能力。\n<\/li><li>\n别以为微结构只有一个版本。同一套微结构能按缓存、核数、工艺、频率切出很多 SKU。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n微结构与指令集的关系是？｜微结构是某指令集的电路实现方案｜两者是同一个东西｜微结构是软件规范｜答案：A｜解析：指令集是规范，微结构是硬件实现。\n<\/li><li>\n下列哪项不是同一微结构衍生型号的手段？｜重新设计一套指令集｜调整缓存大小与核数｜换制造工艺｜答案：A｜解析：换指令集就是另一个产品线了，不属于同微结构衍生。\n<\/li><li>\n软 IP 与硬 IP 的区别是？｜软 IP 是功能描述，硬 IP 是确定的版图｜软 IP 更贵｜硬 IP 不能流片｜答案：A｜解析：软 IP 相当源码，硬 IP 相当可交付的版图。\n<\/li><li>\n&quot;买 IP 攒芯片&quot;不能称为掌握 CPU 技术，原因是？｜核心设计来自他人，只完成集成与制造｜因为成本太低｜因为芯片不能运行｜答案：A｜解析：自主性体现在微结构与指令集的设计能力上。\n<\/ol>\n<h2>抽认卡<\/h2>\n<ul><li>\n微结构的定义？｜一个 CPU 的电路设计，即指令集的硬件实现方案\n<\/li><li>\n同一微结构衍生型号的四种方式？｜改参数、裁模块、多核组合、换工艺并分档定频\n<\/li><li>\nIP 核像什么软件概念？｜函数：一次定义，多次调用\n<\/li><li>\n软 IP 与硬 IP？｜软 IP 是 HDL 功能描述；硬 IP 是含布局布线的晶体管版图\n<\/li><li>\nSoC 是什么？｜片上系统，一块芯片集成 CPU 与多种外设，接近完整计算机\n<\/li><li>\n&quot;CPU 搬运工&quot;指什么？｜买现成 IP 组合成芯片、不掌握核心设计的厂商\n<\/ul>\n<h2>术语<\/h2>\n<ul><li>\n微结构：一条指令集在电路上的具体实现方案\n<\/li><li>\nIP 核：可复用的电路设计模块\n<\/li><li>\n软 IP：以 HDL 描述交付、尚未布局布线的 IP\n<\/li><li>\n硬 IP：已完成布局布线、可直接流片的 IP\n<\/li><li>\nSoC：片上系统，一块芯片集成 CPU 与多种功能模块\n<\/li><li>\n处理器核：CPU 中负责运算与控制的完整单元\n<\/ul>\n<h2>复习锚点<\/h2>\n<ul><li>\n指令集是规范，微结构是设计，IP 是复用件\n<\/li><li>\n同微结构可切出多档产品\n<\/li><li>\n集成 ≠ 自研\n<\/ul>", "ch07": "<h1>第 7 章：功耗从哪里来<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>学时<\/strong>：0.5 小时 | <strong>前置<\/strong>：第 1 章\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能按场景说出四类 CPU 的典型功耗区间\n<\/li><li>\n能列出降低功耗的三条路径，并说明哪条最依赖设计\n<\/li><li>\n能解释&quot;低功耗&quot;为什么不只是省电费\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>功耗是电流通过晶体管时变成的热。降功耗有三条路：换工艺、让操作系统管电源、按负载调频率电压。工艺买得到，设计买不到。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>功耗的场合差异<\/h3>\n<p>功耗就是单位时间消耗的电能，单位瓦特。算得越猛通常越费电，所以不同场景对功耗的容忍度完全不同。<\/p>\n<p>嵌入式与微控制器常在没电源的地方工作，靠电池撑，功耗在毫瓦级。书里提过一个极端要求：&quot;一节干电池用十年&quot;。手机平板一般不超过 10W，笔记本不超过 20W，台式机 50W 上下，服务器轻松破 100W。龙芯 1C 只有 0.5W，3A4000 峰值 50W。<\/p>\n<h3>为什么在意发热<\/h3>\n<p>电流过晶体管就发热，芯片表面能到 100℃，足以烧坏。几十瓦的台式机必须配风扇，风扇是机械件，有噪声也容易坏。功耗压到 15W 以内，就能做出无风扇的静音机器。<\/p>\n<p>数据中心是另一回事。几万台服务器集中在一起，电费能占运营成本的三分之一，还得花大价钱制冷。阿里千岛湖用湖水冷却，Google 用海水和生活废水。2010 年全球数据中心用电约占全球发电量的 1.1% 到 1.5%。<\/p>\n<h3>三条降功耗的路<\/h3>\n<p>第一，先进工艺。晶体管间距更小、电压更低、密度更高，发热自然少。最先进的 5nm 往往先用在对功耗敏感的移动设备上。<\/p>\n<p>第二，操作系统电源管理。待机时关屏、切断硬盘等外设供电，把能省的电省下来。<\/p>\n<p>第三，按负载调频调压。负载低时降频降压，需要时再冲上去，这就是&quot;睿频&quot;一类的机制。更进一步的还能动态调电压，龙芯 3A4000 就有这个能力。<\/p>\n<p>三条里，第一条靠钱和供应链，第二条靠软件生态，第三条靠微结构与固件的设计功底。所以&quot;降功耗&quot;最后拼的还是人。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  P[功耗] --&gt; S1[先进工艺&lt;br/&gt;更小间距 / 更低电压]\n  P --&gt; S2[操作系统电源管理&lt;br/&gt;关屏 / 断外设]\n  P --&gt; S3[动态调频调压&lt;br/&gt;按负载升降]\n  S1 --&gt; R[发热下降]\n  S2 --&gt; R\n  S3 --&gt; R\n  R --&gt; B[更长续航 / 无风扇 / 更低电费]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：三条箭头都指向发热，但成本与门槛不同。工艺是一次性投入，电源管理和调频调压是持续优化，能做到什么程度取决于设计能力。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：功耗像汽车的油耗。换发动机（工艺）是最根本的，但贵；养成良好驾驶习惯（电源管理）不要钱但收益有限；智能启停（调频调压）介于两者之间。失效边界：汽车油耗还受路况影响，CPU 的负载波动比路况剧烈得多。\n<\/li><li>\n实例：龙芯 3A4000 相比 3A3000 性能翻倍，同时靠功耗控制把待机时间也翻了一倍。性能与续航不是必然对立，关键看有没有在电源管理上下功夫。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为功耗低就是性能差。低功耗设计的目标是&quot;同性能下更省&quot;，不是砍性能。\n<\/li><li>\n别以为换个先进工艺就万事大吉。工艺红利会被更高频率、更多核心吃掉，架构不改照样费电。\n<\/li><li>\n别以为散热是整机厂的事。芯片封装、功耗密度从一开始就决定了整机能不能不用风扇。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n下列哪类 CPU 的功耗通常在毫瓦级？｜嵌入式与微控制器｜服务器｜台式机｜答案：A｜解析：靠电池工作，必须把功耗压到极低。\n<\/li><li>\n降低功耗的三条路径不包括？｜减少指令集条数｜采用先进工艺｜操作系统电源管理｜答案：A｜解析：指令集条数与功耗没有直接对应关系。\n<\/li><li>\n低功耗 CPU 的一个直接好处是？｜可以做出无风扇的静音计算机｜可以不用操作系统｜可以不用内存｜答案：A｜解析：功耗低、发热小，机械风扇可以省掉。\n<\/li><li>\n数据中心电费约占运营成本多少？｜约三分之一｜约十分之一｜几乎为零｜答案：A｜解析：海量服务器加制冷，电费是主要成本项之一。\n<\/ol>\n<h2>抽认卡<\/h2>\n<ul><li>\n功耗的定义与单位？｜单位时间消耗的电能，单位瓦特\n<\/li><li>\n四类 CPU 的典型功耗？｜嵌入式毫瓦级、手机不超 10W、台式约 50W、服务器可超 100W\n<\/li><li>\n降功耗的三条路径？｜先进工艺、操作系统电源管理、动态调频调压\n<\/li><li>\n为什么风扇是问题？｜机械件有噪声且易损坏，低功耗才能省掉它\n<\/li><li>\n睿频是什么？｜按负载动态升降频率的功耗管理机制\n<\/ul>\n<h2>术语<\/h2>\n<ul><li>\n功耗：单位时间消耗的电能，单位瓦特\n<\/li><li>\n睿频：根据负载动态调整频率（及电压）的机制\n<\/li><li>\n功耗密度：单位面积上的发热量，决定散热设计难度\n<\/li><li>\n无风扇设计：靠被动散热把整机做到静音的方案\n<\/li><li>\n电源管理：操作系统按状态关闭或降低部件供电的机制\n<\/ul>\n<h2>复习锚点<\/h2>\n<ul><li>\n功耗按场景分档：毫瓦、10W、50W、100W+\n<\/li><li>\n三条路：工艺、系统管理、调频调压\n<\/li><li>\n低功耗换来的是续航、静音和电费\n<\/ul>", "ch08": "<h1>第 8 章：摩尔定律与它的黄昏<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>学时<\/strong>：0.6 小时 | <strong>前置<\/strong>：第 2、7 章\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说出摩尔定律的原始表述与 1975 年的修正\n<\/li><li>\n能解释 Tick-Tock 为什么把工艺和架构分开做，以及后来为什么变成三步\n<\/li><li>\n能列出 CPU 性能提升变慢的三个原因\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>摩尔定律不是物理定律，是一条被人努力维持了半个多世纪的经验曲线。曲线还在，但斜率在变小。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>一条从草稿纸开始的曲线<\/h3>\n<p>1965 年，摩尔在草稿纸上点出历年集成电路的最大晶体管数，连成一条斜线：每年翻一倍。1975 年改成每两年翻一倍，等于承认放缓。此后几十年，产业基本按这条线走。<\/p>\n<p>它跟物理定律不一样。物理定律背后有因果，摩尔定律背后只有一个观察和一群人的努力。每次撞上工程瓶颈，总有新材料、新结构把它续上。但晶体管尺寸逼近原子尺度，4nm 时只剩几个原子的宽度，电子进出控不住，1 和 0 就不稳了。有文献预计这个瓶颈在 2030 年前到来。<\/p>\n<p>就算失效，也不算意外。产业够先进、供给够用，速度自然会慢下来，转向别的价值维度——就像汽车跑到 240km/h 之后，人们开始比舒适、比自动化，而不是比极速。<\/p>\n<h3>Tick-Tock：把两件难事分开做<\/h3>\n<p>Intel 2006 年提出&quot;嘀嗒&quot;策略：Tick 年换制造工艺，吃摩尔定律的红利；Tock 年换微结构，做性能、节能和专用功能。两年一个循环。<\/p>\n<p>为什么分开？因为工艺和架构是两颗最难的钉子。新工艺动辄几十亿美元，验证周期长；新架构要走完设计到验证的长流程。两件事一起做，问题缠在一起，很可能两头都砸。分开做，每次只解决一个子问题，难度降维，上市节奏也稳。<\/p>\n<p>2017 年改成&quot;制程—架构—优化&quot;三步，周期拉到三年。多出来的&quot;优化&quot;是制程架构都不变时的小修小补、提频、修 bug。外界把这叫&quot;挤牙膏&quot;。<\/p>\n<h3>为什么变慢了<\/h3>\n<p>三个原因叠在一起。<\/p>\n<p>需求端：2010 年前，多媒体、游戏、互联网、大数据轮番拉着 CPU 往前跑，两三年就得换机。2010 年后 PC 应用定型，三四百元的桌面 CPU 就够用，人们觉得&quot;够好了&quot;。手机和云还在要性能，但不再是全民焦点。<\/p>\n<p>竞争端：Intel 在桌面、服务器、笔记本的份额长期在 80% 以上，第二名 AMD 只在少数时段构成威胁。用现有性能的芯片也能持续拿单，换代的紧迫感就弱了。<\/p>\n<p>学术端：九十年代流水线、RISC 定下来之后，体系结构领域很多年没有本质突破。现在的提升多是工程细节、先进工艺、SoC 组合式创新。没有新理论，性能曲线自然平。<\/p>\n<p>用户的关注点也跟着变：2000 年前买电脑要算&quot;单位价格买到多少算力&quot;，现在多数人只看品牌、价格、外观。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  subgraph 旧节奏\n    T1[Tick&lt;br/&gt;换工艺] --&gt; T2[Tock&lt;br/&gt;换架构] --&gt; T1\n  end\n  subgraph 新节奏\n    P1[Process] --&gt; A1[Architecture] --&gt; O1[Optimization] --&gt; P1\n  end<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：上面是两年一循环的两步走，下面是三年一循环的三步走。多出来的优化步，本质是承认&quot;工艺和架构都难有大跃进了&quot;。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：摩尔定律像一场长跑的世界纪录。纪录还在被破，但每次都只快零点几秒，而且需要更好的鞋、更好的跑道、更科学的训练。失效不是某天突然跑不动，而是越来越难快。失效边界：体育有生理极限，芯片的极限来自原子尺度，性质不同但&quot;边际收益递减&quot;的逻辑一样。\n<\/li><li>\n实例：&quot;挤牙膏&quot;那几年，每代 CPU 的单核性能提升只有个位数百分比。用户换机周期从两三年拉长到五六年，二手市场反而火了。这就是性能过剩带来的产业结构变化。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为摩尔定律是自然规律。它是经验观察加产业共识，靠人维持。\n<\/li><li>\n别以为工艺进步必然带来性能提升。频率墙、功耗墙、内存墙都在旁边卡着。\n<\/li><li>\n别以为性能停滞等于技术停滞。算力在往专用化、并行化、封装层面走，只是不再表现为单核频率。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n摩尔定律 1975 年的修正表述是？｜晶体管数量每两年翻一倍｜每年翻四倍｜每十年翻一倍｜答案：A｜解析：原为每年翻倍，1975 年改为两年。\n<\/li><li>\nTick-Tock 把工艺与架构分开做的主要目的是？｜分解难度、控制风险、稳定节奏｜节省广告费｜减少核数｜答案：A｜解析：两件最难的钉子分开钉，避免问题交织。\n<\/li><li>\n2017 年后 Tick-Tock 变成？｜制程—架构—优化三步走｜彻底取消｜改成四年一轮｜答案：A｜解析：增加优化步，周期从两年拉到三年。\n<\/li><li>\nCPU 性能提升放缓的原因不包括？｜指令集数量减少｜应用需求饱和｜Intel 市场份额过高｜答案：A｜解析：指令集数量与性能增速没有这种因果关系。\n<\/ol>\n<h2>抽认卡<\/h2>\n<ul><li>\n摩尔定律原始表述？｜集成电路晶体管数量每年翻一倍（1965）\n<\/li><li>\n1975 年的修正？｜改为每两年翻一倍\n<\/li><li>\nTick 与 Tock 各做什么？｜Tick 换制造工艺，Tock 换微结构\n<\/li><li>\n为什么工艺与架构要分开迭代？｜分解难度、控制风险、缩短上市周期\n<\/li><li>\n性能放缓的三个原因？｜需求饱和、市场垄断、体系结构缺乏新理论\n<\/li><li>\n摩尔定律的性质？｜人为总结的经验规律，不是物理定律\n<\/ul>\n<h2>术语<\/h2>\n<ul><li>\n摩尔定律：集成电路晶体管数量约每两年翻倍的产业经验规律\n<\/li><li>\nTick-Tock：工艺与架构交替升级的两年周期策略\n<\/li><li>\n制程：制造工艺节点，如 14nm、10nm、7nm\n<\/li><li>\n挤牙膏：形容性能提升幅度很小的代际更新\n<\/li><li>\n性能过剩：算力超出多数用户实际需求的状态\n<\/ul>\n<h2>复习锚点<\/h2>\n<ul><li>\n一条靠人维持的经验曲线，斜率在变小\n<\/li><li>\nTick-Tock 的本质是分而治之，后来变三步\n<\/li><li>\n变慢是三件事叠加：没需求、没对手、没新理论\n<\/ul>", "ch09": "<h1>第 9 章：通用还是专用<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>学时<\/strong>：0.6 小时 | <strong>前置<\/strong>：第 1、5 章\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说清异构计算的两个基本思想\n<\/li><li>\n能举例说明专用处理器为什么快\n<\/li><li>\n能解释 big.little 的思路与适用场景\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>通用 CPU 什么都能干，但什么都不最快。把常见的大块计算交给专用电路，剩下的调度交回 CPU，整机就快了。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>两个基本思想<\/h3>\n<p>异构计算是不同类型计算单元合作完成一件事。第一个思想是&quot;专人干专事&quot;：数字信号处理、3D 渲染、AI 推理这些活，专门设计电路去做，效率远高于通用处理器，也更省电、更省面积。<\/p>\n<p>第二个思想是&quot;把软件干的活交给硬件&quot;。通用 CPU 上，一个功能是一串指令，指令越多越慢。专用处理器把整组操作固化成一排电路，一次就出结果，执行时间短得多。<\/p>\n<h3>GPU 就是最典型的例子<\/h3>\n<p>在屏幕上画一条线，CPU 一次只能画一个点，要画多少个点就得多少条指令。GPU 换了个思路：CPU 只告诉它两个端点坐标，中间的点由 GPU 自己插值、批量生成，再送显示器。结构可以很简单，速度却能快上百倍。<\/p>\n<p>最早的 GPU 只做 2D 硬件加速（直线、矩形、圆），后来加 3D，再加视频硬解码。连&quot;显示鼠标指针&quot;这种小事也交给 GPU 了。看高清视频时 CPU 占用不到 5%，就是因为画面相关的工作被 GPU 接走了。<\/p>\n<h3>桌面上的协处理器<\/h3>\n<p>一台现代计算机是&quot;一个通用 CPU 加一堆专用处理器&quot;：GPU 管图形，NPU 管网络，音频处理器管声音，硬盘控制器管读写。它们都受 CPU 调度，所以叫协处理器。科学计算和信号处理机器上还有 DSP，手机里则有 AI 用的 NPU。<\/p>\n<h3>通用芯片也能分工<\/h3>\n<p>ARM 的 big.little 在同一个芯片里放两类核：big 性能高功耗高，little 性能低功耗低。跑游戏、渲染复杂网页时上 big，打电话、发消息、听歌时用 little。这样一台手机既能扛重活，又能省电。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  CPU[通用 CPU&lt;br/&gt;调度 + 通用计算] --&gt; GPU[GPU&lt;br/&gt;图形与并行浮点]\n  CPU --&gt; NPU[NPU&lt;br/&gt;AI 推理]\n  CPU --&gt; DSP[DSP&lt;br/&gt;信号处理]\n  CPU --&gt; IO[IO 控制器&lt;br/&gt;网络 / 硬盘]\n  GPU --&gt; OUT[显示输出]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：CPU 在中间当调度者，四周是各类专用单元。箭头是任务分配，不是数据流；真正跑起来时数据在内存和各单元之间来回搬。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：通用 CPU 像一家综合医院，什么科都有但每个科都不顶尖；专用处理器像专科医院，看一类病又快又专。社区里两家并存，常见病去专科，复杂病回综合。失效边界：医院之间转诊要时间，芯片里数据搬运也有带宽和延迟成本，搬多了反而慢。\n<\/li><li>\n实例：播放高清视频。解码器把压缩流解成画面，这个活在专用硬件上做；CPU 只负责调度播放器、处理弹幕和声音同步。所以你看到 CPU 占用极低，风扇也不怎么转。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为专用处理器能取代 CPU。它只在特定计算上快，调度、分支、通用逻辑还得靠 CPU。\n<\/li><li>\n别以为异构就是堆芯片。任务分配、数据搬运、编程模型都要配套，堆了不会用等于白堆。\n<\/li><li>\n别以为 big.little 只是省电。调度策略写不好，任务在大小核之间来回搬，反而更费电。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n异构计算的两个基本思想是？｜专人干专事，以及把软件功能硬件化｜提高主频，增加核数｜降价，缩面积｜答案：A｜解析：专用化与硬件化是异构的核心。\n<\/li><li>\nGPU 画线比 CPU 快，主要因为？｜一次生成整条线的点，而不是逐点执行指令｜主频更高｜内存更大｜答案：A｜解析：把循环插值固化进硬件，指令数大幅减少。\n<\/li><li>\nbig.little 的适用场景是？｜应用多样且对功耗敏感的设备，如手机｜超算中心｜工业控制｜答案：A｜解析：大小核按负载切换，兼顾性能与续航。\n<\/ol>\n<h2>抽认卡<\/h2>\n<ul><li>\n异构计算的定义？｜不同类型计算单元分工合作完成计算任务\n<\/li><li>\n异构的两个基本思想？｜专人干专事；把软件功能交给硬件实现\n<\/li><li>\nGPU 为什么擅长图形？｜批量并行生成像素点，一条指令处理大量数据\n<\/li><li>\n协处理器是什么？｜受 CPU 调度、承担特定功能的专用处理器\n<\/li><li>\nbig.little 的两种核？｜高性能大核与低功耗小核，按负载调度\n<\/ul>\n<h2>术语<\/h2>\n<ul><li>\n异构计算：多种架构的计算单元协同完成任务的模式\n<\/li><li>\n协处理器：辅助 CPU 完成特定功能的专用处理器\n<\/li><li>\nGPU：图形处理器，擅长批量并行的像素与浮点运算\n<\/li><li>\nNPU：神经网络处理器，专门加速 AI 推理\n<\/li><li>\nbig.little：同芯片内集成高性能核与低功耗核的调度架构\n<\/ul>\n<h2>复习锚点<\/h2>\n<ul><li>\n通用管调度，专用管重活\n<\/li><li>\n专用快在&quot;循环变电路&quot;\n<\/li><li>\n异构的瓶颈常在数据搬运和调度\n<\/ul>", "ch10": "<h1>第 10 章：后门与漏洞——芯片里的幽灵<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>学时<\/strong>：0.8 小时 | <strong>前置<\/strong>：第 4、5 章\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能区分后门与漏洞：一个是态度问题，一个是能力问题\n<\/li><li>\n能说出 Meltdown/Spectre 利用了哪些常见优化机制\n<\/li><li>\n能解释打补丁为什么必然掉性能，以及为什么自主设计是必要的\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>后门是有人故意留的门，漏洞是没人发现的门缝。前者靠制度和自律，后者只能靠设计与验证，而且永远清不干净。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>两个词，两件事<\/h3>\n<p>后门是绕过正常安全机制的通道，通常是设计者有意安排、又没写进产品文档。比如留着调试接口不上报，出厂也不禁用，日后就能悄悄收集运行信息；或者留一条能被远程触发、执行异常操作的路径。<\/p>\n<p>漏洞是设计缺陷，设计者自己没意识到，测试也没抓到，上市后被外界发现。它不是故意的，但一样能被利用。<\/p>\n<p>书里那句话说得直白：漏洞是能力问题，后门是态度问题。<\/p>\n<h3>为什么漏洞清不完<\/h3>\n<p>软件工程有条基本原理：穷尽测试不可能。CPU 的输入组合和执行路径几乎是无限的，有限用例覆盖不了；用例本身也是人写的，也会漏。所以测试只能证明&quot;暂时没发现&quot;，永远证明不了&quot;没有&quot;。<\/p>\n<p>现代 CPU 为了性能堆了流水线、缓存、乱序执行、转移猜测。机制越复杂，出错的机会越多，而且这些机制互相交织，问题往往藏在组合条件里。<\/p>\n<h3>两个标志性漏洞<\/h3>\n<p>Meltdown 和 Spectre 在 2018 年公开，影响 Intel、ARM 的大量处理器。它们利用的恰恰是近三十年普遍使用的优化原理——乱序执行、推测执行、缓存侧信道。攻击者不需要特权，靠执行正常指令就能把不该看的数据摸出来。<\/p>\n<p>Intel 公布的受影响型号有 2300 种，能追到 1994 年的 Pentium；ARM 从 Cortex-A8 到 A77 都在列。这说明问题不在某一家，而在整套性能优化范式。<\/p>\n<p>再往前，威盛 C3 被研究者从专利文件里拼出一条未公开指令，能突破权限拿到最高控制权，公司没有正面回应是不是有意为之。Intel ME 则是另一个性质的问题：它是独立于 CPU 的管理模块，自带微型 CPU 和系统，能远程开机、监控、维修。2017 年曝出的 ME 漏洞让所有人意识到——这个&quot;管家&quot;权力太大，一旦被攻破，整机没有安全可言。<\/p>\n<h3>补丁与代价<\/h3>\n<p>已经卖出去的 CPU 不可能召回改硬件，只能在操作系统里绕。两种做法：改工作模式，避开触发条件；关掉部分优化特性，绕开执行路径。后者必然掉性能，Meltdown 的某个补丁据说掉了 40%。<\/p>\n<p>补丁是头痛医头。根治要靠硬件改版，但那要等下一代产品。<\/p>\n<h3>查漏洞与防后门<\/h3>\n<p>国际权威漏洞库是 CVE，编号格式 <code>CVE-年份-流水号<\/code>，1999 年建立，第一条是 BSD 协议栈的拒绝服务漏洞。Meltdown 对应 CVE-2017-5754，Spectre 对应 CVE-2017-5753 和 CVE-2017-5715。各国还有 NVD、CNNVD、CNVD，厂商也有自己的安全中心。<\/p>\n<p>防后门靠制度、自律、流程；防漏洞只能靠设计、验证、开源审视。CPU 源码不开放时，只能等原厂改版，周期很长。<\/p>\n<p>最关键的一句在书里：最危险的不是发现 CPU 有后门，而是你根本没法判断它有没有。黑盒子拿在手里，外部测试证明不了清白。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  D[设计] --&gt; V[验证]\n  V --&gt; M[量产上市]\n  M --&gt; F[外界发现漏洞]\n  F --&gt; P[操作系统打补丁&lt;br/&gt;掉性能]\n  F --&gt; R[下一代硬件修复&lt;br/&gt;周期长]\n  D -.有意留接口.-&gt; B[后门]\n  B --&gt; X[数据泄露 / 远程控制]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：实线是漏洞的正常生命周期，虚线是后门。补丁只是把风险往后推，硬件修复才是根治，而后门根本不在这条链上——它在设计那一刻就存在了。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：CPU 像一栋大楼。漏洞是设计时没算到的承重隐患，住进去才发现；后门是施工方偷偷配的钥匙。前者要靠加固和改图，后者要靠换施工方和制度约束。失效边界：楼可以封楼检查，CPU 封不了，你只能靠它自己说实话。\n<\/li><li>\n实例：Meltdown 补丁上线后，一些数据库和虚拟化场景的性能明显下滑，运维不得不重新评估容量。安全与性能从来不是免费的，这笔账最后由用户付。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为漏洞是&quot;小概率事件&quot;。它普遍存在，只是有没有被发现。\n<\/li><li>\n别以为关掉乱序执行就安全了。性能会塌，而且新漏洞还会从别的机制里冒出来。\n<\/li><li>\n别以为开源就等于安全。开源让更多人能查，但也让攻击者看得更清楚；它提高的是发现速度，不是绝对安全。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n后门与漏洞的本质区别是？｜后门是有意安排，漏洞是疏忽造成｜后门更严重｜漏洞更难修｜答案：A｜解析：一个是态度问题，一个是能力问题。\n<\/li><li>\nMeltdown/Spectre 利用的是？｜乱序执行、推测执行、缓存等性能优化机制｜电源管理漏洞｜网络协议缺陷｜答案：A｜解析：它们利用现代 CPU 的共性优化原理实现越权读取。\n<\/li><li>\n操作系统补丁的主要代价是？｜性能下降｜失去网络功能｜无法开机｜答案：A｜解析：绕开漏洞往往要关闭优化特性。\n<\/li><li>\n为什么说&quot;无法判断有没有后门&quot;最危险？｜黑盒外部测试无法证明其清白｜因为后门一定存在｜因为漏洞无法修复｜答案：A｜解析：不可验证意味着风险不可控。\n<\/ol>\n<h2>抽认卡<\/h2>\n<ul><li>\n后门的定义？｜绕过正常安全机制的隐秘通道，通常为有意设置\n<\/li><li>\n漏洞的定义？｜设计缺陷，可被攻击者利用实现非正常功能\n<\/li><li>\n为什么测试找不全漏洞？｜输入与执行路径近乎无限，穷尽测试不可能\n<\/li><li>\nMeltdown 的 CVE 编号？｜CVE-2017-5754\n<\/li><li>\nSpectre 的两个 CVE？｜CVE-2017-5753、CVE-2017-5715\n<\/li><li>\nIntel ME 是什么？｜独立于 CPU 的管理引擎，含微型 CPU 与系统，可远程管理机器\n<\/ul>\n<h2>术语<\/h2>\n<ul><li>\n后门：设计者有意保留、未公开的绕过安全机制的通道\n<\/li><li>\n漏洞：设计中可被利用的缺陷\n<\/li><li>\n侧信道：通过缓存、时序等间接信息推断数据的攻击方式\n<\/li><li>\nCVE：国际通用的漏洞编号与披露体系\n<\/li><li>\n补丁：在软件层绕开硬件漏洞的修复手段\n<\/ul>\n<h2>复习锚点<\/h2>\n<ul><li>\n后门看态度，漏洞看能力\n<\/li><li>\n优化越复杂，漏洞越多；补丁必掉性能\n<\/li><li>\n不可验证的黑盒，是最大的风险\n<\/ul>", "ch11": "<h1>第 11 章：理论基石——布尔代数与数字电路<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>学时<\/strong>：0.7 小时 | <strong>前置<\/strong>：第 4、5 章\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说出支撑 CPU 的三门基础理论\n<\/li><li>\n能列出 CPU 研制团队里至少六个岗位，并说出各自产出什么\n<\/li><li>\n能解释为什么电路设计比软件编程更难\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>CPU 是数学、电子、计算机科学三股绳拧出来的。设计它的难，不在单个模块，在模块之间那张网。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>三门底子<\/h3>\n<p>布尔代数：1847 年布尔在《逻辑的数学分析》里把逻辑写成代数，二进制从此有了运算规则。数字电路设计：用 0/1 电平搭电路，CPU 的引脚、内部模块都跑在这套逻辑上。计算机系统结构：讲整机由哪些模块组成、模块之间怎么连，CPU 是其中最复杂的一块。<\/p>\n<p>缺一门都做不成：只有数学是纸上谈兵，只有电路是没有灵魂的开关，只有系统结构是画不出来的框图。<\/p>\n<h3>一支 CPU 团队有哪些人<\/h3>\n<p>数字电路设计：用 Verilog 写逻辑，龙芯 3A4000 的源码有几十万行。 物理设计：决定每个器件在芯片上的位置、连线，做时序分析，输出交给流片厂的版图。 全定制设计：手工摆每个晶体管，用在寄存器堆这类最要性能的模块上。 可测性设计（DFT）：加测试接口，能控制、能观察内部状态。 性能评估与优化：追学术新方法，也复盘自家产品的瓶颈。 安全分析：盯漏洞与后门，在设计中规避。 电路验证：在流片前用 FPGA 跑设计，证明功能对。 模拟电路：温度传感器、部分外设接口这类少量模块。 封装设计：外壳尺寸、材料。 测试：硅后测试，筛成品。<\/p>\n<p>这套岗位组合起来，就是一颗 ASIC 的完整设计流程。<\/p>\n<h3>为什么电路比软件难<\/h3>\n<p>第一，工具差一代。软件语言一路演进到 Python、Java，硬件描述语言主流还是八十年代的 Verilog，描述能力大致在汇编和 C 之间。<\/p>\n<p>第二，结构不同。软件是树形分层，模块高内聚低耦合，能拆开单独测；电路为了性能高度耦合，是网状结构，模块并行工作，拆不开。软件那套&quot;分而治之&quot;在电路上不好使。<\/p>\n<p>第三，有状态。软件推崇无状态函数，输入定输出就定；电路模块大量带存储，输出还取决于内部记忆，测试要考虑输入顺序、时间维度。有状态模块的验证工作量，比无状态大得多。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  B[布尔代数&lt;br/&gt;数学] --&gt; D[数字电路设计&lt;br/&gt;电路]\n  D --&gt; C[CPU]\n  A[计算机系统结构&lt;br/&gt;整机] --&gt; C\n  C --&gt; V[验证 / 物理设计 / 封装 / 测试]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：左边两门理论合成设计能力，右边是工程实现链条。理论给你&quot;能不能算&quot;，工程链决定&quot;能不能造出来、造得对不对&quot;。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：电路设计像中医看病，靠的是长期经验和整体判断；软件像现代流水线，分工明确、每道工序可独立检验。失效边界：中医也有规范，电路也有工具链，这个比喻只强调&quot;整体耦合&quot;这一面。\n<\/li><li>\n实例：龙芯 GS232 的微结构图是一张密密麻麻的网，几乎每个模块都跟好几个模块相连。看软件架构图，通常是整齐的树；看电路架构图，很难找到干净的层级。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为写 Verilog 就是写代码。它描述的是同时存在的电路，不是顺序执行的语句。\n<\/li><li>\n别以为验证是&quot;跑一遍看看&quot;。验证的工作量往往超过设计本身。\n<\/li><li>\n别以为全定制一定更好。它性能高，但人力和周期成本也高，只在关键模块用。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n下列哪项不属于 CPU 的三门基础理论？｜概率论｜布尔代数｜数字电路设计｜答案：A｜解析：书中列的是布尔代数、数字电路、计算机系统结构。\n<\/li><li>\n物理设计的输出是什么？｜可交给流片厂的版图｜一份需求文档｜一段汇编代码｜答案：A｜解析：物理设计确定器件位置与连线，最终形成版图。\n<\/li><li>\n电路设计比软件难的原因不包括？｜电路模块都是无状态的｜硬件描述语言更新慢、描述能力弱｜电路是高度耦合的网状结构｜答案：A｜解析：电路模块大量是有状态的，恰恰更难。\n<\/ol>\n<h2>抽认卡<\/h2>\n<ul><li>\nCPU 的三门基础理论？｜布尔代数、数字电路设计、计算机系统结构\n<\/li><li>\n数字电路设计用什么语言？｜硬件描述语言，如 Verilog、VHDL\n<\/li><li>\nDFT 的作用？｜增加可控可观测的测试接口，便于验证与排错\n<\/li><li>\n电路验证常用什么平台？｜FPGA，用设计源码模拟真实芯片\n<\/li><li>\n电路为什么难分而治之？｜模块高度耦合、网状连接、并行工作\n<\/li><li>\n&quot;有状态&quot;模块难在哪？｜输出还取决于内部存储，测试要覆盖输入顺序与时间维度\n<\/ul>\n<h2>术语<\/h2>\n<ul><li>\n布尔代数：研究二进制逻辑表示与运算的数学理论\n<\/li><li>\n硬件描述语言：描述数字电路功能与结构的文本语言\n<\/li><li>\n物理设计：确定器件位置、连线并输出工艺版图的设计阶段\n<\/li><li>\n全定制设计：手工排布每个晶体管的高性能实现方式\n<\/li><li>\n可测性设计（DFT）：为测试与调试增加专用电路接口的设计方法\n<\/ul>\n<h2>复习锚点<\/h2>\n<ul><li>\n数学给规则，电路给载体，体系结构给组织方式\n<\/li><li>\n设计流程十来个岗位，验证与物理设计是大头\n<\/li><li>\n电路难在&quot;网&quot;和&quot;状态&quot;\n<\/ul>", "ch12": "<h1>第 12 章：EDA——在电脑里先把 CPU 造一遍<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>学时<\/strong>：0.6 小时 | <strong>前置<\/strong>：第 11 章\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说出 EDA 的两大功能\n<\/li><li>\n能走通 RTL → 逻辑综合 → 门级网表 → 版图这条链\n<\/li><li>\n能区分前端设计与后端设计\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>EDA 是芯片的设计软件。你用 Verilog 写&quot;要什么功能&quot;，它帮你算&quot;怎么摆晶体管&quot;。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>两大功能<\/h3>\n<p>设计：把 Verilog 描述的电路，自动转成晶体管布局和连线，顺带做时序分析、功耗分析、封装设计。 验证：在流片前自动检查设计代码，甚至加载代码像真 CPU 一样跑起来，看状态变化对不对——这叫仿真。<\/p>\n<h3>产业链位置<\/h3>\n<p>全球 EDA 市场九成半在美国三巨头手里：Synopsys、Cadence、Mentor。这是芯片产业最上游的软件，源代码规模不低于 CPU 和操作系统，属于需要多年积累的高门槛产品。高端工具贵到一年几千万美元，小公司根本用不起。<\/p>\n<p>国产有十余家，华大九天、芯禾、广立微等，工艺上以 16nm、28nm 为主，还撑不起 7nm；加起来占全球份额约 1%。点工具好用，全流程还差。<\/p>\n<h3>开源也能练手<\/h3>\n<p>学原理不必上高端工具。任何文本编辑器都能写 Verilog，一个模块一个文件，整个 CPU 拆成一堆文件，合起来叫一个项目。验证用 iverilog，先编译再仿真；状态变化用 gtkwave 看波形，0/1 随时间起伏像波浪。<\/p>\n<p>这套环境能完成大部分 CPU 原理教材的实验，也是龙芯新人入门用的工具链，甚至可以在龙芯机器上跑——&quot;用龙芯电脑设计龙芯 CPU&quot;。<\/p>\n<h3>Verilog 里有什么<\/h3>\n<p>module 定义模块，wire 是连线，reg 是存储，assign 描述组合逻辑，always 描述时序逻辑，initial 是初始动作，再加上运算符、if-else、循环、函数。还有时钟信号、EDA 提供的单元库（加法器、乘法器、存储器），以及设计约束——时序、面积、功耗三条硬杠。<\/p>\n<h3>从抽象到实现<\/h3>\n<p>Verilog 写出来的是 RTL 模型（寄存器传输级），描述数据在寄存器之间怎么流动、怎么加工。这不是真正的门电路。<\/p>\n<p>逻辑综合把 RTL 转成门级模型：门单元加连线，像一张网，所以叫网表（netlist）。这一步类似软件里的编译。<\/p>\n<p>以网表为界，前面叫前端（逻辑设计），后面叫后端（物理设计：布局布线，定下晶体管实际位置，产出交付流片厂的版图）。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  RTL[Verilog RTL&lt;br/&gt;逻辑功能] --&gt;|逻辑综合| NET[门级网表]\n  NET --&gt;|布局布线| GDS[版图]\n  RTL --&gt;|仿真验证| WAVE[波形 / 结果]\n  GDS --&gt; FAB[流片厂]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：仿真那条支路是&quot;先在电脑里试错&quot;，流片是&quot;真花钱&quot;。前端改一行代码几乎不要钱，流片改一版要几百万美元，所以验证必须做足。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：EDA 像建筑行业的 BIM 加自动出图。设计师只画功能与结构，软件算钢筋怎么排、管线怎么走，还能先做碰撞检查。失效边界：BIM 错了改图就行，芯片错了要重新流片，代价高几个数量级。\n<\/li><li>\n实例：用 iverilog 仿真一个加法器，给输入 A=3、B=5，波形窗口里能看到进位与和的变化逐拍出现。这种&quot;看得见的 0/1&quot;是初学者理解时序最直接的方式。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 EDA 只是画图工具。它的验证能力才是保命的部分。\n<\/li><li>\n别以为开源 EDA 只能玩。教学、嵌入式、控制类 CPU 完全够用。\n<\/li><li>\n别以为有了 EDA 就不需要懂电路。工具替你布线，不替你决定架构。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\nEDA 的两大功能是？｜设计与验证｜编译与运行｜绘图与打印｜答案：A｜解析：自动布局布线和仿真验证是核心。\n<\/li><li>\nRTL 经逻辑综合后得到什么？｜门级网表｜汇编代码｜版图｜答案：A｜解析：网表是门单元及其连线的描述。\n<\/li><li>\n前端与后端的分界点是？｜网表｜操作系统｜封装｜答案：A｜解析：网表之前是逻辑设计，之后是物理设计。\n<\/li><li>\n常用于教学的波形查看工具是？｜gtkwave｜Photoshop｜WPS｜答案：A｜解析：gtkwave 用来观察仿真中 0/1 随时间的变化。\n<\/ol>\n<h2>抽认卡<\/h2>\n<ul><li>\nEDA 全称？｜电子设计自动化\n<\/li><li>\nRTL 是什么？｜寄存器传输级模型，描述数据在寄存器间的流动与加工\n<\/li><li>\n逻辑综合做什么？｜把 RTL 自动转换成门级网表\n<\/li><li>\n版图是什么？｜确定器件位置与连线的最终设计文件，交付流片\n<\/li><li>\n开源仿真器与波形工具？｜iverilog 与 gtkwave\n<\/li><li>\nEDA 三巨头？｜Synopsys、Cadence、Mentor\n<\/ul>\n<h2>术语<\/h2>\n<ul><li>\nEDA：电子设计自动化，芯片设计与验证软件\n<\/li><li>\nRTL：寄存器传输级，Verilog 描述的抽象电路模型\n<\/li><li>\n逻辑综合：把 RTL 转成门级网表的过程\n<\/li><li>\n网表：门单元及其连接关系的描述\n<\/li><li>\n版图：含器件位置与连线的物理设计成果\n<\/li><li>\n仿真：用软件模拟电路运行以验证功能\n<\/ul>\n<h2>复习锚点<\/h2>\n<ul><li>\nEDA 管设计也管验证\n<\/li><li>\nRTL → 网表 → 版图，前端到后端\n<\/li><li>\n流片很贵，所以先在电脑里跑够\n<\/ul>", "ch13": "<h1>第 13 章：二进制——从开关到数字<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>学时<\/strong>：0.8 小时 | <strong>前置<\/strong>：无（本章可独立读）\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能用 CMOS 晶体管解释 0/1 的物理来源\n<\/li><li>\n能用&quot;字符表 + 权重&quot;说明任意进制，并会做十进制转二进制\n<\/li><li>\n能解释补码为什么让 CPU 只需要加法器\n<\/li><li>\n能说出 IEEE 754 浮点数存了哪两部分\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>0/1 不是抽象符号，是晶体管导通与截止。补码让减法变成加法，浮点数让小数点的位置可以浮动。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>0 和 1 从哪来<\/h3>\n<p>CPU 里最小的物理单元是 CMOS 晶体管，材料是硅、二氧化硅、金属、多晶硅。它的特性很简单：电压控制下导通或截止。导通就是能过电子，截止就是绝缘。像水龙头，电压是旋钮。<\/p>\n<p>引脚电压低代表 0，高代表 1。两个晶体管组成一个反相器（非门）：输入低就输出高，反之亦然。有了非门，按布尔代数就能拼出与、或、与非、或非，再往上拼出计算单元和存储单元。整个 CPU 是从这颗小开关一层层叠起来的。<\/p>\n<p>硅在地壳里占 26.3%，所以这行叫&quot;硅工业&quot;。<\/p>\n<h3>数制：字符表和权重<\/h3>\n<p>N 进制用 0 到 N-1 做字符，从低位到高位排列，第 n 位的权重是 N 的 n 次方。二进制只有 0 和 1，权重是 1、2、4、8……十进制 183 用 8 位寄存器表示就是 10110111（128+32+16+4+2+1）。<\/p>\n<h3>补码：让减法消失<\/h3>\n<p>原码是把最高位当符号位，0 正 1 负。麻烦在于加减要分别判断符号位和数值位，电路复杂。<\/p>\n<p>补码换了个思路：正数的补码等于原码；负数的补码是原码按位取反再加一。这样符号位和数值位可以统一处理，加法就是按位加；减法 A-B 变成 A+(-B)，把 B 取反加一再加就行。<\/p>\n<p>结果就是现在的 CPU 只有加法器，没有减法器。补码的发明远早于计算机——1645 年帕斯卡的机械计算器用的就是十进制补码。<\/p>\n<h3>浮点数：小数点会移动<\/h3>\n<p>定点表示范围太小：32 位整数最大约 21 亿（2 的 31 次方），科学计算不够用。<\/p>\n<p>浮点数借科学计数法：125.62 写成 1.2562×10 的 2 次方，只需存底数&quot;1&quot;后面的部分和指数。IEEE 754 规定单精度 32 位，最大约 3.4×10 的 38 次方；双精度 64 位，最大约 1.8×10 的 308 次方。龙芯也遵循这个标准，有独立浮点寄存器和浮点运算器。<\/p>\n<p>要记住一个边界：计算机只能存有限小数，数学里的无限小数、无理数它存不下。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  T[CMOS 晶体管&lt;br/&gt;导通 / 截止] --&gt; N[反相器&lt;br/&gt;非门]\n  N --&gt; G[与 / 或 / 与非 / 或非]\n  G --&gt; A[加法器 / 存储单元]\n  A --&gt; CPU[CPU]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：越往下越抽象。看这张图要抓的是&quot;逐层叠加&quot;：没有一个叫&quot;CPU&quot;的魔法零件，只有开关和开关的组合。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：补码像钟表。把 8 点往回拨 3 小时，等于往前拨 9 小时，表盘上结果一样。模运算里，减一个数等于加它的补数。失效边界：钟表是 12 进制循环，计算机是 2 的 n 次方循环，溢出时会绕回，这既是技巧也是坑。\n<\/li><li>\n实例：8 位下算 -5 的补码：5 是 00000101，取反 11111010，加一 11111011。用它和 7（00000111）相加得 00000010，即 2，正好是 7-5。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 0/1 是&quot;电子的有无&quot;。它是电压高低两个区间，中间还有不允许的过渡带。\n<\/li><li>\n别以为浮点数精度很高。0.1 在二进制里就是无限循环小数，存进去必然有误差，所以金额计算不能用浮点。\n<\/li><li>\n别以为位宽越多越好。64 位已够用，128 位暂时没有实际需求，加了只是成本。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\nCPU 中 0 和 1 的物理载体是？｜CMOS 晶体管的截止与导通｜磁盘的磁极｜光的明暗｜答案：A｜解析：引脚电压高低对应 0/1。\n<\/li><li>\n负数补码的计算方法是？｜原码按位取反后加一｜原码加一｜原码最高位置一｜答案：A｜解析：这是补码的标准定义。\n<\/li><li>\n补码带来的直接好处是？｜减法可转成加法，只需加法器｜存储容量翻倍｜主频提高｜答案：A｜解析：符号位与数值位统一处理。\n<\/li><li>\nIEEE 754 单精度浮点数的位宽是？｜32 位｜16 位｜64 位｜答案：A｜解析：单精度 32 位，双精度 64 位。\n<\/ol>\n<h2>抽认卡<\/h2>\n<ul><li>\n反相器由几个晶体管组成？｜两个\n<\/li><li>\nN 进制的两条基本规则？｜字符表 0 到 N-1；第 n 位权重为 N 的 n 次方\n<\/li><li>\n负数的补码怎么求？｜原码按位取反再加一\n<\/li><li>\n为什么 CPU 没有减法器？｜补码把减法化成了加法\n<\/li><li>\nIEEE 754 存浮点数的哪两部分？｜底数（有效数字）与指数\n<\/li><li>\n计算机能表示所有实数吗？｜不能，只能表示有限小数\n<\/ul>\n<h2>术语<\/h2>\n<ul><li>\nCMOS：互补金属氧化物半导体，CPU 的基础器件\n<\/li><li>\n反相器：输出与输入相反的基本门电路\n<\/li><li>\n补码：让符号位与数值位统一运算的编码方式\n<\/li><li>\n定点数：小数点位置固定的表示方式\n<\/li><li>\n浮点数：按科学计数法存储底数与指数的表示方式\n<\/li><li>\nIEEE 754：国际通用的浮点数表示标准\n<\/ul>\n<h2>复习锚点<\/h2>\n<ul><li>\n0/1 = 电压高低 = 晶体管开合\n<\/li><li>\n补码把减法变成加法\n<\/li><li>\n浮点 = 底数 + 指数，精度有边界\n<\/ul>", "ch14": "<h1>第 14 章：CPU 的天职——数值运算<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>学时<\/strong>：0.6 小时 | <strong>前置<\/strong>：第 13 章\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明 1 位加法器怎样串成 32 位加法器\n<\/li><li>\n能列出 ALU 的四类常见功能\n<\/li><li>\n能区分数数据寄存器、指令寄存器、地址寄存器、标志位寄存器\n<\/li><li>\n能解释&quot;CPU 是多少位&quot;指的是什么\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>CPU 的算力起点是一个能做&quot;1+1&quot;的电路。把它串起来、并起来、加快起来，就有了现代 CPU。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>从 1 位加法器到 32 位<\/h3>\n<p>1 位加法器有三个输入：加数 A、被加数 B、低位来的进位 Cin；两个输出：本位的和 S、向高位的进位 Cout。八种输入组合可以手工列全，十来颗晶体管就能实现。<\/p>\n<p>多位加法就是串联：32 位加法器由 32 个 1 位加法器从低到高连起来，低位进位喂给高位，跟小学列竖式一模一样。<\/p>\n<p>乘法器最常见的是&quot;移位加&quot;：乘数每一位决定要不要把被乘数移位后加上去，也是竖式思路。1960 年代科学家把高速算法挖到极致，现在很少再出新算法，龙芯沿用的也是那批经典方法。<\/p>\n<h3>ALU：一个模块干多种活<\/h3>\n<p>算术逻辑单元（ALU）把多种运算装进一个模块：算术（加、减、乘、除、余数）、移位（左、右）、逻辑（与、或、非、异或、取反）、比较（相等、大于、小于）、地址（当前指令地址加偏移求跳转目标）。科学计算用的高级 ALU 还能做指数、对数、三角、开方。<\/p>\n<p>典型结构：两个源操作数 A、B，一个结果 S，一个控制端 ALUop 选择做哪种运算。<\/p>\n<p>一条指令只能用一个 ALU 的话，速度上不去。所以高性能 CPU 放多个 ALU 并行工作——龙芯 2 号有 5 个运算模块：2 个整数 ALU、1 个地址 ALU、2 个浮点 ALU，同时开工，速度提升数倍。<\/p>\n<h3>寄存器：CPU 的草稿纸<\/h3>\n<p>寄存器是 CPU 内部的存储单元，和存储器（内存）相对：内存大、在片外，存程序的输入和最终结果；寄存器小、在片内，存计算过程的中间数据，讲究&quot;瞬时&quot;。<\/p>\n<p>按用途分：数据寄存器（整数、浮点分开）、指令寄存器（暂存待执行的指令）、地址寄存器（存要访问的内存地址，其中存下一条指令地址的叫程序计数器 PC）、标志位寄存器（存运算结果的特征，比如是否为零、是否溢出）。<\/p>\n<p>位宽是一个寄存器包含多少二进制位，&quot;CPU 是多少位&quot;说的就是它。位宽大，能表示的范围大、算力强，但成本也高。历史从 8 位、16 位走到 32 位、64 位；64 位已够用，桌面和服务器暂时没有 128 位的需求。龙芯 1 号是 32 位，2 号、3 号是 64 位。<\/p>\n<p>一组寄存器做成一个模块就是寄存器堆，三个端口：地址端口选编号，读写控制端口定方向，数据端口进出数据。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[&quot;加数 A&quot;] --&gt; FA[&quot;1 位加法器&quot;]\n  B[&quot;被加数 B&quot;] --&gt; FA\n  CIN[&quot;低位进位&quot;] --&gt; FA\n  FA --&gt; S[&quot;本位和 S&quot;]\n  FA --&gt; COUT[&quot;向高位进位&quot;]\n  COUT --&gt;|串联| NEXT[&quot;高位加法器&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：进位那根线是关键。它从低位一路传到高位，位宽越大，进位链越长，这也是加法器速度优化的着力点。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：寄存器像做题时的草稿纸，内存像课本和作业本。草稿纸就在手边，写得快，但只有几页；作业本厚，翻起来慢。失效边界：草稿纸写完可以擦，寄存器会被下一条指令直接覆盖，程序员得自己安排谁先用谁后用。\n<\/li><li>\n实例：算 183+97。8 位加法器从最低位开始，逐位加并传递进位，最后得到 280，但 8 位最大只能表示 255，于是溢出。标志位寄存器会把溢出位置一，程序据此判断结果是否可信。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为乘法是独立硬件从头算。很多实现是移位加，靠加法器反复用。\n<\/li><li>\n别以为寄存器越多越好。数量多了编码变长、访问变慢，编译器分配也更难。\n<\/li><li>\n别以为 64 位一定比 32 位快一倍。位宽影响的是寻址范围与单次处理能力，实际性能还看微结构。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n32 位加法器由什么构成？｜32 个 1 位加法器串联，低位进位接高位｜32 个乘法器｜一个 32 位寄存器｜答案：A｜解析：与竖式加法同理，逐位进位。\n<\/li><li>\nALU 的控制端 ALUop 作用是什么？｜选择执行哪种运算｜设置主频｜选择寄存器编号｜答案：A｜解析：它决定多路选择器输出哪一路运算结果。\n<\/li><li>\n&quot;CPU 是多少位&quot;通常指？｜寄存器的位宽｜主板尺寸｜风扇转速｜答案：A｜解析：位宽决定单次处理的数据宽度与寻址能力。\n<\/li><li>\n程序计数器 PC 属于哪类寄存器？｜地址寄存器｜数据寄存器｜标志位寄存器｜答案：A｜解析：PC 保存下一条要执行的指令地址。\n<\/ol>\n<h2>抽认卡<\/h2>\n<ul><li>\n1 位加法器有几个输入输出？｜3 个输入（A、B、Cin），2 个输出（S、Cout）\n<\/li><li>\n乘法器的基本算法？｜移位加\n<\/li><li>\nALU 的四类常见功能？｜算术、移位、逻辑、比较（另有地址运算）\n<\/li><li>\n寄存器与存储器的区别？｜寄存器在片内、容量小、存中间数据；存储器在片外、容量大、存程序与结果\n<\/li><li>\n寄存器堆的三个端口？｜地址端口、读写控制端口、数据端口\n<\/li><li>\n标志位寄存器存什么？｜运算结果的特征，如是否为零、是否溢出\n<\/ul>\n<h2>术语<\/h2>\n<ul><li>\n加法器：实现二进制加法的电路，多位由 1 位串联而成\n<\/li><li>\nALU：算术逻辑单元，执行多种运算的部件\n<\/li><li>\n寄存器：CPU 内部的小容量高速存储单元\n<\/li><li>\n程序计数器（PC）：保存下一条指令地址的寄存器\n<\/li><li>\n寄存器堆：一组寄存器构成的模块，带地址与读写端口\n<\/li><li>\n溢出：运算结果超出寄存器位宽所能表示的范围\n<\/ul>\n<h2>复习锚点<\/h2>\n<ul><li>\n加法器串联靠进位，乘法靠移位加\n<\/li><li>\nALU 多而并行，算力才上得去\n<\/li><li>\n寄存器是草稿纸，位宽定义&quot;多少位 CPU&quot;\n<\/ul>", "ch15": "<h1>第 15 章：流水线的奥秘<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>学时<\/strong>：0.7 小时 | <strong>前置<\/strong>：第 14 章\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能画出四级流水线，并说明为什么两条指令只要 5 拍而不是 8 拍\n<\/li><li>\n能列出流水线级数增加的好处与代价\n<\/li><li>\n能用 Pentium 4 的例子说明&quot;主频不等于性能&quot;\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>流水线是把一条指令切成几段，让不同段同时处理不同指令。切得越细主频越高，但段间的开销也越大。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>四段怎么切<\/h3>\n<p>以 CHN-1 为例，一条指令分四段：算地址（AG，地址计数器加一）、取指令（IF，从存储器取到指令寄存器）、执行（EX，运算器生成点阵）、显示（DC，输出到屏幕）。顺序固定：AG → IF → EX → DC。相邻两段之间用寄存器存上一步的结果。<\/p>\n<p>不做流水时，一条指令占四个节拍，两条要八拍。每一刻只有一段在干活，另外三段闲着。<\/p>\n<h3>叠加起来<\/h3>\n<p>第一条在执行 IF 时，第二条的 AG 完全可以同时开始——用的是不同硬件，不冲突。于是两条指令从 8 拍缩到 5 拍。这就是流水线：宏观上多条指令同时在跑，微观上每一刻各段都在忙。<\/p>\n<p>CHN-4 用 4 分频时钟驱动四个段，是四级流水线，最多四条指令并行。级数可以继续加，每级干的活更少，龙芯 3A4000 做到了 12 级。历史上 ILLIAC 2 在 1958 年就用了三级：取指、译码、执行。<\/p>\n<p>流水线原理简单、容易用数字电路实现，从超算到嵌入式、手机 CPU 全都在用，所以教材都拿它当开篇第一课。<\/p>\n<h3>级数不是越多越好<\/h3>\n<p>好处有两个：并行度提高，单位时间完成的指令更多（吞吐率上升）；每级活少，时钟节拍可以更短，主频可以更高。<\/p>\n<p>代价也有两个：段间寄存器变多，面积、功耗、成本都涨；数据在寄存器间多走几趟，单条指令的延迟反而变长。再叠加转移猜测、指令相关这些机制，收益可能被吃光。<\/p>\n<h3>一场主频大战的教训<\/h3>\n<p>1999 年 AMD 的 Athlon 率先跑到 1GHz，压过 Pentium 3。Intel 2000 年推 NetBurst 架构的 Pentium 4，靠加深流水线冲主频：P3 是 11 级，P4 一开始 20 级，后来到 31 级，主频冲到 1.4GHz 以上。结果实测计算速度还不如 P3 和 Athlon。消费者这才发现，为&quot;主频&quot;多掏的钱没换来性能。<\/p>\n<p>这段历史说明：主频只是性能公式里的一个因子，流水线深度是拿延迟换频率，换过头就亏。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  subgraph 第1拍\n    A1[AG1]\n  end\n  subgraph 第2拍\n    A2[IF1]\n    B2[AG2]\n  end\n  subgraph 第3拍\n    A3[EX1]\n    B3[IF2]\n    C3[AG3]\n  end<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：斜着看是同一时刻并行工作的不同段，横着看是一条指令走完全程。流水线的效率来自这张&quot;斜表&quot;被填满，一旦遇到跳转或数据依赖，表里就会出现空档。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：流水线像洗车房。冲水、打泡沫、擦干、上蜡四道工序，四辆车可以同时在不同工位。单辆车通过仍要四道工序的时间，但整体吞吐翻了几倍。失效边界：车与车之间不会互相等数据，指令之间会——后一条要用前一条的结果，就得停下来等。\n<\/li><li>\n实例：把一条指令切成 12 级，主频也许能从 2GHz 提到 3GHz，但一次跳转猜错要清空十几级流水，惩罚比以前更重。所以深流水必须配更好的分支预测，否则白搭。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为流水线让单条指令变快。它优化的是吞吐，不是延迟，单条反而可能更慢。\n<\/li><li>\n别以为级数越多越先进。P4 的 31 级就是反面教材。\n<\/li><li>\n别以为流水线只在大芯片里有。手机、嵌入式 CPU 一样用。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n四级流水线执行两条指令需要几拍？｜5 拍｜8 拍｜4 拍｜答案：A｜解析：第一拍填满，之后每拍出一条，共 4+2-1=5。\n<\/li><li>\n加深流水线的主要好处是？｜提高吞吐率与主频｜降低面积｜减少寄存器｜答案：A｜解析：每级活少、时钟可更短，同时并行度更高。\n<\/li><li>\nPentium 4 的教训说明？｜主频高不等于性能高｜流水线没有用｜AMD 没有竞争力｜答案：A｜解析：31 级流水线主频虽高，实测性能不及 P3。\n<\/li><li>\n段间寄存器的作用是？｜保存上一段的结果供下一段使用｜提高电压｜存储程序｜答案：A｜解析：它是流水段之间的数据交接点。\n<\/ol>\n<h2>抽认卡<\/h2>\n<ul><li>\n流水线的定义？｜把指令切成多段，由不同硬件同时处理多条指令\n<\/li><li>\n四级流水线的四个段？｜算地址 AG、取指 IF、执行 EX、显示 DC\n<\/li><li>\n为什么两条指令只要 5 拍？｜不同段用不同硬件，可叠加执行\n<\/li><li>\n加深流水线的两个代价？｜面积功耗上升；单条指令延迟变长\n<\/li><li>\n龙芯 3A4000 的流水线级数？｜12 级\n<\/li><li>\n吞吐率与延迟的区别？｜单位时间完成的任务量 vs 单条任务从开始到结束的时间\n<\/ul>\n<h2>术语<\/h2>\n<ul><li>\n流水线：把指令执行切分为多段并叠加处理的结构\n<\/li><li>\n吞吐率：单位时间内完成的指令数量\n<\/li><li>\n流水级：流水线中的一段，由独立电路模块承担\n<\/li><li>\n段间寄存器：保存上一段结果、供下一段读取的寄存器\n<\/li><li>\n主频：时钟每秒跳动的次数\n<\/ul>\n<h2>复习锚点<\/h2>\n<ul><li>\n流水线换的是吞吐，不是单条速度\n<\/li><li>\n级数加深：频率升、开销也升\n<\/li><li>\n主频只是性能的一个因子\n<\/ul>", "ch16": "<h1>第 16 章：乱序执行与多发射——把流水线喂饱<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>学时<\/strong>：0.9 小时 | <strong>前置<\/strong>：第 15 章\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能区分数据相关与结构相关，并说明它们为什么让流水线停顿\n<\/li><li>\n能用保留站、重命名寄存器、ROB 三个部件解释乱序执行\n<\/li><li>\n能解释多发射与转移猜测各自解决什么问题\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>乱序执行的秩序是：乱着做，按原顺序交账。保留站负责乱，ROB 负责收，重命名寄存器负责中间账。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>为什么要乱<\/h3>\n<p>流水线最怕停顿。相邻两条指令，后一条要用前一条的结果，这叫数据相关（写后读 RAW），后一条只能等。两条都要用唯一的乘法器，这叫结构相关，也只能等。等，就是流水线空转。<\/p>\n<p>既然 A 和 B 相关、A 和 C 不相关，那就让 C 先上。这种由硬件判断相关性、重排执行顺序的技术叫动态调度，做出来的流水线叫动态流水线；反之是静态流水线。手机、桌面的 CPU 基本都是动态的，只有低端嵌入式还用静态。<\/p>\n<h3>Tomasulo 的三个部件<\/h3>\n<p>1966 年 IBM 360/91 用的 Tomasulo 算法，是这一切的老祖宗。<\/p>\n<p>保留站（也叫发射队列）在指令队列和计算单元之间，每条待执行的指令占一格，格里记三样：操作类型、已就绪的源操作数数值、还没就绪的源操作数的&quot;生产者编号&quot;。每拍扫一遍，谁的源操作数齐了就送谁去算。<\/p>\n<p>寄存器堆里每个寄存器也加一个指针，指向最后会写它的那个保留站单元。<\/p>\n<p>算完的结果走公共数据总线（CDB）广播回去：所有等这个结果的保留站单元、所有指向它的寄存器，一次全更新。这就是&quot;借道超车&quot;能成立的原因——结果不用挨个通知。<\/p>\n<p>重命名寄存器是这套机制的点睛。软件看得见的叫物理（架构）寄存器，保存最终结果；内部另有一套重命名寄存器，存中间结果。同一个架构寄存器被多条指令反复写，内部各用各的副本，写后读的假依赖就消失了。这叫寄存器重命名。<\/p>\n<h3>ROB：乱着做，按序交<\/h3>\n<p>乱序最怕收不了场：一旦某条指令出错（除零、缺页），后面的指令可能已经把状态改乱了。<\/p>\n<p>重排序缓存（ROB）按程序原始顺序排队，在执行之后加一个提交阶段。执行结果先写重命名寄存器，只有走到提交阶段，才写进物理寄存器。正常指令提交后出队；出错的那条，检查 ROB 队首就知道是谁，它后面的指令一律不提交。<\/p>\n<p>所以乱序执行的三句话：有序取指、乱序执行、有序提交。对程序员透明，结果和顺序执行完全一致。<\/p>\n<p>典型结构至少四级：取指、译码（分派到不同发射队列）、发射（挑就绪的送计算单元）、执行（结果经总线写回）。看到材料里出现&quot;发射队列&quot;，基本可以断定这是动态流水线。龙芯用的是统一寄存器堆加译码端重命名表的结构。<\/p>\n<h3>多发射：一条流水线加宽<\/h3>\n<p>多发射不是多条流水线，是把每一级加宽，一拍处理多条指令：取指一次取几条，译码同时分析几条并分到不同队列，发射每拍从各队列各发一条，执行有多个计算单元并行。<\/p>\n<p>书里的比喻很顺：静态流水线是单车道，动态流水线允许超车，多发射是变成多车道齐头并进。<\/p>\n<p>龙芯 3A4000 后端有 8 条执行流水线，峰值 8 操作/周期：每周期最多 4 个定点、2 个浮点/向量、2 个访存。<\/p>\n<h3>转移猜测：先猜再善后<\/h3>\n<p>转移（分支）指令会让程序分叉：要么顺序执行下一条，要么跳到目标地址。多发射一次取好几条，遇到分支就不知道后面该不该取。<\/p>\n<p>办法是猜。最简单的猜&quot;不跳&quot;，成功率约五成，等于白猜一半。高端的用分支目标缓冲器（BTB）记住这条分支上次跳到哪，下次直接照着取，成功率能到九成以上。<\/p>\n<p>猜错怎么办？靠 ROB：猜错路径上的指令不提交，清掉重来。这就是&quot;激进优化 + 善后处理&quot;的思路——先按大概率把流水线喂饱，错了再擦掉，平均下来还是赚。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  IF[取指] --&gt; ID[译码 / 分派]\n  ID --&gt; RS[保留站&lt;br/&gt;按就绪挑指令]\n  RS --&gt; EX[计算单元 ×N]\n  EX --&gt;|CDB 广播| RS\n  EX --&gt; ROB[ROB&lt;br/&gt;按原序提交]\n  ROB --&gt; AR[物理寄存器]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：左边是顺序，中间是乱序，右边又回到顺序。ROB 那道闸门是关键——它让&quot;乱&quot;只发生在内部，外面看到的结果永远规规矩矩。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：乱序执行像餐厅后厨。几张单子同时进来，有的菜要等汤底，有的立刻能炒，厨师先炒能炒的，但上菜顺序仍按单子来。失效边界：后厨可以先上凉菜，CPU 的提交顺序一步都不能乱，否则程序会算错。\n<\/li><li>\n实例：A 写 R1、B 读 R1、C 写 R2，A 和 C 无关。静态流水线要让 B 等 A 算完；Tomasulo 让 C 先算，A 的结果出来后经 CDB 直接填进 B 的源操作数槽，B 立刻执行。三拍干完原本要五拍的事。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为乱序执行会改变程序结果。它只改内部时序，提交顺序严格按原序。\n<\/li><li>\n别以为多发射等于多核。多发射是一条流水线变宽，多核是多条流水线各干各的。\n<\/li><li>\n别以为猜测成功率越高越好就完事。猜错的惩罚也要算，深流水线上一次猜错可能亏十几拍。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n数据相关（RAW）指？｜后一条指令要读前一条刚写的结果｜两条指令抢同一个部件｜两条指令写同一寄存器｜答案：A｜解析：写后读是最常见的数据依赖。\n<\/li><li>\n保留站中&quot;源操作数的指针&quot;存的是什么？｜尚未就绪的操作数由哪个保留站单元产生｜内存地址｜指令地址｜答案：A｜解析：靠它建立生产者与消费者的关联。\n<\/li><li>\nROB 的作用是？｜按程序原序提交结果，并支持例外精确处理｜加快取指｜扩大缓存｜答案：A｜解析：保证乱序执行的最终结果与顺序执行一致。\n<\/li><li>\n分支目标缓冲器（BTB）提高的是？｜转移指令的预测成功率｜内存带宽｜主频｜答案：A｜解析：它记住分支最近的目标地址，供取指参考。\n<\/ol>\n<h2>抽认卡<\/h2>\n<ul><li>\n动态流水线解决什么问题？｜消除指令相关性造成的停顿\n<\/li><li>\n两种指令相关性？｜数据相关（RAW 等）与结构相关（抢部件）\n<\/li><li>\nTomasulo 三个核心部件？｜保留站、重命名寄存器、ROB\n<\/li><li>\n乱序执行的三句话？｜有序取指、乱序执行、有序提交\n<\/li><li>\nCDB 的作用？｜把计算结果广播给所有等待它的保留站与寄存器\n<\/li><li>\n多发射与多核的区别？｜前者加宽一条流水线，后者是多个独立流水线\n<\/ul>\n<h2>术语<\/h2>\n<ul><li>\n数据相关：指令间因读写同一数据形成的依赖\n<\/li><li>\n结构相关：多条指令争用同一硬件部件形成的冲突\n<\/li><li>\n保留站：暂存待执行指令、按操作数就绪情况发射的单元\n<\/li><li>\n寄存器重命名：用内部寄存器副本消除假依赖的机制\n<\/li><li>\nROB：重排序缓存，按原序提交并处理例外的部件\n<\/li><li>\nBTB：分支目标缓冲器，记录分支历史目标地址的预测部件\n<\/ul>\n<h2>复习锚点<\/h2>\n<ul><li>\n相关性让流水线停，重排让它不停\n<\/li><li>\n保留站乱序、ROB 收序、重命名消依赖\n<\/li><li>\n多发射加宽，转移猜测喂饱，猜错靠 ROB 擦掉\n<\/ul>", "ch17": "<h1>第 17 章：内存、缓存与虚拟内存<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>学时<\/strong>：0.7 小时 | <strong>前置<\/strong>：第 14 章\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明访存指令（LD/ST）做了什么\n<\/li><li>\n能解释缓存为什么有效：数据局部性\n<\/li><li>\n能说清多级缓存的取舍，以及虚拟内存的分段与分页差别\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>CPU 太快，内存太慢，缓存是中间那张小桌子。虚拟内存是给每个程序发一张&quot;看起来连续&quot;的地图。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>CPU 怎么和内存说话<\/h3>\n<p>内存是一组带地址的存储单元，程序和数据都先放进去。CPU 靠访存指令读写：读（LD）把内存单元的值搬进寄存器，写（ST）把寄存器的值写回内存。寄存器是双方交接的中转站。<\/p>\n<p>内存有三类端口：地址端口选单元，读写控制端口定方向，数据端口搬数据。CPU 通过内存控制器调用它们，流水线里这一级叫访存阶段（MEM），排在提交之前。<\/p>\n<p>龙芯的写法是 <code>LD r1, (r0)offset<\/code>：r0 的值加偏移算出地址，取出的值进 r1；ST 反过来。<\/p>\n<h3>容量单位与&quot;尾端&quot;<\/h3>\n<p>1 位是 1 bit，8 位是 1 字节；1024B=1KB，往上到 MB、GB、TB。网页约 100KB，一首 MP3 约 5MB，两小时高清电影约 5GB，拍一年照片能到 1TB。台式机常配 8GB，服务器 256GB 起，最小嵌入式 64KB 就够。<\/p>\n<p>尾端（Endian）说的是多个字节装进一个寄存器时的排列。大尾端：内存低地址的字节放到寄存器高位；小尾端：低地址放低位。没有绝对优劣，x86、ARM、龙芯都用小尾端，有些 Power、MIPS 可配置。<\/p>\n<h3>缓存：小桌子放大书<\/h3>\n<p>矛盾很直接：2GHz 的 64 位桌面 CPU 每秒能执行上百亿条指令，DDR4 内存在 2.4GHz 时峰值约 19200MB/s，供数速度差一个数量级。CPU 只能干等。<\/p>\n<p>缓存用更快的工艺做一小块存储，放内存的&quot;局部备份&quot;。依据是数据局部性：CPU 反复用的数据只占内存很小一部分，也就是热点数据。缓存把这些热点留下，再访问就快几十上百倍。<\/p>\n<p>代价是贵，所以容量做不大：内存以 GB 计，缓存只有几十 MB。于是分级：一级最近最快最小，三级最远最慢最大。访问时先查一级，没有再往下，全没有才去内存。主流最多三级，超算可到四级。2000 年前二三级缓存还常在 CPU 外，现在都集成进芯片，占的面积甚至超过处理器核本身。<\/p>\n<p>龙芯 3A4000：4 个核，每核 64KB 一级、256KB 二级，4 核共享 8MB 三级。<\/p>\n<h3>虚拟内存：每个程序一张假地图<\/h3>\n<p>单任务时代，程序可以随便用整块内存。多任务并发后不行了，得由操作系统分配。<\/p>\n<p>虚拟内存给每个程序一块&quot;看起来连续&quot;的地址空间。程序看到的是虚拟地址，真正装在机器上的是物理内存。两种实现：分段，给每个程序一段连续的物理内存，简单快，但不容易伸缩、浪费多；分页，把物理内存切成页，虚拟地址映射到不一定连续的页上，可以按需分配、随时回收，利用率高。<\/p>\n<p>分页时，访存指令给的是虚拟地址，CPU 里的地址转换模块（TLB）翻成物理地址再访问。高性能 CPU 都有这套模块。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  CPU[CPU 核] --&gt; L1[L1 缓存&lt;br/&gt;最快最小]\n  L1 --&gt; L2[L2 缓存]\n  L2 --&gt; L3[L3 缓存&lt;br/&gt;多核共享]\n  L3 --&gt; MEM[内存&lt;br/&gt;GB 级]\n  MEM --&gt; DISK[磁盘 / 外存]\n  VA[虚拟地址] --&gt;|TLB 转换| PA[物理地址]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：越往右越慢越大。这张金字塔决定了程序性能的上限——数据在 L1 里和在内存里，差的是几十倍的时间。TLB 那条线说明地址翻译是另一条并行的关键路径。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：缓存是书桌，内存是书柜，硬盘是图书馆。写论文时先把要用的几本书摊在桌上，需要别的再去书柜翻，实在没有才跑去图书馆。失效边界：书桌挪书要人动手，缓存换入换出由硬件自动做，而且换错一次（缓存缺失）的代价可能上百拍。\n<\/li><li>\n实例：遍历一个 100MB 的数组，按行顺序访问很快，按列跳跃访问明显变慢。数据没变、指令没变，慢在缓存装不下、每次都要去内存取。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为缓存越大越好。面积、成本、访问延迟都会涨，还得看命中率是否真的提升。\n<\/li><li>\n别以为虚拟内存是&quot;硬盘当内存&quot;。换页到磁盘只是它的一种实现手段，核心是地址空间隔离与映射。\n<\/li><li>\n别以为尾端只是学术细节。跨平台传二进制数据不处理尾端，读出来的数就是错的。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n读指令 LD 的功能是？｜把内存单元的值加载到寄存器｜把寄存器值写入内存｜跳转到目标地址｜答案：A｜解析：LD 是 load，方向是内存到寄存器。\n<\/li><li>\n缓存有效的依据是？｜数据局部性，热点数据被反复访问｜内存容量大｜CPU 主频低｜答案：A｜解析：少量热点数据留在高速存储里，命中率就高。\n<\/li><li>\n分页相对分段的主要优势是？｜按需分配、便于伸缩、利用率高｜实现更简单｜速度更快｜答案：A｜解析：分页是离散映射，可增可减。\n<\/li><li>\n大尾端的含义是？｜内存低地址字节装入寄存器高位｜低地址装入低位｜两种都可｜答案：A｜解析：这是大尾端的定义，与小尾端相反。\n<\/ol>\n<h2>抽认卡<\/h2>\n<ul><li>\nLD 与 ST 的方向？｜LD 内存到寄存器；ST 寄存器到内存\n<\/li><li>\n容量单位换算？｜1024B=1KB，1024KB=1MB，1024MB=1GB，1024GB=1TB\n<\/li><li>\n数据局部性是什么？｜CPU 反复访问的内存只占很小一部分\n<\/li><li>\n多级缓存的取舍？｜近的快而小，远的慢而大，兼顾成本与速度\n<\/li><li>\n虚拟内存的两种实现？｜分段与分页\n<\/li><li>\nTLB 的作用？｜把虚拟地址翻译成物理地址\n<\/ul>\n<h2>术语<\/h2>\n<ul><li>\n访存指令：读写内存的指令，如 LD、ST\n<\/li><li>\n尾端：多字节数据在寄存器中的排列顺序\n<\/li><li>\n缓存：CPU 与内存之间的小容量高速存储\n<\/li><li>\n数据局部性：访问集中在少量地址且反复使用的规律\n<\/li><li>\n虚拟内存：操作系统为程序提供的抽象地址空间\n<\/li><li>\nTLB：地址转换后备缓冲器，缓存虚拟地址到物理地址的映射\n<\/ul>\n<h2>复习锚点<\/h2>\n<ul><li>\nCPU 与内存的速度差，靠缓存填\n<\/li><li>\n缓存靠局部性生效，靠分级平衡成本\n<\/li><li>\n虚拟内存让每个程序以为自己独占内存\n<\/ul>", "ch18": "<h1>第 18 章：CPU 的&quot;外交&quot;——特权级、中断与 I/O<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>学时<\/strong>：0.6 小时 | <strong>前置<\/strong>：第 17 章\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能解释特权级怎样隔开操作系统与应用程序\n<\/li><li>\n能分清中断与例外的触发源\n<\/li><li>\n能说明 DMA 为什么比直接 I/O 高效\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>CPU 只管算，外设的事靠三条通道接进来：总线搬数据、中断报消息、DMA 让数据自己走。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>特权级：两把钥匙<\/h3>\n<p>并发系统里，一个程序不能随便动别人的东西。CPU 于是把运行状态分成等级：至少两级，操作系统级和应用级。<\/p>\n<p>资源也分级：有的任何状态都能访问，有的核心资源（关键寄存器、时钟等）只有操作系统能碰。<\/p>\n<p>指令同样分级：应用态指令谁都能执行；特权指令只有操作系统能执行，比如设置运行等级的那条。<\/p>\n<p>开机时 CPU 处于操作系统级，可以&quot;无所不能&quot;。操作系统把程序装进内存，用特权指令把 CPU 降到应用级，程序才开始跑。程序只能执行应用态指令，碰不到别人的资源。<\/p>\n<p>运行中特权级会来回切换：操作系统调程序，高级到低级；程序遇到例外、外设中断或系统调用，低级回高级。<\/p>\n<h3>中断与例外：一个从外，一个从内<\/h3>\n<p>中断是外部事件让 CPU 停下当前指令。键盘按键、网卡收到报文、定时器到点，都属于外部。没有中断机制时，CPU 只能轮询——反复检查设备状态，白费时间。<\/p>\n<p>中断信号走到 CPU 引脚上，CPU 一般在流水线最后一级（提交阶段）检查电平，决定继续还是处理。处理时停止取指，切到操作系统级，跳到中断服务程序（ISR），由它判断是哪个设备、把数据取走，再切回应用级继续跑。<\/p>\n<p>例外是 CPU 内部指令执行触发的，比如除零。两者的机制相似，触发源不同：中断来自外部信号，例外来自指令本身。<\/p>\n<h3>I/O：总线加指令<\/h3>\n<p>CPU 芯片上有专门连外设的引脚，合起来叫外设总线，三类信号：地址（找哪个设备）、控制（读还是写）、数据（搬什么）。<\/p>\n<p>I/O 指令负责读写外设。有的 CPU 让 I/O 指令与访存指令共用，只靠地址空间区分——龙芯就是这样，用 <code>LD<\/code> 读一个外设地址。<\/p>\n<p>完整机制是三件套：外设总线提供物理连接，I/O 指令给软件入口，中断提供事件通知。<\/p>\n<h3>DMA：让数据绕开 CPU<\/h3>\n<p>直接 I/O 的问题是效率。每条 I/O 指令搬的数据不超过寄存器宽度，32 位 CPU 传 1MB 要 32768 条指令，CPU 时间全耗在搬运上。<\/p>\n<p>DMA 在内存和外设之间加一个控制器，它跟 CPU 独立工作。CPU 只要告诉它：从哪个外设读、读多长、放到内存哪个起始地址，剩下的事控制器自己干。传完发一个中断说&quot;好了&quot;，CPU 直接用内存里的数据。<\/p>\n<p>DMA 控制器就是个典型的协处理器，专干一件事，不用跑指令流水线，单位时间能搬更多数据。这项技术最早在大型机上用，现在台式机、服务器甚至手机都有，控制器一般集成在处理器芯片里。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  APP[应用程序&lt;br/&gt;应用级] --&gt;|系统调用| OS[操作系统&lt;br/&gt;特权级]\n  DEV[外设] --&gt;|中断信号| CPU[CPU 提交阶段]\n  CPU --&gt; ISR[中断服务程序]\n  DMA[DMA 控制器] --&gt;|直接读写| MEM[内存]\n  DEV --&gt; DMA\n  CPU --&gt;|配置地址 / 长度| DMA<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：上面那条是权限切换，下面那条是数据通道。注意 DMA 绕过了 CPU——CPU 只下命令，不搬箱子，这就是它高效的原因。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：特权级像公司门禁。普通员工（应用）只能进自己楼层，管理员（操作系统）能进机房。中断像前台打内线电话，你得放下手上的事去接。失效边界：门禁是物理的，权限切换是 CPU 状态位，切换本身只要几个周期，代价小得多。\n<\/li><li>\n实例：拷贝一个 1GB 文件。走直接 I/O，CPU 要执行上千万条搬运指令，风扇狂转；走 DMA，CPU 下完命令就去干别的，硬盘和内存自己传，传完一个中断通知。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为中断是&quot;出错&quot;。正常的数据到达也叫中断，它是通知机制，不是故障。\n<\/li><li>\n别以为特权级只是软件约定。它是硬件强制，应用态执行特权指令会直接触发例外。\n<\/li><li>\n别以为 DMA 不需要 CPU。配置、启动、收尾都要 CPU，只是不参与逐字节搬运。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n特权级机制的作用是？｜隔离应用与操作系统可访问的资源｜提高主频｜扩大内存｜答案：A｜解析：防止一个程序破坏其他程序与系统。\n<\/li><li>\n中断与例外的根本区别是？｜中断由外部信号触发，例外
