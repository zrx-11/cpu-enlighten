没写回的结果）、控制冲突（遇到分支不知道下一条在哪）。<\/p>\n<p>解决办法：转发（把结果直接送过去，不等写回）、停顿（插气泡）、分支预测（猜方向，猜错就清空流水线）。级数越多，猜错的惩罚越大——Pentium 4 深流水追求高主频，最后被功耗和失误率反噬。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为流水线级数越多越快。级数换主频，但每级的开销与预测代价也在涨。\n<\/li><li>\n别以为流水线等于多核。它只是单核内部的并行。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 15 章<\/td><td>四段、5 拍、级数代价<\/td><td>深流水的老教训<\/td><\/tr><tr><td>第 16 章<\/td><td>乱序、保留站、ROB<\/td><td>用重排序填满流水线<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：<a href=\"#\" target=\"_blank\" rel=\"noopener\">微结构<\/a>\n<\/li><li>\n后续：<a href=\"#\" target=\"_blank\" rel=\"noopener\">缓存<\/a>\n<\/ul>", "c-cache": "<h1>缓存与存储层次<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 17 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>缓存是放在 CPU 旁边的小而快的存储器，用来兜住&quot;内存太慢&quot;这个事实。<\/p>\n<h2>为什么重要<\/h2>\n<p>CPU 一拍能算完，内存要几十上百拍才给数据。不解决这个落差，流水线再宽也白搭。<strong>存储层次是整个计算机体系里最贵的妥协<\/strong>。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  R[寄存器&lt;br/&gt;1 拍] --&gt; L1[L1 缓存&lt;br/&gt;几拍]\n  L1 --&gt; L2[L2 缓存&lt;br/&gt;十几拍]\n  L2 --&gt; L3[L3 缓存&lt;br/&gt;几十拍]\n  L3 --&gt; M[内存&lt;br/&gt;上百拍]\n  M --&gt; D[磁盘 / 网络&lt;br/&gt;更慢]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：越往右越大越慢。看这张图要抓住&quot;每往下一层，容量涨一个量级，速度掉一个量级&quot;。<\/p>\n<h2>详解<\/h2>\n<p>缓存能起作用，靠的是局部性：时间局部性（刚用过的还会再用）、空间局部性（用了这个地址，附近的也会用）。程序不是随机访问内存的，这让小缓存能拦住大部分访问。<\/p>\n<p>多级缓存之外还有两个关键机制：虚拟内存把物理内存切成页，给每个进程一套独立地址空间；TLB 缓存&quot;虚拟地址到物理地址&quot;的映射，避免每次访存都走一遍页表。<\/p>\n<p>写策略也分两种：写穿（同时写缓存和内存，简单但慢）、写回（只写缓存，标记脏，换出时再写回，快但要维护一致性）。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为缓存越大越好。大了变慢、变贵、费电，命中率提升却递减。\n<\/li><li>\n别以为虚拟内存是&quot;硬盘当内存&quot;。它是地址空间的抽象，换页只是它的一个副作用。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 17 章<\/td><td>LD/ST、尾端、局部性、多级缓存、分段分页、TLB<\/td><td>层次结构 + 局部性 = 可用性<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：<a href=\"#\" target=\"_blank\" rel=\"noopener\">流水线<\/a>\n<\/li><li>\n后续：<a href=\"#\" target=\"_blank\" rel=\"noopener\">系统调用<\/a>\n<\/ul>", "c-syscall": "<h1>系统调用<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 18、19 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>系统调用是应用程序请求操作系统帮忙做事的正式入口，也是 CPU 从&quot;用户态&quot;切到&quot;内核态&quot;的那道门。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是应用与操作系统之间的第二条接口（第一条是指令集）。没有它，应用没法读写文件、发网络包、申请内存——这些事都必须由操作系统代做。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  APP[应用：调库函数] --&gt; LIB[库函数封装]\n  LIB --&gt;|syscall 指令| K[内核：特权级切换]\n  K --&gt; S[内核服务例程]\n  S --&gt;|返回| APP<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：应用看到的常常是库函数，库函数里面才发系统调用。看这张图要区分&quot;库函数&quot;和&quot;系统调用&quot;不是一回事。<\/p>\n<h2>详解<\/h2>\n<p>CPU 有特权级。用户态不能直接碰硬件、不能改页表、不能关中断；要做这些，只能通过系统调用这条受控通道。<\/p>\n<p>过程大致是：应用把调用号放进寄存器，执行一条特殊指令（如 syscall），CPU 切到内核态、跳到固定的入口，内核按号分发到对应服务例程，做完再返回用户态。<\/p>\n<p>系统调用的集合构成操作系统的&quot;API 底座&quot;。Linux 的系统调用是 Linux 内核 API，换了操作系统，这套接口就换一套——所以同一个程序在不同系统上要重新编译或做兼容层。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 printf 就是系统调用。它是库函数，内部可能调用 write。\n<\/li><li>\n别以为系统调用越少越好。它有一次切换开销，但安全边界必须靠它。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 18 章<\/td><td>特权级、中断与例外<\/td><td>特权级是系统调用的前提<\/td><\/tr><tr><td>第 19 章<\/td><td>应用 = 指令 + 库函数 + 系统调用<\/td><td>三者分工明确<\/td><\/tr><tr><td>第 32 章<\/td><td>三种接口<\/td><td>ISA、System Call、API<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：<a href=\"#\" target=\"_blank\" rel=\"noopener\">缓存<\/a>\n<\/li><li>\n后续：<a href=\"#\" target=\"_blank\" rel=\"noopener\">软件生态<\/a>\n<\/ul>", "c-perf": "<h1>性能度量<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 2、36 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>性能是&quot;多快干完活&quot;，但怎么量取决于你量的是什么活，没有单一数字能概括。<\/p>\n<h2>为什么重要<\/h2>\n<p>选 CPU、评 CPU、卖 CPU 都绕不开它。而每个指标都有它测不到的地方，误用一个指标就会得出错误结论——书里拿 MIPS、SPEC、单核分值反复举过例子。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  F[主频] --&gt; P[性能]\n  IPC[每拍指令数] --&gt; P\n  PAR[并行度&lt;br/&gt;核数 / 发射宽度] --&gt; P\n  P --&gt; M[MIPS&lt;br/&gt;失真]\n  P --&gt; S[SPEC&lt;br/&gt;有偏向]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：性能由三块相乘，任何一块单独拉高都可能被另一块拖住。下面两个是常用指标，各自都有盲区。<\/p>\n<h2>详解<\/h2>\n<p>常用关系：性能 ≈ 主频 × 每拍执行指令数 × 并行度。主频靠工艺与流水线，每拍指令数靠微结构，并行度靠多核与多发射。<\/p>\n<p>MIPS（每秒百万条指令）看着直观，但不同指令集的指令&quot;含金量&quot;不同，一条复杂指令可能等于别人几条，所以跨架构比 MIPS 没有意义；同架构内也可能被指令组合刷高。<\/p>\n<p>SPEC 用一组真实程序跑分，比 MIPS 靠谱，但仍有偏向：不同编译器、不同内存配置、不同优化选项都会影响结果。厂商选对自己有利的子项报分，是常规操作。<\/p>\n<p>单核性能与多核性能也不是一回事。很多任务只能在单核跑，核数再多也帮不上；这就是&quot;先单核后核数&quot;的由来。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为主频就是性能。同主频下 IPC 可以差几倍。\n<\/li><li>\n别以为跑分高就一定好用。日常办公受单核、访存、I/O 共同影响。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 2 章<\/td><td>主频 × 每拍 × 并行度、MIPS 失效、SPEC 软肋<\/td><td>指标都有盲区<\/td><\/tr><tr><td>第 36 章<\/td><td>单核 2.7 → 25 分<\/td><td>补课补的是单核与设计能力<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：<a href=\"#\" target=\"_blank\" rel=\"noopener\">流水线<\/a>\n<\/li><li>\n后续：<a href=\"#\" target=\"_blank\" rel=\"noopener\">自主指令集<\/a>\n<\/ul>", "c-eco": "<h1>软件生态<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 32—34 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>软件生态是某一颗 CPU 能运行的全部软件的集合，以及围绕这些软件形成的开发者、厂商、社区与标准。<\/p>\n<h2>为什么重要<\/h2>\n<p>书里最硬的一句判断是：CPU 本身没有使用价值，它的价值由其上承载的生态决定。做 CPU 是技术活，做生态是群体工程，后者门槛更高、周期更长。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart BT\n  ISA[指令集] --&gt; OS[操作系统]\n  OS --&gt; API[API 与库]\n  API --&gt; APP[应用软件]\n  APP --&gt; USER[用户]\n  DEV[开发者] --&gt; APP\n  STD[标准规范] --&gt; OS<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：生态是自底向上长出来的，不是拼出来的。开发者与标准是两条横向的支撑线，缺一条结构就歪。<\/p>\n<h2>详解<\/h2>\n<p>生态有三条原则：开放（企业多、可平等参与，壮大力量）、兼容（产品能互相配合，积累成果）、优化（联合打磨体验）。<\/p>\n<p>对照三个范例：Windows-Intel 是兼容至上，40 年前的软件还能跑；Android-ARM 是开放，占全球智能机 87%；苹果是优化，对每个像素死磕。<\/p>\n<p>反面是 Linux：开放做得最好，兼容与优化乏力，发行版几百种、打包格式各行其是、内核升级常不向下兼容，结果桌面份额长期只有百分之一左右。<\/p>\n<p>生态的商业模式分三档：一流做标准（知识产权，如高通专利费占净利一半以上）、二流做品牌（生态，如 Intel 的 x86 份额）、三流做产品（制造，拼成本）。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为生态等于软件数量。标准、认证、人才、书籍同样是支柱。\n<\/li><li>\n别以为开源自动带来生态。缺兼容与优化，开源也会碎片化。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 32 章<\/td><td>Inside/Outside、三种接口<\/td><td>CPU 是土壤，生态是森林<\/td><\/tr><tr><td>第 33 章<\/td><td>开发者、发行版、虚拟机、解决方案<\/td><td>谁控制方案谁分利润<\/td><\/tr><tr><td>第 34 章<\/td><td>开放兼容优化、Linux 反面、三档营利<\/td><td>碎片化难治<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：<a href=\"#\" target=\"_blank\" rel=\"noopener\">系统调用<\/a>\n<\/li><li>\n后续：<a href=\"#\" target=\"_blank\" rel=\"noopener\">自主指令集<\/a>\n<\/ul>", "c-ownisa": "<h1>自主指令集<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 4、37、38 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>自主指令集是自己定义编码与语义、不依赖他人授权的指令集，典型例子是龙芯的 LoongArch。<\/p>\n<h2>为什么重要<\/h2>\n<p>用别人的指令集可以做产品，但做不出自主产业生态。授权一旦收紧，产品线就断——日本 1986 年被断供 32 位授权，就是最直接的教训。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  LIC[授权指令集] --&gt; PROD[能做产品]\n  LIC --&gt; LIM[受制于人&lt;br/&gt;断供风险]\n  OWN[自主指令集] --&gt; ECO[可建自主生态]\n  OWN --&gt; COST[要背时间与迁移成本]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：两条路的差别不在&quot;能不能造出芯片&quot;，而在&quot;能不能长期定标准&quot;。看这张图要同时看收益和代价。<\/p>\n<h2>详解<\/h2>\n<p>自主指令集要解决三件事：自己定义（编码、寄存器、语义）、自己能实现（微结构配套）、别人愿意用（生态从零起步）。<\/p>\n<p>LoongArch 的做法有代表性：2021 年发布，含基础部分、虚拟化扩展、二进制翻译扩展、向量与高级向量扩展；设计上丢掉陈旧内容、吸纳先进成果；兼容靠十余年的二进制翻译积累，能把旧应用无损迁到新架构，也能翻译 x86、ARM。<\/p>\n<p>代价也很实：30 年积累的应用系统要迁移，工作量和时间都是巨大的。这不是&quot;换个指令集&quot;那么简单，是整条产业链重做一遍。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为自主等于闭门造车。LoongArch 兼容国际主流功能，也参与国际开源社区。\n<\/li><li>\n别以为自主指令集能速成。指令集本身几个月能写出来，生态要十年计。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 4 章<\/td><td>ISA 是生态边界<\/td><td>兼容机只在同一 ISA 内成立<\/td><\/tr><tr><td>第 37 章<\/td><td>LoongArch、Loongnix、内生安全<\/td><td>从必然王国到自由王国<\/td><\/tr><tr><td>第 38 章<\/td><td>六支柱、应用迁移<\/td><td>生态链比技术链更难打通<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：<a href=\"#\" target=\"_blank\" rel=\"noopener\">指令集<\/a>、<a href=\"#\" target=\"_blank\" rel=\"noopener\">软件生态<\/a>\n<\/ul>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：概览篇：CPU 是什么<\/strong><br>阅读：<a href=\"#/book/cpu-tongshi/chapter/ch01\">第 1 章：CPU 是什么，为什么它是信息社会的基石<\/a>、<a href=\"#/book/cpu-tongshi/chapter/ch02\">第 2 章：怎么衡量一颗 CPU 的好坏<\/a>、<a href=\"#/book/cpu-tongshi/chapter/ch03\">第 3 章：普通人也能学懂 CPU<\/a><br>检查点：该篇各章自测题正确率 ≥ 80%<\/li><li class='path-step' id='path-02'><strong>步骤 02：术语篇：CPU 的语汇<\/strong><br>阅读：<a href=\"#/book/cpu-tongshi/chapter/ch04\">第 4 章：指令集——计算机的语言<\/a>、<a href=\"#/book/cpu-tongshi/chapter/ch05\">第 5 章：精简指令集与汇编语言<\/a>、<a href=\"#/book/cpu-tongshi/chapter/ch06\">第 6 章：做 CPU 就是做微结构<\/a>、<a href=\"#/book/cpu-tongshi/chapter/ch07\">第 7 章：功耗从哪里来<\/a>、<a href=\"#/book/cpu-tongshi/chapter/ch08\">第 8 章：摩尔定律与它的黄昏<\/a>、<a href=\"#/book/cpu-tongshi/chapter/ch09\">第 9 章：通用还是专用<\/a>、<a href=\"#/book/cpu-tongshi/chapter/ch10\">第 10 章：后门与漏洞——芯片里的幽灵<\/a><br>检查点：该篇各章自测题正确率 ≥ 80%<\/li><li class='path-step' id='path-03'><strong>步骤 03：原理篇：CPU 怎么算<\/strong><br>阅读：<a href=\"#/book/cpu-tongshi/chapter/ch11\">第 11 章：理论基石——布尔代数与数字电路<\/a>、<a href=\"#/book/cpu-tongshi/chapter/ch12\">第 12 章：EDA——在电脑里先把 CPU 造一遍<\/a>、<a href=\"#/book/cpu-tongshi/chapter/ch13\">第 13 章：二进制——从开关到数字<\/a>、<a href=\"#/book/cpu-tongshi/chapter/ch14\">第 14 章：CPU 的天职——数值运算<\/a>、<a href=\"#/book/cpu-tongshi/chapter/ch15\">第 15 章：流水线的奥秘<\/a>、<a href=\"#/book/cpu-tongshi/chapter/ch16\">第 16 章：乱序执行与多发射——把流水线喂饱<\/a>、<a href=\"#/book/cpu-tongshi/chapter/ch17\">第 17 章：内存、缓存与虚拟内存<\/a>、<a href=\"#/book/cpu-tongshi/chapter/ch18\">第 18 章：CPU 的&quot;外交&quot;——特权级、中断与 I/O<\/a><br>检查点：该篇各章自测题正确率 ≥ 80%<\/li><li class='path-step' id='path-04'><strong>步骤 04：系统篇：CPU 与外部世界<\/strong><br>阅读：<a href=\"#/book/cpu-tongshi/chapter/ch19\">第 19 章：系统调用——应用与操作系统之间的桥<\/a>、<a href=\"#/book/cpu-tongshi/chapter/ch20\">第 20 章：专用指令——向量与加密<\/a>、<a href=\"#/book/cpu-tongshi/chapter/ch21\">第 21 章：虚拟化与可信计算——一台机器当几台用，也只信该信的<\/a>、<a href=\"#/book/cpu-tongshi/chapter/ch22\">第 22 章：并行——多核、多路、多线程与 Amdahl 定律<\/a>、<a href=\"#/book/cpu-tongshi/chapter/ch23\">第 23 章：从 CPU 到计算机——总线、主板与 BIOS<\/a><br>检查点：该篇各章自测题正确率 ≥ 80%<\/li><li class='path-step' id='path-05'><strong>步骤 05：生产制造篇：从设计到实物<\/strong><br>阅读：<a href=\"#/book/cpu-tongshi/chapter/ch24\">第 24 章：化设计为实物——设计公司与流片厂<\/a>、<a href=\"#/book/cpu-tongshi/chapter/ch25\">第 25 章：从沙子到晶圆<\/a>、<a href=\"#/book/cpu-tongshi/chapter/ch26\">第 26 章：模拟与数字元器件——世界只有几种积木<\/a>、<a href=\"#/book/cpu-tongshi/chapter/ch27\">第 27 章：版图、制造设备与成本<\/a>、<a href=\"#/book/cpu-tongshi/chapter/ch28\">第 28 章：不流片也能做 CPU——FPGA 与模拟器<\/a><br>检查点：该篇各章自测题正确率 ≥ 80%<\/li><li class='path-step' id='path-06'><strong>步骤 06：家族篇：厂商与架构的兴衰<\/strong><br>阅读：<a href=\"#/book/cpu-tongshi/chapter/ch29\">第 29 章：从上古到战国——CPU 家族简史<\/a>、<a href=\"#/book/cpu-tongshi/chapter/ch30\">第 30 章：巨头寻踪——Intel、AMD、ARM、苹果、IBM<\/a>、<a href=\"#/book/cpu-tongshi/chapter/ch31\">第 31 章：小而坚强与世界边缘——MIPS、RISC-V 与各国 CPU 之路<\/a><br>检查点：该篇各章自测题正确率 ≥ 80%<\/li><li class='path-step' id='path-07'><strong>步骤 07：生态篇：为什么生态比芯片难<\/strong><br>阅读：<a href=\"#/book/cpu-tongshi/chapter/ch32\">第 32 章：生态之重——CPU 的价值不在 CPU<\/a>、<a href=\"#/book/cpu-tongshi/chapter/ch33\">第 33 章：开发者的号角与解决方案为王<\/a>、<a href=\"#/book/cpu-tongshi/chapter/ch34\">第 34 章：生态的优点与方向——开放、兼容、优化<\/a><br>检查点：该篇各章自测题正确率 ≥ 80%<\/li><li class='path-step' id='path-08'><strong>步骤 08：中国 CPU 篇：自主路线<\/strong><br>阅读：<a href=\"#/book/cpu-tongshi/chapter/ch35\">第 35 章：中国 CPU 旧事——为什么必须自己做<\/a>、<a href=\"#/book/cpu-tongshi/chapter/ch36\">第 36 章：龙的声音——龙芯的两个十年与三条原则<\/a>、<a href=\"#/book/cpu-tongshi/chapter/ch37\">第 37 章：龙之生态——试错、LoongArch 与内生安全<\/a>、<a href=\"#/book/cpu-tongshi/chapter/ch38\">第 38 章：未来已来——泛生态六支柱与多条路线<\/a><br>检查点：该篇各章自测题正确率 ≥ 80%<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__quiz_all__": "<h1>全部测验<\/h1><p>全书各章测验汇总：逐题作答，提交后即时反馈并显示解析。<\/p><h2>测验：第 1 章：CPU 是什么，为什么它是信息社会的基石<\/h2><div class='quiz-item' data-qid='ch01-q01-1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> CPU 由哪两部分合并而成？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01-1' value='0'> 运算器和控制器<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01-1' value='1'> 存储器和运算器<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01-1' value='2'> 控制器和输入设备<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q01-2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 冯·诺依曼体系结构最关键的思想是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01-2' value='0'> 程序和数据都放在存储器里<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01-2' value='1'> 用继电器代替电子管<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01-2' value='2'> 用多核提高主频<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q01-3' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 下列哪个最可能是专用 CPU？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01-3' value='0'> 服务器里的通用处理器<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01-3' value='1'> 智能门锁里管刷卡和蓝牙的低功耗芯片<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01-3' value='2'> 台式机 CPU<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 2 章：怎么衡量一颗 CPU 的好坏<\/h2><div class='quiz-item' data-qid='ch02-q02-1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 为什么主频不能无限提高？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q02-1' value='0'> 因为数据通路和运算都有延迟，周期短于一条指令的最短执行时间就会失控<\/label><label class='quiz-opt'><input type='radio' name='ch02-q02-1' value='1'> 因为厂商不愿意<\/label><label class='quiz-opt'><input type='radio' name='ch02-q02-1' value='2'> 因为散热片不够大<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch02-q02-2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> MIPS 指标的根本缺陷是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q02-2' value='0'> 不同机器一条指令代表的工作量不同<\/label><label class='quiz-opt'><input type='radio' name='ch02-q02-2' value='1'> 数值太大不好记<\/label><label class='quiz-opt'><input type='radio' name='ch02-q02-2' value='2'> 只适用于手机<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch02-q02-3' data-type='single'><p class='quiz-q'><b>Q3.<\/b> SPEC CPU 测试的本质是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q02-3' value='0'> 测硬件和软件联合运行真实程序的时间<\/label><label class='quiz-opt'><input type='radio' name='ch02-q02-3' value='1'> 测晶体管数量<\/label><label class='quiz-opt'><input type='radio' name='ch02-q02-3' value='2'> 测主频<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch02-q02-4' data-type='single'><p class='quiz-q'><b>Q4.<\/b> UnixBench 不适合当标准的主要原因是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q02-4' value='0'> 测试项老旧，与当前硬件结构脱节<\/label><label class='quiz-opt'><input type='radio' name='ch02-q02-4' value='1'> 收费太贵<\/label><label class='quiz-opt'><input type='radio' name='ch02-q02-4' value='2'> 只支持 Windows<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 3 章：普通人也能学懂 CPU<\/h2><div class='quiz-item' data-qid='ch03-q03-1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> Intel 4004 的意义是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q03-1' value='0'> 第一款商用微处理器，把 CPU 做进一块芯片<\/label><label class='quiz-opt'><input type='radio' name='ch03-q03-1' value='1'> 第一台电子计算机<\/label><label class='quiz-opt'><input type='radio' name='ch03-q03-1' value='2'> 第一个开源 CPU<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch03-q03-2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> &quot;制作计算机 = 做 CPU + 做操作系统&quot;强调的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q03-2' value='0'> 两者是构成一台可用计算机的核心，其余多是应用<\/label><label class='quiz-opt'><input type='radio' name='ch03-q03-2' value='1'> 只要会写应用就行<\/label><label class='quiz-opt'><input type='radio' name='ch03-q03-2' value='2'> 操作系统不重要<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch03-q03-3' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 当前开源 CPU 的整体状况是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q03-3' value='0'> 以入门级、嵌入式为主，活跃度有限<\/label><label class='quiz-opt'><input type='radio' name='ch03-q03-3' value='1'> 已经能替代高端商用 CPU<\/label><label class='quiz-opt'><input type='radio' name='ch03-q03-3' value='2'> 完全空白<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 4 章：指令集——计算机的语言<\/h2><div class='quiz-item' data-qid='ch04-q04-1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 指令集的本质是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch04-q04-1' value='0'> 软件与硬件之间的二进制编码规范<\/label><label class='quiz-opt'><input type='radio' name='ch04-q04-1' value='1'> 一种电路布局<\/label><label class='quiz-opt'><input type='radio' name='ch04-q04-1' value='2'> 一种编程语言<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch04-q04-2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> &quot;增量演进、向下兼容&quot;的含义是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch04-q04-2' value='0'> 只增加新指令，不删除、不改变已有指令<\/label><label class='quiz-opt'><input type='radio' name='ch04-q04-2' value='1'> 每隔几年推翻重来<\/label><label class='quiz-opt'><input type='radio' name='ch04-q04-2' value='2'> 只兼容自家软件<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch04-q04-3' data-type='single'><p class='quiz-q'><b>Q3.<\/b> IA64 失败的直接原因是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch04-q04-3' value='0'> 不兼容 32 位 x86，而 AMD64 向下兼容<\/label><label class='quiz-opt'><input type='radio' name='ch04-q04-3' value='1'> 性能太差<\/label><label class='quiz-opt'><input type='radio' name='ch04-q04-3' value='2'> 价格太高<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch04-q04-4' data-type='single'><p class='quiz-q'><b>Q4.<\/b> 新指令集难在哪里？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch04-q04-4' value='0'> 难在建立软件生态，而非写出规范<\/label><label class='quiz-opt'><input type='radio' name='ch04-q04-4' value='1'> 难在申请专利<\/label><label class='quiz-opt'><input type='radio' name='ch04-q04-4' value='2'> 难在取名字<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 5 章：精简指令集与汇编语言<\/h2><div class='quiz-item' data-qid='ch05-q05-1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> RISC 提出的统计依据是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch05-q05-1' value='0'> 两成常用指令承担八成执行次数<\/label><label class='quiz-opt'><input type='radio' name='ch05-q05-1' value='1'> 指令越少越好<\/label><label class='quiz-opt'><input type='radio' name='ch05-q05-1' value='2'> 寄存器越多越好<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch05-q05-2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> &quot;CISC = 预译码 + RISC&quot;描述的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch05-q05-2' value='0'> CISC 指令在内部被译成 RISC 风格微指令再流水执行<\/label><label class='quiz-opt'><input type='radio' name='ch05-q05-2' value='1'> CISC 被 RISC 取代<\/label><label class='quiz-opt'><input type='radio' name='ch05-q05-2' value='2'> 两种指令集合并<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch05-q05-3' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 高级语言相对汇编的主要优势不包括？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch05-q05-3' value='0'> 可以直接操作 CPU 内部寄存器<\/label><label class='quiz-opt'><input type='radio' name='ch05-q05-3' value='1'> 代码量约为汇编的七分之一<\/label><label class='quiz-opt'><input type='radio' name='ch05-q05-3' value='2'> 换平台只需重新编译<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch05-q05-4' data-type='single'><p class='quiz-q'><b>Q4.<\/b> 汇编语言仍被使用的原因？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch05-q05-4' value='0'> 内核驱动等需访问硬件，以及关键代码的性能优化<\/label><label class='quiz-opt'><input type='radio' name='ch05-q0 /div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch01__": "<h1>测验：第 1 章：CPU 是什么，为什么它是信息社会的基石<\/h1><div class='quiz-item' data-qid='ch01-q01-1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> CPU 由哪两部分合并而成？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01-1' value='0'> 运算器和控制器<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01-1' value='1'> 存储器和运算器<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01-1' value='2'> 控制器和输入设备<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q01-2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 冯·诺依曼体系结构最关键的思想是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01-2' value='0'> 程序和数据都放在存储器里<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01-2' value='1'> 用继电器代替电子管<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01-2' value='2'> 用多核提高主频<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q01-3' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 下列哪个最可能是专用 CPU？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01-3' value='0'> 服务器里的通用处理器<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01-3' value='1'> 智能门锁里管刷卡和蓝牙的低功耗芯片<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01-3' value='2'> 台式机 CPU<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch02__": "<h1>测验：第 2 章：怎么衡量一颗 CPU 的好坏<\/h1><div class='quiz-item' data-qid='ch02-q02-1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 为什么主频不能无限提高？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q02-1' value='0'> 因为数据通路和运算都有延迟，周期短于一条指令的最短执行时间就会失控<\/label><label class='quiz-opt'><input type='radio' name='ch02-q02-1' value='1'> 因为厂商不愿意<\/label><label class='quiz-opt'><input type='radio' name='ch02-q02-1' value='2'> 因为散热片不够大<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch02-q02-2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> MIPS 指标的根本缺陷是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q02-2' value='0'> 不同机器一条指令代表的工作量不同<\/label><label class='quiz-opt'><input type='radio' name='ch02-q02-2' value='1'> 数值太大不好记<\/label><label class='quiz-opt'><input type='radio' name='ch02-q02-2' value='2'> 只适用于手机<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch02-q02-3' data-type='single'><p class='quiz-q'><b>Q3.<\/b> SPEC CPU 测试的本质是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q02-3' value='0'> 测硬件和软件联合运行真实程序的时间<\/label><label class='quiz-opt'><input type='radio' name='ch02-q02-3' value='1'> 测晶体管数量<\/label><label class='quiz-opt'><input type='radio' name='ch02-q02-3' value='2'> 测主频<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch02-q02-4' data-type='single'><p class='quiz-q'><b>Q4.<\/b> UnixBench 不适合当标准的主要原因是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q02-4' value='0'> 测试项老旧，与当前硬件结构脱节<\/label><label class='quiz-opt'><input type='radio' name='ch02-q02-4' value='1'> 收费太贵<\/label><label class='quiz-opt'><input type='radio' name='ch02-q02-4' value='2'> 只支持 Windows<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch03__": "<h1>测验：第 3 章：普通人也能学懂 CPU<\/h1><div class='quiz-item' data-qid='ch03-q03-1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> Intel 4004 的意义是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q03-1' value='0'> 第一款商用微处理器，把 CPU 做进一块芯片<\/label><label class='quiz-opt'><input type='radio' name='ch03-q03-1' value='1'> 第一台电子计算机<\/label><label class='quiz-opt'><input type='radio' name='ch03-q03-1' value='2'> 第一个开源 CPU<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch03-q03-2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> &quot;制作计算机 = 做 CPU + 做操作系统&quot;强调的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q03-2' value='0'> 两者是构成一台可用计算机的核心，其余多是应用<\/label><label class='quiz-opt'><input type='radio' name='ch03-q03-2' value='1'> 只要会写应用就行<\/label><label class='quiz-opt'><input type='radio' name='ch03-q03-2' value='2'> 操作系统不重要<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch03-q03-3' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 当前开源 CPU 的整体状况是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q03-3' value='0'> 以入门级、嵌入式为主，活跃度有限<\/label><label class='quiz-opt'><input type='radio' name='ch03-q03-3' value='1'> 已经能替代高端商用 CPU<\/label><label class='quiz-opt'><input type='radio' name='ch03-q03-3' value='2'> 完全空白<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch04__": "<h1>测验：第 4 章：指令集——计算机的语言<\/h1><div class='quiz-item' data-qid='ch04-q04-1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 指令集的本质是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch04-q04-1' value='0'> 软件与硬件之间的二进制编码规范<\/label><label class='quiz-opt'><input type='radio' name='ch04-q04-1' value='1'> 一种电路布局<\/label><label class='quiz-opt'><input type='radio' name='ch04-q04-1' value='2'> 一种编程语言<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch04-q04-2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> &quot;增量演进、向下兼容&quot;的含义是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch04-q04-2' value='0'> 只增加新指令，不删除、不改变已有指令<\/label><label class='quiz-opt'><input type='radio' name='ch04-q04-2' value='1'> 每隔几年推翻重来<\/label><label class='quiz-opt'><input type='radio' name='ch04-q04-2' value='2'> 只兼容自家软件<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch04-q04-3' data-type='single'><p class='quiz-q'><b>Q3.<\/b> IA64 失败的直接原因是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch04-q04-3' value='0'> 不兼容 32 位 x86，而 AMD64 向下兼容<\/label><label class='quiz-opt'><input type='radio' name='ch04-q04-3' value='1'> 性能太差<\/label><label class='quiz-opt'><input type='radio' name='ch04-q04-3' value='2'> 价格太高<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch04-q04-4' data-type='single'><p class='quiz-q'><b>Q4.<\/b> 新指令集难在哪里？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch04-q04-4' value='0'> 难在建立软件生态，而非写出规范<\/label><label class='quiz-opt'><input type='radio' name='ch04-q04-4' value='1'> 难在申请专利<\/label><label class='quiz-opt'><input type='radio' name='ch04-q04-4' value='2'> 难在取名字<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch05__": "<h1>测验：第 5 章：精简指令集与汇编语言<\/h1><div class='quiz-item' data-qid='ch05-q05-1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> RISC 提出的统计依据是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch05-q05-1' value='0'> 两成常用指令承担八成执行次数<\/label><label class='quiz-opt'><input type='radio' name='ch05-q05-1' value='1'> 指令越少越好<\/label><label class='quiz-opt'><input type='radio' name='ch05-q05-1' value='2'> 寄存器越多越好<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch05-q05-2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> &quot;CISC = 预译码 + RISC&quot;描述的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch05-q05-2' value='0'> CISC 指令在内部被译成 RISC 风格微指令再流水执行<\/label><label class='quiz-opt'><input type='radio' name='ch05-q05-2' value='1'> CISC 被 RISC 取代<\/label><label class='quiz-opt'><input type='radio' name='ch05-q05-2' value='2'> 两种指令集合并<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch05-q05-3' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 高级语言相对汇编的主要优势不包括？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch05-q05-3' value='0'> 可以直接操作 CPU 内部寄存器<\/label><label class='quiz-opt'><input type='radio' name='ch05-q05-3' value='1'> 代码量约为汇编的七分之一<\/label><label class='quiz-opt'><input type='radio' name='ch05-q05-3' value='2'> 换平台只需重新编译<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch05-q05-4' data-type='single'><p class='quiz-q'><b>Q4.<\/b> 汇编语言仍被使用的原因？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch05-q05-4' value='0'> 内核驱动等需访问硬件，以及关键代码的性能优化<\/label><label class='quiz-opt'><input type='radio' name='ch05-q05-4' value='1'> 因为编译器不存在<\/label><label class='quiz-opt'><input type='radio' name='ch05-q05-4' value='2'> 因为汇编更简单<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch06__": "<h1>测验：第 6 章：做 CPU 就是做微结构<\/h1><div class='quiz-item' data-qid='ch06-q06-1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 微结构与指令集的关系是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch06-q06-1' value='0'> 微结构是某指令集的电路实现方案<\/label><label class='quiz-opt'><input type='radio' name='ch06-q06-1' value='1'> 两者是同一个东西<\/label><label class='quiz-opt'><input type='radio' name='ch06-q06-1' value='2'> 微结构是软件规范<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch06-q06-2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 下列哪项不是同一微结构衍生型号的手段？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch06-q06-2' value='0'> 重新设计一套指令集<\/label><label class='quiz-opt'><input type='radio' name='ch06-q06-2' value='1'> 调整缓存大小与核数<\/label><label class='quiz-opt'><input type='radio' name='ch06-q06-2' value='2'> 换制造工艺<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch06-q06-3' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 软 IP 与硬 IP 的区别是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch06-q06-3' value='0'> 软 IP 是功能描述，硬 IP 是确定的版图<\/label><label class='quiz-opt'><input type='radio' name='ch06-q06-3' value='1'> 软 IP 更贵<\/label><label class='quiz-opt'><input type='radio' name='ch06-q06-3' value='2'> 硬 IP 不能流片<\/label><\ ><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch38-q38-3' value='0'> GS132 与 GS232<\/label><label class='quiz-opt'><input type='radio' name='ch38-q38-3' value='1'> GS464v 与 3A4000<\/label><label class='quiz-opt'><input type='radio' name='ch38-q38-3' value='2'> A72 与 A53<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch38-q38-4' data-type='single'><p class='quiz-q'><b>Q4.<\/b> 关于&quot;弯道超车&quot;，书中的观点是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch38-q38-4' value='0'> 没有捷径，只能直道追赶<\/label><label class='quiz-opt'><input type='radio' name='ch38-q38-4' value='1'> 可以靠工艺超车<\/label><label class='quiz-opt'><input type='radio' name='ch38-q38-4' value='2'> 可以靠授权超车<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='cpu'>CPU — 中央处理器，运算器与控制器的合称，负责指挥整机并执行运算 <span class=glossary-ref>（第 1 章：CPU 是什么，为什么它是信息社会的基石）<\/span><\/li><li data-term='专用 cpu'>专用 CPU — 面向单一应用场景设计的处理器，可牺牲通用性换取性能、成本或功耗优势 <span class=glossary-ref>（第 1 章：CPU 是什么，为什么它是信息社会的基石）<\/span><\/li><li data-term='主频'>主频 — 时钟模块每秒发出节拍的次数，决定 CPU 的工作节奏 <span class=glossary-ref>（第 1 章：CPU 是什么，为什么它是信息社会的基石）<\/span><\/li><li data-term='冯·诺依曼体系结构'>冯·诺依曼体系结构 — 程序和数据都存于存储器、由控制器逐条取指执行的计算机模型 <span class=glossary-ref>（第 1 章：CPU 是什么，为什么它是信息社会的基石）<\/span><\/li><li data-term='指令'>指令 — CPU 能识别并执行的一项基本操作，以二进制编码存在存储器中 <span class=glossary-ref>（第 1 章：CPU 是什么，为什么它是信息社会的基石）<\/span><\/li><li data-term='mips'>MIPS — 每秒执行百万条指令数，早期性能指标 <span class=glossary-ref>（第 2 章：怎么衡量一颗 CPU 的好坏）<\/span><\/li><li data-term='spec cpu'>SPEC CPU — 面向真实应用的性能测试套件，以运行时间衡量 <span class=glossary-ref>（第 2 章：怎么衡量一颗 CPU 的好坏）<\/span><\/li><li data-term='吞吐'>吞吐 — 单位时间内完成的有效计算量，性能的实质 <span class=glossary-ref>（第 2 章：怎么衡量一颗 CPU 的好坏）<\/span><\/li><li data-term='编译器优化'>编译器优化 — 把高级语言转成更高效机器码的手段，会显著影响跑分 <span class=glossary-ref>（第 2 章：怎么衡量一颗 CPU 的好坏）<\/span><\/li><li data-term='体系结构'>体系结构 — 规定指令集、寄存器、存储与 IO 组织方式的计算机抽象层 <span class=glossary-ref>（第 3 章：普通人也能学懂 CPU）<\/span><\/li><li data-term='制程（工艺节点）'>制程（工艺节点） — 制造中晶体管的最小特征尺寸，如 10μm、7nm <span class=glossary-ref>（第 3 章：普通人也能学懂 CPU）<\/span><\/li><li data-term='开源 cpu'>开源 CPU — 设计源码公开、可复用的处理器核 <span class=glossary-ref>（第 3 章：普通人也能学懂 CPU）<\/span><\/li><li data-term='流片'>流片 — 把设计送去晶圆厂试产，第一次做出实物芯片 <span class=glossary-ref>（第 3 章：普通人也能学懂 CPU）<\/span><\/li><li data-term='集成电路'>集成电路 — 把大量晶体管与连线做在同一块半导体衬底上的电路 <span class=glossary-ref>（第 3 章：普通人也能学懂 CPU）<\/span><\/li><li data-term='二进制翻译'>二进制翻译 — 把一种指令集的机器码转换成另一种指令集可执行形式的技术 <span class=glossary-ref>（第 4 章：指令集——计算机的语言）<\/span><\/li><li data-term='兼容机'>兼容机 — 遵循同一指令集、可运行相同软件的计算机 <span class=glossary-ref>（第 4 章：指令集——计算机的语言）<\/span><\/li><li data-term='向下兼容'>向下兼容 — 新机器能运行旧机器上的软件 <span class=glossary-ref>（第 4 章：指令集——计算机的语言）<\/span><\/li><li data-term='指令集授权'>指令集授权 — 指令集权利人许可他人生产兼容 CPU 的商业模式 <span class=glossary-ref>（第 4 章：指令集——计算机的语言）<\/span><\/li><li data-term='指令集（isa）'>指令集（ISA） — CPU 能识别的指令编码规范，软硬件接口 <span class=glossary-ref>（第 4 章：指令集——计算机的语言）<\/span><\/li><li data-term='cisc'>CISC — 复杂指令集计算机，指令多、长度可变 <span class=glossary-ref>（第 5 章：精简指令集与汇编语言）<\/span><\/li><li data-term='risc'>RISC — 精简指令集计算机，指令少、长度统一、便于流水 <span class=glossary-ref>（第 5 章：精简指令集与汇编语言）<\/span><\/li><li data-term='微指令（μop）'>微指令（μOP） — CISC 内部译码产生的 RISC 风格操作 <span class=glossary-ref>（第 5 章：精简指令集与汇编语言）<\/span><\/li><li data-term='正交性'>正交性 — 指令之间功能不重复、可组合覆盖全部需求的性质 <span class=glossary-ref>（第 5 章：精简指令集与汇编语言）<\/span><\/li><li data-term='汇编器'>汇编器 — 把汇编语言转成机器码的程序 <span class=glossary-ref>（第 5 章：精简指令集与汇编语言）<\/span><\/li><li data-term='编译器'>编译器 — 把高级语言源码转成机器码的程序 <span class=glossary-ref>（第 5 章：精简指令集与汇编语言）<\/span><\/li><li data-term='ip 核'>IP 核 — 可复用的电路设计模块 <span class=glossary-ref>（第 6 章：做 CPU 就是做微结构）<\/span><\/li><li data-term='soc'>SoC — 片上系统，一块芯片集成 CPU 与多种功能模块 <span class=glossary-ref>（第 6 章：做 CPU 就是做微结构）<\/span><\/li><li data-term='处理器核'>处理器核 — CPU 中负责运算与控制的完整单元 <span class=glossary-ref>（第 6 章：做 CPU 就是做微结构）<\/span><\/li><li data-term='微结构'>微结构 — 一条指令集在电路上的具体实现方案 <span class=glossary-ref>（第 6 章：做 CPU 就是做微结构）<\/span><\/li><li data-term='硬 ip'>硬 IP — 已完成布局布线、可直接流片的 IP <span class=glossary-ref>（第 6 章：做 CPU 就是做微结构）<\/span><\/li><li data-term='软 ip'>软 IP — 以 HDL 描述交付、尚未布局布线的 IP <span class=glossary-ref>（第 6 章：做 CPU 就是做微结构）<\/span><\/li><li data-term='功耗'>功耗 — 单位时间消耗的电能，单位瓦特 <span class=glossary-ref>（第 7 章：功耗从哪里来）<\/span><\/li><li data-term='功耗密度'>功耗密度 — 单位面积上的发热量，决定散热设计难度 <span class=glossary-ref>（第 7 章：功耗从哪里来）<\/span><\/li><li data-term='无风扇设计'>无风扇设计 — 靠被动散热把整机做到静音的方案 <span class=glossary-ref>（第 7 章：功耗从哪里来）<\/span><\/li><li data-term='电源管理'>电源管理 — 操作系统按状态关闭或降低部件供电的机制 <span class=glossary-ref>（第 7 章：功耗从哪里来）<\/span><\/li><li data-term='睿频'>睿频 — 根据负载动态调整频率（及电压）的机制 <span class=glossary-ref>（第 7 章：功耗从哪里来）<\/span><\/li><li data-term='tick-tock'>Tick-Tock — 工艺与架构交替升级的两年周期策略 <span class=glossary-ref>（第 8 章：摩尔定律与它的黄昏）<\/span><\/li><li data-term='制程'>制程 — 制造工艺节点，如 14nm、10nm、7nm <span class=glossary-ref>（第 8 章：摩尔定律与它的黄昏）<\/span><\/li><li data-term='性能过剩'>性能过剩 — 算力超出多数用户实际需求的状态 <span class=glossary-ref>（第 8 章：摩尔定律与它的黄昏）<\/span><\/li><li data-term='挤牙膏'>挤牙膏 — 形容性能提升幅度很小的代际更新 <span class=glossary-ref>（第 8 章：摩尔定律与它的黄昏）<\/span><\/li><li data-term='摩尔定律'>摩尔定律 — 集成电路晶体管数量约每两年翻倍的产业经验规律 <span class=glossary-ref>（第 8 章：摩尔定律与它的黄昏）<\/span><\/li><li data-term='gpu'>GPU — 图形处理器，擅长批量并行的像素与浮点运算 <span class=glossary-ref>（第 9 章：通用还是专用）<\/span><\/li><li data-term='npu'>NPU — 神经网络处理器，专门加速 AI 推理 <span class=glossary-ref>（第 9 章：通用还是专用）<\/span><\/li><li data-term='big.little'>big.little — 同芯片内集成高性能核与低功耗核的调度架构 <span class=glossary-ref>（第 9 章：通用还是专用）<\/span><\/li><li data-term='协处理器'>协处理器 — 辅助 CPU 完成特定功能的专用处理器 <span class=glossary-ref>（第 9 章：通用还是专用）<\/span><\/li><li data-term='异构计算'>异构计算 — 多种架构的计算单元协同完成任务的模式 <span class=glossary-ref>（第 9 章：通用还是专用）<\/span><\/li><li data-term='cve'>CVE — 国际通用的漏洞编号与披露体系 <span class=glossary-ref>（第 10 章：后门与漏洞——芯片里的幽灵）<\/span><\/li><li data-term='侧信道'>侧信道 — 通过缓存、时序等间接信息推断数据的攻击方式 <span class=glossary-ref>（第 10 章：后门与漏洞——芯片里的幽灵）<\/span><\/li><li data-term='后门'>后门 — 设计者有意保留、未公开的绕过安全机制的通道 <span class=glossary-ref>（第 10 章：后门与漏洞——芯片里的幽灵）<\/span><\/li><li data-term='漏洞'>漏洞 — 设计中可被利用的缺陷 <span class=glossary-ref>（第 10 章：后门与漏洞——芯片里的幽灵）<\/span><\/li><li data-term='补丁'>补丁 — 在软件层绕开硬件漏洞的修复手段 <span class=glossary-ref>（第 10 章：后门与漏洞——芯片里的幽灵）<\/span><\/li><li data-term='全定制设计'>全定制设计 — 手工排布每个晶体管的高性能实现方式 <span class=glossary-ref>（第 11 章：理论基石——布尔代数与数字电路）<\/span><\/li><li data-term='可测性设计（dft）'>可测性设计（DFT） — 为测试与调试增加专用电路接口的设计方法 <span class=glossary-ref>（第 11 章：理论基石——布尔代数与数字电路）<\/span><\/li><li data-term='布尔代数'>布尔代数 — 研究二进制逻辑表示与运算的数学理论 <span class=glossary-ref>（第 11 章：理论基石——布尔代数与数字电路）<\/span><\/li><li data-term='物理设计'>物理设计 — 确定器件位置、连线并输出工艺版图的设计阶段 <span class=glossary-ref>（第 11 章：理论基石——布尔代数与数字电路）<\/span><\/li><li data-term='硬件描述语言'>硬件描述语言 — 描述数字电路功能与结构的文本语言 <span class=glossary-ref>（第 11 章：理论基石——布尔代数与数字电路）<\/span><\/li><li data-term='eda'>EDA — 电子设计自动化，芯片设计与验证软件 <span class=glossary-ref>（第 12 章：EDA——在电脑里先把 CPU 造一遍）<\/span><\/li><li data-term='rtl'>RTL — 寄存器传输级，Verilog 描述的抽象电路模型 <span class=glossary-ref>（第 12 章：EDA——在电脑里先把 CPU 造一遍）<\/span><\/li><li data-term='仿真'>仿真 — 用软件模拟电路运行以验证功能 <span class=glossary-ref>（第 12 章：EDA——在电脑里先把 CPU 造一遍）<\/span><\/li><li data-term='版图'>版图 — 含器件位置与连线的物理设计成果 <span class=glossary-ref>（第 12 章：EDA——在电脑里先把 CPU 造一遍）<\/span><\/li><li data-term='网表'>网表 — 门单元及其连接关系的描述 <span class=glossary-ref>（第 12 章：EDA——在电脑里先把 CPU 造一遍）<\/span><\/li><li data-term='逻辑综合'>逻辑综合 — 把 RTL 转成门级网表的过程 <span class=glossary-ref>（第 12 章：EDA——在电脑里先把 CPU 造一遍）<\/span><\/li><li data-term='cmos'>CMOS — 互补金属氧化物半导体，CPU 的基础器件 <span class=glossary-ref>（第 13 章：二进制——从开关到数字）<\/span><\/li><li data-term='ieee 754'>IEEE 754 — 国际通用的浮点数表示标准 <span class=glossary-ref>（第 13 章：二进制——从开关到数字）<\/span><\/li><li data-term='反相器'>反相器 — 输出与输入相反的基本门电路 <span class=glossary-ref>（第 13 章：二进制——从开关到数字）<\/span><\/li><li data-term='定点数'>定点数 — 小数点位置固定的表示方式 <span class=glossary-ref>（第 13 章：二进制——从开关到数字）<\/span><\/li><li data-term='浮点数'>浮点数 — 按科学计数法存储底数与指数的表示方式 <span class=glossary-ref>（第 13 章：二进制——从开关到数字）<\/span><\/li><li data-term='补码'>补码 — 让符号位与数值位统一运算的编码方式 <span class=glossary-ref>（第 13 章：二进制——从开关到数字）<\/span><\/li><li data-term='alu'>ALU — 算术逻辑单元，执行多种运算的部件 <span class=glossary-ref>（第 14 章：CPU 的天职——数值运算）<\/span><\/li><li data-term='加法器'>加法器 — 实现二进制加法的电路，多位由 1 位串联而成 <span class=glossary-ref>（第 14 章：CPU 的天职——数值运算）<\/span><\/li><li data-term='寄存器'>寄存器 — CPU 内部的小容量高速存储单元 <span class=glossary-ref>（第 14 章：CPU 的天职——数值运算）<\/span><\/li><li data-term='寄存器堆'>寄存器堆 — 一组寄存器构成的模块，带地址与读写端口 <span class=glossary-ref>（第 14 章：CPU 的天职——数值运算）<\/span><\/li><li data-term='溢出'>溢出 — 运算结果超出寄存器位宽所能表示的范围 <span class=glossary-ref>（第 14 章：CPU 的天职——数值运算）<\/span><\/li><li data-term='程序计数器（pc）'>程序计数器（PC） — 保存下一条指令地址的寄存器 <span class=glossary-ref>（第 14 章：CPU 的天职——数值运算）<\/span><\/li><li data-term='吞吐率'>吞吐率 — 单位时间内完成的指令数量 <span class=glossary-ref>（第 15 章：流水线的奥秘）<\/span><\/li><li data-term='段间寄存器'>段间寄存器 — 保存上一段结果、供下一段读取的寄存器 <span class=glossary-ref>（第 15 章：流水线的奥秘）<\/span><\/li><li data-term='流水级'>流水级 — 流水线中的一段，由独立电路模块承担 <span class=glossary-ref>（第 15 章：流水线的奥秘）<\/span><\/li><li data-term='流水线'>流水线 — 把指令执行切分为多段并叠加处理的结构 <span class=glossary-ref>（第 15 章：流水线的奥秘）<\/span><\/li><li data-term='btb'>BTB — 分支目标缓冲器，记录分支历史目标地址的预测部件 <span class=glossary-ref>（第 16 章：乱序执行与多发射——把流水线喂饱）<\/span><\/li><li data-term='rob'>ROB — 重排序缓存，按原序提交并处理例外的部件 <span class=glossary-ref>（第 16 章：乱序执行与多发射——把流水线喂饱）<\/span><\/li><li data-term='保留站'>保留站 — 暂存待执行指令、按操作数就绪情况发射的单元 <span class=glossary-ref>（第 16 章：乱序执行与多发射——把流水线喂饱）<\/span><\/li><li data-term='寄存器重命名'>寄存器重命名 — 用内部寄存器副本消除假依赖的机制 <span class=glossary-ref>（第 16 章：乱序执行与多发射——把流水线喂饱）<\/span><\/li><li data-term='数据相关'>数据相关 — 指令间因读写同一数据形成的依赖 <span class=glossary-ref>（第 16 章：乱序执行与多发射——把流水线喂饱）<\/span><\/li><li data-term='结构相关'>结构相关 — 多条指令争用同一硬件部件形成的冲突 <span class=glossary-ref>（第 16 章：乱序执行与多发射——把流水线喂饱）<\/span><\/li><li data-term='tlb'>TLB — 地址转换后备缓冲器，缓存虚拟地址到物理地址的映射 <span class=glossary-ref>（第 17 章：内存、缓存与虚拟内存）<\/span><\/li><li data-term='尾端'>尾端 — 多字节数据在寄存器中的排列顺序 <span class=glossary-ref>（第 17 章：内存、缓存与虚拟内存）<\/span><\/li><li data-term='数据局部性'>数据局部性 — 访问集中在少量地址且反复使用的规律 <span class=glossary-ref>（第 17 章：内存、缓存与虚拟内存）<\/span><\/li><li data-term='缓存'>缓存 — CPU 与内存之间的小容量高速存储 <span class=glossary-ref>（第 17 章：内存、缓存与虚拟内存）<\/span><\/li><li data-term='虚拟内存'>虚拟内存 — 操作系统为程序提供的抽象地址空间 <span class=glossary-ref>（第 17 章：内存、缓存与虚拟内存）<\/span><\/li><li data-term='访存指令'>访存指令 — 读写内存的指令，如 LD、ST <span class=glossary-ref>（第 17 章：内存、缓存与虚拟内存）<\/span><\/li><li data-term='dma'>DMA — 直接存储器访问，外设与内存之间不经济 CPU 的数据传输方式 <span class=glossary-ref>（第 18 章：CPU 的&quot;外交&quot;——特权级、中断与 I/O）<\/span><\/li><li data-term='中断'>中断 — 外部事件触发 CPU 暂停当前流程的机制 <span class=glossary-ref>（第 18 章：CPU 的&quot;外交&quot;——特权级、中断与 I/O）<\/span><\/li><li data-term='例外'>例外 — 指令执行异常触发的处理机制 <span class=glossary-ref>（第 18 章：CPU 的&quot;外交&quot;——特权级、中断与 I/O）<\/span><\/li><li data-term='特权指令'>特权指令 — 只允许操作系统执行的指令 <span class=glossary-ref>（第 18 章：CPU 的&quot;外交&quot;——特权级、中断与 I/O）<\/span><\/li><li data-term='特权级'>特权级 — CPU 为隔离资源而设置的运行权限等级 <span class=glossary-ref>（第 18 章：CPU 的&quot;外交&quot;——特权级、中断与 I/O）<\/span><\/li><li data-term='库函数'>库函数 — 语言层面封装、在应用态执行的功能模块 <span class=glossary-ref>（第 19 章：系统调用——应用与操作系统之间的桥）<\/span><\/li><li data-term='特权级切换'>特权级切换 — CPU 从应用级进入操作系统级（或反向）的过程 <span class=glossary-ref>（第 19 章：系统调用——应用与操作系统之间的桥）<\/span><\/li><li data-term='系统调用'>系统调用 — 操作系统提供给应用的高权限功能接口 <span class=glossary-ref>（第 19 章：系统调用——应用与操作系统之间的桥）<\/span><\/li><li data-term='系统调用列表'>系统调用列表 — 操作系统规定的可调用服务清单 <span class=glossary-ref>（第 19 章：系统调用——应用与操作系统之间的桥）<\/span><\/li><li data-term='内生安全'>内生安全 — 安全能力内建于硬件、不依赖外挂软件的安全形态 <span class=glossary-ref>（第 20 章：专用指令——向量与加密）<\/span><\/li><li data-term='向量寄存器'>向量寄存器 — 保存多个数据元素的宽寄存器 <span class=glossary-ref>（第 20 章：专用指令——向量与加密）<\/span><\/li><li data-term='向量指令'>向量指令 — 一条指令同时计算多组操作数的指令 <span class=glossary-ref>（第 20 章：专用指令——向量与加密）<\/span><\/li><li data-term='国密算法'>国密算法 — SM1、SM2、SM3、SM4 等自主密码算法 <span class=glossary-ref>（第 20 章：专用指令——向量与加密）<\/span><\/li><li data-term='标量'>标量 — 一组操作数只含单个数值的运算形式 <span class=glossary-ref>（第 20 章：专用指令——向量与加密）<\/span><\/li><li data-term='tcm'>TCM — 可信密码模块，提供度量与校验所需的密码功能 <span class=glossary-ref>（第 21 章：虚拟化与可信计算——一台机器当几台用，也只信该信的）<\/span><\/li><li data-term='tpcm'>TPCM — 可信平台控制模块，独立于 CPU 的可信根 <span class=glossary-ref>（第 21 章：虚拟化与可信计算——一台机器当几台用，也只信该信的）<\/span><\/li><li data-term='可信计算'>可信计算 — 以度量与校验保证部件未被篡改的安全机制 <span class=glossary-ref>（第 21 章：虚拟化与可信计算——一台机器当几台用，也只信该信的）<\/span><\/li><li data-term='硬件虚拟化'>硬件虚拟化 — CPU 提供机制以高效运行多个操作系统的能力 <span class=glossary-ref>（第 21 章：虚拟化与可信计算——一台机器当几台用，也只信该信的）<\/span><\/li><li data-term='虚拟化'>虚拟化 — 把一台物理机抽象为多台逻辑机的技术 <span class=glossary-ref>（第 21 章：虚拟化与可信计算——一台机器当几台用，也只信该信的）<\/span><\/li><li data-term='虚拟机'>虚拟机 — 虚拟化产生的逻辑计算机 <span class=glossary-ref>（第 21 章：虚拟化与可信计算——一台机器当几台用，也只信该信的）<\/span><\/li><li data-term='amdahl 定律'>Amdahl 定律 — 并行加速比受串行比例限制的定量规律 <span class=glossary-ref>（第 22 章：并行——多核、多路、多线程与 Amdahl 定律）<\/span><\/li><li data-term='numa'>NUMA — 非统一内存访问，本地与远程访问速度不同 <span class=glossary-ref>（第 22 章：并行——多核、多路、多线程与 Amdahl 定律）<\/span><\/li><li data-term='smp'>SMP — 对称多处理，所有 CPU 等速访问所有内存 <span class=glossary-ref>（第 22 章：并行——多核、多路、多线程与 Amdahl 定律）<\/span><\/li><li data-term='smt'>SMT — 同时多线程，一个核支持多套硬件线程环境 <span class=glossary-ref>（第 22 章：并行——多核、多路、多线程与 Amdahl 定律）<\/span><\/li><li data-term='原子指令'>原子指令 — 保证一段操作不被其他核打断的指令 <span class=glossary-ref>（第 22 章：并行——多核、多路、多线程与 Amdahl 定律）<\/span><\/li><li data-term='多核'>多核 — 单芯片集成多个独立处理器核 <span class=glossary-ref>（第 22 章：并行——多核、多路、多线程与 Amdahl 定律）<\/span><\/li><li data-term='多路'>多路 — 主板上安装多个独立 CPU 芯片 <span class=glossary-ref>（第 22 章：并行——多核、多路、多线程与 Amdahl 定律）<\/span><\/li><li data-term='bga'>BGA — 球栅阵列封装，以焊球作为引脚 <span class=glossary-ref>（第 23 章：从 CPU 到计算机——总线、主板与 BIOS）<\/span><\/li><li data-term='bios'>BIOS — 基本输入输出系统，开机最先运行的固件 <span class=glossary-ref>（第 23 章：从 CPU 到计算机——总线、主板与 BIOS）<\/span><\/li><li data-term='lga'>LGA — 栅格阵列封装，以触点与扣架连接 <span class=glossary-ref>（第 23 章：从 CPU 到计算机——总线、主板与 BIOS）<\/span><\/li><li data-term='pcb'>PCB — 印制电路板，承载并连接电子元器件的基板 <span class=glossary-ref>（第 23 章：从 CPU 到计算机——总线、主板与 BIOS）<\/span><\/li><li data-term='固件'>固件 — 嵌入硬件中的软件程序 <span class=glossary-ref>（第 23 章：从 CPU 到计算机——总线、主板与 BIOS）<\/span><\/li><li data-term='总线'>总线 — 计算机模块之间的通信线路 <span class=glossary-ref>（第 23 章：从 CPU 到计算机——总线、主板与 BIOS）<\/span><\/li><li data-term='桥片'>桥片 — 连接 CPU 与外设、承担外设管理的外围芯片 <span class=glossary-ref>（第 23 章：从 CPU 到计算机——总线、主板与 BIOS）<\/span><\/li><li data-term='fabless'>Fabless — 无晶圆厂 IC 设计公司 <span class=glossary-ref>（第 24 章：化设计为实物——设计公司与流片厂）<\/span><\/li><li data-term='晶圆代工'>晶圆代工 — 专门为设计公司制造芯片的商业模式 <span class=glossary-ref>（第 24 章：化设计为实物——设计公司与流片厂）<\/span><\/li><li data-term='栅极'>栅极 — 控制源漏之间通断的晶体管引脚 <span class=glossary-ref>（第 24 章：化设计为实物——设计公司与流片厂）<\/span><\/li><li data-term='流片（tapeout）'>流片（tapeout） — 把版图交付工厂投产的过程 <span class=glossary-ref>（第 24 章：化设计为实物——设计公司与流片厂）<\/span><\/li><li data-term='版图（gds2）'>版图（GDS2） — 含全部晶体管与连线的物理设计文件 <span class=glossary-ref>（第 24 章：化设计为实物——设计公司与流片厂）<\/span><\/li><li data-term='纳米工艺'>纳米工艺 — 以栅极沟道最小宽度标称的工艺节点 <span class=glossary-ref>（第 24 章：化设计为实物——设计公司与流片厂）<\/span><\/li><li data-term='die'>die — 晶圆切割后含完整电路的单颗晶片 <span class=glossary-ref>（第 25 章：从沙子到晶圆）<\/span><\/li><li data-term='光刻胶'>光刻胶 — 受光照后性质改变、用于定义图形的涂层 <span class=glossary-ref>（第 25 章：从沙子到晶圆）<\/span><\/li><li data-term='掩膜版'>掩膜版 — 带电路图形的透光模板 <span class=glossary-ref>（第 25 章：从沙子到晶圆）<\/span><\/li><li data-term='晶圆'>晶圆 — 由硅锭切出的圆形硅片 <span class=glossary-ref>（第 25 章：从沙子到晶圆）<\/span><\/li><li data-term='电子级硅（egs）'>电子级硅（EGS） — 可用于半导体制造的高纯度硅 <span class=glossary-ref>（第 25 章：从沙子到晶圆）<\/span><\/li><li data-term='硅锭'>硅锭 — 熔炼拉制成的圆柱形硅晶体 <span class=glossary-ref>（第 25 章：从沙子到晶圆）<\/span><\/li><li data-term='离子注入'>离子注入 — 把杂质离子打入硅中以改变导电性 <span class=glossary-ref>（第 25 章：从沙子到晶圆）<\/span><\/li><li data-term='蚀刻'>蚀刻 — 用化学方式去除指定区域材料的工艺 <span class=glossary-ref>（第 25 章：从沙子到晶圆）<\/span><\/li><li data-term='fet'>FET — 场效应管，以电场控制通断的三端器件 <span class=glossary-ref>（第 26 章：模拟与数字元器件——世界只有几种积木）<\/span><\/li><li data-term='pn 结'>PN 结 — P 型与 N 型半导体交界形成的单向导电结构 <span class=glossary-ref>（第 26 章：模拟与数字元器件——世界只有几种积木）<\/span><\/li><li data-term='时序电路'>时序电路 — 带记忆、输出依赖内部状态的数字电路 <span class=glossary-ref>（第 26 章：模拟与数字元器件——世界只有几种积木）<\/span><\/li><li data-term='电容'>电容 — 存储电荷的元件，通交流阻直流 <span class=glossary-ref>（第 26 章：模拟与数字元器件——世界只有几种积木）<\/span><\/li><li data-term='电感'>电感 — 把电能转为磁能存储的元件 <span class=glossary-ref>（第 26 章：模拟与数字元器件——世界只有几种积木）<\/span><\/li><li data-term='电阻'>电阻 — 限制电流的元件 <span class=glossary-ref>（第 26 章：模拟与数字元器件——世界只有几种积木）<\/span><\/li><li data-term='代工厂'>代工厂 — 为设计公司提供晶圆制造服务的企业 <span class=glossary-ref>（第 27 章：版图、制造设备与成本）<\/span><\/li><li data-term='光刻机'>光刻机 — 把掩膜图形投影到晶圆上的核心设备 <span class=glossary-ref>（第 27 章：版图、制造设备与成本）<\/span><\/li><li data-term='单元库'>单元库 — 可复用的标准电路模块集合 <span class=glossary-ref>（第 27 章：版图、制造设备与成本）<\/span><\/li><li data-term='成品率'>成品率 — 扣除次品后良品所占比例 <span class=glossary-ref>（第 27 章：版图、制造设备与成本）<\/span><\/li><li data-term='测试向量'>测试向量 — 用于检验芯片功能的测试输入集合 <span class=glossary-ref>（第 27 章：版图、制造设备与成本）<\/span><\/li><li data-term='fpga'>FPGA — 可反复编程配置的电路器件 <span class=glossary-ref>（第 28 章：不流片也能做 CPU——FPGA 与模拟器）<\/span><\/li><li data-term='finfet'>FinFET — 栅极三面包围沟道的 3D 晶体管 <span class=glossary-ref>（第 28 章：不流片也能做 CPU——FPGA 与模拟器）<\/span><\/li><li data-term='gaa'>GAA — 全环绕栅极晶体管，FinFET 的后继结构 <span class=glossary-ref>（第 28 章：不流片也能做 CPU——FPGA 与模拟器）<\/span><\/li><li data-term='soi'>SOI — 绝缘体上硅，以埋氧层抑制漏电的工艺 <span class=glossary-ref>（第 28 章：不流片也能做 CPU——FPGA 与模拟器）<\/span><\/li><li data-term='模拟器'>模拟器 — 用软件模拟硬件行为的程序 <span class=glossary-ref>（第 28 章：不流片也能做 CPU——FPGA 与模拟器）<\/span><\/li><li data-term='上古时代'>上古时代 — CPU 由整机厂自研自用、未独立销售的时期 <span class=glossary-ref>（第 29 章：从上古到战国——CPU 家族简史）<\/span><\/li><li data-term='单板机'>单板机 — 把 CPU、内存、I/O 集成在一块板上的微型计算机 <span class=glossary-ref>（第 29 章：从上古到战国——CPU 家族简史）<\/span><\/li><li data-term='战国时代'>战国时代 — 1971 年后多家 CPU 厂商并存的时期 <span class=glossary-ref>（第 29 章：从上古到战国——CPU 家族简史）<\/span><\/li><li data-term='第二套生态'>第二套生态 — 相对 x86 而言、以 ARM 为核心的软硬件体系 <span class=glossary-ref>（第 29 章：从上古到战国——CPU 家族简史）<\/span><\/li><li data-term='终端'>终端 — 与人交互的输入输出设备部分 <span class=glossary-ref>（第 29 章：从上古到战国——CPU 家族简史）<\/span><\/li><li data-term='ip 授权'>IP 授权 — 把指令集或核设计许可给他人生产芯片的模式 <span class=glossary-ref>（第 30 章：巨头寻踪——Intel、AMD、ARM、苹果、IBM）<\/span><\/li><li data-term='win32 api'>Win32 API — Windows 提供给应用的编程接口 <span class=glossary-ref>（第 30 章：巨头寻踪——Intel、AMD、ARM、苹果、IBM）<\/span><\/li><li data-term='wintel 联盟'>Wintel 联盟 — x86 与 Windows 组成的产业组合 <span class=glossary-ref>（第 30 章：巨头寻踪——Intel、AMD、ARM、苹果、IBM）<\/span><\/li><li data-term='真双核'>真双核 — 两个完整核集成于一个 die，区别于双 die 封装 <span class=glossary-ref>（第 30 章：巨头寻踪——Intel、AMD、ARM、苹果、IBM）<\/span><\/li><li data-term='epi'>EPI — 欧洲处理器计划 <span class=glossary-ref>（第 31 章：小而坚强与世界边缘——MIPS、RISC-V 与各国 CPU 之路）<\/span><\/li><li data-term='risc-v'>RISC-V — 伯克利发起的开放指令集架构 <span class=glossary-ref>（第 31 章：小而坚强与世界边缘——MIPS、RISC-V 与各国 CPU 之路）<\/span><\/li><li data-term='tron'>TRON — 日本 1984 年启动的自主信息产业体系项目 <span class=glossary-ref>（第 31 章：小而坚强与世界边缘——MIPS、RISC-V 与各国 CPU 之路）<\/span><\/li><li data-term='碎片化'>碎片化 — 同一架构因扩展不一导致软件难以通用的问题 <span class=glossary-ref>（第 31 章：小而坚强与世界边缘——MIPS、RISC-V 与各国 CPU 之路）<\/span><\/li><li data-term='api'>API — 应用编程接口，语言与函数库层面的调用规范 <span class=glossary-ref>（第 32 章：生态之重——CPU 的价值不在 CPU）<\/span><\/li><li data-term='cpu 生态'>CPU 生态 — 围绕某 CPU 的全部资源与产业集合 <span class=glossary-ref>（第 32 章：生态之重——CPU 的价值不在 CPU）<\/span><\/li><li data-term='inside/outside'>Inside/Outside — 芯片内核心与芯片外生态的二分模型 <span class=glossary-ref>（第 32 章：生态之重——CPU 的价值不在 CPU）<\/span><\/li><li data-term='软件生态'>软件生态 — 某 CPU 可运行的全部软件集合 <span class=glossary-ref>（第 32 章：生态之重——CPU 的价值不在 CPU）<\/span><\/li><li data-term='发行版'>发行版 — 把大量源码编译打包成的 Linux 成品 <span class=glossary-ref>（第 33 章：开发者的号角与解决方案为王）<\/span><\/li><li data-term='本地编译型语言'>本地编译型语言 — 编译成可执行文件后运行的语言 <span class=glossary-ref>（第 33 章：开发者的号角与解决方案为王）<\/span><\/li><li data-term='系统软件开发者'>系统软件开发者 — 开发操作系统与 API 的人员 <span class=glossary-ref>（第 33 章：开发者的号角与解决方案为王）<\/span><\/li><li data-term='虚拟机型语言'>虚拟机型语言 — 由虚拟机动态翻译执行的语言 <span class=glossary-ref>（第 33 章：开发者的号角与解决方案为王）<\/span><\/li><li data-term='解决方案'>解决方案 — 面向某类需求的整体软硬件平台 <span class=glossary-ref>（第 33 章：开发者的号角与解决方案为王）<\/span><\/li><li data-term='标准规范'>标准规范 — 定义产品间接口、约束兼容的规则集合 <span class=glossary-ref>（第 34 章：生态的优点与方向——开放、兼容、优化）<\/span><\/li><li data-term='泛生态'>泛生态 — 解决方案之外的标准、社区、认证、人才、出版等支撑体系 <span class=glossary-ref>（第 34 章：生态的优点与方向——开放、兼容、优化）<\/span><\/li><li data-term='生态税'>生态税 — 平台从开发者收益中抽取分成 <span class=glossary-ref>（第 34 章：生态的优点与方向——开放、兼容、优化）<\/span><\/li><li data-term='109 丙'>109 丙 — 中国早期自主研制的大型晶体管计算机 <span class=glossary-ref>（第 35 章：中国 CPU 旧事——为什么必须自己做）<\/span><\/li><li data-term='市场带技术'>市场带技术 — 以自研与市场牵引共同推动技术进步的路线 <span class=glossary-ref>（第 35 章：中国 CPU 旧事——为什么必须自己做）<\/span><\/li><li data-term='市场换技术'>市场换技术 — 以市场开放换取国外技术引进的路线 <span class=glossary-ref>（第 35 章：中国 CPU 旧事——为什么必须自己做）<\/span><\/li><li data-term='缺芯少魂'>缺芯少魂 — 核心芯片与操作系统均依赖国外的状态 <span class=glossary-ref>（第 35 章：中国 CPU 旧事——为什么必须自己做）<\/span><\/li><li data-term='gs464v'>GS464v — 龙芯 3A4000 采用的新一代处理器核代号 <span class=glossary-ref>（第 36 章：龙的声音——龙芯的两个十年与三条原则）<\/span><\/li><li data-term='学院派思维'>学院派思维 — 以单一学术指标衡量产品的思路 <span class=glossary-ref>（第 36 章：龙的声音——龙芯的两个十年与三条原则）<\/span><\/li><li data-term='性能补课'>性能补课 — 把单核与通用处理能力补到国际主流水平 <span class=glossary-ref>（第 36 章：龙的声音——龙芯的两个十年与三条原则）<\/span><\/li><li data-term='lvz / lbt / lsx / lasx'>LVZ / LBT / LSX / LASX — 虚拟化、二进制翻译、向量、高级向量扩展 <span class=glossary-ref>（第 37 章：龙之生态——试错、LoongArch 与内生安全）<\/span><\/li><li data-term='loongarch'>LoongArch — 龙芯自主设计的指令集架构 <span class=glossary-ref>（第 37 章：龙之生态——试错、LoongArch 与内生安全）<\/span><\/li><li data-term='loongnix'>Loongnix — 龙芯社区版操作系统发行版 <span class=glossary-ref>（第 37 章：龙之生态——试错、LoongArch 与内生安全）<\/span><\/li><li data-term='高复杂系统'>高复杂系统 — 因素众多、子系统强耦合、难以分治的系统 <span class=glossary-ref>（第 37 章：龙之生态——试错、LoongArch 与内生安全）<\/span><\/li><li data-term='gs132 / gs232'>GS132 / GS232 — 向高校开源的龙芯 CPU 核 <span class=glossary-ref>（第 38 章：未来已来——泛生态六支柱与多条路线）<\/span><\/li><li data-term='应用迁移'>应用迁移 — 把既有应用系统适配到新平台的工作 <span class=glossary-ref>（第 38 章：未来已来——泛生态六支柱与多条路线）<\/span><\/li><li data-term='生态适配服务产业联盟'>生态适配服务产业联盟 — 统一兼容性测试与认证的产业组织 <span class=glossary-ref>（第 38 章：未来已来——泛生态六支柱与多条路线）<\/span><\/li><\/ul>", "__patterns__": "<h1>模式与框架库<\/h1>\n<p>这本书里真正可迁移的东西，不是那些型号和数字，而是作者反复使用的几套分析框架。学会一套，遇到新的芯片新闻也能自己判断。<\/p>\n<h2>框架：Inside / Outside<\/h2>\n<p>龙芯 2012 年提出的二分法。Inside 是芯片之内的 CPU 核，考验设计与工艺；Outside 是芯片之外的软件生态，考验组织与耐心。芯片是两者的衔接点。<\/p>\n<p><strong>怎么用<\/strong>：看任何一家 CPU 公司的实力，两边各打一次分。只有 Inside 强，那是实验室；只有 Outside 强，那是代理商；两边都强，才是产业玩家。<\/p>\n<p><strong>边界<\/strong>：这个模型对通用 CPU 成立得最好；纯专用芯片（如某些 MCU）Outside 很薄，用它评估会失真。<\/p>\n<h2>框架：兼容的三处支点<\/h2>\n<p>Intel 的成功不在跑分，而在于同时在三个地方保持向下兼容：指令集只增不删、PC 整机标准开放给所有厂商、操作系统对应用保持 API 稳定。<\/p>\n<p><strong>怎么用<\/strong>：判断一个生态能不能长期存活，挨个看这三处有没有断。断一处，应用就开始流失。<\/p>\n<p><strong>边界<\/strong>：兼容会积累历史包袱，架构老化时改不动。这也是 RISC-V 强调&quot;没有包袱&quot;的原因。<\/p>\n<h2>框架：生态三原则<\/h2>\n<p>开放、兼容、优化。开放壮大力量，兼容积累成果，优化提升体验。<\/p>\n<p><strong>怎么用<\/strong>：诊断一个生态的病，先看是哪一条缺了。Linux 是开放满分、兼容与优化不及格；苹果是优化满分、开放不及格；Wintel 是兼容满分。<\/p>\n<p><strong>边界<\/strong>：三条不是平均用力。处于不同阶段的企业优先级不同——起步期最缺开放，成熟期最缺优化。<\/p>\n<h2>框架：性能三因子<\/h2>\n<p>性能 ≈ 主频 × 每拍执行指令数 × 并行度。三者互相牵制：提主频要加深流水线，深流水又拉低每拍有效指令数；加宽发射要更多端口与缓存，面积和功耗随之上涨。<\/p>\n<p><strong>怎么用<\/strong>：看到&quot;性能提升 X%&quot;的宣传，先问是哪一项带来的，代价是什么。<\/p>\n<p><strong>边界<\/strong>：这是稳态吞吐的近似。遇到突发、串行、I/O 密集的场景，三因子解释不了全部。<\/p>\n<h2>框架：产品化的三个先后<\/h2>\n<p>先通用后专用、先单核后核数、先设计能力后先进工艺。这是龙芯从学院派转向产品后的排序。<\/p>\n<p><strong>怎么用<\/strong>：当一个团队把资源压在&quot;浮点峰值&quot;&quot;核数&quot;&quot;先进工艺&quot;上时，用这三条检查它是否在追指标而不是追体验。<\/p>\n<p><strong>边界<\/strong>：对科学计算、AI 训练这类真需要专用能力与堆核的场景，顺序要反过来。<\/p>\n<h2>框架：试错的时间函数<\/h2>\n<p>创新 = f(资金, 人才, 体制机制, 时间)。前三个变量能加速迭代，但替代不了迭代。核心技术的难点在功能细节，不在科学原理。<\/p>\n<p><strong>怎么用<\/strong>：判断一个&quot;三年赶超&quot;的承诺是否可信，看它有没有为试错留出周期。<\/p>\n<p><strong>边界<\/strong>：这不是说慢慢来就行。方向错了，时间只会放大错误。<\/p>\n<h2>框架：成本与定价<\/h2>\n<p>制造成本 =（晶片 + 测试 + 封装）÷ 成品率。售价还受销量（摊薄一次性费用）与商业策略影响。<\/p>\n<p><strong>怎么用<\/strong>：看到&quot;某芯片成本仅几美元&quot;的说法，先问成品率与测试覆盖率假设。<\/p>\n<p><strong>边界<\/strong>：这个公式只覆盖制造侧，不含研发、生态建设、市场费用。<\/p>\n<h2>决策规则<\/h2>\n<ul><li>\n<strong>要进一个新 CPU 生态吗？<\/strong> 先看它有没有稳定的指令集授权条款。授权可被单方面收回的，只能做产品，不能做产业。\n<\/li><li>\n<strong>要自研指令集吗？<\/strong> 只有当你能承受十年以上的生态建设与迁移成本时才选。否则先在成熟生态里做差异化。\n<\/li><li>\n<strong>要提性能吗？<\/strong> 先测瓶颈在哪：单核不满，先补设计能力；访存打墙，先加缓存层次；核数不够，再谈多核。\n<\/li><li>\n<strong>要堆核吗？<\/strong> 问一句&quot;目标负载能不能并行&quot;。办公桌面 4 核够用，服务器单核弱则堆核无效。\n<\/li><li>\n<strong>要上先进工艺吗？<\/strong> 先算一遍：同工艺下设计优化能拿到多少。3A4000 与 3A3000 同工艺性能翻倍，就是例子。\n<\/li><li>\n<strong>要不要做低端产品？<\/strong> 如果目标是守高端定价权，做；如果只是想走量，先算清会不会拖垮品牌与研发。\n<\/li><li>\n<strong>看到&quot;某指标世界先进&quot;要信吗？<\/strong> 先确认那是产品指标还是单项指标。单项领先常常只是原型。\n<\/ul>\n<h2>反模式<\/h2>\n<p><strong>用单项指标代替产品评价。<\/strong> 浮点峰值、主频、核数都是单项。作者对龙芯自身这段历史的批评最狠：单一指标接近国际主流，是典型的学院派思维。替代方案是把通用处理能力、单核性能、设计能力当主线。<\/p>\n<p><strong>把集成当成自研。<\/strong> 买 IP 攒 SoC 能做产品，但不掌握核心设计。行业里叫&quot;CPU 搬运工&quot;。替代方案是至少在一两个关键模块上自己做，并逐步扩大范围。<\/p>\n<p><strong>用授权架构建&quot;自主&quot;生态。<\/strong> 用英文能写小说，但不会因此形成自己的文化。替代方案是自研指令集，同时用二进制翻译兜住存量应用。<\/p>\n<p><strong>只做兼容产品，不做标准。<\/strong> 日本 1986 年的断供是代价最清楚的一次。替代方案是参与甚至主导标准，把接口写进规则里。<\/p>\n<p><strong>把开源当成免费午餐。<\/strong> 开源降低门槛，不自动带来兼容与优化。Linux 桌面份额长期在 1% 左右，就是碎片化的账单。<\/p>\n<p><strong>靠降价破生态怪圈。<\/strong> 用户缺的是能用的软件，不是便宜的机器。降价只能延缓死亡，不能启动正循环。<\/p>\n<p><strong>幻想弯道超车。<\/strong> 书里的判断很直白：有些表面上的直道是更弯的弯道。替代方案是直道追赶，把时间当变量而不是敌人。<\/p>\n<p><strong>把安全当成外挂模块。<\/strong> 在外面加一层安全盒子，挡不住核内的漏洞利用。替代方案是把机制做进处理器核，即&quot;内生安全&quot;。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<p>考前、面试前、读新闻前扫一眼。数字都取自原书，括号里是出处章节。<\/p>\n<h2>公式与规则<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>性能估算<\/td><td>性能 ≈ 主频 × 每拍执行指令数（IPC）× 并行度<\/td><\/tr><tr><td>多核加速上限<\/td><td>Amdahl：S = 1 / ((1 - a) + a / n)，a 为可并行比例，n 为核数<\/td><\/tr><tr><td>单核加速的封顶<\/td><td>串行部分占比 1-a，则加速比上限为 1/(1-a)<\/td><\/tr><tr><td>MIPS 的用法<\/td><td>只在同架构内比较；跨架构无意义（指令含金量不同）<\/td><\/tr><tr><td>流水线吞吐<\/td><td>k 级流水执行 m 条指令，理想拍数 ≈ k + (m - 1)<\/td><\/tr><tr><td>制造成本<\/td><td>成本 =（晶片 + 测试 + 封装）/ 成品率<\/td><\/tr><tr><td>晶片成本<\/td><td>与 die 面积成正比；面积减半，单颗晶片成本约减半<\/td><\/tr><tr><td>功耗构成<\/td><td>动态功耗 ∝ 电容 × 电压² × 频率；另有静态漏电功耗<\/td><\/tr><tr><td>纳米工艺<\/td><td>指标称栅极沟道最小宽度，不是晶体管整体尺寸<\/td><\/tr><tr><td>服务器核数换算<\/td><td>单机 2 路 × 4 核 = 8 核；4 路 × 4 核 = 16 核（以 3B4000 为例）<\/td><\/tr><\/tbody><\/table>\n<h2>关键数字<\/h2>\n<table><thead><tr><th>项目<\/th><th>数值<\/th><th>出处<\/th><\/tr><\/thead><tbody><tr><td>地壳中硅含量<\/td><td>26.30%<\/td><td>第 25 章<\/td><\/tr><tr><td>电子级硅纯度<\/td><td>99.9999%（百万原子最多一个杂质）<\/td><td>第 25 章<\/td><\/tr><tr><td>硅锭质量<\/td><td>约 100kg<\/td><td>第 25 章<\/td><\/tr><tr><td>高性能 CPU 电路层数<\/td><td>约 40 层<\/td><td>第 25 章<\/td><\/tr><tr><td>每层平均耗时<\/td><td>约 1.6 天，光造晶圆约 64 天<\/td><td>第 25 章<\/td><\/tr><tr><td>整颗芯片生产周期<\/td><td>3 个月以上<\/td><td>第 25 章<\/td><\/tr><tr><td>28nm 一次流片费用<\/td><td>上千万元<\/td><td>第 28 章<\/td><\/tr><tr><td>龙芯 3A4000 真片主频<\/td><td>2.0GHz<\/td><td>第 28 章<\/td><\/tr><tr><td>同设计在 FPGA 上<\/td><td>50MHz，测试时间长约 40 倍<\/td><td>第 28 章<\/td><\/tr><tr><td>ASML 光刻机份额<\/td><td>约 80%；最先进机型每台超 10 亿美元<\/td><td>第 27 章<\/td><\/tr><tr><td>台积电代工份额<\/td><td>超过 50%；三星约 20%，格方约 10%<\/td><td>第 27 章<\/td><\/tr><tr><td>Intel 2019 年<\/td><td>收入 720 亿美元，净利 210 亿美元<\/td><td>第 33 章<\/td><\/tr><tr><td>联想 2019 年<\/td><td>收入 510 亿美元，净利 5.97 亿美元<\/td><td>第 33 章<\/td><\/tr><tr><td>苹果手机利润占比<\/td><td>全球智能手机利润的 66%<\/td><td>第 33 章<\/td><\/tr><tr><td>Windows 10 兼容率<\/td><td>4.1 万款软件中仅 49 款有问题（99.9%）<\/td><td>第 34 章<\/td><\/tr><tr><td>Linux 桌面份额<\/td><td>1.29%（2020 年 8 月）<\/td><td>第 34 章<\/td><\/tr><tr><td>ARM 芯片累计出货<\/td><td>1991—2020 年 1600 亿颗<\/td><td>第 34 章<\/td><\/tr><tr><td>A14 晶体管数<\/td><td>118 亿，5nm，6 核 CPU<\/td><td>第 30 章<\/td><\/tr><tr><td>IBM z15<\/td><td>12 核、696mm²、122 亿晶体管、5.2GHz、960MB 四级缓存<\/td><td>第 30 章<\/td><\/tr><tr><td>RISC-V 基础指令<\/td><td>40 余条；核心文档 238 页<\/td><td>第 31 章<\/td><\/tr><tr><td>龙芯 3A1000 → 3A4000 单核<\/td><td>2.7 分 → 21.1 分（SPEC CPU 2006）<\/td><td>第 36 章<\/td><\/tr><tr><td>3A5000 相对 3A4000<\/td><td>SPEC 提升 50%+、STREAM 40%+、Unixbench 100%+<\/td><td>第 36 章<\/td><\/tr><tr><td>申威 26010 浮点峰值<\/td><td>3.168×10¹² 次/秒<\/td><td>第 38 章<\/td><\/tr><\/tbody><\/table>\n<h2>易混对照<\/h2>\n<table><thead><tr><th>别混<\/th><th>区别<\/th><\/tr><\/thead><tbody><tr><td>指令集 vs 微结构<\/td><td>前者是规范（一对多），后者是实现方案<\/td><\/tr><tr><td>CISC vs RISC<\/td><td>指令复杂度取向；现代 CISC 内部拆成类 RISC 微操作<\/td><\/tr><tr><td>软 IP vs 硬 IP<\/td><td>前者是 HDL 功能描述，后者是含布局布线的版图<\/td><\/tr><tr><td>后门 vs 漏洞<\/td><td>前者是有意安排（态度问题），后者是疏忽（能力问题）<\/td><\/tr><tr><td>库函数 vs 系统调用<\/td><td>前者在用户态，后者要切内核态；printf 内部可能调 write<\/td><\/tr><tr><td>虚拟内存 vs 虚拟机<\/td><td>前者是地址空间抽象，后者是整机模拟<\/td><\/tr><tr><td>流水线 vs 多核<\/td><td>前者是单核内并行，后者是核间并行<\/td><\/tr><tr><td>乱序执行 vs 多发射<\/td><td>前者调顺序，后者调宽度，常一起用<\/td><\/tr><tr><td>成品率 vs 良率宣传<\/td><td>成品率是制造端良品比例，与设计无关<\/td><\/tr><tr><td>生态 vs 软件数量<\/td><td>生态还含标准、认证、人才、社区、书籍<\/td><\/tr><\/tbody><\/table>\n<h2>流程步骤<\/h2>\n<p><strong>一条指令的旅程<\/strong>：取指 → 译码 → 取操作数 → 执行 → 访存 → 写回。<\/p>\n<p><strong>从代码到芯片<\/strong>：Verilog → 逻辑综合 → 门级网表 → 布局布线 → GDS2 版图 → 流片 → 晶圆 → 切割 → 封装 → 测试。<\/p>\n<p><strong>从沙子到芯片<\/strong>：二氧化硅 → 熔炼提纯（EGS）→ 硅锭 → 切片（晶圆）→ 光刻/注入/蚀刻逐层加工 → 切割成 die → 封装 → 测试。<\/p>\n<p><strong>验证三档<\/strong>：模拟器（纯软件、最省、最慢但好调）→ FPGA（买板子、慢约 40 倍）→ 流片（最真、最贵）。<\/p>\n<p><strong>系统调用一次<\/strong>：应用调库函数 → 库函数执行 syscall 指令 → CPU 切内核态 → 内核按调用号分发 → 服务例程执行 → 返回用户态。<\/p>\n<p><strong>生态建设六支柱<\/strong>：标准规范 → 开源软件 → 解决方案 → 产品认证 → 人才培养 → 书籍出版。<\/p>\n<h2>缩写<\/h2>\n<table><thead><tr><th>缩写<\/th><th>全称<\/th><th>一句话<\/th><\/tr><\/thead><tbody><tr><td>ISA<\/td><td>Instruction Set Architecture<\/td><td>指令集，软硬件合同<\/td><\/tr><tr><td>IPC<\/td><td>Instructions Per Cycle<\/td><td>每拍执行指令数<\/td><\/tr><tr><td>CISC / RISC<\/td><td>Complex / Reduced Instruction Set Computer<\/td><td>复杂 / 精简指令集<\/td><\/tr><tr><td>SoC<\/td><td>System on Chip<\/td><td>片上系统<\/td><\/tr><tr><td>IP<\/td><td>Intellectual Property<\/td><td>可复用电路模块<\/td><\/tr><tr><td>EDA<\/td><td>Electronic Design Automation<\/td><td>电子设计自动化<\/td><\/tr><tr><td>RTL<\/td><td>Register Transfer Level<\/td><td>寄存器传输级描述<\/td><\/tr><tr><td>FPGA<\/td><td>Field Programmable Gate Array<\/td><td>可反复烧写的可编程逻辑阵列<\/td><\/tr><tr><td>ALU<\/td><td>Arithmetic Logic Unit<\/td><td>算术逻辑单元<\/td><\/tr><tr><td>ROB<\/td><td>Reorder Buffer<\/td><td>重排序缓冲<\/td><\/tr><tr><td>BTB<\/td><td>Branch Target Buffer<\/td><td>分支目标缓冲<\/td><\/tr><tr><td>TLB<\/td><td>Translation Lookaside Buffer<\/td><td>地址转换旁路缓冲<\/td><\/tr><tr><td>MMU<\/td><td>Memory Management Unit<\/td><td>内存管理单元<\/td><\/tr><tr><td>DMA<\/td><td>Direct Memory Access<\/td><td>直接存储器访问<\/td><\/tr><tr><td>SMT<\/td><td>Simultaneous Multithreading<\/td><td>同时多线程<\/td><\/tr><tr><td>NUMA<\/td><td>Non-Uniform Memory Access<\/td><td>非一致内存访问<\/td><\/tr><tr><td>SMP<\/td><td>Symmetric Multiprocessing<\/td><td>对称多处理<\/td><\/tr><tr><td>GAA<\/td><td>Gate-All-Around<\/td><td>全环绕栅极晶体管<\/td><\/tr><tr><td>SOI<\/td><td>Silicon On Insulator<\/td><td>绝缘体上硅<\/td><\/tr><tr><td>TCM / TPCM<\/td><td>Trusted Cryptography / Platform Control Module<\/td><td>可信密码 / 平台控制模块<\/td><\/tr><tr><td>EPI<\/td><td>European Processor Initiative<\/td><td>欧洲处理器计划<\/td><\/tr><\/tbody><\/table>"}, "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "章节", "children": [{"label": "第 1 章：CPU 是什么，为什么它是信息社会的基石", "hre     sec('概念');
    man.concepts.forEach(c=>{
      const a=add(c.title, '#/book/'+cur.book+'/concept/'+c.id, cur.page==='concept/'+c.id?'active':'');
      if(S.visited.includes(cur.book+'/concept/'+c.id)){
        const s=document.createElement('span'); s.className='done'; s.textContent='✓'; a.appendChild(s);
      }
    });
  }
  sec('测验');
  add('全部测验','#/book/'+cur.book+'/quiz/all', cur.page==='quiz/all'?'active':'');
  (man.chapters||[]).forEach(c=>{
    if(!((B.quizCoverage||{})[c.id])) return;
    add('测验：'+c.title, '#/book/'+cur.book+'/quiz/'+c.id, cur.page==='quiz/'+c.id?'active':'');
  });
  sec('复习工具');
  add('抽认卡','#/book/'+cur.book+'/cards', cur.page==='cards'?'active':'');
  add('术语表','#/book/'+cur.book+'/glossary', cur.page==='glossary'?'active':'');
  if(B.rendered['__patterns__']) add('模式库','#/book/'+cur.book+'/patterns', cur.page==='patterns'?'active':'');
  if(B.rendered['__cheatsheet__']) add('速查表','#/book/'+cur.book+'/cheatsheet', cur.page==='cheatsheet'?'active':'');
  sec('其他');
  const m=META.find(x=>x.key===cur.book);
  if(m) add('单独打开学习伴侣 ↗', encodeURI(m.companion));

  updateProgressBook(cur.book);
}

/* ---------- 进度 ---------- */
function updateProgress(pct,label){
  $('#progress-fill').style.width=pct+'%';
  $('#progress-label').textContent=label;
}
function updateProgressBook(book){
  const B=BOOKS[book], S=getState(book);
  const chs=(B.manifest.chapters||[]).length;
  const done=(B.manifest.chapters||[]).filter(c=>S.visited.includes(book+'/chapter/'+c.id)).length;
  const pct=chs?Math.round(done/chs*100):0;
  $('#progress-fill').style.width=pct+'%';
  $('#progress-label').textContent=`《${(META.find(x=>x.key===book)||{}).title||book}》 进度 ${pct}% · 已学 ${done}/${chs} 章`;
}

/* ---------- 渲染 ---------- */
function renderCross(){
  const v=$('#view');
  const docId=cur.doc||FIRST_DOC;
  const html=CROSS[docId]||'<div class="empty">页面不存在</div>';
  let pre='';
  if(docId===FIRST_DOC){
    pre = '<h1>学习总手册</h1>'
      + '<p>本学习系统把书点化为一套可跟着走的学习内容。顶部切换书籍，或用下方卡片进入；'
      + '每本书含学习路径、章节精讲、概念页、测验、抽认卡、术语表、模式库与速查表，进度自动保存在本机浏览器。</p>'
      + '<div class="book-cards">'
      + META.map(m=>`<div class="book-card"><h3>${esc(m.title)}</h3>
          <div class="meta">${m.chapters} 章 · ${m.concepts} 概念 · ${m.quizzes} 测验 · ${m.cards} 抽认卡</div>
          <div class="enter"><a href="#/book/${m.key}/path">进入学习 →</a> &nbsp;|&nbsp;
          <a href="${encodeURI(m.companion)}" target="_blank">单独伴侣 ↗</a></div></div>`).join('')
      + '</div>';
  }
  v.innerHTML = pre + html;
  renderMermaid();
}

function renderBook(){
  const B=BOOKS[cur.book];
  if(!B){ $('#view').innerHTML='<div class="empty">书目不存在</div>'; return; }
  const pid=pageIdOf(cur.page);
  let html=B.rendered[pid];
  if(!html){ html='<div class="empty">页面不存在</div>'; }
  const S=getState(cur.book);
  if((cur.page.startsWith('chapter/')||cur.page.startsWith('concept/')) && !S.visited.includes(cur.book+'/'+cur.page)){
    S.visited.push(cur.book+'/'+cur.page);
    store.set(stKey(cur.book,'visited'), S.visited);
  }
  $('#view').innerHTML=html;
  if(cur.page==='cards') initCards();
  if(cur.page==='glossary') initGlossary();
  if(cur.page.startsWith('quiz/')) initQuizzes();
  if(pid==='__path__') updatePath();
  renderMermaid();
}

/* ---------- 测验 ---------- */
function initQuizzes(){
  const B=BOOKS[cur.book];
  document.querySelectorAll('.quiz-item').forEach(item=>{
    const btn=item.querySelector('.quiz-check');
    if(!btn||item.dataset.inited) return;
    item.dataset.inited='1';
    btn.addEventListener('click',()=>{
      const qid=item.dataset.qid, type=item.dataset.type;
      const q=(B.manifest.quizzes||[]).find(x=>x.id===qid); if(!q) return;
      let user=null, correct=false, fb='';
      if(type==='single'){
        const sel=item.querySelector('input:checked');
        user=sel?parseInt(sel.value):null;
        correct=(user===q.answer);
        fb=correct?'✓ 正确':'✗ 错误'+(user==null?'（未作答）':'');
      }else if(type==='multi'){
        user=Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
        const ans=Array.isArray(q.answer)?q.answer.slice().sort():[q.answer];
        correct=user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
        fb=correct?'✓ 正确':'✗ 错误';
      }else if(type==='blank'){
        const v=(item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
        correct=(v===String(q.answer).trim().toLowerCase());
        fb=correct?'✓ 正确':'✗ 错误'+(v?'':'（未作答）');
      }
      item.querySelectorAll('input:checked').forEach(i=>{
        const val=parseInt(i.value);
        if(Array.isArray(q.answer)?q.answer.includes(val):val===q.answer) i.parentElement.style.color='var(--ok)';
        else i.parentElement.style.color='var(--bad)';
      });
      const feed=item.querySelector('.quiz-feedback');
      feed.className='quiz-feedback '+(correct?'fb-ok':'fb-bad');
      feed.textContent=fb;
      let ex=item.querySelector('.quiz-explain');
      if(!ex){ ex=document.createElement('div'); ex.className='quiz-explain'; item.appendChild(ex); }
      ex.innerHTML='解析：'+esc(q.explain||'');
      const S=getState(cur.book);
      const ch=q.chapterId||'__all__';
      if(!S.quiz[ch]) S.quiz[ch]={n:0};
      S.quiz[ch].n+=1;
      store.set(stKey(cur.book,'quiz'), S.quiz);
    });
  });
}
function updatePath(){
  const B=BOOKS[cur.book], S=getState(cur.book);
  document.querySelectorAll('.path-step').forEach(el=>{
    const step=el.id.replace('path-','');
    const s=(B.manifest.learningPath||[]).find(x=>String(x.step)===step);
    if(s && (s.chapterIds||[]).every(c=>S.visited.includes(cur.book+'/chapter/'+c))){
      el.classList.add('passed');
      if(!el.querySelector('.ck')){ const sp=document.createElement('span'); sp.className='ck done'; sp.textContent=' ✓ 已完成'; el.appendChild(sp); }
    }
  });
}

/* ---------- 抽认卡 ---------- */
let cardIdx=0, cardList=[];
function initCards(){
  const B=BOOKS[cur.book];
  const cards=B.manifest.flashcards||[];
  cardList=cards.slice(); cardIdx=0;
  if(!$('#card-done')){
    const d=document.createElement('div'); d.id='card-done'; d.className='empty';
    d.style.display='none'; d.textContent='本组卡片已全部复习完 🎉';
    const st=$('#card-stage'); if(st) st.appendChild(d);
  }
  const sel=$('#card-filter'); if(!sel) return;
  sel.innerHTML='<option value="">全部</option>';
  [...new Set(cards.map(c=>c.chapterId).filter(Boolean))].forEach(c=>{
    const o=document.createElement('option'); o.value=c;
    const ch=(B.manifest.chapters||[]).find(x=>x.id===c);
    o.textContent=ch?ch.title:c; sel.appendChild(o);
  });
  sel.onchange=()=>{ const v=sel.value; cardList=v?cards.filter(c=>c.chapterId===v):cards.slice(); cardIdx=0; showCard(); };
  $('#flashcard').onclick=()=>$('#flashcard').classList.toggle('flip');
  $('#card-known-btn').onclick=()=>markCard(true);
  $('#card-again-btn').onclick=()=>markCard(false);
  showCard();
}
function showCard(){
  const S=getState(cur.book);
  updateCardCounts();
  const done=$('#card-done'), fc=$('#flashcard');
  if(cardIdx>=cardList.length){
    if(done) done.style.display=''; if(fc) fc.style.display='none'; return;
  }
  if(done) done.style.display='none'; if(fc) fc.style.display='';
  const c=cardList[cardIdx];
  document.querySelector('.fc-front').textContent=c.front;
  document.querySelector('.fc-back').textContent=c.back;
  $('#flashcard').classList.remove('flip');
}
function markCard(known){
  const S=getState(cur.book);
  const c=cardList[cardIdx]; if(!c) return;
  S.cards[c.id]=known?'known':'again';
  store.set(stKey(cur.book,'cards'), S.cards);
  cardIdx++; showCard();
}
function updateCardCounts(){
  const S=getState(cur.book);
  const known=Object.values(S.cards).filter(v=>v==='known').length;
  const again=Object.values(S.cards).filter(v=>v==='again').length;
  const k=$('#card-known'), a=$('#card-again'), l=$('#card-left');
  if(k) k.textContent=known; if(a) a.textContent=again; if(l) l.textContent=Math.max(0,cardList.length-cardIdx);
}

/* ---------- 术语表 ---------- */
function initGlossary(){
  const input=$('#glossary-filter');
  if(!input||input.dataset.inited) return;
  input.dataset.inited='1';
  input.oninput=()=>{
    const v=input.value.trim().toLowerCase();
    document.querySelectorAll('#glossary-list li').forEach(li=>{
      li.style.display=(!v||li.dataset.term.includes(v))?'':'none';
    });
  };
}

/* ---------- 全局搜索 ---------- */
let searchIdx=null;
function buildSearch(){
  if(searchIdx) return searchIdx;
  searchIdx=[];
  META.forEach(m=>{
    const B=BOOKS[m.key];
    Object.entries(B.rendered).forEach(([pid,html])=>{
      if(pid.startsWith('__')) return;
      const text=html.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
      searchIdx.push({book:m.key, page:pdfToPage(pid, B), text, label:m.title});
    });
  });
  Object.entries(CROSS).forEach(([k,html])=>{
    const meta=CROSS_META.find(x=>x.key===k)||{};
    searchIdx.push({book:'cross', page:'cross/'+k, text:html.replace(/<[^>]+>/g,' ').replace(/\s+/g,' '), label:(meta.label||'总览')});
  });
  return searchIdx;
}
function pdfToPage(pid, B){
  if(pid.startsWith('__quiz_')) return 'quiz/'+pid.replace('__quiz_','').replace('__','');
  if(pid==='__path__') return 'path';
  if(pid==='__cards__') return 'cards';
  if(pid==='__glossary__') return 'glossary';
  if(pid==='__patterns__') return 'patterns';
  if(pid==='__cheatsheet__') return 'cheatsheet';
  const ch=(B.manifest.chapters||[]).find(c=>c.id===pid);
  if(ch) return 'chapter/'+pid;
  return 'concept/'+pid;
}
$('#q').addEventListener('input', e=>{
  const v=e.target.value.trim().toLowerCase();
  if(!v){ route(); return; }
  const hits=buildSearch().filter(p=>p.text.toLowerCase().includes(v)).slice(0,40);
  $('#view').innerHTML='<h1>搜索结果：'+esc(v)+'</h1>'+
    (hits.length? hits.map(h=>{
      const href=h.book==='cross'?('#/cross/'+(h.page.split('/')[1]||FIRST_DOC)):('#/book/'+h.book+'/'+h.page);
      return `<div class="search-hit"><a href="${href}">${esc(h.label)}</a><br><span style="color:var(--muted);font-size:13px">${esc(h.text.slice(0,200))}</span></div>`;
    }).join('') : '<div class="empty">未找到相关内容，试试章节名 / 概念名 / 术语。</div>');
});

/* ---------- Mermaid ---------- */
let mermaidState='idle';
function renderMermaid(){
  const els=Array.from(document.querySelectorAll('.mermaid')).filter(el=>!el.dataset.rendered);
  if(!els.length) return;
  const run=()=>{ try{
    mermaid.initialize({startOnLoad:false, theme:document.body.dataset.theme==='dark'?'dark':'default'});
    els.forEach((el,idx)=>{ try{ el.innerHTML=mermaid.render('mm'+Date.now()+idx, el.textContent); el.dataset.rendered='1'; }
      catch(e){ el.dataset.rendered='0'; } });
  }catch(e){} };
  if(window.mermaid){ run(); return; }
  if(mermaidState==='loading') return;
  mermaidState='loading';
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js';
  s.onload=()=>{ mermaidState='loaded'; run(); };
  s.onerror=()=>{ mermaidState='failed'; };
  document.head.appendChild(s);
}

/* ---------- 主题 ---------- */
const themeBtn=$('#theme-btn');
themeBtn.onclick=()=>{
  const d=document.body.dataset.theme==='dark';
  document.body.dataset.theme=d?'':'dark';
  themeBtn.textContent=d?'🌙 深色':'☀️ 浅色';
};

/* ---------- 启动 ---------- */
function route(){
  cur=parseHash();
  renderTabs();
  renderNav();
  if(cur.book==='cross') renderCross(); else renderBook();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', route);
route();
</script>
