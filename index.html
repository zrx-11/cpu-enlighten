由指令执行触发｜中断更严重｜例外不可处理｜答案：A｜解析：触发源不同，处理机制类似。\n<\/li><li>\nDMA 高效的原因是？｜外设与内存直接传输，CPU 不逐条搬运｜DMA 主频更高｜DMA 能执行指令｜答案：A｜解析：控制器独立工作，省掉大量 I/O 指令。\n<\/li><li>\n32 位 CPU 用直接 I/O 传 1MB 数据约需多少条指令？｜约 3 万多条｜约 30 条｜约 300 条｜答案：A｜解析：1MB÷32 位≈32768 条。\n<\/ol>\n<h2>抽认卡<\/h2>\n<ul><li>\n特权级至少分几级？｜两级：操作系统级与应用级\n<\/li><li>\n特权指令的例子？｜设置 CPU 运行等级的指令\n<\/li><li>\n中断的常见来源？｜键盘、网卡、定时器等外围设备\n<\/li><li>\n中断服务程序（ISR）做什么？｜判断中断来源、接收数据、处理后返回\n<\/li><li>\nI/O 三件套？｜外设总线、I/O 指令、中断\n<\/li><li>\nDMA 控制器属于哪类部件？｜协处理器\n<\/ul>\n<h2>术语<\/h2>\n<ul><li>\n特权级：CPU 为隔离资源而设置的运行权限等级\n<\/li><li>\n特权指令：只允许操作系统执行的指令\n<\/li><li>\n中断：外部事件触发 CPU 暂停当前流程的机制\n<\/li><li>\n例外：指令执行异常触发的处理机制\n<\/li><li>\nDMA：直接存储器访问，外设与内存之间不经济 CPU 的数据传输方式\n<\/ul>\n<h2>复习锚点<\/h2>\n<ul><li>\n特权级靠硬件强制，不靠自觉\n<\/li><li>\n中断从外，例外从内\n<\/li><li>\nDMA 让 CPU 下命令而不是搬数据\n<\/ul>", "ch19": "<h1>第 19 章：系统调用——应用与操作系统之间的桥<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>学时<\/strong>：0.5 小时 | <strong>前置<\/strong>：第 18 章\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能写出&quot;应用程序 = 指令序列 + 库函数 + 系统调用&quot;这个等式并解释每一项\n<\/li><li>\n能说明系统调用为什么必须切换特权级\n<\/li><li>\n能区分库函数与系统调用\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>应用只能在自己的院子里活动，想看墙外的信息，得走系统调用这道门，门卫是操作系统。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>为什么需要这扇门<\/h3>\n<p>有些信息应用自己拿不到：系统里有多少进程、网卡和硬盘里的数据、当前时间。这些都是核心资源，操作系统私有，应用无权直接访问。<\/p>\n<p>但应用确实有正常需求。于是操作系统把这些能力封装成接口，应用按需调用。这就是系统调用。<\/p>\n<p>调用的前提是检查。系统调用在 CPU 的高特权级下执行，操作系统会核验调用者权限，只对合法请求提供服务。每种操作系统都有一张系统调用清单，Linux 内核有两百多项。<\/p>\n<h3>一条指令完成切换<\/h3>\n<p>每种 CPU 都定义了系统调用指令。龙芯的是 <code>syscall<\/code>。应用执行到这条指令，CPU 把特权级切到操作系统级，跳到操作系统里的系统调用模块，服务做完再跳回来，继续执行 <code>syscall<\/code> 后面的指令。<\/p>\n<h3>库函数不是系统调用<\/h3>\n<p>把应用拆开看：一大串普通指令，加上库函数，加上系统调用。<\/p>\n<p>库函数是语言层面封装好的功能，编译成模块供重复调用，最典型的是 C 的 <code>printf()<\/code>。但它本质仍是应用态指令序列，在应用权限下执行，碰不到核心资源和外设，也不会引发特权级切换。<\/p>\n<p>区别就在这儿：库函数是&quot;应用自己人帮忙&quot;，系统调用是&quot;进衙门办事&quot;。<code>printf()<\/code> 最终要输出到屏幕，底层还得走系统调用，但那是它内部的事，不改变它自身的性质。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  APP[应用程序&lt;br/&gt;应用态] --&gt;|执行 syscall 指令| SW[特权级切换]\n  SW --&gt; K[操作系统系统调用模块]\n  K --&gt;|权限检查| OK{合法?}\n  OK --&gt;|是| S[执行服务]\n  OK --&gt;|否| D[拒绝]\n  S --&gt; R[返回应用态]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：中间那道&quot;权限检查&quot;是整条链的关键。没有它，系统调用就成了提权后门；有了它，应用只能拿到被允许的那部分能力。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：系统调用像去银行柜台办业务。你不能自己进金库（核心资源），但可以递单子让柜员帮你取（系统调用），柜员会核对身份（权限检查）。失效边界：银行柜员有裁量权，系统调用的检查是代码写死的规则，按清单执行。\n<\/li><li>\n实例：程序要读文件，调用 <code>read()<\/code>。这个函数最终执行系统调用，操作系统核对文件描述符与权限，从磁盘取数据，再把结果交回应用。全程应用没碰过磁盘控制器。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为系统调用很慢所以能不用就不用。它确实有切换开销，但正确性优先，该走还得走。\n<\/li><li>\n别以为库函数等于系统调用。前者是应用态的代码，后者会进内核。\n<\/li><li>\n别以为系统调用只是&quot;函数&quot;。它是 CPU 指令 + 操作系统服务 + 权限检查三件套。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n系统调用的执行权限是？｜操作系统级（高特权级）｜应用级｜无所谓｜答案：A｜解析：核心资源只能在高特权级下访问。\n<\/li><li>\n下列哪项属于库函数而非系统调用？｜printf()｜syscall 指令｜read() 的内核实现｜答案：A｜解析：printf 是应用态的库函数。\n<\/li><li>\nLinux 内核的系统调用有多少项？｜两百多项｜十几项｜上万项｜答案：A｜解析：书中给出的量级是 200 多项。\n<\/li><li>\n系统调用前操作系统会做什么？｜对应用进行权限检查｜重启计算机｜清空内存｜答案：A｜解析：防止恶意应用获取非法信息。\n<\/ol>\n<h2>抽认卡<\/h2>\n<ul><li>\n应用的三个组成部分？｜指令序列、库函数、系统调用\n<\/li><li>\n龙芯的系统调用指令？｜syscall\n<\/li><li>\n系统调用与库函数的本质区别？｜是否切换特权级、进入操作系统执行\n<\/li><li>\n系统调用能提供哪三类典型服务？｜查资源使用、读外设数据、取当前时间\n<\/li><li>\n为什么系统调用要做权限检查？｜防止应用越权访问核心资源\n<\/ul>\n<h2>术语<\/h2>\n<ul><li>\n系统调用：操作系统提供给应用的高权限功能接口\n<\/li><li>\n库函数：语言层面封装、在应用态执行的功能模块\n<\/li><li>\n特权级切换：CPU 从应用级进入操作系统级（或反向）的过程\n<\/li><li>\n系统调用列表：操作系统规定的可调用服务清单\n<\/ul>\n<h2>复习锚点<\/h2>\n<ul><li>\n应用 = 指令 + 库函数 + 系统调用\n<\/li><li>\n系统调用 = 一条指令 + 一次提权 + 一次检查\n<\/li><li>\n库函数在院内，系统调用出墙\n<\/ul>", "ch20": "<h1>第 20 章：专用指令——向量与加密<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>学时<\/strong>：0.5 小时 | <strong>前置<\/strong>：第 14、15 章\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能用 ADDV.W 说明向量指令如何一条算四组\n<\/li><li>\n能举例说出向量指令的适用场景\n<\/li><li>\n能说明硬件加密相对软件加密的两点优势\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>一条指令算一组数据叫标量，算多组叫向量。把重复的活打包进一条指令，就是拿面积换时间。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>向量指令：一条顶四条<\/h3>\n<p>一组操作数只有一个数，叫标量；一组操作数由多个数组成，叫向量。<\/p>\n<p>以 128 位向量加法 <code>ADDV.W w2, w1, w0<\/code> 为例：三个都是 128 位向量寄存器，每个装 4 个 32 位数据。一条指令同时算出 4 组 32 位相加的结果，速度等于基本加法指令的 4 倍。<\/p>\n<p>代价是电路面积：要多做向量寄存器，还要多套并行的运算单元。收益是单位时间算更多数据。相比硬冲主频，这条路容易得多，所以向量扩展成了高性能 CPU 的标配。<\/p>\n<p>龙芯 3A4000 支持的向量指令有数百条：定点向量运算与比较、浮点向量运算与比较、向量分支跳转、向量访存与搬运。适用场景是密集数值运算——图像编解码、3D 游戏、语音分析、雷达信号处理。Intel 最早在 1996 年的 Pentium MMX 上加了 57 条多媒体指令，专门处理视频音频图像，多媒体时代的性能就是这么抬起来的。<\/p>\n<h3>加密：从软件搬进电路<\/h3>\n<p>加密是用算法把信息变成密文，解密是逆运算。开机密码、文档口令、邮件加密，背后都是它。常见算法有 DES、3DES、AES、RSA、DSA、SHA-1、MD5；我国在推自主的 SM1、SM2、SM3、SM4，用于关键信息领域。<\/p>\n<p>实现有两条路。软件路线：用程序写算法，编译成库，Windows、Linux、Android 都内置了这种库。硬件路线：用电路实现算法，再提供指令给应用调用。<\/p>\n<p>硬件路线的好处有两个。一是快，比软件快几十倍；二是稳，电路不像软件那样容易被植入恶意代码，能达到更高水平的&quot;内生安全&quot;。龙芯 3A4000 集成了专用安全模块，可以硬件执行 SM2、SM3、SM4，操作系统和应用通过硬件接口取密码服务。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  SC[&quot;标量加法&lt;br/&gt;1 组 32 位&quot;] --&gt; R1[结果 1]\n  V[&quot;ADDV.W&lt;br/&gt;4 组 32 位&quot;] --&gt; R4[结果 4 组]\n  SW[&quot;软件加密&lt;br/&gt;库函数&quot;] --&gt; S1[&quot;慢，可被篡改&quot;]\n  HW[&quot;硬件加密模块&lt;br/&gt;SM2 / SM3 / SM4&quot;] --&gt; S2[&quot;快几十倍，内生安全&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：上面一对说明&quot;打包&quot;的价值，下面一对说明&quot;搬进硬件&quot;的价值。两条路都是同一个思路——把重复劳动固化，换取单位时间的产出。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：标量像一个人搬一块砖，向量像推车一次装四块。推车要造，但搬起来快。失效边界：推车只在砖块规整时好用，数据不规则、要频繁分支时，向量指令的打包效率会掉下来。\n<\/li><li>\n实例：给一张 4K 图做滤镜，每个像素做同样的浮点运算。标量要循环几百万次，向量一次处理 4 个（甚至更多），循环次数直接除下来。这就是图像处理特别吃向量宽度的原因。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为向量指令能替代 GPU。向量单元在 CPU 内，宽度有限；GPU 是成千上万线程的专用阵列。\n<\/li><li>\n别以为硬件加密绝对安全。算法安全不等于实现安全，侧信道照样能攻击。\n<\/li><li>\n别以为向量指令只在超算有用。手机拍照、视频解码天天在用。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\nADDV.W 一条指令能算几组 32 位加法？｜4 组｜2 组｜1 组｜答案：A｜解析：128 位寄存器装 4 个 32 位数据。\n<\/li><li>\n向量指令的思想是？｜空间换时间｜时间换空间｜降低主频｜答案：A｜解析：多用电路面积换单位时间更多计算。\n<\/li><li>\n硬件加密相对软件加密的优势不包括？｜算法种类更多｜速度快几十倍｜更难被植入恶意代码｜答案：A｜解析：算法种类取决于支持哪些标准，不是硬件天然更多。\n<\/li><li>\n我国自主密码算法包括？｜SM2、SM3、SM4｜DES、MD5｜RSA、DSA｜答案：A｜解析：SM 系列是国密算法。\n<\/ol>\n<h2>抽认卡<\/h2>\n<ul><li>\n标量与向量的区别？｜一组操作数是一个数还是多个数\n<\/li><li>\n128 位向量寄存器装几个 32 位数据？｜4 个\n<\/li><li>\n向量指令的代价？｜更多寄存器与并行运算单元，占面积\n<\/li><li>\nIntel 最早的向量指令扩展？｜Pentium MMX，57 条多媒体指令\n<\/li><li>\n硬件加密的两大好处？｜速度快几十倍；抗篡改、内生安全\n<\/ul>\n<h2>术语<\/h2>\n<ul><li>\n标量：一组操作数只含单个数值的运算形式\n<\/li><li>\n向量指令：一条指令同时计算多组操作数的指令\n<\/li><li>\n向量寄存器：保存多个数据元素的宽寄存器\n<\/li><li>\n国密算法：SM1、SM2、SM3、SM4 等自主密码算法\n<\/li><li>\n内生安全：安全能力内建于硬件、不依赖外挂软件的安全形态\n<\/ul>\n<h2>复习锚点<\/h2>\n<ul><li>\n向量 = 一条指令算多组，靠面积换时间\n<\/li><li>\n密集数值运算最吃向量\n<\/li><li>\n加密进硬件：更快，也更难被动手脚\n<\/ul>", "ch21": "<h1>第 21 章：虚拟化与可信计算——一台机器当几台用，也只信该信的<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>学时<\/strong>：0.7 小时 | <strong>前置<\/strong>：第 18、19 章\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明虚拟化把一台机器变成多台逻辑机器的机制与用途\n<\/li><li>\n能解释硬件虚拟化为什么能让虚拟机跑出接近物理机的性能\n<\/li><li>\n能对比&quot;老三样&quot;与可信计算的思路差别\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>虚拟化是把资源切成几份分给不同系统，可信计算是给每个部件验明正身。一个管&quot;怎么分&quot;，一个管&quot;信不信&quot;。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>虚拟化：一台变多台<\/h3>\n<p>虚拟化把一台计算机切成多台逻辑计算机，每台叫虚拟机，可以各跑各的操作系统，同时运行。用户在里面装软件、用系统，感觉和真机没差别。<\/p>\n<p>三个典型用途。兼容老系统：设备停售了，新机器上开个虚拟机模拟旧环境，核心资产继续用。开发调试操作系统：一台机器上开几个虚拟机，不用格式化硬盘就能试各种 Linux 版本。云计算的基础：数据中心在物理机上开虚拟机跑应用，某台物理机坏了，上面的虚拟机可以迁移到另一台，服务不中断。<\/p>\n<p>概念最早由 IBM 在 1960 年提出，M44/44X 是鼻祖。1972 年 System/370 第一次引入硬件虚拟化。<\/p>\n<h3>硬件虚拟化：别用软件模拟<\/h3>\n<p>不支持硬件虚拟化时，只能靠软件模拟多个 CPU，慢得明显。硬件虚拟化是 CPU 在设计时就提供机制，让多个操作系统同时跑，每个都能用接近 100% 的 CPU 性能。<\/p>\n<p>2005 年之后的桌面与服务器 CPU 逐步都支持。Intel 叫 VT。龙芯从 3B3000 起自研了全面硬件虚拟化，覆盖执行模式、流水线环境、TLB、中断异常、虚拟机辅助机制、时钟系统，虚拟机效率达 95% 以上。这项工程做了三年多，是龙芯掌握全栈虚拟化技术的标志，也让龙芯服务器有了做云平台的实用能力。<\/p>\n<h3>可信计算：换个方向做安全<\/h3>\n<p>传统&quot;老三样&quot;是杀病毒、防火墙、入侵检测，都是被动防御，挡不住新出现的未知恶意代码，中招后还要花时间找漏洞打补丁。<\/p>\n<p>可信计算反过来，做&quot;主动免疫&quot;。核心是一个可信模块，独立于 CPU 工作，装在主板上，开机时它先启动，而不是 CPU 先启动。出厂前它扫描所有硬件软件，把每个部件的关键特征记在自己内部；出厂后它自身和记录都不可改。运行中它不断比对现状与出厂记录，一旦发现被篡改，立即停止并告警。<\/p>\n<p>这就是白名单思路：只有经过度量、确认可信的资源才允许运行——BIOS 固件、CPU 型号、硬盘序列号、网卡序列号、操作系统、应用程序，都在度量范围内。<\/p>\n<p>这个模块的术语是可信平台控制模块（TPCM），里面一般还集成可信密码模块（TCM），因为度量与校验都要用密码算法。<\/p>\n<h3>从外挂到内生<\/h3>\n<p>可信模块可以做成主板上的独立器件，也可以和 CPU 集成。龙芯 3A4000 把可信模块做进了芯片，独立于处理器核工作。主板不用再额外装，成本降了，安全性反而更高——这就是&quot;内生&quot;的意思：安全长在芯片里，不是贴上去的。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  HW[物理机] --&gt; VMM[虚拟化层]\n  VMM --&gt; VM1[虚拟机 1&lt;br/&gt;操作系统 A]\n  VMM --&gt; VM2[虚拟机 2&lt;br/&gt;操作系统 B]\n  TPCM[TPCM 可信模块&lt;br/&gt;先于 CPU 启动] --&gt;|度量 / 比对| HW\n  TPCM --&gt;|发现篡改| ALERT[停止并告警]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：上半张是&quot;分&quot;，一台物理机被切成多台逻辑机；下半张是&quot;验&quot;，可信模块在系统启动前就盯着所有部件。两者解决的是不同层面的问题，常一起用。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：虚拟化像一套公寓隔成几个单间，各自有门有钥匙；可信计算像小区门禁加监控，进出都要核身份，墙被凿了个洞也能发现。失效边界：隔间之间会抢水电（CPU、内存、IO 资源竞争），虚拟机之间也有性能干扰。\n<\/li><li>\n实例：云服务器上一台物理机跑十几台虚拟机，某台虚拟机被攻击，正常情况下影响被限制在它自己那间；若虚拟化层有漏洞，攻击者可能&quot;越狱&quot;影响邻居，这也是虚拟化安全研究的热点。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为虚拟机等于模拟器。模拟器逐条翻译指令，虚拟机多数指令直接在本机跑。\n<\/li><li>\n别以为硬件虚拟化只是软件功能。它需要 CPU 在特权级、TLB、中断等层面提供硬件机制。\n<\/li><li>\n别以为可信计算能防所有攻击。它保证&quot;被改动会被发现&quot;，不保证&quot;不会被攻击&quot;。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n虚拟化的本质是？｜把一台计算机虚拟为多台逻辑计算机｜把多台合成一台｜提高主频｜答案：A｜解析：每台逻辑机可跑独立操作系统。\n<\/li><li>\n硬件虚拟化的优势是？｜虚拟机性能接近物理机｜不需要操作系统｜不需要内存｜答案：A｜解析：CPU 提供硬件机制，避免软件模拟开销。\n<\/li><li>\n可信计算的核心思路是？｜白名单度量，只允许可信资源运行｜查杀已知病毒｜加密所有文件｜答案：A｜解析：主动免疫，先度量后运行。\n<\/li><li>\nTPCM 与 CPU 的启动顺序是？｜TPCM 先启动｜CPU 先启动｜同时启动｜答案：A｜解析：可信模块要最先启动并度量其他部件。\n<\/ol>\n<h2>抽认卡<\/h2>\n<ul><li>\n虚拟化的三个典型用途？｜兼容老系统、开发调试操作系统、云计算基础\n<\/li><li>\n硬件虚拟化的首次引入？｜1972 年 IBM System/370\n<\/li><li>\n龙芯硬件虚拟化的效率？｜虚拟机性能达物理机 95% 以上\n<\/li><li>\n可信计算的&quot;老三样&quot;指什么？｜杀病毒、防火墙、入侵检测\n<\/li><li>\nTPCM 与 TCM 分别是什么？｜可信平台控制模块与可信密码模块\n<\/li><li>\n可信计算为什么算&quot;白名单&quot;？｜只有度量通过的资源才允许运行\n<\/ul>\n<h2>术语<\/h2>\n<ul><li>\n虚拟化：把一台物理机抽象为多台逻辑机的技术\n<\/li><li>\n虚拟机：虚拟化产生的逻辑计算机\n<\/li><li>\n硬件虚拟化：CPU 提供机制以高效运行多个操作系统的能力\n<\/li><li>\n可信计算：以度量与校验保证部件未被篡改的安全机制\n<\/li><li>\nTPCM：可信平台控制模块，独立于 CPU 的可信根\n<\/li><li>\nTCM：可信密码模块，提供度量与校验所需的密码功能\n<\/ul>\n<h2>复习锚点<\/h2>\n<ul><li>\n虚拟化管&quot;分&quot;，可信计算管&quot;信&quot;\n<\/li><li>\n硬件虚拟化让虚拟机跑出接近真机的性能\n<\/li><li>\n可信计算是白名单 + 主动免疫，不是杀毒\n<\/ul>", "ch22": "<h1>第 22 章：并行——多核、多路、多线程与 Amdahl 定律<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>学时<\/strong>：0.8 小时 | <strong>前置<\/strong>：第 15、16 章\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能区分多核、多路、硬件多线程三个层次的并行\n<\/li><li>\n能用 Amdahl 定律算出加速比上限\n<\/li><li>\n能说清 SMP 与 NUMA 的差别，以及弱一致性为什么被普遍采用\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>横向加计算单元比纵向冲主频容易，但加速比有天花板——串行那一段决定了上限。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>三个层次<\/h3>\n<p>多核：一个芯片里集成多个独立 CPU 单元，每个叫一个核。龙芯 3A1000 到 3A5000 都是 4 核，台式机够用。这是横向扩展：与其把单核主频往上顶，不如多放几个核。<\/p>\n<p>多路：一块主板上插多个独立的 CPU 芯片。服务器常用，公式是&quot;CPU 数量 = 路数 × 每芯片核数&quot;。龙芯 3B4000 四路服务器：4 颗芯片 × 4 核 = 16 核。多路还有个好处：每颗 CPU 有自己的内存通道，带宽能成倍涨；单芯片内一味加核，访存通道不够，会出现&quot;茶壶倒饺子&quot;——核多但喂不饱。<\/p>\n<p>硬件多线程（SMT，也叫超线程）：一个核在硬件上支持多套线程执行环境，每套有独立寄存器与执行上下文。只要运行的线程数不超过支持的套数，就不需要分时复用，是真正的并行。Intel 的文献说，支持 2 套线程环境的 CPU，用不到 10% 的晶体管换来平均 60% 的性能提升。SMT 是 1996 年成型的学术成果，2002 年 Pentium 4 HT 把它带进消费市场。龙芯目前还没用。<\/p>\n<p>软件层的多线程是另一回事：操作系统把 CPU 时间切成小片，轮流给各线程，切换快到人感觉不出，本质仍是分时复用。<\/p>\n<h3>Amdahl 定律：天花板在哪<\/h3>\n<p>设问题在单核上耗时 T，n 核理论最短是 T/n。但问题不一定能全部并行。<\/p>\n<p>1967 年 Amdahl 给出的公式：<\/p>\n<p>S = 1 / (1 - a + a/n)<\/p>\n<p>a 是可并行部分占比，n 是核数，S 是加速比。取几个边界值就明白了：a=1 时 S=n，线性加速；a=0 时 S=1，多核白搭；n 趋于无穷时 S 趋于 1/(1-a)。也就是说，串行部分占 25%，无论多少核，加速比都超不过 4 倍。<\/p>\n<p>这条定律对程序员的提醒很直接：先想办法把可并行比例做大，而不是一味堆核数。<\/p>\n<h3>内存怎么连：SMP 与 NUMA<\/h3>\n<p>SMP（对称多处理）：所有 CPU 都能访问所有内存，统一地址空间，访问任何单元的时间相同。结构简单，但 CPU 和内存一多，互连网络的开销就成瓶颈。<\/p>\n<p>NUMA（非统一内存访问）：每个 CPU 带本地内存条，也能访问别人的远程内存。访问本地快、远程慢，&quot;非统一&quot;就是这个意思。它更容易支持大容量内存，互连不易成瓶颈，兼顾了共享的方便与扩展的灵活。龙芯 3B4000 四路服务器就是典型 NUMA。<\/p>\n<h3>缓存怎么同步<\/h3>\n<p>每个核都有自己的缓存，同一份数据可能有多份副本。基于目录的一致性协议：互连网络里放一张全局目录表，记录每个存储单元的状态——在哪些核的缓存里有备份。某核写内存时先查表，若别处有备份就发通知，对方更新。<\/p>\n<p>更新通知的时序有两种原则。强一致性：所有通知执行完才允许继续访存，绝对正确但等得久。弱一致性：不等通知完成就继续跑，硬件不强制全局一致，不同核可能读到不同值；需要时程序员插一条内存同步指令强制等待。<\/p>\n<p>实际并行机几乎都用弱一致：把很小的维护成本交给程序员，换来几倍的性能。龙芯的同步指令是 <code>SYNC<\/code>，执行后保证全机缓存行同步完成。<\/p>\n<h3>原子指令：别让两个核抢着加一<\/h3>\n<p>&quot;内存单元 M 加 1&quot;要三条指令：读、加、写回。单核没问题，双核就可能两边都读到旧值，最后只加了 1 而不是 2。<\/p>\n<p>原子指令让一段操作独占执行。硬件上一般在互连网络里放一个全局原子寄存器，所有核访问它互斥，由网络仲裁，只有一个核拿到权限，其他等着。<\/p>\n<p>龙芯用 LL（取独占权限）和 SC（释放独占权限）成对使用，x86、ARM 也有等价机制。学过数据库的人会发现，这很像事务：一段操作独立完成，不受别人干扰。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  S[&quot;单核 T&quot;] --&gt;|多核 n=4| P[&quot;理想 T/4&quot;]\n  S --&gt;|串行占 25%| L[&quot;上限 4 倍&quot;]\n  subgraph 内存\n    SMP[SMP&lt;br/&gt;访问等距]\n    NUMA[NUMA&lt;br/&gt;本地快 远程慢]\n  end<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：上面是加速比的天花板，下面是两种内存组织方式。看完要记住两件事：核数不是万能的；内存连接方式决定了大机器能扩到多大。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：多人搬一堆货，能并行的部分一人一摞同时搬；但开箱、清点、记账只能一个人做，人再多也得等这几步。失效边界：现实里加人能协调，程序里线程间还要加锁，锁竞争反而可能让多核更慢。\n<\/li><li>\n实例：一个图像处理程序，95% 的像素运算可并行，5% 是串行读写文件。按公式，n 再大加速比也顶到 1/0.05=20 倍。想再快，只能动那 5%。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为核数翻倍性能就翻倍。Amdahl 定律与访存带宽会一起卡住你。\n<\/li><li>\n别以为超线程等于多核。它共享同一套执行单元，争用时收益会掉。\n<\/li><li>\n别以为弱一致性是&quot;不安全&quot;。它把同步责任交给程序员，用指令保证关键点一致。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n龙芯 3B4000 四路服务器的总核数是？｜16｜8｜4｜答案：A｜解析：4 路 × 每芯片 4 核 = 16。\n<\/li><li>\nAmdahl 定律中串行部分占 25% 时，加速比上限是？｜4 倍｜25 倍｜无限｜答案：A｜解析：S→1/(1-a)=1/0.25=4。\n<\/li><li>\nNUMA 的特点是？｜访问本地内存快于远程内存｜所有访问等速｜无内存｜答案：A｜解析：&quot;非统一&quot;即访问时间随位置而变。\n<\/li><li>\n龙芯的缓存同步指令是？｜SYNC｜FENCE｜BARRIER｜答案：A｜解析：书中明确为 SYNC。\n<\/ol>\n<h2>抽认卡<\/h2>\n<ul><li>\n多核、多路、SMT 的区别？｜芯片内多核、主板上多芯片、核内多线程环境\n<\/li><li>\nCPU 总数怎么算？｜路数 × 每芯片核数\n<\/li><li>\nSMT 的性价比数据？｜不到 10% 晶体管换平均 60% 性能提升\n<\/li><li>\nAmdahl 定律公式？｜S = 1/(1-a+a/n)\n<\/li><li>\nSMP 与 NUMA 的核心差别？｜所有访问等速 vs 本地快远程慢\n<\/li><li>\n原子指令的作用？｜让一段操作独占执行，避免多核竞争出错\n<\/ul>\n<h2>术语<\/h2>\n<ul><li>\n多核：单芯片集成多个独立处理器核\n<\/li><li>\n多路：主板上安装多个独立 CPU 芯片\n<\/li><li>\nSMT：同时多线程，一个核支持多套硬件线程环境\n<\/li><li>\nAmdahl 定律：并行加速比受串行比例限制的定量规律\n<\/li><li>\nSMP：对称多处理，所有 CPU 等速访问所有内存\n<\/li><li>\nNUMA：非统一内存访问，本地与远程访问速度不同\n<\/li><li>\n原子指令：保证一段操作不被其他核打断的指令\n<\/ul>\n<h2>复习锚点<\/h2>\n<ul><li>\n横向扩展有三层：核、路、线程\n<\/li><li>\n加速比天花板 = 1/串行比例\n<\/li><li>\n弱一致 + 同步指令，是性能与正确的折中\n<\/ul>", "ch23": "<h1>第 23 章：从 CPU 到计算机——总线、主板与 BIOS<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>学时<\/strong>：0.7 小时 | <strong>前置<\/strong>：第 18、19 章\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说清系统总线与外设总线的分工，以及桥片的作用\n<\/li><li>\n能说出主板的两种 CPU 安装方式与印制电路板的基本构成\n<\/li><li>\n能按顺序复述&quot;敲一下键&quot;在计算机内部走过的 11 步\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>CPU 只是大脑。总线是神经，桥片是副官，主板是躯干，BIOS 是开机后跑的第一段代码。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>总线与桥片<\/h3>\n<p>总线是模块之间的通信线路，把 CPU、内存、外设连起来。它分两类：CPU 与内存之间要高速，叫系统总线（有的厂商叫前端总线）；连外设的不需要那么快，叫外设总线。<\/p>\n<p>设备多了，CPU 管不过来，于是有桥片——CPU 的&quot;副官&quot;，一端接 CPU，一端接各种外设，把外设管理接过去。龙芯 7A1000 桥片配 3A4000：两者之间走高速 HT 总线，7A1000 到外设走 PCIe 这类低速总线。<\/p>\n<p>也有 CPU 把桥片集成进芯片，直接引出外设接口，集成度高、省主板面积，台式机和笔记本常见。服务器外设种类复杂，多数仍用独立桥片，甚至在桥片下再挂扩展芯片，形成多层外设总线，避免一条线上设备太多堵住。<\/p>\n<p>PCIe 4.0 的理论峰值约 2GB/s，传图片、音乐、电影够用。<\/p>\n<h3>主板：把所有东西焊在一起<\/h3>\n<p>主板是一块印制电路板（PCB），由绝缘底板、导线、焊盘组成，把复杂布线集成起来，可以自动化焊接，出问题也便于整块更换。发明者是奥地利人保罗·艾斯勒，1936 年首次用在收音机里。<\/p>\n<p>CPU 上主板有两种方式。球栅阵列封装（BGA）：芯片下面一排焊球，每个焊球是一个引脚，龙芯 3A4000 是 37.5mm×37.5mm、1211 个引脚，就要在主板上留 1211 个焊点，用机器焊上去，抗震好。栅格阵列封装（LGA）：不用焊，用扣架压住引脚，可以随时换 CPU，台式机和服务器常用。<\/p>\n<p>PCB 可以做多层，绝缘层与导线层交替叠加。多数主板是 4 层或 6 层，龙芯 3A4000 设计时考虑了 4 层布线以省成本。<\/p>\n<h3>BIOS：开机第一段代码<\/h3>\n<p>固件是嵌进硬件的软件，存在可擦写存储器里。BIOS 是最重要的固件，装在主板的 ROM 芯片上，出厂前写好，用户一般不改。<\/p>\n<p>它是 CPU 运行的第一个软件。上电后 CPU 从 ROM 读代码执行，做三件事：系统自检（探测 CPU 型号、内存容量、键鼠、硬盘、显示器、网卡，还给内存做读写校验，发现坏单元就报警停机）；初始配置（开机密码、日期时间、启动设备、服务器上的 RAID）；加载操作系统（找到引导程序，装进内存，交班给操作系统）。<\/p>\n<p>整个过程只有几秒，代码装得进 4MB 的 ROM。龙芯 2018 年前用 PMON，之后转用 UEFI。<\/p>\n<h3>敲一下键，机器里发生了什么<\/h3>\n<p>这是龙芯招聘的必考题，十一步：<\/p>\n<ol><li>\n键盘检测到按键，给桥片 7A1000 发信号。\n<\/li><li>\n桥片把事件存进自己的寄存器，通过系统总线拉 CPU 的中断引脚。\n<\/li><li>\nCPU 把中断状态存进中断状态寄存器。\n<\/li><li>\n取指单元把中断状态附在指令后送进 ROB；发射时发现中断，按例外机制撤销未提交指令。\n<\/li><li>\nCPU 提权到操作系统级，把指令地址强行改到中断处理程序入口。\n<\/li><li>\n中断处理程序查桥片寄存器，找到最早的中断源，读出按键编码。\n<\/li><li>\n找到在等按键的应用（WPS），把编码放进操作系统核心区里该应用的键盘事件队列。\n<\/li><li>\n中断处理结束，返回操作系统。\n<\/li><li>\n操作系统降权到应用级，恢复 WPS 运行。\n<\/li><li>\nWPS 变活跃，通过系统调用取事件队列里的按键编码。\n<\/li><li>\nWPS 调绘图函数，显卡把图像送显示器，屏幕上出现字符。\n<\/ol>\n<h3>死机：三种常见根源<\/h3>\n<p>死机是失去响应。原因大致三类：操作系统 bug（占绝大多数，Linux 社区版本更新快，未必在每个 CPU 上都测过）；主板硬件不稳（劣质电源供不上电流，晶体管翻不动 0/1；内存走线不等长或太近引发串扰）；外设故障（某款显卡在特定命令组合下不返回信号，CPU 干等）。<\/p>\n<p>龙芯硬件工程师有句话：电源是血脉，内存是仓库。这两处是稳定性的两大根源。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  KB[键盘] --&gt; BR[桥片 7A1000]\n  BR --&gt;|HT 系统总线| CPU[龙芯 CPU]\n  CPU --&gt;|中断| OS[操作系统]\n  OS --&gt;|事件队列 + 系统调用| APP[WPS]\n  APP --&gt; GPU[显卡]\n  GPU --&gt; MON[显示器]\n  ROM[BIOS ROM] --&gt; CPU<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：注意箭头方向——数据从键盘进、从显示器出，中间每一段都换了&quot;经办人&quot;。这张图也是排障地图：哪一环断了，现象就卡在哪。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：桥片像公司前台，所有访客先到前台登记，前台再通知老板（CPU）；老板不会站在门口盯着每个人。失效边界：前台会筛人，桥片只做转发和暂存，不做业务判断。\n<\/li><li>\n实例：BIOS 内存自检时写入一串数据再读回比对，不一致就停机报警。很多&quot;开机黑屏滴滴响&quot;就是这一步没过，问题往往在内存条接触或颗粒坏。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 CPU 直接连所有外设。中间有桥片和总线分层。\n<\/li><li>\n别以为 BIOS 是操作系统的一部分。它在操作系统之前运行，装完系统就交班。\n<\/li><li>\n别以为死机都是软件问题。电源与内存引起的硬件不稳很常见，而且更难查。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n桥片的作用是？｜接管外设管理，连接 CPU 与外设｜提高主频｜扩大缓存｜答案：A｜解析：桥片是 CPU 的&quot;副官&quot;。\n<\/li><li>\n龙芯 3A4000 的 BGA 封装引脚数？｜1211｜121｜12110｜答案：A｜解析：书中给出 1211 个引脚。\n<\/li><li>\nBIOS 的三大功能不包括？｜编译应用程序｜系统自检｜加载操作系统｜答案：A｜解析：BIOS 负责自检、配置与引导。\n<\/li><li>\n龙芯 2018 年后采用的固件项目是？｜UEFI｜PMON｜BIOS 老版本｜答案：A｜解析：2018 年前用 PMON，之后转 UEFI。\n<\/ol>\n<h2>抽认卡<\/h2>\n<ul><li>\n系统总线与外设总线的区别？｜前者连 CPU 与内存求高速，后者连外设\n<\/li><li>\nBGA 与 LGA 的差别？｜焊球焊接 vs 扣架压接可更换\n<\/li><li>\nPCB 的发明者与年份？｜保罗·艾斯勒，1936 年\n<\/li><li>\nBIOS 存在哪里？｜主板上的 ROM 芯片\n<\/li><li>\n按键事件的第 4 步做了什么？｜中断状态随指令进入 ROB，触发撤销未提交指令\n<\/li><li>\n死机的三大根源？｜操作系统 bug、主板硬件不稳、外设故障\n<\/ul>\n<h2>术语<\/h2>\n<ul><li>\n总线：计算机模块之间的通信线路\n<\/li><li>\n桥片：连接 CPU 与外设、承担外设管理的外围芯片\n<\/li><li>\nPCB：印制电路板，承载并连接电子元器件的基板\n<\/li><li>\nBGA：球栅阵列封装，以焊球作为引脚\n<\/li><li>\nLGA：栅格阵列封装，以触点与扣架连接\n<\/li><li>\nBIOS：基本输入输出系统，开机最先运行的固件\n<\/li><li>\n固件：嵌入硬件中的软件程序\n<\/ul>\n<h2>复习锚点<\/h2>\n<ul><li>\n总线分层，桥片分劳\n<\/li><li>\n主板是躯干，封装决定能不能换 CPU\n<\/li><li>\nBIOS 自检、配置、交班，三步走完就退场\n<\/ul>", "ch24": "<h1>第 24 章：化设计为实物——设计公司与流片厂<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>学时<\/strong>：0.5 小时 | <strong>前置<\/strong>：第 12 章\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能解释 Fabless 模式：设计公司做什么、代工厂做什么\n<\/li><li>\n能说清&quot;流片&quot;这个词的来源\n<\/li><li>\n能准确说出纳米工艺指的是哪一段尺寸\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>大多数芯片公司只出图纸，不出芯片。图纸叫版图，交货的动作叫流片。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>设计与生产分家<\/h3>\n<p>半导体行业分工很细：设计归设计，生产归生产。<\/p>\n<p>设计公司只做研发，工具是计算机和 EDA，人员是工程师，没有产线没有工人——这叫无晶圆厂 IC 设计公司（Fabless）。龙芯中科就是这一类：它设计 CPU，然后下单买生产服务，厂商按期交货。<\/p>\n<p>生产端是晶圆代工厂，工作包括生产晶圆、流片、封装、测试，这四件事还可能再拆给不同公司做。<\/p>\n<h3>从代码到版图<\/h3>\n<p>前端工程师用 Verilog 写电路，EDA 的逻辑综合转成门级网表；物理设计工程师拿网表做布局布线，定下每个晶体管的位置，产出交付给厂商的版图文件，行业里叫 GDS2。<\/p>\n<p>GDS2 很大，要装下整颗芯片所有晶体管、金属连线、层间连接关系。早年这些东西存在磁带上交给工厂。磁带是流式介质，只能从头顺到尾读，所以&quot;把 GDS2 交给工厂&quot;这个动作叫 tapeout，中文译成&quot;流片&quot;。现在早走网络了，词还留着。<\/p>\n<h3>为什么设计者要&quot;上知天文下知地理&quot;<\/h3>\n<p>&quot;上知天文&quot;是懂上层：操作系统、编译器、应用生态。CPU 是给软件当平台的，不懂软件需求就是闭门造车。<\/p>\n<p>&quot;下知地理&quot;是懂下层：电路逻辑、半导体工艺、材料。虽然日常只用 Verilog 抽象描述，但要把面积、速度、功耗榨到极限，必须懂工艺，还得常跟厂商沟通。<\/p>\n<p>龙芯团队有个现象：很多优秀工程师有跨行转岗经历。做应用转做操作系统，能从产品角度设计界面；有 Java 经验的人做虚拟机，更懂程序员的痛点；学物理数学的人做物理设计，更能理解纳米尺度下晶体管的行为。<\/p>\n<h3>纳米工艺到底指什么<\/h3>\n<p>专业定义是栅极沟道的最小宽度。晶体管三个引脚，导通时电流从源极流到漏极，中间的栅极像水龙头闸门，控制通断。栅极的最小宽度，就是&quot;多少纳米&quot;那个数。<\/p>\n<p>网上常说是&quot;两个晶体管间距&quot;或&quot;晶体管本身大小&quot;，都不准确——那两个尺寸都比栅极宽度大。<\/p>\n<p>栅极越窄，电流损耗越小、导通时间越短，功耗降、频率升。所以先进工艺先用在 CPU 上：1978 年 8086 是 3μm，2006 年 Core 是 65nm，2016 年 Kaby Lake 是 14nm，2020 年苹果 A14 到 5nm。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  V[Verilog 源码] --&gt;|逻辑综合| N[门级网表]\n  N --&gt;|布局布线| G[GDS2 版图]\n  G --&gt;|tapeout 流片| F[晶圆代工厂]\n  F --&gt; W[晶圆]\n  W --&gt; P[封装测试]\n  P --&gt; C[芯片成品]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：左半边是设计公司的事，右半边是代工厂的事，中间那道&quot;流片&quot;就是交接点。设计改一版几乎不花钱，流片改一版要上千万，所以两边必须提前对齐。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：设计公司像建筑事务所，出施工图；代工厂像施工队，按图盖楼。图纸错一寸，楼盖歪一层。失效边界：盖楼还能返工，流片失败的晶圆只能报废，钱和时间都回不来。\n<\/li><li>\n实例：28nm 一次流片上千万。小公司烧不起，所以有了 FPGA 验证和模拟器这两条省钱路径（见第 28 章）。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为设计公司&quot;没有工厂&quot;就等于技术弱。Fabless 是主流模式，台积电的客户几乎全是这一类。\n<\/li><li>\n别以为纳米数越小晶体管就一定越快。还要看结构、电压、封装与设计。\n<\/li><li>\n别以为流片是&quot;试一次&quot;。它指整套把版图交给工厂投产的流程，一次投产就是一批晶圆。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\nFabless 指的是？｜只做设计、没有生产线的芯片公司｜只做生产的代工厂｜既设计又生产的公司｜答案：A｜解析：Fabless 即无晶圆厂设计公司。\n<\/li><li>\n&quot;流片&quot;一词来源于？｜磁带（tape）作为交付介质｜流水线生产｜胶片拍摄｜答案：A｜解析：tapeout 源自磁带顺序存储的特性。\n<\/li><li>\n纳米工艺的专业定义是？｜栅极沟道的最小宽度｜两个晶体管的间距｜晶体管整体尺寸｜答案：A｜解析：其余两种说法是传播中的讹误。\n<\/li><li>\n交付给流片厂的文件通称？｜GDS2 版图文件｜Verilog 源码｜网表｜答案：A｜解析：版图是物理设计的最终成果。\n<\/ol>\n<h2>抽认卡<\/h2>\n<ul><li>\nFabless 的含义？｜无晶圆厂，只设计不生产\n<\/li><li>\n版图的行业文件格式？｜GDS2\n<\/li><li>\ntapeout 为什么译成&quot;流片&quot;？｜早年用磁带顺序交付 GDS2\n<\/li><li>\n&quot;上知天文&quot;指什么？｜懂操作系统、编译器与应用生态\n<\/li><li>\n&quot;下知地理&quot;指什么？｜懂电路逻辑、半导体工艺与材料\n<\/li><li>\n纳米工艺影响什么？｜功耗与工作频率\n<\/ul>\n<h2>术语<\/h2>\n<ul><li>\nFabless：无晶圆厂 IC 设计公司\n<\/li><li>\n晶圆代工：专门为设计公司制造芯片的商业模式\n<\/li><li>\n版图（GDS2）：含全部晶体管与连线的物理设计文件\n<\/li><li>\n流片（tapeout）：把版图交付工厂投产的过程\n<\/li><li>\n栅极：控制源漏之间通断的晶体管引脚\n<\/li><li>\n纳米工艺：以栅极沟道最小宽度标称的工艺节点\n<\/ul>\n<h2>复习锚点<\/h2>\n<ul><li>\n设计出图，代工出片，交接叫流片\n<\/li><li>\n纳米数是栅极宽度，不是晶体管大小\n<\/li><li>\n上层懂软件，下层懂工艺\n<\/ul>", "ch25": "<h1>第 25 章：从沙子到晶圆<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>学时<\/strong>：0.7 小时 | <strong>前置<\/strong>：第 24 章\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明硅为什么成为芯片首选材料\n<\/li><li>\n能按顺序复述晶圆制造的主要步骤\n<\/li><li>\n能用&quot;生长、挖掉、掺杂&quot;三种手法概括所有工序\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>芯片的原料是沙子。把它提纯、切片、一层层刻蚀掺杂，三个月后它变成一颗会算数的东西。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>为什么是硅<\/h3>\n<p>地壳里氧占 48.60%，硅占 26.30%，储量充足，不会像石油稀土那样卡脖子。<\/p>\n<p>硅是合适的半导体：常温下导电性介于导体与绝缘体之间。纯硅接近绝缘体，掺进某些杂质就能导电，还能靠杂质浓度调节导电强弱。于是一块硅上可以做出绝缘区和导电区，这就是&quot;半导体芯片&quot;的底子。<\/p>\n<p>沙子的主要成分是二氧化硅，岩石风化后成沙——所以这条路被叫作&quot;从沙子变成芯片之旅&quot;。<\/p>\n<h3>主要工序<\/h3>\n<p>熔炼：二氧化硅脱氧、多步净化，得到电子级硅（EGS），平均每一百万个硅原子最多一个杂质原子。熔炼出的圆柱形大晶体叫硅锭，约 100kg，纯度 99.9999%。<\/p>\n<p>切片：硅锭横向切成圆片，每片叫晶圆。<\/p>\n<p>光刻：晶圆上涂光刻胶，盖一层玻璃掩膜版——有电路的地方透光，没有的不透。紫外光透过掩膜照到胶上，被照到的胶性质改变；再用特殊溶液清洗，电路部分对应的胶被溶掉。<\/p>\n<p>离子注入：对着晶圆打高速金属离子束，离子打进没有被胶保护的区域，掺够了这块硅就能导电。完成后去掉多余的胶。<\/p>\n<p>蚀刻：用同样的光刻思路，把不需要去除的位置用胶盖住，再用酸液洗，露出的硅被溶出凹槽，槽里好铺金属。<\/p>\n<p>多层布线：一层加工完，铺绝缘材料，再加工下一层。复杂芯片有很多层。<\/p>\n<p>切割：把晶圆切成一个个小片，每片含一颗 CPU 的完整电路，这一片叫 die（内核）。<\/p>\n<p>封装：die 放到衬底上，下面是连主板的焊点，上面盖金属散热片，衬底加散热片保护 die，合成最终芯片。<\/p>\n<p>测试：检验、淘汰次品、合格品装箱发货。<\/p>\n<h3>三种手法概括一切<\/h3>\n<p>生长：往上堆材料，由少变多，比如绝缘层和金属线。 挖掉：去掉材料，由多变少，比如蚀刻凹槽。 掺杂：渗进材料改变性质，比如离子注入。<\/p>\n<p>每一种手法都靠光刻和掩膜版遮住不该加工的部分。所以工序是反复循环：涂胶、盖掩膜、曝光、溶胶、加工、洗胶。<\/p>\n<p>层数越多，生产越久。高性能 CPU 有 40 层电路，按每层平均 1.6 天算，光造晶圆就要 64 天；加上前期准备和后段封装测试，整颗芯片通常要 3 个月以上。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  SAND[沙子 / 二氧化硅] --&gt;|熔炼提纯| ING[硅锭 99.9999%]\n  ING --&gt;|切片| WAF[晶圆]\n  WAF --&gt;|光刻 + 注入 + 蚀刻| LAY[逐层电路]\n  LAY --&gt;|切割| DIE[晶片 die]\n  DIE --&gt;|封装 + 测试| CHIP[芯片]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：从左到右是一条&quot;纯度越来越高、结构越来越细&quot;的路。注意中间是循环——不是一次光刻就完事，而是几十层反复做，这才是三个月工期的主因。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：像做多层套色版画。每印一层颜色要先刻一块版（掩膜），用纸挡住不该印的地方，再上色（注入或蚀刻），一层层叠出完整图案。失效边界：版画错了可以重印，晶圆错一层，整批报废。\n<\/li><li>\n实例：电子级硅要求每一百万个原子最多一个杂质。这个纯度比日常所说的&quot;99.9%&quot;高出好几个数量级，提纯本身就是巨大的能耗与工艺挑战。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为芯片是&quot;刻出来的&quot;。它是靠光刻定义图形，再靠注入和蚀刻改变材料，本质是加法与减法混用。\n<\/li><li>\n别以为封装只是&quot;装个壳&quot;。它决定引脚数、散热、可靠性和成本，高端封装能比晶片本身还贵。\n<\/li><li>\n别以为晶圆越大越省。大晶圆能切更多 die，但对工艺均匀性要求更高。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n硅在地壳中的含量约为？｜26.3%｜2.6%｜63%｜答案：A｜解析：仅次于氧的 48.60%。\n<\/li><li>\n光刻中起&quot;模板&quot;作用的是？｜带电路图形的掩膜版｜光刻胶｜酸液｜答案：A｜解析：掩膜版决定哪些区域被光照到。\n<\/li><li>\n下列哪项属于&quot;掺杂&quot;？｜离子注入｜蚀刻凹槽｜铺设绝缘层｜答案：A｜解析：掺杂是改变材料性质，注入金属离子正是此类。\n<\/li><li>\n40 层电路、每层 1.6 天，仅晶圆生产约需？｜64 天｜40 天｜16 天｜答案：A｜解析：40×1.6=64 天。\n<\/ol>\n<h2>抽认卡<\/h2>\n<ul><li>\n电子级硅的纯度？｜99.9999%，百万原子最多一个杂质\n<\/li><li>\n硅锭的典型质量？｜约 100kg\n<\/li><li>\n光刻的四步？｜涂胶、盖掩膜、曝光、溶胶\n<\/li><li>\n芯片制造的三种基本手法？｜生长、挖掉、掺杂\n<\/li><li>\ndie 是什么？｜切割后含一颗芯片完整电路的小片\n<\/li><li>\n一颗芯片的生产周期？｜通常 3 个月以上\n<\/ul>\n<h2>术语<\/h2>\n<ul><li>\n电子级硅（EGS）：可用于半导体制造的高纯度硅\n<\/li><li>\n硅锭：熔炼拉制成的圆柱形硅晶体\n<\/li><li>\n晶圆：由硅锭切出的圆形硅片\n<\/li><li>\n光刻胶：受光照后性质改变、用于定义图形的涂层\n<\/li><li>\n掩膜版：带电路图形的透光模板\n<\/li><li>\n离子注入：把杂质离子打入硅中以改变导电性\n<\/li><li>\n蚀刻：用化学方式去除指定区域材料的工艺\n<\/li><li>\ndie：晶圆切割后含完整电路的单颗晶片\n<\/ul>\n<h2>复习锚点<\/h2>\n<ul><li>\n沙子→硅锭→晶圆→die→芯片\n<\/li><li>\n一切工序归为生长、挖掉、掺杂\n<\/li><li>\n几十层循环，三个月起步\n<\/ul>", "ch26": "<h1>第 26 章：模拟与数字元器件——世界只有几种积木<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>学时<\/strong>：0.7 小时 | <strong>前置<\/strong>：第 13 章\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说出模拟电路六大基础器件与各自的用途\n<\/li><li>\n能用 PN 结解释二极管的单向导电\n<\/li><li>\n能说明 CMOS 反相器如何由一对互补晶体管构成\n<\/li><li>\n能区分组合电路与时序电路\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>无论多复杂的电路，积木只有不到十种。复杂来自组合方式，不来自零件数量。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>三小弟：电阻、电容、电感<\/h3>\n<p>电阻限制电流，单位关系就是欧姆定律：电流 = 电压 ÷ 电阻。芯片里常用多晶硅做电阻，靠控制薄层厚度调阻值，也可以掺杂来增大单位厚度上的电阻。<\/p>\n<p>电容存电荷，两块导体夹一层绝缘介质就是电容，能&quot;通交流、阻直流&quot;，可用来滤噪声。芯片里用金属做，上下两片金属层相对，调面积和间距改容值，还能叠多层省面积。<\/p>\n<p>电感把电能变成磁能存起来，一组线圈就是电感，&quot;通直流、阻交流&quot;，可限制某类频率通过。芯片里把金属走成螺旋形，调长度和圈数改感值。<\/p>\n<p>电容电感是非线性元件，电压电流关系要用指数方程甚至微分方程描述，这是大学&quot;电路分析&quot;课的核心内容。三者合起来叫 RLC 电路，能做出振荡器、滤波器等。<\/p>\n<h3>单向开关：二极管<\/h3>\n<p>二极管只许电流一个方向走。阳极电压高于阴极就导通，反之截止。<\/p>\n<p>芯片里用 PN 结实现。纯硅是四价，原子间共用电子，整体电中性。掺三价元素（铝、镓、硼、铟）成 P 型，共价键缺一个电子，形成空穴；掺五价元素（磷、砷、锑）成 N 型，多出一个自由电子。<\/p>\n<p>正向加压，电子从 N 区往 P 区跑，形成电流；反向加压，电子被拉到 N 区边缘，P 区没有自由电子，电流为零。这就是&quot;单向开关&quot;。<\/p>\n<h3>水龙头：场效应管<\/h3>\n<p>FET 是三端器件：源极、漏极负责传电流，栅极用电场控制通断。<\/p>\n<p>MOS 结构是最常见的一种：源、漏各接一块 N 型半导体，两块都嵌在 P 型里，栅极隔着极薄的二氧化硅绝缘层压在两块 N 型之间的沟道上。<\/p>\n<p>栅极无电压：两块 N 型之间夹着 P 型，相当于两个背靠背的 PN 结，一定挡住电流。 栅极正电压：电场把 P 区少量自由电子吸到沟道，电子浓度升高、电阻下降；电压够大就形成 N 型薄层通路，导通。 栅极负电压：电子被排斥，原位形成空穴，绝缘性增强，电流为零。<\/p>\n<p>FET 靠电压控制，三极管靠电流控制；FET 响应更快、功耗更低，所以芯片里几乎都用 FET。<\/p>\n<p>模拟电路的基本器件就这六种：电阻、电容、电感、二极管、三极管、FET。搭上多层金属连线，能处理任何用微分方程描述的连续信号。<\/p>\n<h3>数字那边：CMOS 反相器<\/h3>\n<p>数字信号是离散的，由模拟信号采样、量化、编码而来。数字电路的器件仍建立在模拟器件上：MOS 管栅极电压高低，天然对应 0 和 1。<\/p>\n<p>CMOS 比 MOS 多一个&quot;C&quot;，互补：一对沟道相反的 MOS 管并联。N 管和 P 管共享栅极作输入，漏极相连作输出。<\/p>\n<p>输入高电平：N 管导通、P 管截止，输出低。 输入低电平：N 管截止、P 管导通，输出高。<\/p>\n<p>这就是非门，也是几乎所有数字集成电路的核心单元。用 P 管 N 管的不同组合，能做出与门、或门、与非门。布尔代数保证：这些门能搭出任何二进制运算。<\/p>\n<h3>两种数字电路<\/h3>\n<p>组合电路：输出只由输入决定，不带记忆。运算器、译码器属于这类。 时序电路：带记忆，输出还取决于内部状态。寄存器、发射队列、Cache、TLB 属于这类。<\/p>\n<h3>积木为什么这么少<\/h3>\n<p>模拟六种、数字四五种，却能撑起整个信息社会。这跟自然界很像：已发现的化学元素 118 种，牛顿用三条定律解释星球运行，欧氏几何从五条公设推演出庞大体系。<\/p>\n<p>&quot;复杂世界由少量积木搭成&quot;这个哲学猜想，被科学一次次印证。学 CPU 的人手里的积木，就是 CMOS 晶体管。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  R[电阻] --&gt; A[模拟电路]\n  C[电容] --&gt; A\n  L[电感] --&gt; A\n  D[二极管 PN 结] --&gt; A\n  F[FET / MOS] --&gt; A\n  F --&gt; N[CMOS 反相器&lt;br/&gt;非门]\n  N --&gt; G[与 / 或 / 与非]\n  G --&gt; DIG[组合电路 + 时序电路]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：上面一支是模拟世界，下面一支从同一个 MOS 管长成数字世界。两支的交点就是那颗晶体管——它是整个分叉的起点。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：积木像乐高。基础砖只有几种形状，搭出来的城堡可以无限复杂。失效边界：乐高可以拆了重搭，芯片的&quot;搭&quot;是在硅片上长出来的，改一次要重新流片。\n<\/li><li>\n实例：PN 结正向导通压降约 0.7V（硅管），这个数值在电源设计里到处出现。它不是理想开关，是有代价的开关。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为数字电路和模拟电路是两套东西。数字电路建在模拟器件之上，只是把连续量当离散用。\n<\/li><li>\n别以为二极管只是&quot;单向阀&quot;。它还有压降、反向击穿等特性，实际电路要算。\n<\/li><li>\n别以为门电路种类越多越好。基础门少，组合方式多，才是可扩展的关键。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n电容在电路中的典型作用是？｜存储电荷、通交流阻直流｜限制电流｜把电能变磁能｜答案：A｜解析：电容隔直通交，可滤波。\n<\/li><li>\nP 型半导体的形成方式是？｜纯硅掺三价元素，形成空穴｜掺五价元素，多出电子｜纯硅不加杂质｜答案：A｜解析：三价元素缺电子，形成空穴。\n<\/li><li>\nCMOS 反相器中输入高电平时？｜N 管导通、P 管截止，输出低｜两管都导通｜两管都截止｜答案：A｜解析：互补结构保证输出与输入相反。\n<\/li><li>\n下列属于时序电路的是？｜寄存器｜译码器｜加法器｜答案：A｜解析：寄存器带记忆，输出与内部状态有关。\n<\/ol>\n<h2>抽认卡<\/h2>\n<ul><li>\n模拟电路六大基础器件？｜电阻、电容、电感、二极管、三极管、FET\n<\/li><li>\n电阻的材料与调值方式？｜多晶硅薄层，靠厚度与掺杂调节\n<\/li><li>\nPN 结正向导通的条件？｜P 区电压高于 N 区（阳极高于阴极）\n<\/li><li>\nFET 与三极管的控制方式？｜FET 靠电压，三极管靠电流\n<\/li><li>\nCMOS 的&quot;C&quot;是什么意思？｜互补，一对沟道相反的 MOS 管\n<\/li><li>\n组合电路与时序电路的区别？｜输出是否依赖内部存储状态\n<\/ul>\n<h2>术语<\/h2>\n<ul><li>\n电阻：限制电流的元件\n<\/li><li>\n电容：存储电荷的元件，通交流阻直流\n<\/li><li>\n电感：把电能转为磁能存储的元件\n<\/li><li>\nPN 结：P 型与 N 型半导体交界形成的单向导电结构\n<\/li><li>\nFET：场效应管，以电场控制通断的三端器件\n<\/li><li>\nCMOS：互补金属氧化物半导体，由互补 MOS 管构成的工艺\n<\/li><li>\n反相器：输出与输入相反的电路，数字电路基本单元\n<\/li><li>\n时序电路：带记忆、输出依赖内部状态的数字电路\n<\/ul>\n<h2>复习锚点<\/h2>\n<ul><li>\n电阻限流、电容存电荷、电感存磁能\n<\/li><li>\nPN 结给单向，MOS 管给开关\n<\/li><li>\n一对互补管 = 非门 = 所有数字电路起点\n<\/ul>", "ch27": "<h1>第 27 章：版图、制造设备与成本<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>学时<\/strong>：0.6 小时 | <strong>前置<\/strong>：第 24、25 章\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明版图里有什么、单元库有什么用\n<\/li><li>\n能说出光刻机与晶圆代工的产业格局\n<\/li><li>\n能拆开 CPU 成本的三项构成，并解释成品率与销量的影响\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>版图是设计的终点、制造的起点。它由色块叠成，靠光刻机印出来，最后由成本公式定价。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>版图：看见平面，想到立体<\/h3>\n<p>版图包含芯片中所有 CMOS 管的布局与布线，是物理设计的成果，也是交付流片厂的材料。<\/p>\n<p>在 EDA 里做版图是&quot;所见即所得&quot;：不同材料用不同颜色，N 型、P 型、栅极多晶硅、接触孔、金属层各一块色块，上下层叠，从顶视图看是多种颜色的矩形叠在一起。所以版图设计者要有的基本功是&quot;看到平面图，想到三维结构&quot;。<\/p>\n<p>设计好的器件可以进单元库，下次直接调用，不必重复设计。单元库来源有三种：EDA 自带、流片厂提供、第三方商业库。<\/p>\n<p>EDA 还能按设计规则自动检查：门电路位置关系、布线时序、多层连通性。这套自动检查能消掉不少人为错误。<\/p>\n<p>版图也是作品。龙芯 1 号推出时正逢夏培肃院士从教 50 周年，设计者在每一层金属上都留了&quot;夏 50&quot;的标记，把纪念刻进了硅里。<\/p>\n<h3>设备与代工格局<\/h3>\n<p>芯片设备十几种：硅单晶炉、气相外延炉、氧化炉、磁控溅射台、化学机械抛光机、光刻机、离子注入机、引线键合机、晶圆划片机、晶圆减薄机等。<\/p>\n<p>光刻机最难，被叫作&quot;工业皇冠上的明珠&quot;。荷兰 ASML 的 TWINSCAN 系列占全球约 80% 份额，Intel、台积电、三星都得向它买；最先进的每台超过 10 亿美元，一年只卖几百台。尼康靠低价抢市场（同类不到 ASML 一半），佳能基本退出高端。中国上海微电子（SMEE）做出了 90nm 光刻机，还在往上攻。低端光刻机在电商上约 500 万元一台，硅单晶炉不到 100 万元。<\/p>\n<p>代工端：台积电超过 50% 份额，三星约 20%，格罗方德约 10%（2009 年从 AMD 剥离）。其余小于 10% 的有联电、中芯国际、高塔、华虹等。华虹旗下上海华力能做 12 英寸、22nm。<\/p>\n<p>封测端：日月光、安靠、长电科技、矽品、力成、华天科技、通富微电等。长电、华天、通富被称为&quot;中国大陆封测三强&quot;。<\/p>\n<p>产业链三段，难度从高到低是制造、设计、封测。代工厂和封测厂只做 To B，不直接面对消费者，在上游&quot;闷声发大财&quot;。<\/p>\n<h3>成本怎么算<\/h3>\n<p>制造侧三块：晶片成本、测试成本、封装成本。<\/p>\n<p>晶片成本与面积成正比——面积越小，一片晶圆能切出越多 die。 测试成本与占用测试平台的时间成正比——测试向量要少而覆盖率高，既省时间又不漏检。 封装成本与引脚数、材料有关，功耗越高越贵；高端芯片的封装成本甚至超过晶片本身。<\/p>\n<p>总成本与成品率成反比。成品率是去除次品后良品的比例。杂质超标、设备老化、引脚畸变，都会拉低成品率。<\/p>\n<p>售价还受销量影响：卖得越多，设计费、人力这些一次性成本摊得越薄，所以新片上市贵、越卖越便宜。<\/p>\n<p>还有一层商业逻辑：用低端保护高端。Intel 的赛扬、奔腾卖三四百元，利润极薄甚至不赚钱，目的是把市场门槛压死——后来者想在高端超过它极难，想靠杀低价又很难比赛扬更便宜。两头都有护城河，高端至强、酷睿才能卖高价。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  GDS[GDS2 版图] --&gt;|光刻机等设备| FAB[晶圆代工]\n  FAB --&gt; WAFER[晶圆]\n  WAFER --&gt;|切割| DIE[die]\n  DIE --&gt;|封装测试| CHIP[芯片]\n  COST[成本 = 晶片 + 测试 + 封装&lt;br/&gt;÷ 成品率] --&gt; PRICE[售价]\n  CHIP --&gt; PRICE<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：上半段是物理流程，下半段是商业公式。注意成本那格底下是&quot;除以成品率&quot;——成品率每掉一成，单位成本就往上跳一截。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：版图像印刷厂的制版，光刻机像印刷机，代工厂像印厂，封测像装订。印得越细，机器越贵；印坏一张，整批纸都废。失效边界：印刷可以补印，晶圆不能单片补做，只能整批重来。\n<\/li><li>\n实例：同一片 12 英寸晶圆，die 面积减半，能切出的颗数大致翻倍，单颗晶片成本接近减半。这就是为什么厂商拼命把面积做小——不只是省材料，是乘法级的成本差。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为版图只是&quot;图&quot;。它包含每一层的几何与连接关系，是工厂照着做的唯一依据。\n<\/li><li>\n别以为设备只影响产量。工艺精度直接决定能不能做出更小的栅极。\n<\/li><li>\n别以为便宜芯片不赚钱就没意义。它常常是市场门槛的一部分。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n版图设计者的基本功是？｜看到平面图能想到三维结构｜会写 Verilog｜会焊板子｜答案：A｜解析：多层色块叠放，必须脑内还原立体。\n<\/li><li>\n全球光刻机市场份额最高的是？｜ASML｜尼康｜佳能｜答案：A｜解析：约 80% 份额。\n<\/li><li>\n晶片成本与什么成正比？｜晶片面积｜引脚数量｜测试时间｜答案：A｜解析：面积越小，一片晶圆切出的 die 越多。\n<\/li><li>\nCPU 总成本与成品率的关系是？｜成反比｜成正比｜无关｜答案：A｜解析：成品率越低，摊到良品上的成本越高。\n<\/ol>\n<h2>抽认卡<\/h2>\n<ul><li>\n版图交付的文件格式？｜GDS2\n<\/li><li>\n单元库的三种来源？｜EDA 自带、流片厂提供、第三方商业库\n<\/li><li>\n光刻机的产业地位？｜工业皇冠上的明珠，ASML 占约 80%\n<\/li><li>\n代工三强份额？｜台积电 &gt;50%、三星约 20%、格方约 10%\n<\/li><li>\n制造成本三构成？｜晶片、测试、封装\n<\/li><li>\n&quot;低端保护高端&quot;指什么？｜用极低价低端产品封死后来者的价格空间\n<\/ul>\n<h2>术语<\/h2>\n<ul><li>\n版图：含各层材料图形与连接关系的物理设计成果\n<\/li><li>\n单元库：可复用的标准电路模块集合\n<\/li><li>\n光刻机：把掩膜图形投影到晶圆上的核心设备\n<\/li><li>\n代工厂：为设计公司提供晶圆制造服务的企业\n<\/li><li>\n成品率：扣除次品后良品所占比例\n<\/li><li>\n测试向量：用于检验芯片功能的测试输入集合\n<\/ul>\n<h2>复习锚点<\/h2>\n<ul><li>\n版图是设计的终点、制造的起点\n<\/li><li>\n设备决定精度，代工决定产能\n<\/li><li>\n成本 = （晶片+测试+封装）/ 成品率\n<\/ul>", "ch28": "<h1>第 28 章：不流片也能做 CPU——FPGA 与模拟器<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>学时<\/strong>：0.5 小时 | <strong>前置<\/strong>：第 24 章\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明 FPGA 为什么能&quot;烧写&quot;成 CPU\n<\/li><li>\n能比较 FPGA、模拟器、流片三种验证方式的速度与成本\n<\/li><li>\n能说出 SOI 与 FinFET 各解决了什么问题\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>想验证 CPU，不一定要花上千万流片。FPGA 是租来的硬件，模拟器是免费的软件，代价都是慢。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>FPGA：一次购买，反复烧写<\/h3>\n<p>28nm 一次流片要上千万，只有商业公司扛得住。学 CPU 的人需要一条便宜路。<\/p>\n<p>FPGA（现场可编程逻辑门阵列）是一种可以定制功能的电路。把 Verilog 设计通过配套工具转成网表，从电脑传进 FPGA，电路功能就和设计一致了。买一次板子，可以反复烧写。<\/p>\n<p>所以 FPGA 是流片前不可缺少的实验平台，专业公司会大量采购。&quot;在 FPGA 上把 CPU 跑通&quot;是前端设计的重要里程碑，很多 CPU 教材也拿它做演示平台。<\/p>\n<p>缺点只有一个：慢。龙芯 3A4000 真芯片能跑 2.0GHz，在 FPGA 上最高只能到 50MHz，同一套测试集运行时间长约 40 倍，所以只能跑小规模测试。<\/p>\n<h3>模拟器：纯软件，几乎零成本<\/h3>\n<p>模拟器用软件模拟硬件功能，可以直接用 Java、C/C++、Python 写。相比 Verilog，这些语言描述能力更强，同样篇幅能表达更丰富的行为，实现更快，出问题也更好调试。<\/p>\n<p>有的模拟器只模拟 CPU，有的连主板外设一起模拟，相当于模拟一整台计算机，后者也叫虚拟机。<\/p>\n<p>开源项目里，龙芯团队早期用 GXemul（支持龙芯 2E，发过论文，后来没再维护），2010 年后主要用 qemu——它不只支持龙芯 2 号、3 号，还能模拟 x86、ARM 等十多种指令集，龙芯团队至今在维护并向上游提交代码。<\/p>\n<p>三者的定位很清楚：流片是真硬件、最贵最真；FPGA 是软硬结合、要买板子、慢 40 倍；模拟器是纯软件、近乎免费、更慢但好调试。<\/p>\n<h3>明天的工艺：SOI 与 FinFET<\/h3>\n<p>CMOS 沟道宽度低于 22nm 时性能严重劣化：栅极下的氧化层太薄，源漏之间漏电，静态功耗上升，甚至无法正确区分 0 和 1，成品率和可靠性都掉。<\/p>\n<p>两种改法。SOI（绝缘体上硅）：在衬底上加一层超薄埋氧层，沟道用很薄的硅膜做，埋氧层挡住电子从源流向漏，大幅减少漏电流。传统 CMOS 因此被称为体硅。SOI 2000 年发布，2010 年后商用成熟，主要代工厂陆续从体硅转向 SOI。<\/p>\n<p>FinFET（鳍式场效应晶体管）：把栅极做成 3D，从上、左、右三面包住沟道，像鱼鳍。三面控制让开关更利落，漏电更少，沟道还能更短。<\/p>\n<p>这两项让&quot;CMOS 极限是 10nm&quot;的预测落空，发明人都是胡正明（曾任台积电 CTO、伯克利教授）。<\/p>\n<p>到 5nm，SOI 和 FinFET 也逼近物理极限。三星推出全环绕栅极（GAA）晶体管，宣称可取代 FinFET；Intel 表示 5nm 放弃 FinFET 转 GAA。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  V[Verilog 设计] --&gt;|烧写| FPGA[FPGA&lt;br/&gt;50MHz，慢 40 倍]\n  V --&gt;|编译| SIM[模拟器&lt;br/&gt;纯软件，最慢但好调]\n  V --&gt;|流片| CHIP[真芯片&lt;br/&gt;2GHz，上千万]\n  CMOS[体硅 CMOS] --&gt; SOI[SOI&lt;br/&gt;加埋氧层]\n  CMOS --&gt; FIN[FinFET&lt;br/&gt;三面栅极]\n  FIN --&gt; GAA[GAA&lt;br/&gt;全环绕]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：上面三条是&quot;验证手段&quot;的三档选择，成本越高越接近真实；下面一条是&quot;工艺演进&quot;的路径，每一步都在解决漏电。两组东西解决的是不同问题，别混着看。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：流片像开模注塑，模具贵但产品真；FPGA 像可反复擦写的白板，便宜但写得慢；模拟器像在纸上推演，最便宜也最慢。失效边界：白板擦不掉的物理时序问题，只有真芯片才暴露。\n<\/li><li>\n实例：龙芯 3A4000 在 FPGA 上 50MHz 跑测试集，时间是真芯片的 40 倍。所以 FPGA 上只跑功能验证的小测试集，性能评估还得靠真片或模拟器统计。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 FPGA 只是&quot;开发板&quot;。它是流片前的必经验证环节。\n<\/li><li>\n别以为模拟器不靠谱。功能验证阶段，模拟器能跑完整启动流程，还能看到每条指令。\n<\/li><li>\n别以为工艺到 5nm 就到头了。GAA 已经在接棒，只是难度和成本都在飙升。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\nFPGA 相对流片的最大优势是？｜一次购买、反复烧写，成本低｜速度更快｜不需要设计｜答案：A｜解析：省掉上千万流片费。\n<\/li><li>\n龙芯 3A4000 在 FPGA 上的最高主频约为？｜50MHz｜2GHz｜500MHz｜答案：A｜解析：真片 2.0GHz，FPGA 上只有 50MHz。\n<\/li><li>\nSOI 解决的核心问题是？｜漏电流｜主频太低｜引脚太少｜答案：A｜解析：埋氧层阻挡源漏间漏电。\n<\/li><li>\nFinFET 的栅极结构是？｜三面包围沟道的 3D 结构｜平面结构｜四面环绕｜答案：A｜解析：像鱼鳍，三面控制。\n<\/ol>\n<h2>抽认卡<\/h2>\n<ul><li>\nFPGA 的全称？｜现场可编程逻辑门阵列\n<\/li><li>\n在 FPGA 上跑通 CPU 意味着什么？｜前端设计达到重要里程碑\n<\/li><li>\n龙芯团队现在主用的模拟器？｜qemu\n<\/li><li>\nSOI 的关键结构？｜衬底上的超薄埋氧层\n<\/li><li>\nFinFET 与 GAA 的发明人？｜胡正明\n<\/li><li>\nGAA 的含义？｜全环绕栅极晶体管\n<\/ul>\n<h2>术语<\/h2>\n<ul><li>\nFPGA：可反复编程配置的电路器件\n<\/li><li>\n模拟器：用软件模拟硬件行为的程序\n<\/li><li>\n流片：把版图交付工厂投产\n<\/li><li>\nSOI：绝缘体上硅，以埋氧层抑制漏电的工艺\n<\/li><li>\nFinFET：栅极三面包围沟道的 3D 晶体管\n<\/li><li>\nGAA：全环绕栅极晶体管，FinFET 的后继结构\n<\/ul>\n<h2>复习锚点<\/h2>\n<ul><li>\n验证三档：流片最真、FPGA 居中、模拟器最省\n<\/li><li>\n省钱的代价都是速度\n<\/li><li>\n工艺演进的主线是&quot;把漏电关住&quot;\n<\/ul>", "ch29": "<h1>第 29 章：从上古到战国——CPU 家族简史<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>学时<\/strong>：0.6 小时 | <strong>前置<\/strong>：第 4 章\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能定义 CPU 的&quot;上古时代&quot;与&quot;战国时代&quot;\n<\/li><li>\n能举出四款 20 世纪 70 年代的经典 8 位处理器\n<\/li><li>\n能说出几个曾经辉煌、如今退场的 CPU 品牌及其原因\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>1971 年之前，CPU 只是整机的一部分；1971 年之后，CPU 成了有型号、有品牌的独立商品。这条分界线是 Intel 4004。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>上古：有实无名<\/h3>\n<p>1971 年 Intel 4004 发布之前，CPU 由计算机厂商自己设计自己用，不作为商品销售，也没有专属品牌。所有 CPU 厂商同时都是计算机制造商。<\/p>\n<p>那时一台大型机的 CPU 可能占一个机柜，甚至一个机房。举几个标本：<\/p>\n<p>1951 年 Ferranti Mark 1，4050 个电子管，CPU 主频 100kHz，20 位字长，主存 512B，约 50 条指令，占两个 5m×2.7m 的机柜，功率 25kW。<\/p>\n<p>1959 年 DEC 的 PDP-1，提出&quot;交互式计算机&quot;，把人机交互部分收进一张桌子（显示器、键盘、光笔、打印机），这部分叫终端；主机仍占 2m² 机柜。CPU 主频 5MHz，18 位字长，内存 9KB，加减法 10ms，乘法 20ms。<\/p>\n<p>1961 年 SAGE，史上最大最重最贵的计算机，6 万个电子管，占地 2000m²，CPU 机柜就有 15m×45m，每秒 75000 条指令，造价 120 亿美元，用于防空监测，一直跑到 1983 年。<\/p>\n<p>1964 年 CDC 6600，第一台商用超算，被认为最早采用 RISC 思路（术语还没出现），内存约 65kB，60 位字长。Pascal 语言就是在它上面开发的。设计者西摩·克雷后来做了 Cray-1（1976 年，64 位，80MHz，支持向量指令，1MB 内存）。<\/p>\n<p>1970 年 PDP-11，商业上极成功，16 位小型机，售价 2 万美元，销量超 60 万台，第一个跑 UNIX 的机器，直到 1990 年还在卖。<\/p>\n<h3>战国：百花齐放<\/h3>\n<p>1971 年后，Intel 开创了独立 CPU 厂商的商业模式：专注做 CPU，出系列型号，持续提性能，整机厂买现成的就行。从此人们说&quot;某计算机采用某公司某型号芯片&quot;，CPU 有了身份。<\/p>\n<p>70 年代的&quot;老四强&quot;：Intel 8080、MOS 6502、Motorola MC6800、Zilog Z80。<\/p>\n<p>6502 堪称传奇：Apple I、II、III 都用它（传说第一台苹果机的 6502 是乔布斯亲自开车买回的），史上销量最高的个人计算机 Commodore 64 用它，任天堂 FC、小霸王学习机也用它。<\/p>\n<p>Z80 兼容 8080 并扩展 80 多条指令，能把 CPU、内存、主要 I/O 做在一块板上，是 80 年代工业单板机的主力。<\/p>\n<p>Motorola 的 MC6800 开启 680x 系列，1979 年的 MC68000（16 位）用在早期 Macintosh、Amiga、Atari、Commodore 上，后来&quot;龙珠&quot;系列进入 Palm 等 PDA，最终大部分被 ARM 取代。<\/p>\n<p>80 到 90 年代更热闹：Cyrix 靠低价高能，90 年代与 Intel、AMD 三足鼎立，一度销量超过 Intel，1999 年被威盛收购，衍生出 C3/C5/C7、Nano；DEC 的 Alpha 是 RISC 阵营性能最高的，21164、21264 用不高的工艺跑到很高主频，SMT 最早在这里实现，1998 年被康柏收购后终止；Sun 与 TI 的 SPARC（1987，32 位，16MHz）到 UltraSPARC 占据高端服务器，Java 最早就是在 SPARC 服务器上开发的；MIPS 覆盖服务器、工作站、游戏机、嵌入式，长期是国外计算机教学的示范平台。<\/p>\n<p>大浪淘沙之后，还在活跃的主要是 ARM 与 Power。ARM 在嵌入式、移动计算崛起，建成了唯一能与 x86 平起平坐的第二套生态；IBM 的 Power 守在大型机、服务器，PowerPC 衍生到桌面与嵌入式。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[上古 1940s-1971&lt;br/&gt;CPU 附属于整机] --&gt;|Intel 4004| B[战国 1971-2000&lt;br/&gt;厂商林立]\n  B --&gt; C[收敛&lt;br/&gt;x86 与 ARM 双生态]\n  B --&gt; D[退场&lt;br/&gt;Cyrix / Alpha / SPARC / MIPS]\n  C --&gt; E[Power 守服务器]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：这不是一棵不断分叉的树，而是一次爆发后的大收敛。看这张图要抓的是&quot;为什么收敛&quot;——不是技术最强者胜出，而是生态最稳者胜出。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：上古像家家自己打家具，战国像家具城开张，品牌林立，最后剩下几个大卖场。失效边界：家具城靠渠道，CPU 靠软件生态，后者的黏性强得多。\n<\/li><li>\n实例：一台 1970 年代的 PDP-11 售价 2 万美元、内存 56KB，销量却超过 60 万台。它的成功不在算力，在&quot;便宜 + 能跑 UNIX + 够用&quot;。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为上古 CPU 很弱所以没意义。现代计算机的很多结构（终端、交互、指令系统）都在那时定型。\n<\/li><li>\n别以为退场的品牌都是技术差。Alpha 技术极强，死于公司并购；Cyrix 便宜好用，死于技术迭代跟不上。\n<\/li><li>\n别以为历史只是故事。今天的选择（兼容、开放、生态）都能在这些兴衰里找到依据。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\nCPU&quot;上古时代&quot;结束的标志是？｜1971 年 Intel 4004 发布｜1951 年 Ferranti Mark 1｜1964 年 CDC 6600｜答案：A｜解析：4004 让 CPU 成为独立商品。\n<\/li><li>\n下列哪款不是 70 年代&quot;老四强&quot;？｜Alpha 21264｜Intel 8080｜Zilog Z80｜答案：A｜解析：Alpha 是 90 年代 DEC 的产品。\n<\/li><li>\n苹果早期个人计算机使用过哪些 CPU？｜6502、68000、PowerPC、x86｜只有 x86｜只有 ARM｜答案：A｜解析：四代更替，2003 年才转向 Intel。\n<\/li><li>\nPDP-11 的历史意义之一是？｜第一个运行 UNIX 的计算机｜第一台超算｜第一台 PC｜答案：A｜解析：它也是 PC 时代前销量最大的计算机。\n<\/ol>\n<h2>抽认卡<\/h2>\n<ul><li>\n上古与战国的分界？｜1971 年 Intel 4004\n<\/li><li>\n70 年代四款经典 8 位处理器？｜Intel 8080、MOS 6502、Motorola MC6800、Zilog Z80\n<\/li><li>\n史上销量最高的个人计算机？｜Commodore 64，用 6502\n<\/li><li>\nAlpha 处理器的结局？｜1998 年 DEC 被康柏收购后终止研发\n<\/li><li>\nCyrix 的归宿？｜1999 年被威盛收购\n<\/li><li>\n现存的两大生态？｜x86 与 ARM\n<\/ul>\n<h2>术语<\/h2>\n<ul><li>\n上古时代：CPU 由整机厂自研自用、未独立销售的时期\n<\/li><li>\n战国时代：1971 年后多家 CPU 厂商并存的时期\n<\/li><li>\n终端：与人交互的输入输出设备部分\n<\/li><li>\n单板机：把 CPU、内存、I/O 集成在一块板上的微型计算机\n<\/li><li>\n第二套生态：相对 x86 而言、以 ARM 为核心的软硬件体系\n<\/ul>\n<h2>复习锚点<\/h2>\n<ul><li>\n1971 年是 CPU 独立纪年的起点\n<\/li><li>\n战国百家，最后收敛为 x86 与 ARM\n<\/li><li>\n退场原因多是生态与公司命运，不是单纯技术\n<\/ul>", "ch30": "<h1>第 30 章：巨头寻踪——Intel、AMD、ARM、苹果、IBM<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>学时<\/strong>：0.7 小时 | <strong>前置<\/strong>：第 29 章\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说明 Intel 成功的真正原因不在性能领先\n<\/li><li>\n能说出 AMD 与 Intel 竞争的两大法宝与两次逆转\n<\/li><li>\n能解释 ARM 的授权模式为何能建成第二套生态\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>Intel 赢在生态，不在性能。ARM 赢在开放，不在算力。AMD 赢在敢跟，苹果赢在敢自己来。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>Intel：大一统靠三处兼容<\/h3>\n<p>x86 系列包括 8080、8086、80286、80386、80486，以及奔腾、赛扬、至强、酷睿、凌动，型号加起来几千种。它们指令集兼容，都能跑 DOS、Windows、Linux。<\/p>\n<p>值得注意的是：Intel 的性能长期不是同时代最强的，史上被当作性能标杆的 CPU 很少出自 Intel。它赢在三处向下兼容与标准化：x86 只加指令不改不删；IBM 定义了开放的 PC 整机标准，谁都能造；Windows 的 Win32 API 多年不变，应用向下兼容。<\/p>\n<p>&quot;开放&quot;加&quot;兼容&quot;是它的两个法宝。用户选 x86，就有越来越多的应用可用，而应用才是生态里最值钱的东西。三十年前的 Windows 程序，今天还能在 x86 上跑。<\/p>\n<p>违背这条规律，连 Intel 自己也会碰壁。IA64 不兼容 x86，跑不了 Windows 应用，被用户抵制。<\/p>\n<h3>AMD：技术领跑与质优价廉<\/h3>\n<p>AMD 1969 年由仙童的八位员工创办，长期仿制 Intel 的 8080 到 80486，1995 年 K5 起开始独立设计，但仍留在 x86 生态内。<\/p>\n<p>它的两件武器：一是技术领跑，1999 年 Athlon 先破 1GHz，2003 年 Athlon 64 先推 64 位，2005 年 Athlon 64 X2 是真双核，比 Intel 用两个 die 封装的 Pentium D 更省电；二是价格，一般是同级 Intel 的三分之二，配套桥片和主板也更便宜，整机厂利润空间更大。<\/p>\n<p>2005 年 AMD 份额到 50%，几乎平分秋色。之后 Intel 靠 Tick-Tock 反攻，酷睿 2 横扫高端，AMD 份额 2017 年跌到 20% 以下。再后来 Intel 从 14nm 到 10nm 屡屡受挫，AMD 借自家代工厂 GF 的 7nm 优势，2019 年推 Zen2，2020 年一季度份额回到 40%。<\/p>\n<p>Intel 是伟大公司，AMD 更像可敬的斗士。AMD 市值只有 Intel 的十分之一，但它的存在让 Intel 跑得更快。<\/p>\n<h3>ARM：把芯片生意做成授权生意<\/h3>\n<p>ARM 源自 1978 年成立的英国 Acorn。当年 Acorn 嫌 Motorola 68000 又贵又慢，找 Intel 授权 80286 被拒，工程师只能自己干，做出了 32 位 RISC 的 ARM。<\/p>\n<p>定位一开始就是低功耗、精简架构的嵌入式与移动。2000 年后 PDA、智能机、平板把它推上巅峰。<\/p>\n<p>它建生态靠两条。一是比 Intel 更开放：早早退出制造，只做指令集与 IP 核授权，门槛低，芯片遍地开花。Intel 的对手不是 ARM 一家，是所有造 ARM 兼容芯片的公司。二是抓转折点：别人都在台式机和服务器上拼大而复杂，它避开正面战场，等老牌厂商反应过来，船大难调头。<\/p>\n<p>如今 ARM 也在往桌面和服务器攻，服务器 CPU 性能已不低于 Intel 至强。<\/p>\n<h3>苹果：自己动手做核<\/h3>\n<p>苹果从 1976 年起一直用别人家的 CPU：6502 → 68000 → PowerPC → x86。<\/p>\n<p>A 系列最初只用于手机平板，2010 年 iPhone 4 首搭 A4。三个阶段很清晰：用第三方芯片（iPhone 4 前用高通、三星）；基于 ARM 公版 IP 少量定制（A4、A5）；自研核（2016 年 A6 抛弃公版，用自家 Swift 微架构）。<\/p>\n<p>苹果的 CPU 团队不是从零搭的，是把 DEC、Intel、ARM、AMD、MIPS 的名将收拢起来，加上重金投入。2020 年 A14 是业界首款 5nm，118 亿晶体管，6 核 CPU、4 核 GPU、16 核神经网络引擎，性能不输桌面 CPU。同年 11 月，苹果开始卖搭载 ARM 的台式机与笔记本，17 年后再次换芯。<\/p>\n<h3>IBM：巨人的四条产品线<\/h3>\n<p>IBM 1911 年成立，1964 年 System/360 宣告系统时代来临。<\/p>\n<p>z 系列：大型机最高端，金融与关键业务的主力。2020 年 z15 有 12 核、GF 14nm、核心面积 696mm²、122 亿晶体管、5.2GHz、四级缓存共 960MB。<\/p>\n<p>Power：RISC，源自 1970 年代的 IBM 801，1990 年随 RS/6000 发布第一代。Power9 对 Intel 至强可达两倍性能，Power10 在性能与 I/O 带宽上又有跃升，龙芯团队靠研读它的资料判断前沿走向。<\/p>\n<p>PowerPC：1991 年 IBM、Apple、Motorola 联合开发，用于 90 年代 Mac；2003 年苹果转向 Intel 后，它退到工控与嵌入式。<\/p>\n<p>Cell：2001 年 IBM、索尼、东芝联合研发，&quot;1+N&quot;结构——1 个 Power4 主核加 8 个协处理器，128 位×128 个寄存器，靠超高速总线互连。IBM 用它造出走鹃，登顶过世界最快。2009 年终止，但设计要素被 Power 继承。<\/p>\n<p>Power 走&quot;高端高价&quot;，性能、I/O、可靠性让 Intel 望尘莫及，金融核心系统仍是它的地盘。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  subgraph Intel\n    X[x86 兼容] --&gt; W[Windows 应用]\n    W --&gt; U[用户黏性]\n  end\n  subgraph ARM\n    ISA[指令集 + IP 授权] --&gt; M[众多芯片厂]\n    M --&gt; D[移动设备]\n  end\n  subgraph Apple\n    S[自研微架构] --&gt; A[A 系列 SoC]\n  end<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：三条路径的差别在&quot;谁掌握增量&quot;。Intel 掌握指令集，ARM 掌握授权，苹果掌握核设计。谁掌握的那一层越靠近软件生态，黏性越强。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：Intel 像收租的房东，房子（x86）谁都能住，但产权在它手上；ARM 像卖图纸的设计院，图纸授权给谁都能盖，收的是授权费；苹果像自己设计自己盖的开发商。失效边界：房东会被更好的房子冲击，设计院会被免费图纸冲击，开发商要独自扛全部风险。\n<\/li><li>\n实例：AMD 用 7nm 反超时，Intel 还在 14nm。这不是设计能力突然逆转，是制造路线的一次判断差异被放大成了市场份额的翻转。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 Intel 一直最强。它多数时候是&quot;最稳&quot;，不是&quot;最快&quot;。\n<\/li><li>\n别以为 ARM 不造芯片所以弱。不造芯片恰恰是它能铺开的原因。\n<\/li><li>\n别以为苹果换芯只是商业决策。它背后是十几年自研核的积累与人才收编。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\nIntel 成功的核心原因是？｜在指令集、整机标准、操作系统三处保持兼容与开放｜单核性能长期第一｜价格最低｜答案：A｜解析：生态黏性来自兼容。\n<\/li><li>\nAMD 的两大竞争法宝是？｜技术领跑与质优价廉｜广告与渠道｜规模与垄断｜答案：A｜解析：多次率先突破，同时价格约为同级的三分之二。\n<\/li><li>\nARM 生态成功的关键是？｜低门槛的指令集与 IP 授权模式｜自己制造芯片｜只做高端｜答案：A｜解析：不造芯片，让所有下游厂商成为它的盟友。\n<\/li><li>\n苹果 A6 的转折意义是？｜抛弃 ARM 公版，改用自研微架构｜首次使用 x86｜首次用 5nm｜答案：A｜解析：从定制走向自研核。\n<\/ol>\n<h2>抽认卡<\/h2>\n<ul><li>\nIntel 生态的三处兼容？｜x86 指令集、开放的 PC 整机标准、Windows 向下兼容\n<\/li><li>\nAMD 两次关键领先？｜先破 1GHz、先推 64 位（另有真双核）\n<\/li><li>\nARM 的前身？｜1978 年成立的英国 Acorn\n<\/li><li>\n苹果 A14 的关键参数？｜5nm、118 亿晶体管、6 核 CPU\n<\/li><li>\nIBM 的四条 CPU 产品线？｜z 系列、Power、PowerPC、Cell\n<\/li><li>\nCell 的结构？｜1 个 Power4 主核 + 8 个协处理器\n<\/ul>\n<h2>术语<\/h2>\n<ul><li>\nWintel 联盟：x86 与 Windows 组成的产业组合\n<\/li><li>\nWin32 API：Windows 提供给应用的编程接口\n<\/li><li>\nIP 授权：把指令集或核设计许可给他人生产芯片的模式\n<\/li><li>\n真双核：两个完整核集成于一个 die，区别于双 die 封装\n<\/li><li>\nSoC：片上系统，集成 CPU 与多种功能模块\n<\/ul>\n<h2>复习锚点<\/h2>\n<ul><li>\nIntel 赢兼容，ARM 赢授权，苹果赢自研\n<\/li><li>\nAMD 用领先与低价换生存空间\n<\/li><li>\n生态的黏性来自应用，不来自跑分\n<\/ul>", "ch31": "<h1>第 31 章：小而坚强与世界边缘——MIPS、RISC-V 与各国 CPU 之路<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>学时<\/strong>：0.6 小时 | <strong>前置<\/strong>：第 30 章\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说出 MIPS 的两大贡献与衰落原因\n<\/li><li>\n能解释 RISC-V 的开放理念和它面对的碎片化难题\n<\/li><li>\n能用日本的教训说明&quot;制造不等于掌握生态&quot;\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>MIPS 输给了生态，RISC-V 想用开放换生态。日本输给了授权，因为它只做产品、不做标准。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>MIPS：教科书里的殿堂<\/h3>\n<p>MIPS 由斯坦福前校长约翰·亨利斯团队 1984 年创立，是 RISC 先锋，曾建起能与 x86、ARM 比肩的生态。<\/p>\n<p>它学术气息很重：三本计算机经典教材里有两本出自亨利斯，国外教学长期以 MIPS 为范例，资料最开放、最丰富。技术上也不含糊——1991 年的 R4000 就实现了 64 位，而 Intel、ARM 的 64 位要晚十年以上。<\/p>\n<p>90 年代它一度是最广泛使用的 RISC，产品线覆盖服务器、工作站、PC、游戏机、交换机、嵌入式。2000 年前后转折：服务器和桌面被 x86 挤压，嵌入式没打过 ARM，移动计算没抓住，架构升级慢，公司几经转卖，逐渐边缘化。<\/p>\n<p>它留下的遗产是人才与教材。很多从业者第一款上手的处理器就是 MIPS，龙芯研发人员桌上的参考书也多是 MIPS 示范。<\/p>\n<h3>RISC-V：极简与开放<\/h3>\n<p>RISC-V 与 MIPS 师出同门——领导者之一大卫·帕特森与亨利斯合写过那两本经典教材。<\/p>\n<p>2010 年，伯克利团队要做一款灵活的 CPU，但 Intel、ARM 授权卡得严、限制多，于是从零设计一套全新指令集。<\/p>\n<p>它的风格是极简：没有历史包袱，不需要向下兼容，基础指令仅 40 多条，加模块化扩展总共几十条；核心文档 238 页，而 x86、ARM 的文档上千页。<\/p>\n<p>生态理念是自由开放：任何人可以设计、制造、销售 RISC-V 芯片与软件，不交授权费。基金会成员持续增长，目标是建一个不被某家商业公司控制的&quot;全民生态&quot;。<\/p>\n<p>但书里也点得清楚：RISC-V 在基础原理上创新不多。重设计指令集本身很简单，第一版只花几个月；现代 CPU 核心原理 2000 年就成熟了，它主要是用已有技术做芯片。<\/p>\n<p>最大的难题是立足之地。x86、ARM、Power 已分割世界，各有绝技与多年壁垒。RISC-V 的软件生态要从零做，目前主要在低端嵌入式、物联网分一杯羹，桌面、服务器、移动还没迈过&quot;零的突破&quot;。<\/p>\n<h3>边缘地带的三条路<\/h3>\n<p>日本：70 年代美企向 NEC、夏普、日立、理光、富士通、东芝、三菱大量授权，日本造的兼容 CPU 与内存物美价廉，反而成了美国市场主力。但它只做产品、不做生态主导权。1986 年 80386 上市前，Intel 断供 32 位授权，日本公司从此只能买成品。NEC 的 PC98 只好&quot;换芯&quot;：8086 → 自研 V30 → 又被逼回 80286。1984 年日本启动 TRON 项目想另立体系，被&quot;不公平贸易&quot;&quot;盗取知识产权&quot;打压，又被极低授权条件诱导，最终放弃 PC 正面竞争，只允许在嵌入式领域用。日本对 CPU 家族的贡献更多在制造，SuperH、TMPM 这类自研架构只是支脉。<\/p>\n<p>欧洲：产业分散，没有硅谷量级的聚集区。意法半导体做 STM8（自研）、STM32（ARM 兼容）；西门子剥离出英飞凌，主攻汽车电子，有 ARM 兼容与自研 TriCore；飞利浦分出恩智浦，做 ARM、Power 兼容微控制器。2018 年欧盟提出 EPI（欧洲处理器计划），集结 10 国 27 家机构，目标低功耗处理器与超算 CPU，指令集选 ARM 或 RISC-V，目前仍在初期。<\/p>\n<p>韩国：三星 CPU 历史不短，S3C2410 是最早在中国流行的 ARM 嵌入式芯片，iPhone 一代二代都用三星的 ARM。2011 年推出 Exynos（猎户座），至今仍有国际影响力。但韩国也主要走兼容制造路线，多用 ARM 公版 IP 配自家先进工艺，性能功耗上缺乏鲜明优势，面对苹果 A 系列、高通、海思竞争力偏弱。<\/p>\n<p>一句话总结：制造能力可以买设备建厂堆出来，生态主导权只能靠指令集、专利与开发者一点点养出来。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  MIPS[MIPS&lt;br/&gt;学术强 生态弱] --&gt;|衰落| EDGE[边缘化]\n  RV[RISC-V&lt;br/&gt;开源 极简] --&gt;|生态从零| TRY[嵌入式起步]\n  JP[日本&lt;br/&gt;只做兼容产品] --&gt;|1986 断供| LOSS[失去话语权]\n  EU[欧洲 EPI] --&gt;|ARM 或 RISC-V| WAIT[初期]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：四条路都在同一个问题上打转——生态从哪来。MIPS 有技术没守住，RISC-V 想用免费换规模，日本被授权掐住，欧洲还在选路线。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：MIPS 像一所名校，教材写得最好，但毕业生留不住产业；RISC-V 像开源社区，门槛为零，但要把散落的贡献者拧成一股绳；日本像代工厂，活干得漂亮，图纸不是自己的。失效边界：开源社区能聚人，但商业闭环仍是难题，免费不等于可持续。\n<\/li><li>\n实例：RISC-V 文档 238 页、基础指令 40 多条，对照 x86 上千页文档、上千条指令。这个对比最能说明&quot;历史包袱&quot;的重量。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为开源就一定能赢。生态需要商业闭环，光有免费不够。\n<\/li><li>\n别以为日本技术不行。它造得出好东西，输在没有标准话语权。\n<\/li><li>\n别以为 RISC-V 只能做低端。它在高端有潜力，但目前确实还没跨过零的突破。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\nMIPS 在技术上的领先事例是？｜1991 年 R4000 率先实现 64 位｜率先做出 5nm｜率先做多核｜答案：A｜解析：比 Intel、ARM 早十年以上。\n<\/li><li>\nRISC-V 的核心文档约多少页？｜238 页｜1000 页以上｜40 页｜答案：A｜解析：基础指令 40 多条，文档 238 页。\n<\/li><li>\n日本失去 CPU 话语权的直接事件是？｜1986 年 Intel 中止 32 位授权｜TRON 项目成功｜EPI 计划启动｜答案：A｜解析：断供使日本只能购买成品。\n<\/li><li>\n欧洲 EPI 计划准备采用哪些指令集？｜ARM 或 RISC-V｜只 x86｜只 Power｜答案：A｜解析：两条路线并行评估。\n<\/ol>\n<h2>抽认卡<\/h2>\n<ul><li>\nMIPS 的创始人？｜约翰·亨利斯团队，1984 年\n<\/li><li>\nMIPS 衰落的主要原因？｜桌面与服务器被 x86 挤压、嵌入式输给 ARM、错过移动\n<\/li><li>\nRISC-V 的两位关键人物？｜大卫·帕特森与约翰·亨利斯（合作教材）\n<\/li><li>\nRISC-V 的生态理念？｜自由开放，免授权费\n<\/li><li>\n日本 TRON 项目的结局？｜被迫放弃 PC 正面竞争，限用于嵌入式\n<\/li><li>\n三星移动处理器系列名？｜Exynos（猎户座）\n<\/ul>\n<h2>术语<\/h2>\n<ul><li>\nMIPS：源于斯坦福的 RISC 架构与公司\n<\/li><li>\nRISC-V：伯克利发起的开放指令集架构\n<\/li><li>\n碎片化：同一架构因扩展不一导致软件难以通用的问题\n<\/li><li>\nTRON：日本 1984 年启动的自主信息产业体系项目\n<\/li><li>\nEPI：欧洲处理器计划\n<\/ul>\n<h2>复习锚点<\/h2>\n<ul><li>\n技术领先不等于生态领先\n<\/li><li>\n开源能降低门槛，不能自动带来闭环\n<\/li><li>\n只做兼容产品，迟早被授权掐住\n<\/ul>", "ch32": "<h1>第 32 章：生态之重——CPU 的价值不在 CPU<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>学时<\/strong>：0.6 小时 | <strong>前置<\/strong>：第 4、19 章\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能定义 CPU 生态与软件生态，并说明二者的关系\n<\/li><li>\n能说出 CPU 与应用之间的三种接口\n<\/li><li>\n能用 Inside / Outside 模型解释 CPU 企业的两个使命\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>CPU 是土，软件生态是森林。土本身不能吃，能长出什么才值钱。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>生态是什么<\/h3>\n<p>CPU 生态是围绕某一种 CPU 的全部资源：配套软硬件、应用软件、社区、知识库、书籍、开发者、合作厂商、用户，整条上下游。<\/p>\n<p>软件生态是某一种 CPU 能运行的所有软件的集合，是 CPU 生态里最重要的一块，日常也直接叫&quot;生态&quot;。<\/p>\n<p>关键判断：CPU 本身没有使用价值。一个元器件对用户没用，只有 CPU 加应用软件才提供服务。软件越多，CPU 能干的事越多，价值越大。<\/p>\n<p>所以做生态的门槛远高于做 CPU。做 CPU 是技术活，原理 2000 年前后就成熟了，投人投时间就能出产品；做生态是群体行为，要成千上万家厂商多年合作，大型软件的复杂度不亚于 CPU，CPU 厂不可能全自己做。核心是让应用厂商有利可图，把&quot;统一战线&quot;建起来。<\/p>\n<p>最难的是起步阶段那个怪圈：应用少 → 用户少 → 厂商不愿支持 → 更没人用。很多 CPU 公司没跳出怪圈就撑不住了。全球能做 CPU 的不止百千家，敢做生态的屈指可数。<\/p>\n<h3>Inside 与 Outside<\/h3>\n<p>龙芯 2012 年提出的模型：Inside 是芯片之内的 CPU 核，是看家本事；Outside 是芯片之外的软件生态，决定可用性、放大价值；芯片是两者的衔接载体。<\/p>\n<p>成功的 CPU 公司都会在芯片团队之外再建一支软件生态团队。龙芯 2013 年成立系统软件团队，进入&quot;左手 CPU，右手软件生态&quot;的阶段。2020 年完成性能补课，生态初具规模，但要追到 x86、ARM 的水平还需要更长时间。<\/p>\n<h3>三种接口<\/h3>\n<p>最简的分法：下面操作系统，上面应用软件。两者之间有两个接口——指令集（ISA）规定二进制编码格式，系统调用（System Call）规定操作系统给应用的服务。<\/p>\n<p>但真实的生态是多层的：操作系统在最底层，管硬件、提供驱动，还带编译器（最常用 C/C++）；往上是 API 层，提供编程语言环境与函数库；最上面是应用软件。旁边还有外设（Devices），通过硬件接口连进来。<\/p>\n<p>于是接口变成三种：应用软件接口 = {ISA, System Call, API}。三者缺一不可，都是生态建设的内容。<\/p>\n<p>龙芯桌面与服务器生态以 Linux 为主，系统调用就是 Linux 内核 API；嵌入式和实时系统若用 VxWorks，系统调用就换成 VxWorks API。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart BT\n  ISA[ISA 指令集] --&gt; OS[操作系统 + 驱动 + 编译器]\n  OS --&gt; API[API 函数库与语言环境]\n  API --&gt; APP[应用软件]\n  DEV[外设] --&gt; OS<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：箭头是&quot;支撑&quot;方向，下层托着上层。三种接口分别落在 ISA、System Call、API 三处，任何一层断了，应用都跑不起来。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：CPU 是地基，操作系统是市政管网，API 是水电接口，应用是楼里的商铺。地基再结实，没有管网和商铺，也没人来。失效边界：地基不能换，生态可以迁移（通过二进制翻译、虚拟机），只是要付代价。\n<\/li><li>\n实例：一台性能够用的龙芯机器，如果常用软件装不上，用户就不会买。性能补课完成之后，真正卡住销量的是&quot;软件够不够&quot;。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 CPU 做强了生态自然来。生态是独立战场，要单独的团队和投入。\n<\/li><li>\n别以为生态只是&quot;软件数量&quot;。接口规范、开发者、社区、书籍都算。\n<\/li><li>\n别以为怪圈可以靠降价破。用户要的是能用的软件，不是便宜的空机器。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\nCPU 的价值由什么决定？｜其上承载的软件生态的价值｜主频高低｜晶体管数量｜答案：A｜解析：CPU 单独没有使用价值。\n<\/li><li>\nInside 与 Outside 分别指？｜芯片内的 CPU 核与芯片外的软件生态｜封装内外｜主板内外｜答案：A｜解析：龙芯 2012 年提出的模型。\n<\/li><li>\n应用软件接口包括哪三项？｜ISA、System Call、API｜ISA、PCB、BIOS｜API、GPU、DMA｜答案：A｜解析：三者共同构成应用运行条件。\n<\/li><li>\n生态起步最难的问题是？｜应用少、用户少、厂商不愿支持的双向怪圈｜缺资金｜缺人才｜答案：A｜解析：正反馈难以启动。\n<\/ol>\n<h2>抽认卡<\/h2>\n<ul><li>\nCPU 生态的定义？｜围绕某 CPU 的全部资源与上下游集合\n<\/li><li>\n软件生态的定义？｜某 CPU 能运行的所有软件的集合\n<\/li><li>\n为什么 CPU 本身没有使用价值？｜它只是元器件，需软件才提供服务\n<\/li><li>\n三种接口公式？｜应用软件接口 = {ISA, System Call, API}\n<\/li><li>\n龙芯系统软件团队成立时间？｜2013 年\n<\/li><li>\n生态架构的层次？｜操作系统 → API → 应用软件，旁挂外设\n<\/ul>\n<h2>术语<\/h2>\n<ul><li>\nCPU 生态：围绕某 CPU 的全部资源与产业集合\n<\/li><li>\n软件生态：某 CPU 可运行的全部软件集合\n<\/li><li>\nInside/Outside：芯片内核心与芯片外生态的二分模型\n<\/li><li>\n系统调用：操作系统向应用提供的服务接口\n<\/li><li>\nAPI：应用编程接口，语言与函数库层面的调用规范\n<\/ul>\n<h2>复习锚点<\/h2>\n<ul><li>\n土与森林：CPU 的价值在生态\n<\/li><li>\n三接口：ISA、System Call、API\n<\/li><li>\n做芯片是技术，做生态是群体工程\n<\/ul>", "ch33": "<h1>第 33 章：开发者的号角与解决方案为王<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>学时<\/strong>：0.7 小时 | <strong>前置<\/strong>：第 32 章\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能区分系统软件开发者与应用软件开发者，说出中国开发者结构的特点\n<\/li><li>\n能说明 Linux 发行版是怎么&quot;做&quot;出来的\n<\/li><li>\n能用虚拟机的机制解释&quot;脱离指令集的生态&quot;\n<\/li><li>\n能用利润率数字说明&quot;解决方案为王&quot;\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>写代码的人决定生态有没有内容，做解决方案的人决定钱怎么分。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>两类开发者<\/h3>\n<p>开发者是软件生态的主要贡献者。狭义指写代码的程序员，广义包括一切参与应用制造的人员与厂商。<\/p>\n<p>分两类：系统软件开发者，做操作系统与 API，目标是让操作系统在 CPU 上稳定跑，并向应用提供丰富高效的 API；应用软件开发者，做应用程序，目标是功能满足需求、交互好用。<\/p>\n<p>中国的情况是应用强、系统弱。Java 程序员几百万人，互联网应用全球最发达；系统软件开发者加起来约万人规模，多数还是在开源代码上改定制，属操作系统里的低端工作；API 开发者极稀有，做 C/C++ 编译器、Java 编译器的人不到千人。<\/p>\n<p>龙芯的软件工程师主要做系统软件，围绕自己的指令集研发 Linux 发行版，再细分出内核、C/C++ 编译器、Java 虚拟机、浏览器、图形库、媒体解码、虚拟化与云平台等小组。2015 年做了 3D 地球演示，证明 3A2000 平台上软件优化后 3D 应用是流畅的；2017 年启动&quot;龙芯应用公社&quot;，把类似应用商店的东西集成进系统。<\/p>\n<h3>发行版是怎么来的<\/h3>\n<p>操作系统分商业与社区两类。商业的如 Windows、macOS，不公开源码；社区的如 Linux，全球程序员基于互联网合作开发，源码公开。<\/p>\n<p>Linux 以发行版形式提供成品：把网上分散的源码汇总，在某个 CPU 平台上编译，按统一格式打包，做成一张安装光盘。<\/p>\n<p>做发行版技术含量很低，主要是重新编译的体力活，很少自己写源码。谁都能做。商业公司做发行版，靠技术咨询、支持、维护收费。常见的有 Fedora、Redhat、Ubuntu、Debian。国内的深度（Deepin）自己写了图形界面，接近 macOS 的美观，被称&quot;最美 Linux&quot;。龙芯维护的是 Loongnix——把社区发行版源码在龙芯上重新编译、适配优化，建了开源社区提供镜像与全部源码，也能在源码层面二次定制。<\/p>\n<h3>虚拟机：没有 CPU 实体的生态<\/h3>\n<p>应用要在某 CPU 上跑，得先变成该 CPU 的机器指令。按转换方式分两类语言。<\/p>\n<p>本地编译型：源码编译成二进制可执行文件，运行时不再需要源码。C/C++、Fortran、Pascal 属于这类，都是 80 年代以前的老语言。<\/p>\n<p>虚拟机型：源码不预编译，直接在虚拟机上跑；虚拟机动态加载源码，转成当前 CPU 的机器指令。Java、.Net、JavaScript、Python、PHP、Shell 属于这类。Go 是混合型。<\/p>\n<p>虚拟机屏蔽了指令集差异。本地编译型要为每个 CPU 出不同二进制版本，虚拟机型只发一份源码就能到处跑——&quot;一次编译，多处运行&quot;。<\/p>\n<p>于是开发者可以脱离 CPU 建生态：这个生态属于虚拟机，不属于某颗 CPU。服务器侧最成功的是 Java（占 90% 以上），桌面侧是浏览器里的 JavaScript，移动侧是 Android 虚拟机。<\/p>\n<h3>解决方案为王<\/h3>\n<p>解决方案是针对一种应用需求的整体软硬件平台：CPU 加主板、操作系统、外设、应用软件。做好一套，同类场景可复用。<\/p>\n<p>IT 产业本质是&quot;解决方案为王&quot;。解决方案的研发难度高于 CPU 本身，它含对需求的理解，要同时满足功能、成本、性能、定制，只能在实际应用中反复磨合。<\/p>\n<p>规律很硬：解决方门槛越高，企业在产业链上的位置越高、利润越高；只会造产品、没有核心方案的，只能站在低端做同质竞争。<\/p>\n<p>看两组数字。计算机领域：2019 年 Intel 收入 720 亿美元、净利 210 亿；联想收入 510 亿、净利 5.97 亿。CPU 厂利润率是整机厂的 25 倍。原因是计算机 CPU 设计难度极高，市场被极少数厂商垄断，Intel 不只做 CPU 还做主板设计，联想拿资料生产即可，同类整机厂还有 HP、Dell、曙光、浪潮一大批。<\/p>\n<p>手机领域反过来了：2019 年苹果一家拿走全球智能手机 66% 的利润、32% 的收入；三星 17%，华为约 10%；而做手机芯片的紫光展锐利润率低于 3%。原因是手机 CPU 设计难度低——谁拿到 ARM 公版都能做，全球几百家能做 ARM 芯片；而&quot;做好手机&quot;的厂商不到 10 家，苹果投入最大、方案最优。<\/p>\n<p>所以产业链分钱不看谁干得多，看谁控制解决方案。中国企业的普遍问题是制造发达、方案落后、利润薄。华为干了很多别人的活，利润不如苹果的零头。<\/p>\n<p>结论：在现有 x86、ARM 体系里做 CPU 只能是追随者，地位受威胁时对方会用知识产权、贸易公平等借口压制。根本出路是建自己的体系，走自己的指令集与独立软件生态。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  subgraph 计算机\n    I[Intel 净利 210 亿] --&gt; P1[利润率约为整机厂 25 倍]\n    L[联想 净利 5.97 亿] --&gt; P1\n  end\n  subgraph 手机\n    A[苹果 利润 66%] --&gt; P2[整机厂拿走大部分利润]\n    Z[紫光展锐 利润率 &lt;3%] --&gt; P2\n  end<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：同样是&quot;做芯片&quot;，两个领域的利润分配完全相反。差别不在技术难度本身，在谁掌握了解决方案。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：解决方案像餐厅，CPU 像厨房设备。设备供应商能赚一笔，但定价权和回头客在餐厅。失效边界：如果厨房设备只有一家能造（如计算机 CPU），设备商反而能掐住餐厅。\n<\/li><li>\n实例：苹果应用商店按 3:7 与应用开发者分成，2019 年该业务收入高达 500 亿美元，占其 2600 多亿总收入的一大块。这就是&quot;掌握分发入口&quot;的收益。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为做芯片一定比做整机赚。要看这个领域里谁掌握方案。\n<\/li><li>\n别以为发行版是&quot;开发操作系统&quot;。多数发行版工作只是重编译与打包。\n<\/li><li>\n别以为虚拟机生态与 CPU 无关。它绕开了指令集，但仍要 CPU 与操作系统支撑。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n中国开发者结构的特点是？｜应用软件开发者多、系统软件开发者少｜系统软件多、应用少｜两者均衡｜答案：A｜解析：系统软件约万人规模，API 开发者不到千人。\n<\/li><li>\nLinux 发行版的核心工作是？｜把分散源码在特定平台编译、打包｜从零写内核｜设计指令集｜答案：A｜解析：技术含量低，以重编译为主。\n<\/li><li>\n虚拟机生态的关键作用是？｜屏蔽指令集差异，源码到处可跑｜提高主频｜降低功耗｜答案：A｜解析：一次编译，多处运行。\n<\/li><li>\n2019 年 Intel 与联想的利润率对比说明？｜掌握解决方案者拿走产业链多数利润｜整机厂更赚钱｜芯片厂不赚钱｜答案：A｜解析：计算机领域 CPU 厂利润率为整机厂 25 倍。\n<\/ol>\n<h2>抽认卡<\/h2>\n<ul><li>\n两类开发者？｜系统软件开发者与应用软件开发者\n<\/li><li>\n中国 API 开发者规模？｜从事编译器等工作的人不到千人\n<\/li><li>\nLinux 发行版的产出形式？｜一张安装光盘/镜像\n<\/li><li>\n虚拟机型语言举例？｜Java、.Net、JavaScript、Python\n<\/li><li>\n本地编译型语言举例？｜汇编、C/C++、Fortran、Pascal\n<\/li><li>\n&quot;解决方案为王&quot;的含义？｜对方案的控制力决定利润分配\n<\/ul>\n<h2>术语<\/h2>\n<ul><li>\n系统软件开发者：开发操作系统与 API 的人员\n<\/li><li>\n发行版：把大量源码编译打包成的 Linux 成品\n<\/li><li>\n本地编译型语言：编译成可执行文件后运行的语言\n<\/li><li>\n虚拟机型语言：由虚拟机动态翻译执行的语言\n<\/li><li>\n解决方案：面向某类需求的整体软硬件平台\n<\/ul>\n<h2>复习锚点<\/h2>\n<ul><li>\n应用强、系统弱，是中国开发生态的现状\n<\/li><li>\n发行版多是重编译，不是从零造系统\n<\/li><li>\n虚拟机让开发者脱离指令集\n<\/li><li>\n谁控制解决方案，谁分走利润\n<\/ul>", "ch34": "<h1>第 34 章：生态的优点与方向——开放、兼容、优化<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>学时<\/strong>：0.7 小时 | <strong>前置<\/strong>：第 33 章\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说出优秀生态的三个原则及各自作用\n<\/li><li>\n能用 Linux 的碎片化说明&quot;开放而不兼容&quot;的代价\n<\/li><li>\n能用&quot;标准—品牌—产品&quot;三档解释 CPU 企业的营利模式\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>开放把力量聚起来，兼容把成果留住，优化把体验拉高。三条缺一条，生态就会散。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>三个原则<\/h3>\n<p>开放：生态链企业多，能公开平等合作，有意愿有实力就能进来贡献并获得利益。作用是壮大力量、保持创新、防止少数企业垄断。<\/p>\n<p>兼容：企业间遵守共同规则，产品能互相配合。作用是把所有企业拧成合力，减少冲突与合作成本。兼容靠标准规范约束。<\/p>\n<p>优化：企业联合打磨整体方案，各自根据别人的产品特点提升品质。作用是在同样的成本下挖出更多潜力，提高体验与效率。<\/p>\n<p>三个范例很清楚。Windows-Intel 是兼容至上：x86 几十年向下兼容，今天的机器还能跑 40 年前的软件；Windows 系统调用从 90 年代就走兼容路线；IBM 与 Intel 联合定 PC 硬件规范，所有 x86 主板遵守同一套规则，一张 Windows 光盘能在所有 x86 机器上装，Windows XP 在今天最新的整机上还能装。<\/p>\n<p>Android-ARM 是开放：ARM 向全球授权，Android 源码免费开放，任何手机厂都能用这套组合造手机，全球智能机市场里 Android-ARM 占 87%，远高于封闭的苹果。<\/p>\n<p>苹果是优化：软硬联合优化，&quot;对每一个应用、每一个功能、每一个像素进行优化&quot;，用中等性能的 CPU 做出体验一流的设备，还能要求供应商提供定制元器件。<\/p>\n<h3>松散型的反面教材：Linux<\/h3>\n<p>Linux 是松散型生态的代表：开放做得最好，兼容与优化乏力。<\/p>\n<p>开放性有数据：2019 年 Linux 内核社区提交超过 74000 次代码，来自全球 4189 名程序员，累计增加 300 万行，规模与微软 Windows 内核团队相当。<\/p>\n<p>兼容性有硬伤：内核升级频繁，系统调用常变且不坚持向下兼容，新版本经常不支持老接口或擅自改功能参数；API 层同样混乱，编译器升级随意改语法、函数库里删函数；发行版之间更不兼容，几百种发行版各用各的内核版本、各定各的打包格式，社区从未统一规范。结果是在一个发行版上写的代码，换个发行版可能跑不起来，甚至同一发行版升级后自己原来的程序也跑不了。<\/p>\n<p>优化也乏力：缺少像苹果那样死磕体验的团队，桌面与界面设计滞后。Linux 发展 30 年，台式机份额只有 1.29%。Android 能成功，是因为 Google 把图形界面推倒重写了一遍。<\/p>\n<p>书里判断很直接：碎片化已积重难返，因为生态培育初期没建立好&quot;基因&quot;。中国操作系统大多基于 Linux 发行版，会受这套碎片化影响，需要在生态建设上超越开源社区。<\/p>\n<h3>生态的外沿<\/h3>\n<p>解决方案是核心，但优秀生态还会做五件事增值：<\/p>\n<p>标准规范——定义产品间接口，是&quot;生态的律法书&quot;，从 U 盘尺寸到文档格式都算。 软件社区——集中操作系统、API、应用，也是协作与传播平台。 适配认证——发认证证书做推荐依据，如&quot;Windows 兼容&quot;标记。 人才培养——ARM 2000 年进中国时与高校合建嵌入式实验室、免费送硬件平台，有力拉动了开发者转移。 书籍出版——知识的权威载体，深阅读是培养专业人才的必由之路。<\/p>\n<p>外沿伸到信息化社会每个角落，这个&quot;泛生态&quot;是技术、商业、营销、管理的交叉体，所以需要懂技术也懂经营的复合型人才。<\/p>\n<h3>三档营利模式<\/h3>\n<p>一流做标准（对应知识产权），二流做品牌（对应生态），三流做产品（对应芯片制造）。<\/p>\n<p>高通是知识产权营利的典型：3G/4G 霸主，净利润 53% 来自专利费，专利超 13000 项，约 3900 项是 CDMA 专利。中国手机出货越多，它越&quot;躺着挣钱&quot;。<\/p>\n<p>ARM 也是：自己不造一颗芯片，只授权指令集与公版 IP。收费分两笔——买使用权交一次，每卖一块芯片再交一次。1991 到 2020 年 ARM 芯片累计出货 1600 亿颗。<\/p>\n<p>二流如 Intel：x86 在桌面与服务器份额超 90%，短期内不必担心生存，但这两个市场多年萎缩，它最大的问题是如何拓展新市场。<\/p>\n<p>三流是只会造芯片卖芯片的：没有独门技术，进入门槛低，竞争者环伺，最好也就是把成本做平。追随 x86、ARM 的大多数厂商在这一档。<\/p>\n<p>中国 CPU 企业正从第二档往第一档走：龙芯坚持指令集授权、架构授权、造芯片、建生态齐头并进。<\/p>\n<h3>应用商店：生态阵地<\/h3>\n<p>应用商店极大提高了发行效率。之前靠磁盘、光盘、分散站点下载，找和装都要时间与技术；商店提供图形界面，检索、一键安装、一键升级，还带点赞评论的社交属性。<\/p>\n<p>上架应用数量体现生态繁荣度，优秀应用可以当&quot;杀手锏&quot;。它也改变了选购逻辑——很多人买手机先看商店里有没有自己要的应用。<\/p>\n<p>拥有者可以对开发者抽&quot;生态税&quot;。苹果商店付费应用按 3:7 分成，2019 年应用商店收入高达 500 亿美元。<\/p>\n<p>国内也在做：深度操作系统自研商店，2016 年在龙芯上完成移植，首批 400 款；2020 年龙芯应用商店应用近万款。<\/p>\n<h3>结尾的判断<\/h3>\n<p>中国 IT 生态的水平类似 90 年代的硅谷：已有多个 CPU、操作系统企业，路线各异，性能与创新力持续提升，进入快车道。<\/p>\n<p>应用层面已大部分自主：电子政务、企业信息化、电商、移动支付都能自己开发，WPS 就是例子。下一步要攻的是底层——CPU 与操作系统也自己开发、自己使用。<\/p>\n<p>&quot;没必要自建生态&quot;&quot;中国人做不成生态&quot;的说法长期存在。书里的回答是：生态是持久战略，要一代人努力，不可能速胜，也不能走回头路。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  OPEN[开放&lt;br/&gt;壮大力量] --&gt; GOOD[良性生态]\n  COMPAT[兼容&lt;br/&gt;积累成果] --&gt; GOOD\n  OPT[优化&lt;br/&gt;提升体验] --&gt; GOOD\n  GOOD --&gt; S1[一流：标准/知识产权]\n  GOOD --&gt; S2[二流：品牌/生态]\n  GOOD --&gt; S3[三流：产品/制造]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：三个原则是入口，三档营利是出口。原则越扎实，越能往上走一档——标准收租，生态设卡，制造只能拼成本。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：开放是开城门，兼容是统一轨距，优化是打磨车厢。只开城门不定轨距，火车进不来。失效边界：生态没有强制执法者，靠利益与标准自愿遵守，松散型生态正是缺了这一环。\n<\/li><li>\n实例：Windows 10 官方称 4.1 万款受测软件中仅 49 款存在兼容问题，兼容率 99.9%。这是几十年兼容策略攒下的信用。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为开源就等于好生态。Linux 开放极佳，桌面份额仍只有 1.29%。\n<\/li><li>\n别以为做标准是&quot;虚的&quot;。高通的利润一半以上来自专利费。\n<\/li><li>\n别以为应用商店只是下载工具。它是分发入口，也是抽税通道。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n优秀生态的三个原则是？｜开放、兼容、优化｜便宜、快速、稳定｜开源、免费、众包｜答案：A｜解析：分别对应壮大力量、积累成果、提升体验。\n<\/li><li>\nLinux 桌面份额低的主要原因是？｜兼容与优化不足、碎片化严重｜不开源｜收费太高｜答案：A｜解析：发行版与接口各行其是。\n<\/li><li>\n高通的主要营利方式是？｜知识产权与专利授权｜芯片制造｜整机制造｜答案：A｜解析：净利 53% 来自专利费。\n<\/li><li>\n应用商店按 3:7 分成的含义是？｜苹果与开发者三比七分配付费收入｜厂商与运营商｜硬件与软件｜答案：A｜解析：这是&quot;生态税&quot;的具体形式。\n<\/ol>\n<h2>抽认卡<\/h2>\n<ul><li>\n兼容靠什么约束？｜标准规范\n<\/li><li>\nLinux 内核社区 2019 年的提交规模？｜74000 余次，4189 名程序员\n<\/li><li>\nARM 的授权收费方式？｜购买使用权一次，每片芯片再收一次\n<\/li><li>\n&quot;一流企业做什么&quot;？｜做标准（知识产权）\n<\/li><li>\nARM 芯片累计出货量（1991—2020）？｜1600 亿颗\n<\/li><li>\n深度系统在龙芯上首批上架应用数？｜400 款\n<\/ul>\n<h2>术语<\/h2>\n<ul><li>\n标准规范：定义产品间接口、约束兼容的规则集合\n<\/li><li>\n碎片化：同一生态内版本、接口、格式各行其是\n<\/li><li>\n生态税：平台从开发者收益中抽取分成\n<\/li><li>\n泛生态：解决方案之外的标准、社区、认证、人才、出版等支撑体系\n<\/ul>\n<h2>复习锚点<\/h2>\n<ul><li>\n开放、兼容、优化，三条缺一不可\n<\/li><li>\n碎片化是生态初期种下的病，后期难治\n<\/li><li>\n标准收租，生态设卡，制造拼成本\n<\/ul>", "ch35": "<h1>第 35 章：中国 CPU 旧事——为什么必须自己做<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>学时<\/strong>：0.6 小时 | <strong>前置<\/strong>：第 30、31 章\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说出中国做 CPU 的三条理由与市场规模数据\n<\/li><li>\n能比较&quot;市场换技术&quot;与&quot;市场带技术&quot;两条路线\n<\/li><li>\n能概括中国计算机事业的三个阶段\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>CPU 是所有信息设备的底座。底座买别人的，利润、安全、话语权就都在别人手里。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>为什么必须做<\/h3>\n<p>CPU 是计算机的大脑和心脏，在新基建里是基础元器件。大到台式机、服务器、云计算、工控、高铁、飞机、卫星，小到智能家居、门锁、水表、电饭锅，都要用它。<\/p>\n<p>中国是最大需求市场：台式机约占全球 20%，服务器约占 30%。2019 年全球台式机出货 2.6 亿台，按均价 215 美元算，桌面 CPU 市场约 545 亿美元；服务器 1200 万台，平均每台 2.5 颗 CPU，按 1500 美元算，约 450 亿美元。<\/p>\n<p>自主率却很低：2019 年前 7 个月进口 CPU 470 亿元，其中直接来自美国的（Intel、AMD、高通等）超过 320 亿元。中国信息化生态主要建在 x86、ARM 上，大部分高额利润被国外厂商赚走。<\/p>\n<p>风险有三层：供应链被卡、后门漏洞难杜绝、核心技术受制于人。所以做自己的 CPU，既是产业升级的需要，也是信息安全的需要。<\/p>\n<h3>两条路线<\/h3>\n<p>&quot;市场换技术&quot;：通过合资把市场让出去，走引进—消化—吸收。现实是&quot;引进&quot;容易，&quot;消化吸收&quot;极漫长——知识产权仍在对方手里，有的企业只是拿到 x86、ARM 授权资料直接造芯片，离&quot;掌握设计能力&quot;很远。<\/p>\n<p>&quot;市场带技术&quot;：自研技术、自建生态，用市场引导带动技术进步。航天是成功先例——水平世界领先，形成了中国特有的产业体系，还能走出去参与全球竞争。<\/p>\n<p>龙芯选的是后者：从每一行源代码开始设计自己的芯片，在应用中不断演进。起点低，但能像爬楼一样持续抬升，最终成为市场接受的产品。<\/p>\n<h3>三个阶段<\/h3>\n<p>第一个 30 年（1950—1980）：完全自主研发。1956 年成立中科院计算所，当时的传统是从&quot;沙子&quot;造计算机——单晶硅、晶体管、CPU、主板、操作系统都能自己造。但没有市场化，只服务特定项目。<\/p>\n<p>第二个 30 年（1980—2010）：完全市场化。联想、曙光、浪潮出货量居世界前列，但两大核心技术 CPU 与操作系统主要建在 x86、ARM 上。<\/p>\n<p>第三个阶段（2010 至今）：在市场化条件下重新掌握自主能力，在开放市场中打破垄断。<\/p>\n<p>代表成果是 1967 年的 109 丙&quot;功勋计算机&quot;：中国第一台具有分时、中断系统的计算机，32 位字长，每秒 10 万次，中国第一个自行设计的管理程序（操作系统的前身）就在它上面建立，服役 16 年。<\/p>\n<h3>缺芯少魂<\/h3>\n<p>中国 PC 从一开始就走兼容路线。最早的自研 8 位微型机是 1977 年 DJS-050，清华、安徽无线电厂、电子部联合设计，兼容 Intel 8080。80 年代主要仿制 Intel、Motorola、6502、Z80 的兼容机，90 年代全面转向 IBM PC 与 DOS/Windows。<\/p>\n<p>大型机同样&quot;与国际接轨&quot;：1993 年的曙光一号达到当时国际先进水平，用 Motorola M88100 与 AT&amp;T UNIX，定点运算每秒 6.4 亿次，主存最大 768MB——但团队曾在美国硅谷&quot;洋插队&quot;11 个月，因为国内处理器、操作系统、高密度生产技术都薄弱。<\/p>\n<p>结果很直接：80、90 年代国家对自主研发 CPU 的支持力度明显下降，主要科研计划都未列入，CPU 设计能力在高校与研究所基本丧失。<\/p>\n<p>操作系统的命运类似：70 年代前只服务硬件；80 年代重点转向汉字显示、中文输入法，离核心技术渐远；90 年代被 Windows、UNIX 垄断，自主的 COSIX 放弃研发，&quot;红旗&quot;等厂商只做 Linux 发行版定制，走到产业链末端，没形成有影响力的产业。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  P1[1950-1980&lt;br/&gt;全自研 无市场] --&gt; P2[1980-2010&lt;br/&gt;全市场化 缺芯少魂]\n  P2 --&gt; P3[2010 至今&lt;br/&gt;市场化条件下重掌自主]\n  R1[市场换技术] --&gt; X[引进来 消化难]\n  R2[市场带技术] --&gt; Y[自研 + 自建生态]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：三个阶段是&quot;能力—市场&quot;的钟摆：先有能力没市场，后有市场没能力，现在要两样都要。下面两条路线是同一个问题的两种解法，区别在于技术主权归谁。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：市场换技术像租别人的厨房做菜，菜能卖，配方学不到；市场带技术像自己打灶台，开始火候差，但配方和灶都是自己的。失效边界：自建体系在起步期产品确实不如人，要靠特定市场养着。\n<\/li><li>\n实例：2019 年前 7 个月进口 CPU 470 亿元，美国直接来源超 320 亿元。这个数字就是&quot;底座依赖&quot;的价格标签。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;自己做 CPU&quot;是全新想法。1950—1980 年中国人就从沙子造到操作系统，只是没有市场。\n<\/li><li>\n别以为拿到授权就等于掌握技术。设计资料能造芯片，改不了架构。\n<\/li><li>\n别以为兼容路线一定错。它在市场化阶段救了产业，但也留下了&quot;缺芯少魂&quot;的账。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n2019 年全球服务器 CPU 市场销售额约为？｜450 亿美元｜545 亿美元｜120 亿美元｜答案：A｜解析：1200 万台 × 2.5 颗 × 1500 美元。\n<\/li><li>\n&quot;市场带技术&quot;的典型成功先例是？｜航天产业｜家电产业｜纺织业｜答案：A｜解析：水平领先且形成了自主产业体系。\n<\/li><li>\n中国计算机事业第一个 30 年的特点是？｜完全自主研发但无市场化｜完全市场化｜依赖进口｜答案：A｜解析：从沙子到操作系统都能自造，只服务特定项目。\n<\/li><li>\n109 丙&quot;功勋计算机&quot;的意义是？｜中国第一台具分时中断系统的计算机｜第一台 PC｜第一台超算｜答案：A｜解析：32 位、每秒 10 万次，服役 16 年。\n<\/ol>\n<h2>抽认卡<\/h2>\n<ul><li>\n中国台式机与服务器占全球市场比例？｜约 20% 与 30%\n<\/li><li>\n2019 年前 7 个月 CPU 进口额？｜470 亿元，其中美国来源超 320 亿元\n<\/li><li>\n两条技术路线？｜市场换技术与市场带技术\n<\/li><li>\n中国计算机三个阶段？｜全自研、全市场化、市场化下重掌自主\n<\/li><li>\nDJS-050 兼容哪款芯片？｜Intel 8080\n<\/li><li>\n曙光一号用的是什么处理器？｜Motorola M88100\n<\/ul>\n<h2>术语<\/h2>\n<ul><li>\n市场换技术：以市场开放换取国外技术引进的路线\n<\/li><li>\n市场带技术：以自研与市场牵引共同推动技术进步的路线\n<\/li><li>\n缺芯少魂：核心芯片与操作系统均依赖国外的状态\n<\/li><li>\n109 丙：中国早期自主研制的大型晶体管计算机\n<\/ul>\n<h2>复习锚点<\/h2>\n<ul><li>\n需求最大，自主率最低，这是中国 CPU 的起点\n<\/li><li>\n引进容易，消化极难，架构主权买不来\n<\/li><li>\n三个阶段：有能力没市场 → 有市场没能力 → 两者都要\n<\/ul>", "ch36": "<h1>第 36 章：龙的声音——龙芯的两个十年与三条原则<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>学时<\/strong>：0.7 小时 | <strong>前置<\/strong>：第 35 章\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能说清龙芯两个十年各自的任务\n<\/li><li>\n能说出龙芯 1/2/3 号系列的定位差别\n<\/li><li>\n能复述从学院派转向做产品后的三条设计原则\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>龙芯的第一个十年证明&quot;能做&quot;，第二个十年证明&quot;能用&quot;。转折点是从追单项指标，转向追用户感受。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>两个十年<\/h3>\n<p>做龙芯的初心很朴素：&quot;中国这么大一个国家，怎么能没有 CPU？&quot;当时市场主流已是奔三奔四，团队的判断是&quot;哪怕做个 Intel 8086 也得自己试试&quot;。<\/p>\n<p>第一个十年（2001—2010）是科研史。起源于中科院计算所 2001 年成立的微处理器团队，得到 863、973、自然科学基金、核高基支持，完成技术积累，初步掌握高性能 CPU 核心技术。成果形式是论文、著作、原型样片、科研奖项。<\/p>\n<p>第二个十年（2010 起）是产业史。2010 年开始市场化运作，走企业报国路线，把芯片卖给客户。龙芯中科把课题组的研究成果转换成产品，第一款产品芯片是龙芯 2F。<\/p>\n<p>2015 年进入高速发展期：应用案例遍布政企信息化、教育、工控、网络安全，性能逼近国际主流，形成近千家企业的产业链。<\/p>\n<p>龙芯坚持全面自研：每一行电路源代码、整颗芯片的版图都自己设计。<\/p>\n<p>2002 年 8 月 10 日清晨 6 点 08 分，用龙芯 1 号作 CPU 的计算机屏幕上出现&quot;login:&quot;，中国结束了只能用国外 CPU 造计算机的历史。<\/p>\n<h3>三个系列<\/h3>\n<p>1 号：嵌入式、物联网，性能简、功耗低。3 号：台式机、服务器、笔记本，性能强、核数多。2 号：工控、网络设备，性能适中、接口丰富。<\/p>\n<p>3A4000/3B4000 于 2019 年 12 月发布。3A4000 用 GS464v 核，主频 1.8—2.0GHz，单芯片 4 核，内置功耗控制核心，可按负载动态调频调压。3B4000 面向服务器，支持双路四路，一台机器最多 16 核。<\/p>\n<p>2021 年 3A5000 相比 3A4000：SPEC CPU 2006 提升 50% 以上，STREAM 提升 40% 以上，Unixbench 提升 100% 以上。<\/p>\n<p>配套桥片是 7A 系列，集成自研 GPU。<\/p>\n<h3>&quot;世界先进水平&quot;的误会<\/h3>\n<p>《麻省理工科技评论》2008、2010、2012 年连发三篇文章，标题大意是&quot;中国 CPU 正在逼近 Intel&quot;&quot;很快可以竞争&quot;。<\/p>\n<p>当时龙芯确实在学术会议上发表了成果，但那些&quot;先进&quot;只是<strong>一个指标<\/strong>——计算性能。2010 年的四核 3A1000 靠多核并行，浮点性能确实接近主流。<\/p>\n<p>但产品要看的是多元指标：单核性能、I/O 能力、软件生态。当时的龙芯只能算科研原型。<\/p>\n<p>书里的自我批评很直白：单一指标做到离国际主流很近，是典型的学院派思维。2010 年因此成为龙芯转向做产品、做市场的新起点。<\/p>\n<h3>三条设计原则<\/h3>\n<p>从学院派转向企业运作后，龙芯确定了做产品的三条顺序：<\/p>\n<p>先通用后专用。通用处理能力是日常高频业务的性能，不只取决于计算，而是计算、访存、I/O 都要好。打开 Office 文档、浏览网页、看视频，CPU 执行只占一小部分。浮点计算只是科学计算的&quot;专用处理&quot;能力，不该拿来当招牌。<\/p>\n<p>先单核后核数。很多任务只能在单核上跑，时间取决于单核性能，核多没用。&quot;人多力量大&quot;不完全适用于 CPU。台式机 4 核基本够用；服务器单核弱，堆再多核也无济于事。<\/p>\n<p>先设计能力后先进工艺。设计能力是用同样多的晶体管在更短时间内完成计算，是硬功夫。2010 年 3A1000 用 65nm 做到 1GHz，而 Intel 用 130nm 就能做到 4GHz；即使把 Intel 的芯片降到 1GHz，龙芯性能也只有它的 1/5。所以&quot;性能补课&quot;主要补设计能力。<\/p>\n<h3>性能补课的结果<\/h3>\n<p>三代产品迭代，单核性能提升 10 倍以上。2012 年被称为&quot;即将和 Intel 竞争&quot;的 3A1000，单核分值其实只有 2.7 分；2019 年 3A4000 到 21.1 分；2021 年 3A5000 超过 25 分。<\/p>\n<p>体验的改善很具体：3A1000 上打开 20MB 的 Office 文档要 33 秒，3A4000 上不到 1 秒。<\/p>\n<p>设计能力的进步也具体：3A4000 与 3A3000 工艺相同，性能翻倍——这是二十年优化经验的成果。<\/p>\n<p>下一步是提工艺、提主频、加核数：3A5000、3C5000 主频超 2.5GHz，单核接近 30 分，单芯片最多 16 核，支持四至十六路服务器。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  S1[科研十年 2001-2010&lt;br/&gt;论文 样片 奖项] --&gt;|市场化 2010| S2[产业十年 2010 起&lt;br/&gt;卖芯片 建产业链]\n  S2 --&gt; P[三条原则&lt;br/&gt;通用&gt;专用 / 单核&gt;核数 / 设计&gt;工艺]\n  P --&gt; R[单核 2.7 分 → 25 分]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：从左边到右边，评价标准换了。左侧的&quot;分数&quot;是学术指标，右侧的&quot;分数&quot;是产品指标。中间那三条原则，就是换标准的操作手册。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：学院派像比赛单项的运动员，跳得高就是好；做产品像参加十项全能，还要看耐力、稳定性、配速。失效边界：单项确实能证明潜力，只是不能当交付标准。\n<\/li><li>\n实例：同样是 65nm，龙芯 1GHz 对 Intel 4GHz。这个对比说明&quot;工艺&quot;能放大设计差距，也能掩盖设计差距，所以书里把设计能力排在工艺之前。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为龙芯一开始就想做产品。头十年是科研任务，指标导向。\n<\/li><li>\n别以为浮点性能高就等于好用。日常办公更多受单核、访存、I/O 影响。\n<\/li><li>\n别以为工艺先进就能补一切。同工艺下性能翻倍，才是设计能力的体现。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n龙芯第一个十年的成果形式主要是？｜论文、著作、原型样片、奖项｜量产芯片销售｜整机品牌｜答案：A｜解析：科研阶段，未市场化。\n<\/li><li>\n龙芯 1 号系列的定位是？｜嵌入式、物联网，低功耗｜服务器多核｜台式机高性能｜答案：A｜解析：三系列中最小的一档。\n<\/li><li>\n龙芯三条原则的第一条是？｜先提高通用处理能力，再提高专用处理能力｜先多核再单核｜先工艺再设计｜答案：A｜解析：日常体验由通用能力决定。\n<\/li><li>\n3A1000 与 3A4000 的单核分值大致是？｜2.7 分与 21.1 分｜10 分与 20 分｜2.7 分与 10 分｜答案：A｜解析：十年提升 10 倍以上。\n<\/ol>\n<h2>抽认卡<\/h2>\n<ul><li>\n龙芯起源年份与单位？｜2001 年，中科院计算所微处理器团队\n<\/li><li>\n龙芯第一款产品芯片？｜龙芯 2F\n<\/li><li>\n三个系列的定位？｜1 号嵌入式、2 号工控、3 号桌面服务器\n<\/li><li>\n3A4000 的主频与核数？｜1.8—2.0GHz，4 核\n<\/li><li>\n3A5000 的 SPEC 提升幅度？｜50% 以上\n<\/li><li>\n&quot;性能补课&quot;主要补什么？｜设计能力\n<\/ul>\n<h2>术语<\/h2>\n<ul><li>\nGS464v：龙芯 3A4000 采用的新一代处理器核代号\n<\/li><li>\n桥片：配合 CPU 提供 I/O 与图形等功能的配套芯片\n<\/li><li>\n性能补课：把单核与通用处理能力补到国际主流水平\n<\/li><li>\n学院派思维：以单一学术指标衡量产品的思路\n<\/ul>\n<h2>复习锚点<\/h2>\n<ul><li>\n前十年证明能做，后十年证明能用\n<\/li><li>\n三原则：通用优先、单核优先、设计优先\n<\/li><li>\n单核 2.7 → 25 分，是补课的成绩单\n<\/ul>", "ch37": "<h1>第 37 章：龙之生态——试错、LoongArch 与内生安全<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>学时<\/strong>：0.7 小时 | <strong>前置<\/strong>：第 32、36 章\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能用高复杂系统的两个难点解释&quot;试错不可绕过&quot;\n<\/li><li>\n能说明 LoongArch 为什么是自主生态的根基\n<\/li><li>\n能列出龙芯内生安全的四类机制\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>核心技术难在细节不在原理，所以只能靠时间试错。指令集是生态的户口本，没有它就只能当租客。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>试错：时间是第四个变量<\/h3>\n<p>核心技术有个共同点：都是高复杂系统。我国的清单上有高端发动机、精密仪器、脑科学，还有 CPU。<\/p>\n<p>难点一：影响品质的因素太多，没法用&quot;分而治之&quot;切开，子系统之间牵一发动全身。一个函数若有一万个变量，描述它的公式就极其庞大；人脑即便看清每个神经元，也说不清它们的组织方式。<\/p>\n<p>难点二：必须靠大量实验来完善。产品质量不是设计出来的，是&quot;做原型—试验—找不足—改进—再试验&quot;循环出来的。发动机原理初中就讲过，造一台能用一年的很容易，造 100 万台跑一年都不出问题，就难了。<\/p>\n<p>所以核心技术的难点不在科学原理，在功能细节。创新函数以前看三个变量：资金、人才、体制机制；现在要加第四个——时间。三流产品有钱就能做，二流要有钱有人才，一流还要有体制加长期积累。<\/p>\n<h3>LoongArch：从必然王国到自由王国<\/h3>\n<p>指令集是软硬件界面，规定 CPU 执行指令的二进制编码。一种指令集承载一个生态：x86+Windows 是 Wintel，ARM+Android 是 AA。国外厂商把指令集当控制生态的手段，要授权才能做兼容 CPU。<\/p>\n<p>书里那个比喻很到位：中国人可以用英文写小说，但不可能基于英文形成中华民族文化。用授权指令系统能做出产品，做不出自主产业生态。<\/p>\n<p>2021 年 4 月 15 日，LoongArch 对外发布。从顶层规划到各指令部分的功能定义，再到每条指令每个寄存器的编码、名称、含义，全部自行设计。<\/p>\n<p>结构上包括基础部分（Loongson Base）、虚拟化（LVZ），以及二进制翻译（LBT）、向量（LSX）、高级向量（LASX）三个扩展。它的设计思路是：丢掉传统指令集里不适应发展的陈旧内容，吸纳近年指令系统设计的先进成果；硬件上更易做高性能低功耗，软件上更易编译优化、开发操作系统与虚拟机。<\/p>\n<p>兼容怎么解决？靠团队十余年的二进制翻译积累：能把现有龙芯应用无损自动翻译到 LoongArch，也支持对 x86、ARM 等多种主流指令集的高效二进制翻译。<\/p>\n<p>2020 年起新研 CPU 均支持 LoongArch，3A5000 是首款。<\/p>\n<h3>Loongnix 与统一架构<\/h3>\n<p>成功的 CPU 企业都同时做操作系统。龙芯维护社区版 Loongnix：把大量开源软件在龙芯上移植优化，做成安装光盘，可装在全部龙芯台式机、服务器、笔记本、网络设备、云平台上；代码与镜像在社区公开下载，整机厂也可拿全部源码裁剪定制。<\/p>\n<p>更关键的是统一架构。龙芯联合固件、主板、操作系统厂商制定《龙芯 CPU 统一系统架构规范》，规定主板与操作系统之间所有接口的设计标准。所有整机厂都要遵守并通过龙芯认证，操作系统就可以装在所有认证过的机器上，将来换 CPU 也不影响系统。<\/p>\n<p>软件优化也做到了实处：内核、编译器、API、图形库、媒体库针对龙芯特点优化，性能常比社区原始代码提升 10 倍以上；与应用厂商联合优化后，WPS 在龙芯上比在 x86 上更快。<\/p>\n<h3>内生安全<\/h3>\n<p>只有自己做的芯片才能保证没有后门漏洞。传统做法是在 CPU 外面加安全模块，龙芯 3A4000/3B4000 直接把安全控制机制设计在处理器核内，这叫&quot;内生安全&quot;。<\/p>\n<p>四类机制：漏洞防范——对 Meltdown、Spectre 这类影响 x86、ARM 的漏洞，从机理上分析并设计规避，3A4000 及后续型号已免疫；硬件加解密——支持 SM2、SM3、SM4 国密算法，以前靠软件执行的运算改为电路执行，性能提升几十倍且不怕被篡改；可信计算——芯片内专用安全可信模块，监督每个核的计算任务；访问控制——内核栈溢出防护，对系统调用、进程、I/O 做监督。<\/p>\n<p>有个真实案例：2018 年 4 月某市政务热线中心 15 台 Windows 机器中勒索病毒全部崩溃，同处一室的 3 台龙芯机器不受影响，撑住了系统运转。<\/p>\n<h3>趋于成熟的四个标志<\/h3>\n<p>功能丰富：办公所需功能齐备，WPS、浏览器、Java 虚拟机、中间件、数据库、云平台、大数据、AI 方案都有，打印机、扫描仪、身份证读卡器等外设已适配。<\/p>\n<p>架构稳定：统一架构规范让操作系统对不同主板、升级后的 CPU 都保持二进制兼容，像 Windows XP 能用十几年那样，升级不用换系统。<\/p>\n<p>性能优化：3A4000 打开复杂文档、业务网站、高清视频、3D 应用已无延迟，与软件厂商联合优化后整体性能甚至优于 x86。<\/p>\n<p>问题收敛：用户遇到的问题越来越少，且多是使用习惯或应用软件本身的问题，不再需要 CPU 与操作系统背锅。<\/p>\n<p>书里有一句结论：龙芯计算机已能在日常办公中替代&quot;Intel+Windows&quot;，本书就是基于龙芯 3A5000 写的。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  T[时间] --&gt; TRY[试错循环&lt;br/&gt;原型→试验→改进]\n  TRY --&gt; MAT[产品成熟]\n  ISA[LoongArch 指令集] --&gt; ECO[自主软件生态]\n  NIX[Loongnix + 统一架构规范] --&gt; ECO\n  SEC[内生安全&lt;br/&gt;漏洞免疫 / 国密 / 可信 / 访问控制] --&gt; MAT<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：上半条讲&quot;怎么变强&quot;，下半条讲&quot;凭什么独立&quot;。试错解决能力问题，指令集解决主权问题，两者都不是一次性能解决的。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：指令集像语言的字母表。借别人的字母能写出文章，但字典、教材、考试标准都在别人手上；自建字母表，一开始书少，但标准归自己。失效边界：字母表免费也没用，得有足够多的人愿意用它写字。\n<\/li><li>\n实例：3A4000 与 3A3000 同工艺，性能翻倍。这就是&quot;设计能力&quot;这条原则的实证。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为试错就是&quot;多试几次&quot;。它是有方向的迭代，靠反馈收敛，不是乱撞。\n<\/li><li>\n别以为二进制翻译是临时方案。它同时承担兼容老应用和兼容 x86、ARM 应用两类任务。\n<\/li><li>\n别以为内生安全是营销词。漏洞免疫、国密硬件、可信模块、访问控制都能对应到具体机制。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n高复杂系统的第一个难点是？｜因素太多、子系统牵一发动全身，无法简单分治｜原理太难｜缺少资金｜答案：A｜解析：这是复杂系统区别于普通工程的标志。\n<\/li><li>\nLoongArch 发布的年份是？｜2021 年｜2019 年｜2010 年｜答案：A｜解析：2021 年 4 月 15 日对外发布。\n<\/li><li>\nLoongArch 的向量扩展包括？｜LSX 与 LASX｜LVZ 与 LBT｜Base 与 API｜答案：A｜解析：LVZ 是虚拟化，LBT 是二进制翻译。\n<\/li><li>\n龙芯对 Meltdown、Spectre 的处理是？｜从机理上设计规避，实现免疫｜靠打补丁｜不管｜答案：A｜解析：自研芯片可从根本上消除。\n<\/ol>\n<h2>抽认卡<\/h2>\n<ul><li>\n创新函数的第四个变量？｜时间\n<\/li><li>\nLoongArch 的五个组成部分？｜Base、LVZ、LBT、LSX、LASX\n<\/li><li>\nLoongnix 是什么？｜龙芯维护的社区版 Linux 发行版\n<\/li><li>\n统一架构规范约束什么？｜主板与操作系统之间的所有接口\n<\/li><li>\n内生安全四类机制？｜漏洞防范、国密硬件、可信计算、访问控制\n<\/li><li>\n勒索病毒案例的结果？｜15 台 Windows 崩溃，3 台龙芯正常\n<\/ul>\n<h2>术语<\/h2>\n<ul><li>\n高复杂系统：因素众多、子系统强耦合、难以分治的系统\n<\/li><li>\nLoongArch：龙芯自主设计的指令集架构\n<\/li><li>\nLVZ / LBT / LSX / LASX：虚拟化、二进制翻译、向量、高级向量扩展\n<\/li><li>\nLoongnix：龙芯社区版操作系统发行版\n<\/li><li>\n内生安全：把安全机制做进处理器核内部\n<\/li><li>\n二进制翻译：把一种指令集的程序转成另一种指令集执行\n<\/ul>\n<h2>复习锚点<\/h2>\n<ul><li>\n难在细节不在原理，时间是第四个变量\n<\/li><li>\n指令集是生态户口本，借不来主权\n<\/li><li>\n安全做进核里，才叫内生\n<\/ul>", "ch38": "<h1>第 38 章：未来已来——泛生态六支柱与多条路线<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>学时<\/strong>：0.5 小时 | <strong>前置<\/strong>：第 34、37 章\n<\/ul>\n<h2>学习目标<\/h2>\n<ul><li>\n能列出龙芯泛生态的六个支柱\n<\/li><li>\n能说出&quot;从零开始造计算机&quot;的教育思路\n<\/li><li>\n能比较中国 CPU 企业的两条路线与代表产品\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>把技术链打通只是第一步，真正的门槛是把生态链打通——标准、软件、方案、认证、人才、书籍，六根柱子缺一根都会漏风。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>六根支柱<\/h3>\n<p>到 2020 年，龙芯生态形成了六方面支撑。<\/p>\n<p>标准规范：两个结合部各一套——硬件与操作系统之间是《龙芯 CPU 统一系统架构规范》；操作系统与应用软件之间正在联合厂商制定《龙芯 API 兼容规范》，目标是让龙芯上各种操作系统提供统一 API，消掉 Linux 碎片化的影响。<\/p>\n<p>开源软件：在 Linux 内核、gcc 编译器、Java 虚拟机、浏览器上都是社区维护者，每项提交数万行代码。Java 虚拟机的代码提交量居世界第四，仅次于 Oracle、Red Hat、SAP。<\/p>\n<p>解决方案：打造&quot;从端到云&quot;的全链条，各地建适配中心，提供机器给应用厂适配。2019 年建&quot;云中心&quot;做远程适配，2020 年建全国一体化的&quot;生态适配服务产业联盟&quot;，规范兼容性测试认证，带动上下游协同攻关。<\/p>\n<p>产品认证：发布《龙芯平台兼容适配认证流程规范》，通过测试的发证，证书由龙芯与厂商共同盖章，作为向用户推荐的依据。<\/p>\n<p>人才培养：建立生态培训、学校教育、考核认证体系。2019 年组专职讲师团队，面向开发者推&quot;应用迁移&quot;培训理念，面向用户讲使用方法。2020 年提&quot;龙芯万里行&quot;，全国巡回培训。<\/p>\n<p>书籍出版：2018 年与人民邮电出版社推出&quot;中国自主产权芯片技术与应用丛书&quot;，已出 CPU 原理、操作系统、应用开发、使用教程等。面向用户的教程讲到每个菜单、对话框、界面，帮人从 Windows 习惯迁移过来。<\/p>\n<p>书里的判断：龙芯正从&quot;打通技术链&quot;跃升到&quot;打通生态链&quot;。<\/p>\n<h3>从零开始造计算机<\/h3>\n<p>中国信息技术教育长期缺 CPU 核心原理教学。学生学的主要是 x86、ARM 架构，只能掌握基本概念、看不到内部实现，多数计算机专业毕业生说不清 CPU 怎么跑。<\/p>\n<p>龙芯与学校共建自主创新教育联盟推动课程改革，推出&quot;龙芯 CPU 高校开源计划&quot;，把 GS132 和 GS232 两款 CPU 核向高校与学术界开源，学生对照源码学原理，从学&quot;用&quot;计算机转为学&quot;造&quot;计算机。已有超过百所高校开课。<\/p>\n<p>中小学层面，很多学校建了龙芯电子教室，学龙芯操作而非做&quot;微软培训班&quot;，甚至有小学生用它学开发游戏。<\/p>\n<h3>其他中国 CPU 企业<\/h3>\n<p>申威：自研微架构，2003 年起研制。2015 年申威 26010 面向科学计算，1.5GHz，浮点峰值 3.168×10¹² 次/秒，用于&quot;神威·太湖之光&quot;，2016 年登顶世界最快超算。<\/p>\n<p>更多企业走引进授权路线：海思做 ARM 兼容的&quot;麒麟&quot;手机芯片与&quot;鲲鹏&quot;桌面/服务器芯片；飞腾做 ARM 兼容处理器；AMD 等授权国内企业做 x86 兼容；IBM 授权做 Power。<\/p>\n<p>趋势判断：自研微结构、走&quot;市场带技术&quot;的龙芯快速发展，性能与生态逐渐超越引进授权的 x86、ARM 路线。<\/p>\n<h3>没有弯道超车<\/h3>\n<p>书里的结论很硬：这件事没有捷径，也不要幻想&quot;弯道超车&quot;——有些表面上的直道其实是更弯的弯道，只能直道追赶。不断试错是复杂系统的必要过程，好的体制机制和更多经费可以加速迭代，但不能取代迭代。<\/p>\n<p>有个&quot;30 年为周期&quot;的规律：运十 1986 年终止，C919 首飞已是 2017 年。<\/p>\n<p>下一步三件事：坚持正确生态路线（市场带技术，用专用市场养技术，再参与商业竞争）；进入性能新阶段（3A5000/3C5000 满足开放市场要求，胜任云平台、大数据、高并发网站）；做好&quot;应用迁移&quot;长期攻坚（30 年积累的应用系统要迁到龙芯，工作量巨大，应用厂商开始成为建生态的最重要角色）。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  STD[标准规范] --&gt; ECO[泛生态]\n  OSS[开源软件] --&gt; ECO\n  SOL[解决方案] --&gt; ECO\n  CERT[产品认证] --&gt; ECO\n  TAL[人才培养] --&gt; ECO\n  BOOK[书籍出版] --&gt; ECO\n  ECO --&gt; FUT[市场竞争力]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：六根柱子各自独立，靠&quot;接口标准&quot;串起来。缺标准则散，缺人才则空，缺书籍则知识传不下去——这也是为什么它被单列一支。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：技术链像造好一条生产线，生态链像把原料、销路、质检、工人、说明书全都配齐。只有生产线，产品出不了厂。失效边界：生产线可以买，生态的每一环都得自己攒时间。\n<\/li><li>\n实例：Java 虚拟机代码提交量全球第四，仅次于 Oracle、Red Hat、SAP。这个排名是&quot;参与国际社区&quot;最硬的凭证。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为生态就是&quot;软件多&quot;。标准、认证、人才、书籍同样算支柱。\n<\/li><li>\n别以为开源就是免费拿。要成为维护者，得持续提交代码。\n<\/li><li>\n别以为引进授权和自研只是路线偏好。前者拿不到架构主权，后者要背时间成本。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n龙芯 API 兼容规范要解决什么问题？｜Linux 生态碎片化导致接口不统一｜硬件散热｜封装成本｜答案：A｜解析：让各操作系统提供统一 API。\n<\/li><li>\n神威·太湖之光用的是哪款处理器？｜申威 26010｜龙芯 3A5000｜鲲鹏｜答案：A｜解析：2016 年登顶世界最快超算。\n<\/li><li>\n龙芯高校开源计划开放的两款核是？｜GS132 与 GS232｜GS464v 与 3A4000｜A72 与 A53｜答案：A｜解析：面向高校与学术界开源。\n<\/li><li>\n关于&quot;弯道超车&quot;，书中的观点是？｜没有捷径，只能直道追赶｜可以靠工艺超车｜可以靠授权超车｜答案：A｜解析：表面的直道常是更弯的弯道。\n<\/ol>\n<h2>抽认卡<\/h2>\n<ul><li>\n泛生态六支柱？｜标准规范、开源软件、解决方案、产品认证、人才培养、书籍出版\n<\/li><li>\n龙芯 Java 虚拟机提交量排名？｜世界第四\n<\/li><li>\n申威 26010 的浮点峰值？｜3.168×10¹² 次/秒\n<\/li><li>\n海思的两条产品线？｜麒麟（手机）与鲲鹏（桌面/服务器）\n<\/li><li>\n运十终止与 C919 首飞的年份？｜1986 与 2017\n<\/li><li>\n龙芯下一步三件事？｜坚持路线、进入性能新阶段、应用迁移攻坚\n<\/ul>\n<h2>术语<\/h2>\n<ul><li>\n泛生态：技术之外的标准、社区、认证、人才、出版等支撑体系\n<\/li><li>\n应用迁移：把既有应用系统适配到新平台的工作\n<\/li><li>\nGS132 / GS232：向高校开源的龙芯 CPU 核\n<\/li><li>\n生态适配服务产业联盟：统一兼容性测试与认证的产业组织\n<\/ul>\n<h2>复习锚点<\/h2>\n<ul><li>\n六支柱：标准、开源、方案、认证、人才、书籍\n<\/li><li>\n从学&quot;用&quot;计算机到学&quot;造&quot;计算机\n<\/li><li>\n没有弯道超车，只有直道追赶与时间积累\n<\/ul>", "c-isa": "<h1>指令集（ISA）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 4、5、6、37 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>指令集是 CPU 能听懂的全部指令的集合，规定每条指令的二进制编码格式，是软件与硬件之间的合同。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是全书的地基。上面接着汇编语言、编译器、操作系统、应用软件；下面接着微结构、电路、工艺。<strong>一种指令集承载一个软件生态<\/strong>，所以它不只是技术规范，也是产业主权的边界。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  APP[应用软件] --&gt; API[API / 库函数]\n  API --&gt; OS[操作系统]\n  OS --&gt; ISA[指令集 ISA]\n  ISA --&gt; UARCH[微结构]\n  UARCH --&gt; CIRC[电路与工艺]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：自上而下是&quot;被翻译&quot;的过程，每一层只和相邻层打交道。ISA 是唯一一条既约束软件、又约束硬件的线。<\/p>\n<h2>详解<\/h2>\n<p>指令集回答三件事：有哪些指令、每条指令什么编码、操作哪些寄存器与地址。<\/p>\n<p>按复杂度分两派。CISC（复杂指令集）追求一条指令干更多事，x86 是代表；RISC（精简指令集）只留高频简单指令，把复杂操作拆成多条，MIPS、ARM、RISC-V、LoongArch 都属于这派。现代 CPU 的实际做法是：对外呈现 CISC，内部译成类 RISC 的微操作，两派的界限早已模糊。<\/p>\n<p>兼容性是关键属性。同一指令集的不同 CPU 互为&quot;兼容机&quot;，一个程序能在所有兼容 CPU 上跑；不同指令集之间只能靠二进制翻译或重新编译。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为指令集是软件。它是规范文档，但由硬件实现，改一处要动整条软硬件链。\n<\/li><li>\n别以为指令多就强。二八原则下，少数指令承担绝大多数执行次数，多出来的指令常常只占面积。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 4 章<\/td><td>指令集与兼容机、System/360<\/td><td>一种 ISA 划出一个生态圈<\/td><\/tr><tr><td>第 5 章<\/td><td>CISC 与 RISC、汇编语言<\/td><td>指令膨胀的代价，CISC = 预译码 + RISC 内核<\/td><\/tr><tr><td>第 6 章<\/td><td>指令集与微结构<\/td><td>规范与实现的二分<\/td><\/tr><tr><td>第 37 章<\/td><td>LoongArch<\/td><td>自主指令集是自主生态的根基<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：<a href=\"#\" target=\"_blank\" rel=\"noopener\">微结构<\/a>\n<\/li><li>\n后续：<a href=\"#\" target=\"_blank\" rel=\"noopener\">软件生态<\/a>、<a href=\"#\" target=\"_blank\" rel=\"noopener\">自主指令集<\/a>\n<\/ul>", "c-uarch": "<h1>微结构<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 6、15、16 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>微结构是一颗 CPU 的电路设计方案，也就是某套指令集在硅片上的具体实现。<\/p>\n<h2>为什么重要<\/h2>\n<p>同一个指令集可以有很多种微结构：有的快而费电，有的慢而省电。<strong>性能差异主要来自微结构，不来自指令集<\/strong>。理解这一层，才能看懂&quot;同工艺性能翻倍&quot;这类事实。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  ISA[指令集&lt;br/&gt;规范] --&gt; U1[微结构 A&lt;br/&gt;5 级流水 双发射]\n  ISA --&gt; U2[微结构 B&lt;br/&gt;14 级流水 乱序]\n  U1 --&gt; P1[低功耗 小核]\n  U2 --&gt; P2[高性能 大核]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：左边一份规范，右边两种实现。看这张图要抓住&quot;一对多&quot;——规范唯一，方案可以很多。<\/p>\n<h2>详解<\/h2>\n<p>微结构要决定：流水线分几级、每拍发射几条指令、是否乱序、缓存几级多大、分支预测多复杂、有几个执行单元。<\/p>\n<p>这些选择彼此牵制。级数多能提主频，但分支预测失败的代价变大；发射宽能提并行度，但取指、译码、寄存器端口都要跟上，否则只是加面积不提性能。<\/p>\n<p>同一套微结构还能衍生出多个型号：改缓存与频率、裁掉模块、多核组合、换工艺分档。这就是产品线的做法。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为买了 IP 核就等于会做 CPU。集成与自研是两件事，核心设计不在自己手里。\n<\/li><li>\n别以为微结构越复杂越好。复杂度要能被软件用上，否则只是功耗和面积。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 6 章<\/td><td>微结构衍生四法、IP 核<\/td><td>设计能力体现在微结构<\/td><\/tr><tr><td>第 15 章<\/td><td>流水线级数与主频<\/td><td>级数有代价，Pentium 4 是教训<\/td><\/tr><tr><td>第 16 章<\/td><td>乱序、多发射、ROB<\/td><td>用窗口换并行度<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：<a href=\"#\" target=\"_blank\" rel=\"noopener\">指令集<\/a>\n<\/li><li>\n后续：<a href=\"#\" target=\"_blank\" rel=\"noopener\">流水线<\/a>\n<\/ul>", "c-pipeline": "<h1>流水线<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 15、16 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>流水线是把一条指令的执行拆成若干段、让不同指令同时占着不同段干活的组织方式。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是&quot;不靠提主频也能提速&quot;的第一件法宝。理解流水线，才能理解为什么 CPU 里有一堆看起来&quot;多出来&quot;的寄存器、为什么分支预测错了代价那么大。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  IF[取指] --&gt; ID[译码]\n  ID --&gt; EX[执行]\n  EX --&gt; MEM[访存]\n  MEM --&gt; WB[写回]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：五段像五道工序，每拍每段都有指令在做事。理想状态下每拍完成一条，而不是五拍一条。<\/p>\n<h2>详解<\/h2>\n<p>经典五级：取指、译码、执行、访存、写回。前一条在写回时，后一条正在访存，再后面在执行——同时有五条指令在飞。<\/p>\n<p>提速来自并行，不来自单条变快。代价是三类冲突：结构冲突（两个指令抢同一个部件）、数据冲突（后一条要用前一条还
